D["3.5"]={t:["న హి కశ్చిత్క్షణమపి జాతు తిష్ఠత్యకర్మకృత్ |","కార్యతే హ్యవశః కర్మ సర్వః ప్రకృతిజైర్గుణైః ||"],mt:"ఎవడును ఒక్క క్షణమైనను కర్మ చేయకుండా ఉండడు; ప్రకృతి గుణములచే అందరును అవశులై కర్మ చేయింపబడుదురు.",m:"No one can remain even for a moment without acting; everyone is made to act helplessly by the qualities born of nature.",w:"న హి కశ్చిత్=no one indeed; క్షణమ్ అపి=even for a moment; జాతు=ever; తిష్ఠతి=remains; అకర్మకృత్=without acting; కార్యతే=is made to act; హి=indeed; అవశః=helplessly; కర్మ=action; సర్వః=everyone; ప్రకృతిజైః గుణైః=by the qualities born of nature"};
D["3.6"]={t:["కర్మేన్ద్రియాణి సంయమ్య య ఆస్తే మనసా స్మరన్ |","ఇన్ద్రియార్థాన్విమూఢాత్మా మిథ్యాచారః స ఉచ్యతే ||"],mt:"కర్మేంద్రియములను నిగ్రహించి, మనస్సుతో ఇంద్రియ విషయములను స్మరించుచుండు మూఢాత్ముడు మిథ్యాచారి అనబడును.",m:"One who restrains the organs of action but sits mentally dwelling on sense objects, deluded, is called a hypocrite.",w:"కర్మేన్ద్రియాణి=organs of action; సంయమ్య=restraining; యః=who; ఆస్తే=sits; మనసా=with the mind; స్మరన్=remembering; ఇన్ద్రియార్థాన్=sense objects; విమూఢాత్మా=deluded; మిథ్యాచారః=a hypocrite; సః=he; ఉచ్యతే=is called"};
D["3.7"]={t:["యస్త్విన్ద్రియాణి మనసా నియమ్యారభతేఽర్జున |","కర్మేన్ద్రియైః కర్మయోగమసక్తః స విశిష్యతే ||"],mt:"ఓ అర్జునా! మనస్సుచే ఇంద్రియములను నియమించి, ఆసక్తిలేక కర్మేంద్రియములచే కర్మయోగమును ఆరంభించువాడు శ్రేష్ఠుడు.",m:"But one who controls the senses with the mind and, unattached, engages the organs of action in the yoga of action, O Arjuna, excels.",w:"యః తు=but who; ఇన్ద్రియాణి=senses; మనసా=by the mind; నియమ్య=controlling; ఆరభతే=undertakes; అర్జున=O Arjuna; కర్మేన్ద్రియైః=with the organs of action; కర్మయోగమ్=the yoga of action; అసక్తః=unattached; సః=he; విశిష్యతే=excels"};
D["3.8"]={t:["నియతం కురు కర్మ త్వం కర్మ జ్యాయో హ్యకర్మణః |","శరీరయాత్రాపి చ తే న ప్రసిద్ధ్యేదకర్మణః ||"],mt:"నీవు నియతమైన కర్మను చేయుము; కర్మ అకర్మకంటె శ్రేష్ఠము; కర్మ చేయకున్నచో నీ శరీరయాత్ర కూడా సాగదు.",m:"Perform your prescribed duty, for action is better than inaction; even the maintenance of your body would not be possible through inaction.",w:"నియతమ్=prescribed; కురు=perform; కర్మ=action; త్వమ్=you; జ్యాయః=better; హి=indeed; అకర్మణః=than inaction; శరీరయాత్రా=maintenance of the body; అపి చ=even; తే=your; న ప్రసిద్ధ్యేత్=would not be accomplished; అకర్మణః=through inaction"};

// Chapter 3 – shlokas 3.9 to 3.26. Paste after your D object.
D["3.9"]={t:["యజ్ఞార్థాత్కర్మణోఽన్యత్ర లోకోఽయం కర్మబన్ధనః |","తదర్థం కర్మ కౌన్తేయ ముక్తసఙ్గః సమాచర ||"],mt:"యజ్ఞార్థముగా చేయు కర్మ తప్ప ఇతర కర్మలచే ఈ లోకము బంధింపబడును; కావున ఓ కౌంతేయా! ఆసక్తిని విడిచి యజ్ఞార్థముగా కర్మను ఆచరింపుము.",m:"Except for action done as sacrifice, this world is bound by action. Therefore, O son of Kunti, perform action for that purpose, free from attachment.",w:"యజ్ఞార్థాత్=for the sake of sacrifice; కర్మణః=than action; అన్యత్ర=other; లోకః=world; అయమ్=this; కర్మబన్ధనః=bound by action; తదర్థమ్=for that purpose; కర్మ=action; కౌన్తేయ=O son of Kunti; ముక్తసఙ్గః=free from attachment; సమాచర=perform well"};
D["3.10"]={t:["సహయజ్ఞాః ప్రజాః సృష్ట్వా పురోవాచ ప్రజాపతిః |","అనేన ప్రసవిష్యధ్వమేష వోఽస్త్విష్టకామధుక్ ||"],mt:"పూర్వము ప్రజాపతి యజ్ఞముతో కూడ ప్రజలను సృష్టించి ఇట్లు చెప్పెను: దీనిచే అభివృద్ధి చెందుడు; ఇది మీ ఇష్టకామములనిచ్చు కామధేనువగుగాక.",m:"In the beginning, the Creator, having created beings together with sacrifice, said: By this you shall prosper; let this be the giver of the desired objects for you.",w:"సహయజ్ఞాః=along with sacrifice; ప్రజాః=beings; సృష్ట్వా=having created; పురా=in the beginning; ఉవాచ=said; ప్రజాపతిః=the Creator; అనేన=by this; ప్రసవిష్యధ్వమ్=you shall prosper; ఏషః=this; వః=your; అస్తు=let it be; ఇష్టకామధుక్=giver of desired objects"};
D["3.11"]={t:["దేవాన్భావయతానేన తే దేవా భావయన్తు వః |","పరస్పరం భావయన్తః శ్రేయః పరమవాప్స్యథ ||"],mt:"దీనిచే దేవతలను సంతోషపెట్టుడు; ఆ దేవతలు మిమ్ములను సంతోషపెట్టుదురు; ఒకరినొకరు సంతోషపెట్టుచు పరమశ్రేయస్సును పొందుదురు.",m:"With this, nourish the gods, and may those gods nourish you. Thus nourishing one another, you will attain the supreme good.",w:"దేవాన్=the gods; భావయత=nourish; అనేన=by this; తే దేవాః=those gods; భావయన్తు=let them nourish; వః=you; పరస్పరమ్=mutually; భావయన్తః=nourishing; శ్రేయః=good; పరమ్=supreme; అవాప్స్యథ=you will attain"};
D["3.12"]={t:["ఇష్టాన్భోగాన్హి వో దేవా దాస్యన్తే యజ్ఞభావితాః |","తైర్దత్తానప్రదాయైభ్యో యో భుఙ్క్తే స్తేన ఏవ సః ||"],mt:"యజ్ఞముచే సంతోషపడిన దేవతలు మీకు ఇష్టభోగములను ఇచ్చెదరు; వారిచే ఇవ్వబడిన వాటిని వారికి ఇవ్వక అనుభవించువాడు దొంగయే.",m:"Nourished by sacrifice, the gods will give you the enjoyments you desire. One who enjoys what they have given without offering anything in return is certainly a thief.",w:"ఇష్టాన్=desired; భోగాన్=enjoyments; హి=indeed; వః=to you; దేవాః=gods; దాస్యన్తే=will give; యజ్ఞభావితాః=nourished by sacrifice; తైః=by them; దత్తాన్=given; అప్రదాయ=without offering; ఏభ్యః=to them; యః=who; భుఙ్క్తే=enjoys; స్తేనః=thief; ఏవ=indeed; సః=he"};
D["3.13"]={t:["యజ్ఞశిష్టాశినః సన్తో ముచ్యన్తే సర్వకిల్బిషైః |","భుఞ్జతే తే త్వఘం పాపా యే పచన్త్యాత్మకారణాత్ ||"],mt:"యజ్ఞశేషమును భుజించు సత్పురుషులు సర్వపాపములనుండి విముక్తులగుదురు; తమ కొరకే వండుకొను పాపులు పాపమునే భుజింతురు.",m:"The good who eat the remnants of sacrifice are freed from all sins; but those sinful ones who cook only for themselves eat sin.",w:"యజ్ఞశిష్టాశినః=those who eat the remnants of sacrifice; సన్తః=the good; ముచ్యన్తే=are freed; సర్వకిల్బిషైః=from all sins; భుఞ్జతే=eat; తే=they; తు=but; అఘమ్=sin; పాపాః=the sinful; యే=who; పచన్తి=cook; ఆత్మకారణాత్=for their own sake"};
D["3.14"]={t:["అన్నాద్భవన్తి భూతాని పర్జన్యాదన్నసమ్భవః |","యజ్ఞాద్భవతి పర్జన్యో యజ్ఞః కర్మసముద్భవః ||"],mt:"ప్రాణులు అన్నమునుండి కలుగును; అన్నము వర్షమునుండి; వర్షము యజ్ఞమునుండి; యజ్ఞము కర్మనుండి పుట్టును.",m:"Beings arise from food; food comes from rain; rain comes from sacrifice; and sacrifice is born of action.",w:"అన్నాత్=from food; భవన్తి=arise; భూతాని=beings; పర్జన్యాత్=from rain; అన్నసమ్భవః=production of food; యజ్ఞాత్=from sacrifice; భవతి=comes; పర్జన్యః=rain; యజ్ఞః=sacrifice; కర్మసముద్భవః=born of action"};
D["3.15"]={t:["కర్మ బ్రహ్మోద్భవం విద్ధి బ్రహ్మాక్షరసముద్భవమ్ |","తస్మాత్సర్వగతం బ్రహ్మ నిత్యం యజ్ఞే ప్రతిష్ఠితమ్ ||"],mt:"కర్మ వేదమునుండి పుట్టినదని, వేదము అక్షరపరబ్రహ్మమునుండి పుట్టినదని తెలిసికొనుము; కావున సర్వవ్యాపియైన బ్రహ్మము ఎల్లప్పుడును యజ్ఞమున ప్రతిష్ఠితమై యుండును.",m:"Know that action arises from the Veda, and the Veda arises from the Imperishable. Therefore the all-pervading Brahman is ever established in sacrifice.",w:"కర్మ=action; బ్రహ్మోద్భవమ్=arising from the Veda; విద్ధి=know; బ్రహ్మ=the Veda; అక్షరసముద్భవమ్=arising from the Imperishable; తస్మాత్=therefore; సర్వగతమ్=all-pervading; బ్రహ్మ=Brahman; నిత్యమ్=always; యజ్ఞే=in sacrifice; ప్రతిష్ఠితమ్=established"};
D["3.16"]={t:["ఏవం ప్రవర్తితం చక్రం నానువర్తయతీహ యః |","అఘాయురిన్ద్రియారామో మోఘం పార్థ స జీవతి ||"],mt:"ఇట్లు ప్రవర్తింపబడిన చక్రమును ఈ లోకమున అనుసరింపనివాడు పాపజీవనుడు, ఇంద్రియారాముడు; ఓ పార్థా! అతడు వ్యర్థముగా జీవించును.",m:"One who does not follow the wheel thus set in motion lives in sin, delighting in the senses; such a person lives in vain, O Partha.",w:"ఏవమ్=thus; ప్రవర్తితమ్=set in motion; చక్రమ్=wheel; న అనువర్తయతి=does not follow; ఇహ=here; యః=who; అఘాయుః=living in sin; ఇన్ద్రియారామః=delighting in the senses; మోఘమ్=in vain; పార్థ=O Partha; సః=he; జీవతి=lives"};
D["3.17"]={t:["యస్త్వాత్మరతిరేవ స్యాదాత్మతృప్తశ్చ మానవః |","ఆత్మన్యేవ చ సన్తుష్టస్తస్య కార్యం న విద్యతే ||"],mt:"ఆత్మయందే రతి గలవాడును, ఆత్మతృప్తుడును, ఆత్మయందే సంతుష్టుడునగు మానవునికి చేయవలసిన కర్తవ్యము ఉండదు.",m:"But for the person who delights in the self, is satisfied in the self, and is content in the self alone, there is no duty to perform.",w:"యః తు=but who; ఆత్మరతిః=delighting in the self; ఏవ=alone; స్యాత్=is; ఆత్మతృప్తః=satisfied in the self; చ=and; మానవః=a person; ఆత్మని ఏవ చ సన్తుష్టః=content in the self alone; తస్య=his; కార్యమ్=duty; న విద్యతే=does not exist"};
D["3.18"]={t:["నైవ తస్య కృతేనార్థో నాకృతేనేహ కశ్చన |","న చాస్య సర్వభూతేషు కశ్చిదర్థవ్యపాశ్రయః ||"],mt:"అతనికి కర్మ చేయుటచే ప్రయోజనమేమియు లేదు, చేయకపోవుటచే నష్టమేమియు లేదు; సమస్త ప్రాణులలో ఎవనిపైనను అతనికి ఏ ప్రయోజనాశ్రయమును లేదు.",m:"For such a person there is no purpose in action done, nor in action left undone, and no dependence on any being for any purpose.",w:"న ఏవ=not at all; తస్య=his; కృతేన=by action; అర్థః=purpose; న అకృతేన=nor by inaction; ఇహ=here; కశ్చన=any; న చ=nor; అస్య=his; సర్వభూతేషు=among all beings; కశ్చిత్=any; అర్థవ్యపాశ్రయః=dependence for a purpose"};
D["3.19"]={t:["తస్మాదసక్తః సతతం కార్యం కర్మ సమాచర |","అసక్తో హ్యాచరన్కర్మ పరమాప్నోతి పూరుషః ||"],mt:"కావున ఆసక్తిలేక ఎల్లప్పుడును చేయదగిన కర్మను ఆచరింపుము; ఆసక్తిలేక కర్మ చేయు పురుషుడు పరమాత్మను పొందును.",m:"Therefore, always perform your duty without attachment; by acting without attachment, a person attains the Supreme.",w:"తస్మాత్=therefore; అసక్తః=unattached; సతతమ్=always; కార్యమ్=what ought to be done; కర్మ=action; సమాచర=perform; అసక్తః=unattached; హి=indeed; ఆచరన్=performing; పరమ్=the Supreme; ఆప్నోతి=attains; పూరుషః=a person"};
D["3.20"]={t:["కర్మణైవ హి సంసిద్ధిమాస్థితా జనకాదయః |","లోకసఙ్గ్రహమేవాపి సమ్పశ్యన్కర్తుమర్హసి ||"],mt:"జనకాదులు కర్మచేతనే సంసిద్ధిని పొందిరి; లోకసంగ్రహమును దృష్టిలో ఉంచుకొనియు నీవు కర్మ చేయతగినవాడవు.",m:"Janaka and others attained perfection through action alone. Considering also the welfare of the world, you should act.",w:"కర్మణా ఏవ హి=by action alone indeed; సంసిద్ధిమ్=perfection; ఆస్థితాః=attained; జనకాదయః=Janaka and others; లోకసఙ్గ్రహమ్=the welfare of the world; ఏవ అపి=also; సమ్పశ్యన్=considering; కర్తుమ్=to act; అర్హసి=you should"};
D["3.21"]={t:["యద్యదాచరతి శ్రేష్ఠస్తత్తదేవేతరో జనః |","స యత్ప్రమాణం కురుతే లోకస్తదనువర్తతే ||"],mt:"శ్రేష్ఠుడు ఏది ఆచరించునో ఇతర జనులు అదే ఆచరింతురు; అతడు ఏది ప్రమాణముగా నిలుపునో లోకము దానినే అనుసరించును.",m:"Whatever a great person does, others follow; whatever standard such a person sets, the world follows.",w:"యత్ యత్=whatever; ఆచరతి=does; శ్రేష్ఠః=a great person; తత్ తత్ ఏవ=that very thing; ఇతరః జనః=other people; సః=he; యత్=whatever; ప్రమాణమ్=standard; కురుతే=sets; లోకః=the world; తత్=that; అనువర్తతే=follows"};
D["3.22"]={t:["న మే పార్థాస్తి కర్తవ్యం త్రిషు లోకేషు కిఞ్చన |","నానవాప్తమవాప్తవ్యం వర్త ఏవ చ కర్మణి ||"],mt:"ఓ పార్థా! మూడు లోకములలో నాకు చేయవలసినది ఏదియు లేదు; పొందవలసినదై పొందనిదియు లేదు; అయినను నేను కర్మయందే ప్రవర్తించుచున్నాను.",m:"O Partha, there is nothing in the three worlds that I must do, nothing unattained that I need to attain; yet I engage in action.",w:"న మే=not for me; పార్థ=O Partha; అస్తి=there is; కర్తవ్యమ్=duty; త్రిషు లోకేషు=in the three worlds; కిఞ్చన=any; న అనవాప్తమ్=nothing unattained; అవాప్తవ్యమ్=to be attained; వర్తే=I engage; ఏవ చ=still; కర్మణి=in action"};
D["3.23"]={t:["యది హ్యహం న వర్తేయం జాతు కర్మణ్యతన్ద్రితః |","మమ వర్త్మానువర్తన్తే మనుష్యాః పార్థ సర్వశః ||"],mt:"ఓ పార్థా! నేను ఎన్నడైనను అలసత్వము లేక కర్మయందు ప్రవర్తింపకున్నచో, మనుష్యులందరును అన్ని విధముల నా మార్గమునే అనుసరింతురు.",m:"O Partha, if I ever failed to engage in action without tiring, people would follow my path in every way.",w:"యది=if; హి=indeed; అహమ్=I; న వర్తేయమ్=did not engage; జాతు=ever; కర్మణి=in action; అతన్ద్రితః=tirelessly; మమ=my; వర్త్మ=path; అనువర్తన్తే=follow; మనుష్యాః=people; పార్థ=O Partha; సర్వశః=in every way"};
D["3.24"]={t:["ఉత్సీదేయురిమే లోకా న కుర్యాం కర్మ చేదహమ్ |","సఙ్కరస్య చ కర్తా స్యాముపహన్యామిమాః ప్రజాః ||"],mt:"నేను కర్మ చేయకున్నచో ఈ లోకములు నశించును; నేను సంకరమునకు కర్తనగుదును, ఈ ప్రజలను నాశనము చేయుదును.",m:"If I did not perform action, these worlds would perish; I would be the cause of confusion and would destroy these beings.",w:"ఉత్సీదేయుః=would perish; ఇమే లోకాః=these worlds; న కుర్యామ్=if I did not perform; కర్మ=action; చేత్=if; అహమ్=I; సఙ్కరస్య=of confusion; చ=and; కర్తా=the cause; స్యామ్=I would be; ఉపహన్యామ్=I would destroy; ఇమాః ప్రజాః=these beings"};
D["3.25"]={t:["సక్తాః కర్మణ్యవిద్వాంసో యథా కుర్వన్తి భారత |","కుర్యాద్విద్వాంస్తథాసక్తశ్చికీర్షుర్లోకసఙ్గ్రహమ్ ||"],mt:"ఓ భారతా! అజ్ఞానులు కర్మయందు ఆసక్తులై ఎట్లు చేయుదురో, విద్వాంసుడు ఆసక్తిలేక, లోకసంగ్రహమును కోరి అట్లే చేయవలెను.",m:"As the unwise act with attachment to action, O Bharata, so should the wise act without attachment, wishing the welfare of the world.",w:"సక్తాః=attached; కర్మణి=to action; అవిద్వాంసః=the unwise; యథా=as; కుర్వన్తి=act; భారత=O Bharata; కుర్యాత్=should act; విద్వాన్=the wise; తథా=so; అసక్తః=unattached; చికీర్షుః=wishing; లోకసఙ్గ్రహమ్=the welfare of the world"};
D["3.26"]={t:["న బుద్ధిభేదం జనయేదజ్ఞానాం కర్మసఙ్గినామ్ |","జోషయేత్సర్వకర్మాణి విద్వాన్యుక్తః సమాచరన్ ||"],mt:"కర్మాసక్తులైన అజ్ఞానులకు బుద్ధిభేదమును కలిగింపరాదు; విద్వాంసుడు యుక్తుడై అన్ని కర్మలను చక్కగా ఆచరించుచు వారిని కర్మలయందు నిలుపవలెను.",m:"The wise should not unsettle the minds of the ignorant who are attached to action; rather, acting in a balanced way, they should engage them in all actions.",w:"న=not; బుద్ధిభేదమ్=confusion of mind; జనయేత్=should create; అజ్ఞానామ్=in the ignorant; కర్మసఙ్గినామ్=attached to action; జోషయేత్=should engage; సర్వకర్మాణి=all actions; విద్వాన్=the wise; యుక్తః=balanced; సమాచరన్=performing well"};

// Chapter 3 – shlokas 3.27 to 3.43 (completes chapter 3). Paste after your D object.
D["3.27"]={t:["ప్రకృతేః క్రియమాణాని గుణైః కర్మాణి సర్వశః |","అహఙ్కారవిమూఢాత్మా కర్తాహమితి మన్యతే ||"],mt:"ప్రకృతి గుణములచే అన్ని కర్మలు చేయబడుచుండగా, అహంకారముచే మూఢుడైనవాడు “నేనే కర్తను” అని తలచును.",m:"All actions are performed by the qualities of nature, but one deluded by ego thinks, “I am the doer.”",w:"ప్రకృతేః=of nature; క్రియమాణాని=being performed; గుణైః=by the qualities; కర్మాణి=actions; సర్వశః=in every way; అహఙ్కారవిమూఢాత్మా=deluded by ego; కర్తా=doer; అహమ్=I; ఇతి=thus; మన్యతే=thinks"};
D["3.28"]={t:["తత్త్వవిత్తు మహాబాహో గుణకర్మవిభాగయోః |","గుణా గుణేషు వర్తన్త ఇతి మత్వా న సజ్జతే ||"],mt:"ఓ మహాబాహో! గుణకర్మ విభాగముల తత్త్వము తెలిసినవాడు “గుణములు గుణములయందు ప్రవర్తించుచున్నవి” అని తలచి ఆసక్తుడు కాడు.",m:"But the knower of the truth about the divisions of qualities and actions, O mighty-armed one, understands that the qualities act upon the qualities, and so is not attached.",w:"తత్త్వవిత్=knower of the truth; తు=but; మహాబాహో=O mighty-armed; గుణకర్మవిభాగయోః=of the divisions of qualities and actions; గుణాః=the qualities; గుణేషు=among the qualities; వర్తన్తే=operate; ఇతి=thus; మత్వా=thinking; న సజ్జతే=is not attached"};
D["3.29"]={t:["ప్రకృతేర్గుణసమ్మూఢాః సజ్జన్తే గుణకర్మసు |","తానకృత్స్నవిదో మన్దాన్కృత్స్నవిన్న విచాలయేత్ ||"],mt:"ప్రకృతి గుణములచే మోహితులైనవారు గుణకర్మలయందు ఆసక్తులగుదురు; ఆ అల్పజ్ఞులను పూర్ణజ్ఞానియైనవాడు చలింపజేయరాదు.",m:"Those deluded by the qualities of nature become attached to the actions of the qualities. One who knows the whole should not disturb those dull people of incomplete knowledge.",w:"ప్రకృతేః గుణసమ్మూఢాః=deluded by the qualities of nature; సజ్జన్తే=are attached; గుణకర్మసు=to the actions of the qualities; తాన్=them; అకృత్స్నవిదః=of incomplete knowledge; మన్దాన్=dull; కృత్స్నవిత్=one who knows fully; న విచాలయేత్=should not disturb"};
D["3.30"]={t:["మయి సర్వాణి కర్మాణి సన్న్యస్యాధ్యాత్మచేతసా |","నిరాశీర్నిర్మమో భూత్వా యుధ్యస్వ విగతజ్వరః ||"],mt:"అన్ని కర్మలను అధ్యాత్మచిత్తముతో నాయందు సమర్పించి, ఆశలేక మమకారములేక, తాపము విడిచి యుద్ధము చేయుము.",m:"Surrendering all actions to me, with a mind fixed on the self, free from expectation and possessiveness, fight, free from anxiety.",w:"మయి=in me; సర్వాణి కర్మాణి=all actions; సన్న్యస్య=surrendering; అధ్యాత్మచేతసా=with a mind fixed on the self; నిరాశీః=free from expectation; నిర్మమః=free from possessiveness; భూత్వా=being; యుధ్యస్వ=fight; విగతజ్వరః=free from fever (anxiety)"};
D["3.31"]={t:["యే మే మతమిదం నిత్యమనుతిష్ఠన్తి మానవాః |","శ్రద్ధావన్తోఽనసూయన్తో ముచ్యన్తే తేఽపి కర్మభిః ||"],mt:"శ్రద్ధగలవారై అసూయ లేక నా ఈ మతమును ఎల్లప్పుడును అనుసరించు మానవులు కర్మలనుండి విముక్తులగుదురు.",m:"Those people who always follow this teaching of mine with faith and without envy are also freed from the bondage of actions.",w:"యే=who; మే=my; మతమ్=teaching; ఇదమ్=this; నిత్యమ్=always; అనుతిష్ఠన్తి=follow; మానవాః=people; శ్రద్ధావన్తః=with faith; అనసూయన్తః=without envy; ముచ్యన్తే=are freed; తే అపి=they also; కర్మభిః=from actions"};
D["3.32"]={t:["యే త్వేతదభ్యసూయన్తో నానుతిష్ఠన్తి మే మతమ్ |","సర్వజ్ఞానవిమూఢాంస్తాన్విద్ధి నష్టానచేతసః ||"],mt:"అసూయచే నా ఈ మతమును అనుసరింపనివారిని సర్వజ్ఞానమూఢులుగా, వివేకహీనులుగా, నష్టులుగా తెలిసికొనుము.",m:"But those who, out of envy, do not follow this teaching of mine, know them to be deluded in all knowledge, senseless and lost.",w:"యే తు=but those who; ఏతత్=this; అభ్యసూయన్తః=cavilling at; న అనుతిష్ఠన్తి=do not follow; మే మతమ్=my teaching; సర్వజ్ఞానవిమూఢాన్=deluded in all knowledge; తాన్=them; విద్ధి=know; నష్టాన్=lost; అచేతసః=senseless"};
D["3.33"]={t:["సదృశం చేష్టతే స్వస్యాః ప్రకృతేర్జ్ఞానవానపి |","ప్రకృతిం యాన్తి భూతాని నిగ్రహః కిం కరిష్యతి ||"],mt:"జ్ఞానవంతుడు కూడా తన ప్రకృతికి అనుగుణముగా వర్తించును; ప్రాణులు ప్రకృతిని అనుసరించును; నిగ్రహము ఏమి చేయగలదు?",m:"Even a wise person acts in accordance with their own nature; beings follow their nature. What can suppression accomplish?",w:"సదృశమ్=in accordance; చేష్టతే=acts; స్వస్యాః ప్రకృతేః=with one’s own nature; జ్ఞానవాన్ అపి=even the wise; ప్రకృతిమ్=nature; యాన్తి=follow; భూతాని=beings; నిగ్రహః=suppression; కిమ్=what; కరిష్యతి=will accomplish"};
D["3.34"]={t:["ఇన్ద్రియస్యేన్ద్రియస్యార్థే రాగద్వేషౌ వ్యవస్థితౌ |","తయోర్న వశమాగచ్ఛేత్తౌ హ్యస్య పరిపన్థినౌ ||"],mt:"ప్రతి ఇంద్రియమునకు దాని విషయమున రాగద్వేషములు నిలిచియున్నవి; వాటి వశము కాకూడదు, అవి నిజముగా అతని శత్రువులు.",m:"Attraction and aversion are seated in the object of each sense; one should not come under their sway, for they are one’s two obstructers.",w:"ఇన్ద్రియస్య ఇన్ద్రియస్య అర్థే=in the object of each sense; రాగద్వేషౌ=attraction and aversion; వ్యవస్థితౌ=are stationed; తయోః=of them; న వశమ్ ఆగచ్ఛేత్=should not come under sway; తౌ=those two; హి=indeed; అస్య=his; పరిపన్థినౌ=two obstructers"};
D["3.35"]={t:["శ్రేయాన్స్వధర్మో విగుణః పరధర్మాత్స్వనుష్ఠితాత్ |","స్వధర్మే నిధనం శ్రేయః పరధర్మో భయావహః ||"],mt:"బాగుగా ఆచరింపబడిన పరధర్మముకంటె గుణరహితమైనను స్వధర్మము శ్రేష్ఠము; స్వధర్మమున మరణము శ్రేయస్కరము; పరధర్మము భయావహము.",m:"One’s own duty, even if imperfect, is better than another’s duty well performed. Death in one’s own duty is better; another’s duty is fraught with danger.",w:"శ్రేయాన్=better; స్వధర్మః=one’s own duty; విగుణః=imperfect; పరధర్మాత్=than another’s duty; స్వనుష్ఠితాత్=well performed; స్వధర్మే=in one’s own duty; నిధనమ్=death; శ్రేయః=better; పరధర్మః=another’s duty; భయావహః=fraught with danger"};
D["3.36"]={t:["అర్జున ఉవాచ |","అథ కేన ప్రయుక్తోఽయం పాపం చరతి పూరుషః |","అనిచ్ఛన్నపి వార్ష్ణేయ బలాదివ నియోజితః ||"],mt:"అర్జునుడు పలికెను: ఓ వార్ష్ణేయా! మనుష్యుడు తనకు ఇష్టము లేకున్నను బలవంతముగా నియోగింపబడినట్లు, ఎవనిచే ప్రేరేపింపబడి పాపము చేయుచున్నాడు?",m:"Arjuna said: O descendant of Vrishni, impelled by what does a person commit sin, even unwillingly, as if compelled by force?",w:"అర్జునః ఉవాచ=Arjuna said; అథ=then; కేన=by what; ప్రయుక్తః=impelled; అయమ్=this; పాపమ్=sin; చరతి=commits; పూరుషః=a person; అనిచ్ఛన్=not wishing; అపి=even; వార్ష్ణేయ=O descendant of Vrishni; బలాత్=by force; ఇవ=as if; నియోజితః=engaged"};
D["3.37"]={t:["శ్రీభగవానువాచ |","కామ ఏష క్రోధ ఏష రజోగుణసముద్భవః |","మహాశనో మహాపాప్మా విద్ధ్యేనమిహ వైరిణమ్ ||"],mt:"శ్రీభగవానుడు పలికెను: ఇది రజోగుణమువలన పుట్టిన కామము, ఇదే క్రోధము; ఇది మహాభక్షకము, మహాపాపి; దీనినే ఇచట శత్రువుగా తెలిసికొనుము.",m:"The Blessed Lord said: It is desire, it is anger, born of the quality of passion; all-devouring and greatly sinful. Know this to be the enemy here.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; కామః ఏషః=this desire; క్రోధః ఏషః=this anger; రజోగుణసముద్భవః=born of the quality of passion; మహాశనః=all-devouring; మహాపాప్మా=greatly sinful; విద్ధి=know; ఏనమ్=this; ఇహ=here; వైరిణమ్=the enemy"};
D["3.38"]={t:["ధూమేనావ్రియతే వహ్నిర్యథాదర్శో మలేన చ |","యథోల్బేనావృతో గర్భస్తథా తేనేదమావృతమ్ ||"],mt:"పొగచే అగ్ని కప్పబడునట్లు, మురికిచే అద్దము కప్పబడునట్లు, మావిచే గర్భము కప్పబడునట్లు దీనిచే ఇది (జ్ఞానము) కప్పబడియున్నది.",m:"As fire is covered by smoke, a mirror by dust, and an embryo by the womb, so is this (knowledge) covered by that (desire).",w:"ధూమేన=by smoke; ఆవ్రియతే=is covered; వహ్నిః=fire; యథా=as; ఆదర్శః=mirror; మలేన=by dust; చ=and; ఉల్బేన=by the womb membrane; ఆవృతః=covered; గర్భః=embryo; తథా=so; తేన=by that; ఇదమ్=this; ఆవృతమ్=is covered"};
D["3.39"]={t:["ఆవృతం జ్ఞానమేతేన జ్ఞానినో నిత్యవైరిణా |","కామరూపేణ కౌన్తేయ దుష్పూరేణానలేన చ ||"],mt:"ఓ కౌంతేయా! తృప్తిపొందని అగ్నివంటి, కామరూపమైన, జ్ఞానుల నిత్యశత్రువుచే జ్ఞానము కప్పబడియున్నది.",m:"O son of Kunti, knowledge is covered by this constant enemy of the wise, in the form of desire, which is an insatiable fire.",w:"ఆవృతమ్=covered; జ్ఞానమ్=knowledge; ఏతేన=by this; జ్ఞానినః=of the wise; నిత్యవైరిణా=by the constant enemy; కామరూపేణ=in the form of desire; కౌన్తేయ=O son of Kunti; దుష్పూరేణ=insatiable; అనలేన=fire; చ=and"};
D["3.40"]={t:["ఇన్ద్రియాణి మనో బుద్ధిరస్యాధిష్ఠానముచ్యతే |","ఏతైర్విమోహయత్యేష జ్ఞానమావృత్య దేహినమ్ ||"],mt:"ఇంద్రియములు, మనస్సు, బుద్ధి దీని ఆశ్రయస్థానములని చెప్పబడును; వీటిద్వారా ఇది జ్ఞానమును కప్పి దేహిని మోహపరచును.",m:"The senses, mind and intellect are said to be its seat. Through these, it covers knowledge and bewilders the embodied soul.",w:"ఇన్ద్రియాణి=senses; మనః=mind; బుద్ధిః=intellect; అస్య=its; అధిష్ఠానమ్=seat; ఉచ్యతే=is said; ఏతైః=through these; విమోహయతి=bewilders; ఏషః=this; జ్ఞానమ్=knowledge; ఆవృత్య=covering; దేహినమ్=the embodied"};
D["3.41"]={t:["తస్మాత్త్వమిన్ద్రియాణ్యాదౌ నియమ్య భరతర్షభ |","పాప్మానం ప్రజహి హ్యేనం జ్ఞానవిజ్ఞాననాశనమ్ ||"],mt:"కావున ఓ భరతశ్రేష్ఠా! ముందుగా ఇంద్రియములను నియమించి జ్ఞానవిజ్ఞానములను నాశనము చేయు ఈ పాపిని నశింపజేయుము.",m:"Therefore, O best of the Bharatas, first control the senses and then destroy this sinful enemy, the destroyer of knowledge and realisation.",w:"తస్మాత్=therefore; త్వమ్=you; ఇన్ద్రియాణి=senses; ఆదౌ=first; నియమ్య=controlling; భరతర్షభ=O best of the Bharatas; పాప్మానమ్=the sinful one; ప్రజహి=destroy; హి=indeed; ఏనమ్=this; జ్ఞానవిజ్ఞాననాశనమ్=destroyer of knowledge and realisation"};
D["3.42"]={t:["ఇన్ద్రియాణి పరాణ్యాహురిన్ద్రియేభ్యః పరం మనః |","మనసస్తు పరా బుద్ధిర్యో బుద్ధేః పరతస్తు సః ||"],mt:"ఇంద్రియములు గొప్పవని చెప్పుదురు; ఇంద్రియములకంటె మనస్సు గొప్పది; మనస్సుకంటె బుద్ధి గొప్పది; బుద్ధికంటె గొప్పవాడు ఆత్మ.",m:"They say the senses are superior (to the body); the mind is superior to the senses; the intellect is superior to the mind; and that which is beyond the intellect is the self.",w:"ఇన్ద్రియాణి=senses; పరాణి=superior; ఆహుః=they say; ఇన్ద్రియేభ్యః=than the senses; పరమ్=superior; మనః=mind; మనసః=than the mind; తు=but; పరా=superior; బుద్ధిః=intellect; యః=which; బుద్ధేః=than the intellect; పరతః=beyond; తు=but; సః=that (the self)"};
D["3.43"]={t:["ఏవం బుద్ధేః పరం బుద్ధ్వా సంస్తభ్యాత్మానమాత్మనా |","జహి శత్రుం మహాబాహో కామరూపం దురాసదమ్ ||"],mt:"ఇట్లు బుద్ధికంటె పరమైనదానిని తెలిసికొని, ఆత్మచే ఆత్మను స్థిరపరచి, ఓ మహాబాహో! కామరూపమైన, జయింప కష్టమైన శత్రువును సంహరింపుము.",m:"Thus knowing that which is beyond the intellect, and steadying the self by the self, slay the enemy in the form of desire, so hard to conquer, O mighty-armed one.",w:"ఏవమ్=thus; బుద్ధేః పరమ్=beyond the intellect; బుద్ధ్వా=knowing; సంస్తభ్య=steadying; ఆత్మానమ్=the self; ఆత్మనా=by the self; జహి=slay; శత్రుమ్=enemy; మహాబాహో=O mighty-armed; కామరూపమ్=in the form of desire; దురాసదమ్=hard to conquer"};

// Chapter 4 – shlokas 4.1 to 4.21 (D["4.7"] here replaces the earlier English-only 4.7). Paste after your D object.
D["4.1"]={t:["శ్రీభగవానువాచ |","ఇమం వివస్వతే యోగం ప్రోక్తవానహమవ్యయమ్ |","వివస్వాన్మనవే ప్రాహ మనురిక్ష్వాకవేఽబ్రవీత్ ||"],mt:"శ్రీభగవానుడు పలికెను: నేను ఈ అవ్యయమైన యోగమును వివస్వంతునకు చెప్పితిని; వివస్వంతుడు మనువునకు చెప్పెను; మనువు ఇక్ష్వాకునకు తెలిపెను.",m:"The Blessed Lord said: I taught this imperishable yoga to Vivasvan (the sun-god); Vivasvan told it to Manu, and Manu told it to Ikshvaku.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ఇమమ్=this; వివస్వతే=to Vivasvan; యోగమ్=yoga; ప్రోక్తవాన్=declared; అహమ్=I; అవ్యయమ్=imperishable; వివస్వాన్=Vivasvan; మనవే=to Manu; ప్రాహ=told; మనుః=Manu; ఇక్ష్వాకవే=to Ikshvaku; అబ్రవీత్=said"};
D["4.2"]={t:["ఏవం పరమ్పరాప్రాప్తమిమం రాజర్షయో విదుః |","స కాలేనేహ మహతా యోగో నష్టః పరన్తప ||"],mt:"ఇట్లు పరంపరగా లభించిన దీనిని రాజర్షులు తెలిసికొనిరి; ఓ పరంతపా! ఆ యోగము చాలా కాలముచే ఈ లోకమున నశించినది.",m:"Thus handed down in succession, the royal sages knew this yoga. But over a long time, O scorcher of foes, it was lost in this world.",w:"ఏవమ్=thus; పరమ్పరాప్రాప్తమ్=received through succession; ఇమమ్=this; రాజర్షయః=royal sages; విదుః=knew; సః=that; కాలేన=by time; ఇహ=here; మహతా=long; యోగః=yoga; నష్టః=lost; పరన్తప=O scorcher of foes"};
D["4.3"]={t:["స ఏవాయం మయా తేఽద్య యోగః ప్రోక్తః పురాతనః |","భక్తోఽసి మే సఖా చేతి రహస్యం హ్యేతదుత్తమమ్ ||"],mt:"ఆ పురాతనమైన యోగమే నేడు నీకు నాచే చెప్పబడినది; నీవు నా భక్తుడవు, సఖుడవు; ఇది ఉత్తమమైన రహస్యము.",m:"That same ancient yoga has been told to you by me today, for you are my devotee and friend; this is a supreme secret.",w:"సః ఏవ=that very; అయమ్=this; మయా=by me; తే=to you; అద్య=today; యోగః=yoga; ప్రోక్తః=declared; పురాతనః=ancient; భక్తః=devotee; అసి=you are; మే=my; సఖా=friend; చ=and; ఇతి=thus; రహస్యమ్=secret; హి=indeed; ఏతత్=this; ఉత్తమమ్=supreme"};
D["4.4"]={t:["అర్జున ఉవాచ |","అపరం భవతో జన్మ పరం జన్మ వివస్వతః |","కథమేతద్విజానీయాం త్వమాదౌ ప్రోక్తవానితి ||"],mt:"అర్జునుడు పలికెను: నీ జన్మ ఇటీవలిది, వివస్వంతుని జన్మ పురాతనము; నీవు మొదట దీనిని చెప్పితివని ఎట్లు తెలిసికొనగలను?",m:"Arjuna said: Your birth is recent and Vivasvan’s birth was long ago. How am I to understand that you taught this in the beginning?",w:"అర్జునః ఉవాచ=Arjuna said; అపరమ్=later; భవతః=your; జన్మ=birth; పరమ్=earlier; వివస్వతః=of Vivasvan; కథమ్=how; ఏతత్=this; విజానీయామ్=may I understand; త్వమ్=you; ఆదౌ=in the beginning; ప్రోక్తవాన్=declared; ఇతి=thus"};
D["4.5"]={t:["శ్రీభగవానువాచ |","బహూని మే వ్యతీతాని జన్మాని తవ చార్జున |","తాన్యహం వేద సర్వాణి న త్వం వేత్థ పరన్తప ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ అర్జునా! నాకును నీకును ఎన్నో జన్మలు గడచిపోయినవి; వాటినన్నిటిని నేను ఎరుగుదును; ఓ పరంతపా! నీవు ఎరుగవు.",m:"The Blessed Lord said: Many births of mine and yours have passed, O Arjuna. I know them all, but you do not, O scorcher of foes.",w:"బహూని=many; మే=my; వ్యతీతాని=have passed; జన్మాని=births; తవ=your; చ=and; అర్జున=O Arjuna; తాని=them; అహమ్=I; వేద=know; సర్వాణి=all; న త్వమ్=you do not; వేత్థ=know; పరన్తప=O scorcher of foes"};
D["4.6"]={t:["అజోఽపి సన్నవ్యయాత్మా భూతానామీశ్వరోఽపి సన్ |","ప్రకృతిం స్వామధిష్ఠాయ సమ్భవామ్యాత్మమాయయా ||"],mt:"నేను జన్మరహితుడనైనను, అవ్యయాత్ముడనైనను, భూతములకు ఈశ్వరుడనైనను, నా ప్రకృతిని ఆశ్రయించి నా మాయచే అవతరించుచున్నాను.",m:"Though I am unborn, of imperishable nature, and the lord of all beings, I take birth by governing my own nature through my own power of maya.",w:"అజః=unborn; అపి=though; సన్=being; అవ్యయాత్మా=of imperishable nature; భూతానామ్=of beings; ఈశ్వరః=lord; ప్రకృతిమ్=nature; స్వామ్=my own; అధిష్ఠాయ=governing; సమ్భవామి=I manifest; ఆత్మమాయయా=by my own power of maya"};
D["4.7"]={t:["యదా యదా హి ధర్మస్య గ్లానిర్భవతి భారత |","అభ్యుత్థానమధర్మస్య తదాత్మానం సృజామ్యహమ్ ||"],mt:"ఓ భారతా! ఎప్పుడెప్పుడు ధర్మమునకు హాని కలుగునో, అధర్మము పెరుగునో, అప్పుడప్పుడు నేను నన్ను సృష్టించుకొందును.",m:"Whenever righteousness declines and unrighteousness rises, O Bharata, then I manifest myself.",w:"యదా యదా=whenever; హి=indeed; ధర్మస్య=of righteousness; గ్లానిః=decline; భవతి=occurs; భారత=O Bharata; అభ్యుత్థానమ్=rise; అధర్మస్య=of unrighteousness; తదా=then; ఆత్మానమ్=myself; సృజామి=I manifest; అహమ్=I"};
D["4.8"]={t:["పరిత్రాణాయ సాధూనాం వినాశాయ చ దుష్కృతామ్ |","ధర్మసంస్థాపనార్థాయ సమ్భవామి యుగే యుగే ||"],mt:"సాధువులను రక్షించుటకును, దుష్కృతులను నాశనము చేయుటకును, ధర్మమును స్థాపించుటకును నేను యుగయుగమున అవతరింతును.",m:"To protect the good, to destroy evildoers, and to establish dharma, I manifest age after age.",w:"పరిత్రాణాయ=for the protection; సాధూనామ్=of the good; వినాశాయ=for the destruction; చ=and; దుష్కృతామ్=of evildoers; ధర్మసంస్థాపనార్థాయ=for establishing dharma; సమ్భవామి=I manifest; యుగే యుగే=age after age"};
D["4.9"]={t:["జన్మ కర్మ చ మే దివ్యమేవం యో వేత్తి తత్త్వతః |","త్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోఽర్జున ||"],mt:"ఓ అర్జునా! నా జన్మకర్మలు దివ్యములని ఇట్లు తత్త్వముగా తెలిసినవాడు దేహమును విడిచి మరల జన్మింపడు; నన్నే పొందును.",m:"One who thus truly knows my divine birth and action, on leaving the body, is not born again; that person comes to me, O Arjuna.",w:"జన్మ=birth; కర్మ=action; చ=and; మే=my; దివ్యమ్=divine; ఏవమ్=thus; యః=who; వేత్తి=knows; తత్త్వతః=in truth; త్యక్త్వా=leaving; దేహమ్=body; పునర్జన్మ=rebirth; న ఏతి=does not attain; మామ్=me; ఏతి=comes; సః=he; అర్జున=O Arjuna"};
D["4.10"]={t:["వీతరాగభయక్రోధా మన్మయా మాముపాశ్రితాః |","బహవో జ్ఞానతపసా పూతా మద్భావమాగతాః ||"],mt:"రాగభయక్రోధములు విడిచి, నాయందే లీనమై, నన్ను ఆశ్రయించి, జ్ఞానతపస్సుచే పవిత్రులైన అనేకులు నా భావమును పొందిరి.",m:"Free from attachment, fear and anger, absorbed in me and taking refuge in me, many purified by the austerity of knowledge have attained my state.",w:"వీతరాగభయక్రోధాః=free from attachment, fear and anger; మన్మయాః=absorbed in me; మామ్=me; ఉపాశ్రితాః=taking refuge; బహవః=many; జ్ఞానతపసా=by the austerity of knowledge; పూతాః=purified; మద్భావమ్=my state; ఆగతాః=attained"};
D["4.11"]={t:["యే యథా మాం ప్రపద్యన్తే తాంస్తథైవ భజామ్యహమ్ |","మమ వర్త్మానువర్తన్తే మనుష్యాః పార్థ సర్వశః ||"],mt:"ఎవరు ఎట్లు నన్ను ఆశ్రయింతురో వారిని నేను అట్లే అనుగ్రహింతును; ఓ పార్థా! మనుష్యులు అన్ని విధముల నా మార్గమునే అనుసరింతురు.",m:"In whatever way people approach me, I reciprocate accordingly; people follow my path in every way, O Partha.",w:"యే=who; యథా=in whatever way; మామ్=me; ప్రపద్యన్తే=approach; తాన్=them; తథా ఏవ=in that very way; భజామి=I reciprocate; అహమ్=I; మమ=my; వర్త్మ=path; అనువర్తన్తే=follow; మనుష్యాః=people; పార్థ=O Partha; సర్వశః=in every way"};
D["4.12"]={t:["కాఙ్క్షన్తః కర్మణాం సిద్ధిం యజన్త ఇహ దేవతాః |","క్షిప్రం హి మానుషే లోకే సిద్ధిర్భవతి కర్మజా ||"],mt:"కర్మల సిద్ధిని కోరువారు ఈ లోకమున దేవతలను పూజింతురు; మానవలోకమున కర్మజసిద్ధి శీఘ్రముగా కలుగును.",m:"Those who desire success in their actions worship the gods here; for in the human world, success born of action comes quickly.",w:"కాఙ్క్షన్తః=desiring; కర్మణామ్=of actions; సిద్ధిమ్=success; యజన్తే=worship; ఇహ=here; దేవతాః=gods; క్షిప్రమ్=quickly; హి=indeed; మానుషే లోకే=in the human world; సిద్ధిః=success; భవతి=comes; కర్మజా=born of action"};
D["4.13"]={t:["చాతుర్వర్ణ్యం మయా సృష్టం గుణకర్మవిభాగశః |","తస్య కర్తారమపి మాం విద్ధ్యకర్తారమవ్యయమ్ ||"],mt:"గుణకర్మ విభాగముల ననుసరించి నాచే నాలుగు వర్ణములు సృష్టింపబడినవి; దానికి కర్తనైనను నన్ను అకర్తగా, అవ్యయునిగా తెలిసికొనుము.",m:"The fourfold order was created by me according to the divisions of qualities and actions. Though I am its author, know me to be a non-doer and imperishable.",w:"చాతుర్వర్ణ్యమ్=the fourfold order; మయా=by me; సృష్టమ్=created; గుణకర్మవిభాగశః=according to the divisions of qualities and actions; తస్య=of it; కర్తారమ్=the author; అపి=though; మామ్=me; విద్ధి=know; అకర్తారమ్=non-doer; అవ్యయమ్=imperishable"};
D["4.14"]={t:["న మాం కర్మాణి లిమ్పన్తి న మే కర్మఫలే స్పృహా |","ఇతి మాం యోఽభిజానాతి కర్మభిర్న స బధ్యతే ||"],mt:"కర్మలు నన్ను అంటవు; కర్మఫలమునందు నాకు ఆసక్తి లేదు; ఇట్లు నన్ను తెలిసినవాడు కర్మలచే బంధింపబడడు.",m:"Actions do not taint me, nor do I desire the fruit of action. One who knows me thus is not bound by actions.",w:"న మామ్=not me; కర్మాణి=actions; లిమ్పన్తి=taint; న మే=nor my; కర్మఫలే=in the fruit of action; స్పృహా=desire; ఇతి=thus; మామ్=me; యః=who; అభిజానాతి=knows; కర్మభిః=by actions; న సః=he is not; బధ్యతే=bound"};
D["4.15"]={t:["ఏవం జ్ఞాత్వా కృతం కర్మ పూర్వైరపి ముముక్షుభిః |","కురు కర్మైవ తస్మాత్త్వం పూర్వైః పూర్వతరం కృతమ్ ||"],mt:"ఇట్లు తెలిసి పూర్వపు ముముక్షువులు కూడా కర్మను చేసిరి; కావున నీవు పూర్వులచే పూర్వకాలమునుండి చేయబడిన కర్మనే చేయుము.",m:"Knowing this, even the ancient seekers of liberation performed action. Therefore you too perform action, as was done by the ancients in earlier times.",w:"ఏవమ్=thus; జ్ఞాత్వా=knowing; కృతమ్=done; కర్మ=action; పూర్వైః=by the ancients; అపి=even; ముముక్షుభిః=by seekers of liberation; కురు=perform; కర్మ ఏవ=action alone; తస్మాత్=therefore; త్వమ్=you; పూర్వైః=by the ancients; పూర్వతరమ్=in earlier times; కృతమ్=done"};
D["4.16"]={t:["కిం కర్మ కిమకర్మేతి కవయోఽప్యత్ర మోహితాః |","తత్తే కర్మ ప్రవక్ష్యామి యజ్జ్ఞాత్వా మోక్ష్యసేఽశుభాత్ ||"],mt:"కర్మ ఏది, అకర్మ ఏది అనుటలో విద్వాంసులు కూడా మోహము చెందిరి; దేనిని తెలిసికొని నీవు అశుభమునుండి విముక్తుడవగుదువో ఆ కర్మను నీకు చెప్పెదను.",m:"What is action and what is inaction? Even the wise are bewildered here. I shall explain to you that action, knowing which you will be freed from evil.",w:"కిమ్ కర్మ=what is action; కిమ్ అకర్మ=what is inaction; ఇతి=thus; కవయః=the wise; అపి=even; అత్ర=here; మోహితాః=are bewildered; తత్=that; తే=to you; కర్మ=action; ప్రవక్ష్యామి=I shall explain; యత్=which; జ్ఞాత్వా=knowing; మోక్ష్యసే=you will be freed; అశుభాత్=from evil"};
D["4.17"]={t:["కర్మణో హ్యపి బోద్ధవ్యం బోద్ధవ్యం చ వికర్మణః |","అకర్మణశ్చ బోద్ధవ్యం గహనా కర్మణో గతిః ||"],mt:"కర్మను గూర్చియు తెలిసికొనవలెను, వికర్మను గూర్చియు తెలిసికొనవలెను, అకర్మను గూర్చియు తెలిసికొనవలెను; కర్మ యొక్క గతి గహనమైనది.",m:"One must understand action, understand wrong action, and understand inaction as well; the course of action is profound.",w:"కర్మణః=of action; హి=indeed; అపి=also; బోద్ధవ్యమ్=should be understood; వికర్మణః=of wrong action; చ=and; అకర్మణః=of inaction; గహనా=deep; కర్మణః గతిః=the course of action"};
D["4.18"]={t:["కర్మణ్యకర్మ యః పశ్యేదకర్మణి చ కర్మ యః |","స బుద్ధిమాన్మనుష్యేషు స యుక్తః కృత్స్నకర్మకృత్ ||"],mt:"కర్మయందు అకర్మను, అకర్మయందు కర్మను చూచువాడు మనుష్యులలో బుద్ధిమంతుడు, యోగి, సర్వకర్మలను చేయువాడు.",m:"One who sees inaction in action and action in inaction is wise among people, is a yogi, and performs all actions.",w:"కర్మణి=in action; అకర్మ=inaction; యః=who; పశ్యేత్=sees; అకర్మణి=in inaction; చ=and; కర్మ=action; సః=he; బుద్ధిమాన్=wise; మనుష్యేషు=among people; యుక్తః=a yogi; కృత్స్నకర్మకృత్=performer of all actions"};
D["4.19"]={t:["యస్య సర్వే సమారమ్భాః కామసఙ్కల్పవర్జితాః |","జ్ఞానాగ్నిదగ్ధకర్మాణం తమాహుః పణ్డితం బుధాః ||"],mt:"ఎవని సమస్త ప్రయత్నములు కామసంకల్పములు లేనివో, జ్ఞానాగ్నిచే కర్మలు దగ్ధమైన అతనిని జ్ఞానులు పండితుడందురు.",m:"One whose every undertaking is free from desire and selfish intention, and whose actions are burnt by the fire of knowledge, the learned call wise.",w:"యస్య=whose; సర్వే=all; సమారమ్భాః=undertakings; కామసఙ్కల్పవర్జితాః=free from desire and intention; జ్ఞానాగ్నిదగ్ధకర్మాణమ్=whose actions are burnt by the fire of knowledge; తమ్=him; ఆహుః=call; పణ్డితమ్=wise; బుధాః=the learned"};
D["4.20"]={t:["త్యక్త్వా కర్మఫలాసఙ్గం నిత్యతృప్తో నిరాశ్రయః |","కర్మణ్యభిప్రవృత్తోఽపి నైవ కిఞ్చిత్కరోతి సః ||"],mt:"కర్మఫలాసక్తిని విడిచి, నిత్యతృప్తుడై, ఆశ్రయములేనివాడై కర్మయందు ప్రవర్తించినను అతడు ఏమియు చేయనివాడే.",m:"Having given up attachment to the fruit of action, ever content and independent, even though engaged in action, such a person does nothing at all.",w:"త్యక్త్వా=giving up; కర్మఫలాసఙ్గమ్=attachment to the fruit of action; నిత్యతృప్తః=ever content; నిరాశ్రయః=independent; కర్మణి=in action; అభిప్రవృత్తః అపి=though engaged; న ఏవ=not at all; కిఞ్చిత్=anything; కరోతి=does; సః=he"};
D["4.21"]={t:["నిరాశీర్యతచిత్తాత్మా త్యక్తసర్వపరిగ్రహః |","శారీరం కేవలం కర్మ కుర్వన్నాప్నోతి కిల్బిషమ్ ||"],mt:"ఆశలేనివాడై, మనోదేహములను నిగ్రహించి, సర్వపరిగ్రహములను విడిచి, కేవలము శారీరక కర్మను చేయువాడు పాపమును పొందడు.",m:"Free from expectation, with mind and body controlled, having given up all possessions, one who performs merely bodily action incurs no sin.",w:"నిరాశీః=free from expectation; యతచిత్తాత్మా=with controlled mind and body; త్యక్తసర్వపరిగ్రహః=having given up all possessions; శారీరమ్=bodily; కేవలమ్=merely; కర్మ=action; కుర్వన్=performing; న ఆప్నోతి=does not incur; కిల్బిషమ్=sin"};

// Chapter 4 – shlokas 4.22 to 4.42 (completes chapter 4). Paste after your D object.
D["4.22"]={t:["యదృచ్ఛాలాభసన్తుష్టో ద్వన్ద్వాతీతో విమత్సరః |","సమః సిద్ధావసిద్ధౌ చ కృత్వాపి న నిబధ్యతే ||"],mt:"యదృచ్ఛగా లభించినదానితో సంతుష్టుడై, ద్వంద్వములను దాటి, మత్సరము విడిచి, సిద్ధియందు అసిద్ధియందు సమభావము గలవాడు కర్మ చేసినను బంధింపబడడు.",m:"Content with whatever comes by chance, beyond the pairs of opposites, free from envy, and equal in success and failure, one is not bound even while acting.",w:"యదృచ్ఛాలాభసన్తుష్టః=content with what comes by chance; ద్వన్ద్వాతీతః=beyond the pairs of opposites; విమత్సరః=free from envy; సమః=equal; సిద్ధౌ=in success; అసిద్ధౌ=in failure; చ=and; కృత్వా అపి=even while acting; న నిబధ్యతే=is not bound"};
D["4.23"]={t:["గతసఙ్గస్య ముక్తస్య జ్ఞానావస్థితచేతసః |","యజ్ఞాయాచరతః కర్మ సమగ్రం ప్రవిలీయతే ||"],mt:"ఆసక్తిని విడిచినవానికి, ముక్తునికి, జ్ఞానమందు నిలిచిన చిత్తము గలవానికి, యజ్ఞార్థముగా కర్మ చేయువానికి సమస్త కర్మయు లయమగును.",m:"For one who is free from attachment, liberated, whose mind is established in knowledge, and who acts for the sake of sacrifice, all action is dissolved.",w:"గతసఙ్గస్య=of one free from attachment; ముక్తస్య=of the liberated; జ్ఞానావస్థితచేతసః=whose mind is established in knowledge; యజ్ఞాయ=for sacrifice; ఆచరతః=of one performing; కర్మ=action; సమగ్రమ్=entire; ప్రవిలీయతే=dissolves"};
D["4.24"]={t:["బ్రహ్మార్పణం బ్రహ్మ హవిర్బ్రహ్మాగ్నౌ బ్రహ్మణా హుతమ్ |","బ్రహ్మైవ తేన గన్తవ్యం బ్రహ్మకర్మసమాధినా ||"],mt:"అర్పణము బ్రహ్మము, హవిస్సు బ్రహ్మము, బ్రహ్మాగ్నియందు బ్రహ్మముచే హోమము చేయబడెను; కర్మయందు బ్రహ్మభావమున నిమగ్నుడైనవాడు బ్రహ్మమునే పొందును.",m:"The offering is Brahman, the oblation is Brahman, offered by Brahman into the fire of Brahman. Brahman alone is reached by one absorbed in Brahman through action.",w:"బ్రహ్మార్పణమ్=the offering is Brahman; బ్రహ్మ=Brahman; హవిః=oblation; బ్రహ్మాగ్నౌ=in the fire of Brahman; బ్రహ్మణా=by Brahman; హుతమ్=offered; బ్రహ్మ ఏవ=Brahman alone; తేన=by him; గన్తవ్యమ్=to be reached; బ్రహ్మకర్మసమాధినా=by one absorbed in Brahman in action"};
D["4.25"]={t:["దైవమేవాపరే యజ్ఞం యోగినః పర్యుపాసతే |","బ్రహ్మాగ్నావపరే యజ్ఞం యజ్ఞేనైవోపజుహ్వతి ||"],mt:"కొందరు యోగులు దైవయజ్ఞమునే ఆచరింతురు; మరికొందరు బ్రహ్మాగ్నియందు యజ్ఞముచేతనే యజ్ఞమును హోమము చేయుదురు.",m:"Some yogis perform sacrifice to the gods alone; others offer sacrifice by sacrifice itself into the fire of Brahman.",w:"దైవమ్=to the gods; ఏవ=alone; అపరే=others; యజ్ఞమ్=sacrifice; యోగినః=yogis; పర్యుపాసతే=perform; బ్రహ్మాగ్నౌ=in the fire of Brahman; యజ్ఞేన ఏవ=by sacrifice itself; ఉపజుహ్వతి=offer"};
D["4.26"]={t:["శ్రోత్రాదీనీన్ద్రియాణ్యన్యే సంయమాగ్నిషు జుహ్వతి |","శబ్దాదీన్విషయానన్య ఇన్ద్రియాగ్నిషు జుహ్వతి ||"],mt:"కొందరు శ్రోత్రాది ఇంద్రియములను సంయమాగ్నులలో హోమము చేయుదురు; మరికొందరు శబ్దాది విషయములను ఇంద్రియాగ్నులలో హోమము చేయుదురు.",m:"Some offer hearing and the other senses into the fires of restraint; others offer sound and the other sense objects into the fires of the senses.",w:"శ్రోత్రాదీని=hearing and the rest; ఇన్ద్రియాణి=senses; అన్యే=others; సంయమాగ్నిషు=in the fires of restraint; జుహ్వతి=offer; శబ్దాదీన్=sound and the rest; విషయాన్=objects; అన్యే=others; ఇన్ద్రియాగ్నిషు=in the fires of the senses"};
D["4.27"]={t:["సర్వాణీన్ద్రియకర్మాణి ప్రాణకర్మాణి చాపరే |","ఆత్మసంయమయోగాగ్నౌ జుహ్వతి జ్ఞానదీపితే ||"],mt:"మరికొందరు ఇంద్రియకర్మలన్నిటిని ప్రాణకర్మలను జ్ఞానముచే ప్రజ్వలింపబడిన ఆత్మసంయమ యోగాగ్నియందు హోమము చేయుదురు.",m:"Others offer all actions of the senses and the vital breath into the fire of yoga of self-control, kindled by knowledge.",w:"సర్వాణి ఇన్ద్రియకర్మాణి=all actions of the senses; ప్రాణకర్మాణి=actions of the vital breath; చ=and; అపరే=others; ఆత్మసంయమయోగాగ్నౌ=in the fire of yoga of self-control; జుహ్వతి=offer; జ్ఞానదీపితే=kindled by knowledge"};
D["4.28"]={t:["ద్రవ్యయజ్ఞాస్తపోయజ్ఞా యోగయజ్ఞాస్తథాపరే |","స్వాధ్యాయజ్ఞానయజ్ఞాశ్చ యతయః సంశితవ్రతాః ||"],mt:"కొందరు ద్రవ్యయజ్ఞులు, తపోయజ్ఞులు, యోగయజ్ఞులు; మరికొందరు కఠినవ్రతులైన యతులు స్వాధ్యాయజ్ఞానయజ్ఞులు.",m:"Some offer wealth, some austerity, some yoga practice; and others, ascetics of strict vows, offer study and knowledge as sacrifice.",w:"ద్రవ్యయజ్ఞాః=offering wealth; తపోయజ్ఞాః=offering austerity; యోగయజ్ఞాః=offering yoga practice; తథా=so also; అపరే=others; స్వాధ్యాయజ్ఞానయజ్ఞాః=offering study and knowledge; చ=and; యతయః=ascetics; సంశితవ్రతాః=of strict vows"};
D["4.29"]={t:["అపానే జుహ్వతి ప్రాణం ప్రాణేఽపానం తథాపరే |","ప్రాణాపానగతీ రుద్ధ్వా ప్రాణాయామపరాయణాః ||"],mt:"మరికొందరు ప్రాణాయామపరాయణులై ప్రాణాపానముల గతిని నిరోధించి, అపానమునందు ప్రాణమును, ప్రాణమునందు అపానమును హోమము చేయుదురు.",m:"Others, devoted to breath control, restrain the paths of the incoming and outgoing breath, offering the incoming breath into the outgoing and the outgoing into the incoming.",w:"అపానే=in the outgoing breath; జుహ్వతి=offer; ప్రాణమ్=the incoming breath; ప్రాణే=in the incoming breath; అపానమ్=the outgoing breath; తథా=so; అపరే=others; ప్రాణాపానగతీ=the paths of prana and apana; రుద్ధ్వా=restraining; ప్రాణాయామపరాయణాః=devoted to breath control"};
D["4.30"]={t:["అపరే నియతాహారాః ప్రాణాన్ప్రాణేషు జుహ్వతి |","సర్వేఽప్యేతే యజ్ఞవిదో యజ్ఞక్షపితకల్మషాః ||"],mt:"మరికొందరు ఆహారనియమము కలవారై ప్రాణములను ప్రాణములయందే హోమము చేయుదురు; వీరందరును యజ్ఞవిదులు, యజ్ఞముచే పాపములను పోగొట్టుకొనినవారు.",m:"Others, with regulated diet, offer life-breaths into life-breaths. All of these are knowers of sacrifice, whose sins are destroyed by sacrifice.",w:"అపరే=others; నియతాహారాః=with regulated diet; ప్రాణాన్=life-breaths; ప్రాణేషు=in life-breaths; జుహ్వతి=offer; సర్వే అపి ఏతే=all of these; యజ్ఞవిదః=knowers of sacrifice; యజ్ఞక్షపితకల్మషాః=whose sins are destroyed by sacrifice"};
D["4.31"]={t:["యజ్ఞశిష్టామృతభుజో యాన్తి బ్రహ్మ సనాతనమ్ |","నాయం లోకోఽస్త్యయజ్ఞస్య కుతోఽన్యః కురుసత్తమ ||"],mt:"యజ్ఞశేషామృతమును భుజించువారు సనాతన బ్రహ్మమును పొందుదురు; ఓ కురుశ్రేష్ఠా! యజ్ఞము చేయనివానికి ఈ లోకమే లేదు, ఇక పరలోకమెక్కడ?",m:"Those who partake of the nectar left over from sacrifice go to the eternal Brahman. This world is not for one who does not perform sacrifice; how then the other, O best of the Kurus?",w:"యజ్ఞశిష్టామృతభుజః=who partake of the nectar left over from sacrifice; యాన్తి=go; బ్రహ్మ=to Brahman; సనాతనమ్=eternal; న అయమ్ లోకః అస్తి=this world is not; అయజ్ఞస్య=for one who does not perform sacrifice; కుతః అన్యః=how then the other; కురుసత్తమ=O best of the Kurus"};
D["4.32"]={t:["ఏవం బహువిధా యజ్ఞా వితతా బ్రహ్మణో ముఖే |","కర్మజాన్విద్ధి తాన్సర్వానేవం జ్ఞాత్వా విమోక్ష్యసే ||"],mt:"ఇట్లు అనేక విధములైన యజ్ఞములు వేదముఖమున వివరింపబడినవి; వాటన్నిటిని కర్మజములుగా తెలిసికొనుము; ఇట్లు తెలిసి నీవు విముక్తుడవగుదువు.",m:"Thus many kinds of sacrifice are spread out in the mouth of the Veda. Know them all to be born of action; knowing this, you will be liberated.",w:"ఏవమ్=thus; బహువిధాః=many kinds; యజ్ఞాః=sacrifices; వితతాః=spread out; బ్రహ్మణః ముఖే=in the mouth of the Veda; కర్మజాన్=born of action; విద్ధి=know; తాన్=them; సర్వాన్=all; జ్ఞాత్వా=knowing; విమోక్ష్యసే=you will be liberated"};
D["4.33"]={t:["శ్రేయాన్ద్రవ్యమయాద్యజ్ఞాజ్జ్ఞానయజ్ఞః పరన్తప |","సర్వం కర్మాఖిలం పార్థ జ్ఞానే పరిసమాప్యతే ||"],mt:"ఓ పరంతపా! ద్రవ్యమయ యజ్ఞముకంటె జ్ఞానయజ్ఞము శ్రేష్ఠము; ఓ పార్థా! సమస్త కర్మయు జ్ఞానమునందు పరిసమాప్తమగును.",m:"The sacrifice of knowledge is better than sacrifice with material things, O scorcher of foes; all action without exception culminates in knowledge, O Partha.",w:"శ్రేయాన్=better; ద్రవ్యమయాత్ యజ్ఞాత్=than sacrifice with material things; జ్ఞానయజ్ఞః=sacrifice of knowledge; పరన్తప=O scorcher of foes; సర్వమ్ కర్మ అఖిలమ్=all action without exception; పార్థ=O Partha; జ్ఞానే=in knowledge; పరిసమాప్యతే=culminates"};
D["4.34"]={t:["తద్విద్ధి ప్రణిపాతేన పరిప్రశ్నేన సేవయా |","ఉపదేక్ష్యన్తి తే జ్ఞానం జ్ఞానినస్తత్త్వదర్శినః ||"],mt:"ప్రణామము చేతను, ప్రశ్నించుటచేతను, సేవచేతను దానిని తెలిసికొనుము; తత్త్వదర్శులైన జ్ఞానులు నీకు జ్ఞానమును ఉపదేశింతురు.",m:"Learn that by humble reverence, by sincere inquiry, and by service. The wise who have seen the truth will instruct you in knowledge.",w:"తత్=that; విద్ధి=learn; ప్రణిపాతేన=by humble reverence; పరిప్రశ్నేన=by inquiry; సేవయా=by service; ఉపదేక్ష్యన్తి=will instruct; తే=you; జ్ఞానమ్=knowledge; జ్ఞానినః=the wise; తత్త్వదర్శినః=seers of the truth"};
D["4.35"]={t:["యజ్జ్ఞాత్వా న పునర్మోహమేవం యాస్యసి పాణ్డవ |","యేన భూతాన్యశేషేణ ద్రక్ష్యస్యాత్మన్యథో మయి ||"],mt:"ఓ పాండవా! దీనిని తెలిసికొనినచో నీవు మరల ఇట్లు మోహము పొందవు; దీనిచే సమస్త భూతములను నీయందును, నాయందును చూచెదవు.",m:"Knowing which, O Pandava, you will not fall into delusion like this again; by it you will see all beings entirely in yourself and then in me.",w:"యత్=which; జ్ఞాత్వా=knowing; న పునః మోహమ్=not again delusion; ఏవమ్=thus; యాస్యసి=you will fall into; పాణ్డవ=O Pandava; యేన=by which; భూతాని=beings; అశేషేణ=entirely; ద్రక్ష్యసి=you will see; ఆత్మని=in yourself; అథో=and; మయి=in me"};
D["4.36"]={t:["అపి చేదసి పాపేభ్యః సర్వేభ్యః పాపకృత్తమః |","సర్వం జ్ఞానప్లవేనైవ వృజినం సన్తరిష్యసి ||"],mt:"నీవు పాపులందరిలో మహాపాపివైనను, జ్ఞానమను నావచేతనే ఈ సర్వపాపసముద్రమును దాటెదవు.",m:"Even if you are the greatest sinner of all sinners, you will cross over all sin by the raft of knowledge alone.",w:"అపి చేత్=even if; అసి=you are; పాపేభ్యః సర్వేభ్యః=of all sinners; పాపకృత్తమః=the greatest sinner; సర్వమ్=all; జ్ఞానప్లవేన=by the raft of knowledge; ఏవ=alone; వృజినమ్=sin; సన్తరిష్యసి=you will cross over"};
D["4.37"]={t:["యథైధాంసి సమిద్ధోఽగ్నిర్భస్మసాత్కురుతేఽర్జున |","జ్ఞానాగ్నిః సర్వకర్మాణి భస్మసాత్కురుతే తథా ||"],mt:"ఓ అర్జునా! ప్రజ్వలించు అగ్ని కట్టెలను బూడిదచేయునట్లు, జ్ఞానాగ్ని సర్వకర్మలను బూడిదచేయును.",m:"As a blazing fire reduces fuel to ashes, O Arjuna, so the fire of knowledge reduces all actions to ashes.",w:"యథా=as; ఏధాంసి=fuel; సమిద్ధః=blazing; అగ్నిః=fire; భస్మసాత్=to ashes; కురుతే=turns; అర్జున=O Arjuna; జ్ఞానాగ్నిః=the fire of knowledge; సర్వకర్మాణి=all actions; తథా=so"};
D["4.38"]={t:["న హి జ్ఞానేన సదృశం పవిత్రమిహ విద్యతే |","తత్స్వయం యోగసంసిద్ధః కాలేనాత్మని విన్దతి ||"],mt:"ఈ లోకమున జ్ఞానమునకు సమానమైన పవిత్రమైనది లేదు; యోగసిద్ధుడైనవాడు కాలక్రమమున దానిని తనయందే పొందును.",m:"Indeed, there is nothing in this world as purifying as knowledge. One who is perfected in yoga finds it in oneself in due time.",w:"న హి=indeed not; జ్ఞానేన సదృశమ్=equal to knowledge; పవిత్రమ్=purifier; ఇహ=here; విద్యతే=exists; తత్=that; స్వయమ్=by oneself; యోగసంసిద్ధః=perfected in yoga; కాలేన=in time; ఆత్మని=in the self; విన్దతి=finds"};
D["4.39"]={t:["శ్రద్ధావాఁల్లభతే జ్ఞానం తత్పరః సంయతేన్ద్రియః |","జ్ఞానం లబ్ధ్వా పరాం శాన్తిమచిరేణాధిగచ్ఛతి ||"],mt:"శ్రద్ధ కలవాడు, దానియందే నిష్ఠ గలవాడు, ఇంద్రియములను జయించినవాడు జ్ఞానమును పొందును; జ్ఞానము పొంది వెంటనే పరమశాంతిని పొందును.",m:"One with faith, devoted to it and with controlled senses, obtains knowledge; having obtained knowledge, one soon attains supreme peace.",w:"శ్రద్ధావాన్=one with faith; లభతే=obtains; జ్ఞానమ్=knowledge; తత్పరః=devoted to it; సంయతేన్ద్రియః=with controlled senses; జ్ఞానమ్=knowledge; లబ్ధ్వా=having obtained; పరామ్ శాన్తిమ్=supreme peace; అచిరేణ=soon; అధిగచ్ఛతి=attains"};
D["4.40"]={t:["అజ్ఞశ్చాశ్రద్దధానశ్చ సంశయాత్మా వినశ్యతి |","నాయం లోకోఽస్తి న పరో న సుఖం సంశయాత్మనః ||"],mt:"అజ్ఞుడు, శ్రద్ధలేనివాడు, సంశయాత్ముడు నశించును; సంశయాత్మునికి ఈ లోకము లేదు, పరలోకము లేదు, సుఖము లేదు.",m:"The ignorant, the faithless and the doubting person perishes. For the doubter there is neither this world, nor the next, nor happiness.",w:"అజ్ఞః=ignorant; చ=and; అశ్రద్దధానః=faithless; సంశయాత్మా=doubting; వినశ్యతి=perishes; న అయమ్ లోకః అస్తి=this world is not; న పరః=nor the next; న సుఖమ్=nor happiness; సంశయాత్మనః=for the doubter"};
D["4.41"]={t:["యోగసన్న్యస్తకర్మాణం జ్ఞానసఞ్ఛిన్నసంశయమ్ |","ఆత్మవన్తం న కర్మాణి నిబధ్నన్తి ధనఞ్జయ ||"],mt:"ఓ ధనంజయా! యోగముచే కర్మలను సన్న్యసించినవానిని, జ్ఞానముచే సంశయములను ఛేదించినవానిని, ఆత్మవంతుని కర్మలు బంధింపవు.",m:"Actions do not bind one who has renounced actions through yoga, whose doubts are cut asunder by knowledge, and who is self-possessed, O Dhananjaya.",w:"యోగసన్న్యస్తకర్మాణమ్=who has renounced actions through yoga; జ్ఞానసఞ్ఛిన్నసంశయమ్=whose doubts are cut by knowledge; ఆత్మవన్తమ్=self-possessed; న=not; కర్మాణి=actions; నిబధ్నన్తి=bind; ధనఞ్జయ=O Dhananjaya"};
D["4.42"]={t:["తస్మాదజ్ఞానసమ్భూతం హృత్స్థం జ్ఞానాసినాత్మనః |","ఛిత్త్వైనం సంశయం యోగమాతిష్ఠోత్తిష్ఠ భారత ||"],mt:"కావున ఓ భారతా! అజ్ఞానమువలన పుట్టి హృదయమున నిలిచిన నీ సంశయమును జ్ఞానమను ఖడ్గముచే ఛేదించి, యోగమును ఆశ్రయించి లెమ్ము.",m:"Therefore, with the sword of knowledge, cut asunder this doubt in your heart, born of ignorance. Take recourse to yoga and arise, O Bharata.",w:"తస్మాత్=therefore; అజ్ఞానసమ్భూతమ్=born of ignorance; హృత్స్థమ్=residing in the heart; జ్ఞానాసినా=with the sword of knowledge; ఆత్మనః=your own; ఛిత్త్వా=cutting; ఏనమ్=this; సంశయమ్=doubt; యోగమ్=yoga; ఆతిష్ఠ=take recourse to; ఉత్తిష్ఠ=arise; భారత=O Bharata"};


// Chapter 5 – shlokas 5.1 to 5.14. Paste after your D object.
D["5.1"]={t:["అర్జున ఉవాచ |","సన్న్యాసం కర్మణాం కృష్ణ పునర్యోగం చ శంసతి |","యచ్ఛ్రేయ ఏతయోరేకం తన్మే బ్రూహి సునిశ్చితమ్ ||"],mt:"అర్జునుడు పలికెను: ఓ కృష్ణా! కర్మసన్న్యాసమును, మరల కర్మయోగమును నీవు ప్రశంసించుచున్నావు; ఈ రెంటిలో ఏది శ్రేయస్కరమో ఒక్కదానినే నిశ్చయముగా నాకు చెప్పుము.",m:"Arjuna said: O Krishna, you praise the renunciation of actions and then again the yoga of action. Tell me decisively which one of these two is better.",w:"అర్జునః ఉవాచ=Arjuna said; సన్న్యాసమ్=renunciation; కర్మణామ్=of actions; కృష్ణ=O Krishna; పునః=again; యోగమ్=yoga (of action); చ=and; శంసతి=you praise; యత్=which; శ్రేయః=better; ఏతయోః=of these two; ఏకమ్=one; తత్=that; మే=me; బ్రూహి=tell; సునిశ్చితమ్=decisively"};
D["5.2"]={t:["శ్రీభగవానువాచ |","సన్న్యాసః కర్మయోగశ్చ నిఃశ్రేయసకరావుభౌ |","తయోస్తు కర్మసన్న్యాసాత్కర్మయోగో విశిష్యతే ||"],mt:"శ్రీభగవానుడు పలికెను: సన్న్యాసము, కర్మయోగము రెండును మోక్షప్రదములే; కాని వాటిలో కర్మసన్న్యాసముకంటె కర్మయోగము శ్రేష్ఠము.",m:"The Blessed Lord said: Renunciation and the yoga of action both lead to the highest good; but of the two, the yoga of action is superior to renunciation of action.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; సన్న్యాసః=renunciation; కర్మయోగః=yoga of action; చ=and; నిఃశ్రేయసకరౌ=leading to the highest good; ఉభౌ=both; తయోః=of the two; తు=but; కర్మసన్న్యాసాత్=than renunciation of action; కర్మయోగః=yoga of action; విశిష్యతే=is superior"};
D["5.3"]={t:["జ్ఞేయః స నిత్యసన్న్యాసీ యో న ద్వేష్టి న కాఙ్క్షతి |","నిర్ద్వన్ద్వో హి మహాబాహో సుఖం బన్ధాత్ప్రముచ్యతే ||"],mt:"ద్వేషింపక, కోరక యుండువాడు నిత్యసన్న్యాసిగా తెలిసికొనదగినవాడు; ఓ మహాబాహో! ద్వంద్వరహితుడు సుఖముగా బంధమునుండి విముక్తుడగును.",m:"One who neither hates nor desires should be known as a perpetual renunciant; free from the pairs of opposites, O mighty-armed one, such a person is easily freed from bondage.",w:"జ్ఞేయః=to be known; సః=he; నిత్యసన్న్యాసీ=a perpetual renunciant; యః=who; న ద్వేష్టి=neither hates; న కాఙ్క్షతి=nor desires; నిర్ద్వన్ద్వః=free from dualities; హి=indeed; మహాబాహో=O mighty-armed; సుఖమ్=easily; బన్ధాత్=from bondage; ప్రముచ్యతే=is freed"};
D["5.4"]={t:["సాఙ్ఖ్యయోగౌ పృథగ్బాలాః ప్రవదన్తి న పణ్డితాః |","ఏకమప్యాస్థితః సమ్యగుభయోర్విన్దతే ఫలమ్ ||"],mt:"సాంఖ్యమును యోగమును వేరువేరని బాలురు చెప్పుదురు, పండితులు కాదు; ఒక్కదానియందు చక్కగా నిలిచినవాడు రెంటి ఫలమును పొందును.",m:"The immature, not the wise, speak of knowledge and action as separate. One who is properly established in even one obtains the fruit of both.",w:"సాఙ్ఖ్యయోగౌ=knowledge and action; పృథక్=separate; బాలాః=the immature; ప్రవదన్తి=say; న పణ్డితాః=not the wise; ఏకమ్ అపి=even one; ఆస్థితః=established in; సమ్యక్=properly; ఉభయోః=of both; విన్దతే=obtains; ఫలమ్=fruit"};
D["5.5"]={t:["యత్సాఙ్ఖ్యైః ప్రాప్యతే స్థానం తద్యోగైరపి గమ్యతే |","ఏకం సాఙ్ఖ్యం చ యోగం చ యః పశ్యతి స పశ్యతి ||"],mt:"సాంఖ్యులు పొందు స్థానమును యోగులును పొందుదురు; సాంఖ్యమును యోగమును ఒక్కటిగా చూచువాడే నిజముగా చూచువాడు.",m:"The state attained by the followers of knowledge is also reached by the followers of action. One who sees knowledge and action as one truly sees.",w:"యత్=which; సాఙ్ఖ్యైః=by the followers of knowledge; ప్రాప్యతే=is attained; స్థానమ్=state; తత్=that; యోగైః అపి=also by the followers of action; గమ్యతే=is reached; ఏకమ్=one; సాఙ్ఖ్యమ్=knowledge; చ=and; యోగమ్=action; యః పశ్యతి=who sees; సః పశ్యతి=he truly sees"};
D["5.6"]={t:["సన్న్యాసస్తు మహాబాహో దుఃఖమాప్తుమయోగతః |","యోగయుక్తో మునిర్బ్రహ్మ నచిరేణాధిగచ్ఛతి ||"],mt:"ఓ మహాబాహో! యోగము లేని సన్న్యాసము దుఃఖప్రాప్తికే; యోగయుక్తుడైన ముని త్వరలో బ్రహ్మమును పొందును.",m:"But renunciation without yoga, O mighty-armed one, is hard to attain and leads to sorrow; the sage engaged in yoga reaches Brahman before long.",w:"సన్న్యాసః=renunciation; తు=but; మహాబాహో=O mighty-armed; దుఃఖమ్=sorrow; ఆప్తుమ్=to attain; అయోగతః=without yoga; యోగయుక్తః=one engaged in yoga; మునిః=sage; బ్రహ్మ=Brahman; న చిరేణ=before long; అధిగచ్ఛతి=reaches"};
D["5.7"]={t:["యోగయుక్తో విశుద్ధాత్మా విజితాత్మా జితేన్ద్రియః |","సర్వభూతాత్మభూతాత్మా కుర్వన్నపి న లిప్యతే ||"],mt:"యోగయుక్తుడు, విశుద్ధాత్ముడు, మనస్సును ఇంద్రియములను జయించినవాడు, సర్వభూతములకు ఆత్మయే తన ఆత్మగా భావించువాడు కర్మ చేసినను అంటబడడు.",m:"One engaged in yoga, pure in mind, with mind and senses conquered, whose self is the self of all beings, is not tainted even while acting.",w:"యోగయుక్తః=engaged in yoga; విశుద్ధాత్మా=pure in mind; విజితాత్మా=with conquered mind; జితేన్ద్రియః=with conquered senses; సర్వభూతాత్మభూతాత్మా=one whose self is the self of all beings; కుర్వన్ అపి=even while acting; న లిప్యతే=is not tainted"};
D["5.8"]={t:["నైవ కిఞ్చిత్కరోమీతి యుక్తో మన్యేత తత్త్వవిత్ |","పశ్యఞ్శృణ్వన్స్పృశఞ్జిఘ్రన్నశ్నన్గచ్ఛన్స్వపఞ్శ్వసన్ ||"],mt:"తత్త్వవేత్తయైన యోగి చూచుచు, వినుచు, తాకుచు, వాసన చూచుచు, తినుచు, నడచుచు, నిద్రించుచు, శ్వాసించుచు ఉన్నను, “నేను ఏమియు చేయుట లేదు” అని తలచును... (5.9 లో కొనసాగును)",m:"The knower of the truth, engaged in yoga, thinks, “I do nothing at all,” even while seeing, hearing, touching, smelling, eating, going, sleeping and breathing... (continues in 5.9)",w:"న ఏవ=not at all; కిఞ్చిత్=anything; కరోమి=I do; ఇతి=thus; యుక్తః=the one engaged; మన్యేత=thinks; తత్త్వవిత్=knower of the truth; పశ్యన్=seeing; శృణ్వన్=hearing; స్పృశన్=touching; జిఘ్రన్=smelling; అశ్నన్=eating; గచ్ఛన్=going; స్వపన్=sleeping; శ్వసన్=breathing"};
D["5.9"]={t:["ప్రలపన్విసృజన్గృహ్ణన్నున్మిషన్నిమిషన్నపి |","ఇన్ద్రియాణీన్ద్రియార్థేషు వర్తన్త ఇతి ధారయన్ ||"],mt:"...మాట్లాడుచు, విడుచుచు, పట్టుకొనుచు, కనులు తెరచుచు మూయుచు ఉన్నను, ఇంద్రియములు ఇంద్రియ విషయములయందు ప్రవర్తించుచున్నవని భావించుచు (ఉండును).",m:"...even while speaking, letting go, grasping, opening and closing the eyes, holding the conviction that only the senses are moving among sense objects.",w:"ప్రలపన్=speaking; విసృజన్=letting go; గృహ్ణన్=grasping; ఉన్మిషన్=opening the eyes; నిమిషన్=closing the eyes; అపి=even; ఇన్ద్రియాణి=the senses; ఇన్ద్రియార్థేషు=among sense objects; వర్తన్తే=operate; ఇతి=thus; ధారయన్=reflecting"};
D["5.10"]={t:["బ్రహ్మణ్యాధాయ కర్మాణి సఙ్గం త్యక్త్వా కరోతి యః |","లిప్యతే న స పాపేన పద్మపత్రమివామ్భసా ||"],mt:"ఆసక్తిని విడిచి కర్మలను బ్రహ్మమునందు సమర్పించి చేయువాడు, తామరాకు నీటిచే వలె, పాపముచే అంటబడడు.",m:"One who acts, offering actions to Brahman and giving up attachment, is not tainted by sin, as a lotus leaf is not wetted by water.",w:"బ్రహ్మణి=in Brahman; ఆధాయ=offering; కర్మాణి=actions; సఙ్గమ్=attachment; త్యక్త్వా=giving up; కరోతి=acts; యః=who; లిప్యతే=is tainted; న సః=he is not; పాపేన=by sin; పద్మపత్రమ్=lotus leaf; ఇవ=like; అమ్భసా=by water"};
D["5.11"]={t:["కాయేన మనసా బుద్ధ్యా కేవలైరిన్ద్రియైరపి |","యోగినః కర్మ కుర్వన్తి సఙ్గం త్యక్త్వాత్మశుద్ధయే ||"],mt:"యోగులు ఆసక్తిని విడిచి ఆత్మశుద్ధి కొరకు శరీరముచే, మనస్సుచే, బుద్ధిచే, కేవలము ఇంద్రియములచే కర్మ చేయుదురు.",m:"Yogis perform action with the body, mind, intellect and even the senses alone, giving up attachment, for the purification of the self.",w:"కాయేన=with the body; మనసా=with the mind; బుద్ధ్యా=with the intellect; కేవలైః=merely; ఇన్ద్రియైః అపి=with the senses; యోగినః=yogis; కర్మ=action; కుర్వన్తి=perform; సఙ్గమ్=attachment; త్యక్త్వా=giving up; ఆత్మశుద్ధయే=for the purification of the self"};
D["5.12"]={t:["యుక్తః కర్మఫలం త్యక్త్వా శాన్తిమాప్నోతి నైష్ఠికీమ్ |","అయుక్తః కామకారేణ ఫలే సక్తో నిబధ్యతే ||"],mt:"యుక్తుడు కర్మఫలమును విడిచి నైష్ఠికమైన శాంతిని పొందును; అయుక్తుడు కామప్రేరితుడై ఫలమునందు ఆసక్తుడై బంధింపబడును.",m:"The steadfast, giving up the fruit of action, attains lasting peace; the unsteady, driven by desire and attached to the fruit, is bound.",w:"యుక్తః=the steadfast; కర్మఫలమ్=fruit of action; త్యక్త్వా=giving up; శాన్తిమ్=peace; ఆప్నోతి=attains; నైష్ఠికీమ్=lasting; అయుక్తః=the unsteady; కామకారేణ=driven by desire; ఫలే=in the fruit; సక్తః=attached; నిబధ్యతే=is bound"};
D["5.13"]={t:["సర్వకర్మాణి మనసా సన్న్యస్యాస్తే సుఖం వశీ |","నవద్వారే పురే దేహీ నైవ కుర్వన్న కారయన్ ||"],mt:"వశేంద్రియుడైన దేహి సర్వకర్మలను మనస్సుచే విడిచి, తానేమియు చేయకయు చేయింపకయు, తొమ్మిది ద్వారములు గల పురమున సుఖముగా ఉండును.",m:"The self-controlled embodied soul, mentally renouncing all actions, dwells happily in the city of nine gates, neither acting nor causing others to act.",w:"సర్వకర్మాణి=all actions; మనసా=mentally; సన్న్యస్య=renouncing; ఆస్తే=dwells; సుఖమ్=happily; వశీ=the self-controlled; నవద్వారే పురే=in the city of nine gates; దేహీ=the embodied soul; న ఏవ కుర్వన్=neither acting; న కారయన్=nor causing to act"};
D["5.14"]={t:["న కర్తృత్వం న కర్మాణి లోకస్య సృజతి ప్రభుః |","న కర్మఫలసంయోగం స్వభావస్తు ప్రవర్తతే ||"],mt:"ప్రభువు లోకమునకు కర్తృత్వమును, కర్మలను, కర్మఫలసంయోగమును సృజింపడు; స్వభావమే ప్రవర్తించుచున్నది.",m:"The Lord does not create agency or actions for the world, nor the union with the fruit of action; it is nature that acts.",w:"న కర్తృత్వమ్=not agency; న కర్మాణి=nor actions; లోకస్య=of the world; సృజతి=creates; ప్రభుః=the Lord; న కర్మఫలసంయోగమ్=nor the union with the fruit of action; స్వభావః=nature; తు=but; ప్రవర్తతే=acts"};


// Chapter 5 – shlokas 5.15 to 5.29 (completes chapter 5). Paste after your D object.
D["5.15"]={t:["నాదత్తే కస్యచిత్పాపం న చైవ సుకృతం విభుః |","అజ్ఞానేనావృతం జ్ఞానం తేన ముహ్యన్తి జన్తవః ||"],mt:"విభువు ఎవరి పాపమును గ్రహింపడు, పుణ్యమును గ్రహింపడు; జ్ఞానము అజ్ఞానముచే కప్పబడియున్నది, అందువలన జీవులు మోహపడుదురు.",m:"The all-pervading Lord accepts neither the sin nor the merit of anyone. Knowledge is covered by ignorance, and so beings are deluded.",w:"న ఆదత్తే=does not accept; కస్యచిత్=of anyone; పాపమ్=sin; న చ ఏవ=nor indeed; సుకృతమ్=merit; విభుః=the all-pervading; అజ్ఞానేన=by ignorance; ఆవృతమ్=covered; జ్ఞానమ్=knowledge; తేన=therefore; ముహ్యన్తి=are deluded; జన్తవః=beings"};
D["5.16"]={t:["జ్ఞానేన తు తదజ్ఞానం యేషాం నాశితమాత్మనః |","తేషామాదిత్యవజ్జ్ఞానం ప్రకాశయతి తత్పరమ్ ||"],mt:"ఎవరి అజ్ఞానము జ్ఞానముచే నశించినదో వారికి ఆ జ్ఞానము సూర్యునివలె పరతత్త్వమును ప్రకాశింపజేయును.",m:"But for those whose ignorance is destroyed by knowledge of the self, that knowledge, like the sun, reveals the Supreme.",w:"జ్ఞానేన=by knowledge; తు=but; తత్=that; అజ్ఞానమ్=ignorance; యేషామ్=whose; నాశితమ్=is destroyed; ఆత్మనః=of the self; తేషామ్=for them; ఆదిత్యవత్=like the sun; జ్ఞానమ్=knowledge; ప్రకాశయతి=illumines; తత్ పరమ్=that Supreme"};
D["5.17"]={t:["తద్బుద్ధయస్తదాత్మానస్తన్నిష్ఠాస్తత్పరాయణాః |","గచ్ఛన్త్యపునరావృత్తిం జ్ఞాననిర్ధూతకల్మషాః ||"],mt:"ఆ పరమాత్మయందే బుద్ధి, ఆత్మ, నిష్ఠ, పరాయణత్వము గలవారు జ్ఞానముచే పాపములు తొలగి తిరిగి రాని స్థితిని పొందుదురు.",m:"With intellect and self absorbed in That, established in That, and intent on That as the goal, they go to the state of no return, their sins shaken off by knowledge.",w:"తద్బుద్ధయః=with intellects fixed on that; తదాత్మానః=with selves absorbed in that; తన్నిష్ఠాః=established in that; తత్పరాయణాః=having that as the goal; గచ్ఛన్తి=go; అపునరావృత్తిమ్=to non-return; జ్ఞాననిర్ధూతకల్మషాః=whose sins are shaken off by knowledge"};
D["5.18"]={t:["విద్యావినయసమ్పన్నే బ్రాహ్మణే గవి హస్తిని |","శుని చైవ శ్వపాకే చ పణ్డితాః సమదర్శినః ||"],mt:"విద్యావినయసంపన్నుడైన బ్రాహ్మణునియందు, ఆవునందు, ఏనుగునందు, కుక్కయందు, చండాలునియందును పండితులు సమదృష్టి గలవారు.",m:"The wise see with equal vision a learned and humble brahmin, a cow, an elephant, a dog, and an outcaste.",w:"విద్యావినయసమ్పన్నే=endowed with learning and humility; బ్రాహ్మణే=in a brahmin; గవి=in a cow; హస్తిని=in an elephant; శుని=in a dog; చ ఏవ=and also; శ్వపాకే=in an outcaste; చ=and; పణ్డితాః=the wise; సమదర్శినః=see with equal vision"};
D["5.19"]={t:["ఇహైవ తైర్జితః సర్గో యేషాం సామ్యే స్థితం మనః |","నిర్దోషం హి సమం బ్రహ్మ తస్మాద్బ్రహ్మణి తే స్థితాః ||"],mt:"ఎవరి మనస్సు సమత్వమందు నిలిచియుండునో వారు ఇక్కడే సంసారమును జయించిరి; బ్రహ్మము నిర్దోషము, సమము; కావున వారు బ్రహ్మమునందే నిలిచియున్నారు.",m:"Those whose minds are established in equanimity have conquered the cycle of birth right here. Brahman is flawless and the same in all; therefore they are established in Brahman.",w:"ఇహ ఏవ=right here; తైః=by them; జితః=conquered; సర్గః=creation (the cycle of birth); యేషామ్=whose; సామ్యే=in equanimity; స్థితమ్=established; మనః=mind; నిర్దోషమ్=flawless; హి=indeed; సమమ్=equal; బ్రహ్మ=Brahman; తస్మాత్=therefore; బ్రహ్మణి=in Brahman; తే=they; స్థితాః=are established"};
D["5.20"]={t:["న ప్రహృష్యేత్ప్రియం ప్రాప్య నోద్విజేత్ప్రాప్య చాప్రియమ్ |","స్థిరబుద్ధిరసమ్మూఢో బ్రహ్మవిద్బ్రహ్మణి స్థితః ||"],mt:"ప్రియమును పొంది సంతోషింపక, అప్రియమును పొంది కలత చెందక, స్థిరబుద్ధియై మోహములేని బ్రహ్మవిదుడు బ్రహ్మమునందు నిలిచియుండును.",m:"One should not rejoice on obtaining what is pleasant nor be disturbed on obtaining what is unpleasant; steady in mind and undeluded, the knower of Brahman is established in Brahman.",w:"న ప్రహృష్యేత్=should not rejoice; ప్రియమ్=the pleasant; ప్రాప్య=obtaining; న ఉద్విజేత్=nor be disturbed; ప్రాప్య చ అప్రియమ్=on obtaining the unpleasant; స్థిరబుద్ధిః=steady in mind; అసమ్మూఢః=undeluded; బ్రహ్మవిత్=knower of Brahman; బ్రహ్మణి స్థితః=established in Brahman"};
D["5.21"]={t:["బాహ్యస్పర్శేష్వసక్తాత్మా విన్దత్యాత్మని యత్సుఖమ్ |","స బ్రహ్మయోగయుక్తాత్మా సుఖమక్షయమశ్నుతే ||"],mt:"బాహ్య స్పర్శలయందు ఆసక్తిలేనివాడు ఆత్మయందే సుఖమును పొందును; బ్రహ్మయోగయుక్తాత్ముడైన అతడు అక్షయసుఖమును అనుభవించును.",m:"One whose mind is unattached to external contacts finds happiness in the self; united with Brahman through yoga, that person enjoys imperishable happiness.",w:"బాహ్యస్పర్శేషు=in external contacts; అసక్తాత్మా=unattached; విన్దతి=finds; ఆత్మని=in the self; యత్ సుఖమ్=whatever happiness; సః=he; బ్రహ్మయోగయుక్తాత్మా=one united with Brahman by yoga; సుఖమ్=happiness; అక్షయమ్=imperishable; అశ్నుతే=enjoys"};
D["5.22"]={t:["యే హి సంస్పర్శజా భోగా దుఃఖయోనయ ఏవ తే |","ఆద్యన్తవన్తః కౌన్తేయ న తేషు రమతే బుధః ||"],mt:"ఇంద్రియ సంస్పర్శజములైన భోగములు దుఃఖమునకు కారణములే; ఓ కౌంతేయా! అవి ఆదిఅంతములు గలవి; వివేకి వాటియందు రమింపడు.",m:"The pleasures born of contact are indeed sources of pain, having a beginning and an end, O son of Kunti; the wise do not delight in them.",w:"యే హి=those which; సంస్పర్శజాః=born of contact; భోగాః=pleasures; దుఃఖయోనయః=sources of pain; ఏవ తే=indeed they; ఆద్యన్తవన్తః=having a beginning and an end; కౌన్తేయ=O son of Kunti; న తేషు రమతే=does not delight in them; బుధః=the wise"};
D["5.23"]={t:["శక్నోతీహైవ యః సోఢుం ప్రాక్శరీరవిమోక్షణాత్ |","కామక్రోధోద్భవం వేగం స యుక్తః స సుఖీ నరః ||"],mt:"శరీరవిమోచనమునకు ముందే ఇక్కడ కామక్రోధములనుండి పుట్టిన వేగమును సహింపగలవాడు యుక్తుడు, సుఖి.",m:"One who is able, even here before leaving the body, to withstand the impulse born of desire and anger is a yogi and a happy person.",w:"శక్నోతి=is able; ఇహ ఏవ=right here; యః=who; సోఢుమ్=to withstand; ప్రాక్=before; శరీరవిమోక్షణాత్=the release from the body; కామక్రోధోద్భవమ్=arising from desire and anger; వేగమ్=impulse; సః యుక్తః=he is a yogi; సః సుఖీ=he is happy; నరః=person"};
D["5.24"]={t:["యోఽన్తఃసుఖోఽన్తరారామస్తథాన్తర్జ్యోతిరేవ యః |","స యోగీ బ్రహ్మనిర్వాణం బ్రహ్మభూతోఽధిగచ్ఛతి ||"],mt:"అంతరమున సుఖము, అంతరమున ఆరామము, అంతరమున జ్యోతి గలవాడు యోగి; బ్రహ్మభూతుడై బ్రహ్మనిర్వాణమును పొందును.",m:"One who finds joy within, delight within, and light within is a yogi, who, having become one with Brahman, attains liberation in Brahman.",w:"యః అన్తఃసుఖః=who has joy within; అన్తరారామః=delight within; తథా=and; అన్తర్జ్యోతిః=light within; ఏవ యః=indeed who; సః యోగీ=that yogi; బ్రహ్మనిర్వాణమ్=liberation in Brahman; బ్రహ్మభూతః=having become one with Brahman; అధిగచ్ఛతి=attains"};
D["5.25"]={t:["లభన్తే బ్రహ్మనిర్వాణమృషయః క్షీణకల్మషాః |","ఛిన్నద్వైధా యతాత్మానః సర్వభూతహితే రతాః ||"],mt:"పాపములు క్షీణించినవారు, సంశయములు తొలగినవారు, ఆత్మనిగ్రహులు, సర్వభూతహితమందు రతులైన ఋషులు బ్రహ్మనిర్వాణమును పొందుదురు.",m:"Sages whose sins are destroyed, whose doubts are cut away, who are self-controlled and engaged in the welfare of all beings, attain liberation in Brahman.",w:"లభన్తే=attain; బ్రహ్మనిర్వాణమ్=liberation in Brahman; ఋషయః=sages; క్షీణకల్మషాః=whose sins are destroyed; ఛిన్నద్వైధాః=whose doubts are cut; యతాత్మానః=self-controlled; సర్వభూతహితే=in the welfare of all beings; రతాః=engaged"};
D["5.26"]={t:["కామక్రోధవియుక్తానాం యతీనాం యతచేతసామ్ |","అభితో బ్రహ్మనిర్వాణం వర్తతే విదితాత్మనామ్ ||"],mt:"కామక్రోధములు విడిచినవారు, ఆత్మనిగ్రహులు, ఆత్మతత్త్వమెరిగినవారైన యతులకు బ్రహ్మనిర్వాణము ఇరువైపులా సమీపముననే ఉండును.",m:"For ascetics free from desire and anger, with controlled minds and knowledge of the self, liberation in Brahman is present on all sides.",w:"కామక్రోధవియుక్తానామ్=of those free from desire and anger; యతీనామ్=of the ascetics; యతచేతసామ్=of the self-controlled; అభితః=on both sides; బ్రహ్మనిర్వాణమ్=liberation in Brahman; వర్తతే=exists; విదితాత్మనామ్=who know the self"};
D["5.27"]={t:["స్పర్శాన్కృత్వా బహిర్బాహ్యాంశ్చక్షుశ్చైవాన్తరే భ్రువోః |","ప్రాణాపానౌ సమౌ కృత్వా నాసాభ్యన్తరచారిణౌ ||"],mt:"బాహ్య విషయములను బయటికి నెట్టి, దృష్టిని భ్రూమధ్యమున నిలిపి, నాసికలలో సంచరించు ప్రాణాపానములను సమము చేసి... (5.28 లో కొనసాగును)",m:"Shutting out external contacts, fixing the gaze between the eyebrows, and evening out the incoming and outgoing breath moving within the nostrils... (continues in 5.28)",w:"స్పర్శాన్=contacts; కృత్వా=keeping; బహిః=outside; బాహ్యాన్=external; చక్షుః=the gaze; చ ఏవ=and; అన్తరే భ్రువోః=between the eyebrows; ప్రాణాపానౌ=inhaling and exhaling breath; సమౌ కృత్వా=making even; నాసాభ్యన్తరచారిణౌ=moving within the nostrils"};
D["5.28"]={t:["యతేన్ద్రియమనోబుద్ధిర్మునిర్మోక్షపరాయణః |","విగతేచ్ఛాభయక్రోధో యః సదా ముక్త ఏవ సః ||"],mt:"...ఇంద్రియమనోబుద్ధులను నిగ్రహించి, మోక్షమే లక్ష్యముగా కలిగి, ఇచ్ఛాభయక్రోధములు విడిచిన ముని ఎల్లప్పుడును ముక్తుడే.",m:"...the sage who has controlled the senses, mind and intellect, is intent on liberation, and is free from desire, fear and anger is always liberated.",w:"యతేన్ద్రియమనోబుద్ధిః=with controlled senses, mind and intellect; మునిః=sage; మోక్షపరాయణః=intent on liberation; విగతేచ్ఛాభయక్రోధః=free from desire, fear and anger; యః=who; సదా=always; ముక్తః ఏవ=indeed liberated; సః=he"};
D["5.29"]={t:["భోక్తారం యజ్ఞతపసాం సర్వలోకమహేశ్వరమ్ |","సుహృదం సర్వభూతానాం జ్ఞాత్వా మాం శాన్తిమృచ్ఛతి ||"],mt:"యజ్ఞతపస్సులకు భోక్తనుగా, సర్వలోకములకు మహేశ్వరునిగా, సర్వప్రాణులకు మిత్రునిగా నన్ను తెలిసికొని శాంతిని పొందును.",m:"Knowing me as the enjoyer of sacrifices and austerities, the great Lord of all worlds, and the friend of all beings, one attains peace.",w:"భోక్తారమ్=the enjoyer; యజ్ఞతపసామ్=of sacrifices and austerities; సర్వలోకమహేశ్వరమ్=the great Lord of all worlds; సుహృదమ్=friend; సర్వభూతానామ్=of all beings; జ్ఞాత్వా=knowing; మామ్=me; శాన్తిమ్=peace; ఋచ్ఛతి=attains"};


// Chapter 6 – shlokas 6.1 to 6.16. Paste after your D object.
D["6.1"]={t:["శ్రీభగవానువాచ |","అనాశ్రితః కర్మఫలం కార్యం కర్మ కరోతి యః |","స సన్న్యాసీ చ యోగీ చ న నిరగ్నిర్న చాక్రియః ||"],mt:"శ్రీభగవానుడు పలికెను: కర్మఫలమును ఆశ్రయింపక చేయవలసిన కర్మను చేయువాడు సన్న్యాసియు యోగియు; అగ్నిహోత్రాదులను మాత్రమే విడిచినవాడు, కర్మలను చేయనివాడు కాడు.",m:"The Blessed Lord said: One who performs a duty without depending on its fruit is both a renunciant and a yogi, not one who merely gives up the sacred fire or refrains from action.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; అనాశ్రితః=not depending on; కర్మఫలమ్=fruit of action; కార్యమ్=duty; కర్మ=action; కరోతి=performs; యః=who; సః=he; సన్న్యాసీ=a renunciant; చ=and; యోగీ=a yogi; న నిరగ్నిః=not one without the sacred fire; న చ అక్రియః=nor one without action"};
D["6.2"]={t:["యం సన్న్యాసమితి ప్రాహుర్యోగం తం విద్ధి పాణ్డవ |","న హ్యసన్న్యస్తసఙ్కల్పో యోగీ భవతి కశ్చన ||"],mt:"సన్న్యాసమని దేనిని చెప్పుదురో దానినే యోగముగా తెలిసికొనుము, ఓ పాండవా! సంకల్పములను విడువనివాడెవడును యోగి కాడు.",m:"What they call renunciation, know that to be yoga, O Pandava; for no one becomes a yogi without renouncing selfish intention.",w:"యమ్=which; సన్న్యాసమ్=renunciation; ఇతి=thus; ప్రాహుః=they call; యోగమ్=yoga; తమ్=that; విద్ధి=know; పాణ్డవ=O Pandava; న హి=not indeed; అసన్న్యస్తసఙ్కల్పః=one who has not renounced selfish intention; యోగీ=a yogi; భవతి=becomes; కశ్చన=anyone"};
D["6.3"]={t:["ఆరురుక్షోర్మునేర్యోగం కర్మ కారణముచ్యతే |","యోగారూఢస్య తస్యైవ శమః కారణముచ్యతే ||"],mt:"యోగమును ఎక్కగోరు మునికి కర్మ సాధనమనబడును; యోగారూఢుడైన అతనికే శమము సాధనమనబడును.",m:"For a sage who wishes to ascend to yoga, action is said to be the means; for the same one who has ascended to yoga, tranquillity is said to be the means.",w:"ఆరురుక్షోః=for one wishing to ascend; మునేః=for the sage; యోగమ్=to yoga; కర్మ=action; కారణమ్=means; ఉచ్యతే=is said; యోగారూఢస్య=for one who has ascended to yoga; తస్య ఏవ=of that very one; శమః=tranquillity; కారణమ్=means; ఉచ్యతే=is said"};
D["6.4"]={t:["యదా హి నేన్ద్రియార్థేషు న కర్మస్వనుషజ్జతే |","సర్వసఙ్కల్పసన్న్యాసీ యోగారూఢస్తదోచ్యతే ||"],mt:"ఇంద్రియ విషయములయందును కర్మలయందును ఆసక్తుడు కానప్పుడు, సర్వసంకల్పములను విడిచినవాడు యోగారూఢుడనబడును.",m:"When one is no longer attached to sense objects or to actions, having renounced all selfish intentions, that person is said to have ascended to yoga.",w:"యదా=when; హి=indeed; న ఇన్ద్రియార్థేషు=not in sense objects; న కర్మసు=nor in actions; అనుషజ్జతే=is attached; సర్వసఙ్కల్పసన్న్యాసీ=renouncer of all intentions; యోగారూఢః=one who has ascended to yoga; తదా=then; ఉచ్యతే=is said"};
D["6.5"]={t:["ఉద్ధరేదాత్మనాత్మానం నాత్మానమవసాదయేత్ |","ఆత్మైవ హ్యాత్మనో బన్ధురాత్మైవ రిపురాత్మనః ||"],mt:"ఆత్మచేత ఆత్మను ఉద్ధరించుకొనవలెను; ఆత్మను అధోగతిపాలు చేయరాదు; ఆత్మయే ఆత్మకు బంధువు, ఆత్మయే ఆత్మకు శత్రువు.",m:"One should lift oneself by oneself and not degrade oneself; for the self alone is the friend of the self, and the self alone is the enemy of the self.",w:"ఉద్ధరేత్=should lift up; ఆత్మనా=by the self (mind); ఆత్మానమ్=the self; న ఆత్మానమ్ అవసాదయేత్=should not degrade the self; ఆత్మా ఏవ హి=the self alone indeed; ఆత్మనః బన్ధుః=friend of the self; ఆత్మా ఏవ=the self alone; రిపుః=enemy; ఆత్మనః=of the self"};
D["6.6"]={t:["బన్ధురాత్మాత్మనస్తస్య యేనాత్మైవాత్మనా జితః |","అనాత్మనస్తు శత్రుత్వే వర్తేతాత్మైవ శత్రువత్ ||"],mt:"ఆత్మచేత ఆత్మను జయించినవానికి ఆత్మ బంధువు; జయింపనివానికి ఆత్మయే శత్రువువలె శత్రుత్వమున ప్రవర్తించును.",m:"For one who has conquered the self by the self, the self is a friend; but for one who has not, the self itself acts like an enemy.",w:"బన్ధుః ఆత్మా=the self is a friend; ఆత్మనః తస్య=of that person; యేన=by whom; ఆత్మా ఏవ=the self; ఆత్మనా=by the self; జితః=conquered; అనాత్మనః=of one who has not conquered the self; తు=but; శత్రుత్వే=in enmity; వర్తేత=acts; ఆత్మా ఏవ=the self itself; శత్రువత్=like an enemy"};
D["6.7"]={t:["జితాత్మనః ప్రశాన్తస్య పరమాత్మా సమాహితః |","శీతోష్ణసుఖదుఃఖేషు తథా మానాపమానయోః ||"],mt:"జితాత్ముడు, ప్రశాంతుడు అయినవానికి పరమాత్మ శీతోష్ణసుఖదుఃఖములయందును మానాపమానములయందును సమాహితమై (స్థిరముగా) యుండును.",m:"For one who has conquered the self and is tranquil, the Supreme Self remains steadily established, in cold and heat, pleasure and pain, honour and dishonour.",w:"జితాత్మనః=of the self-conquered; ప్రశాన్తస్య=of the tranquil; పరమాత్మా=the Supreme Self; సమాహితః=steadily established; శీతోష్ణసుఖదుఃఖేషు=in cold, heat, pleasure and pain; తథా=and; మానాపమానయోః=in honour and dishonour"};
D["6.8"]={t:["జ్ఞానవిజ్ఞానతృప్తాత్మా కూటస్థో విజితేన్ద్రియః |","యుక్త ఇత్యుచ్యతే యోగీ సమలోష్టాశ్మకాఞ్చనః ||"],mt:"జ్ఞానవిజ్ఞానములచే తృప్తుడై, కూటస్థుడై, ఇంద్రియములను జయించి, మట్టిపెళ్ళను రాతిని బంగారమును సమముగా చూచు యోగి యుక్తుడనబడును.",m:"The yogi content with knowledge and realisation, unchanging, with senses conquered, and to whom a clod, a stone and gold are alike, is said to be established in yoga.",w:"జ్ఞానవిజ్ఞానతృప్తాత్మా=content with knowledge and realisation; కూటస్థః=unchanging; విజితేన్ద్రియః=with conquered senses; యుక్తః=established in yoga; ఇతి ఉచ్యతే=is said; యోగీ=the yogi; సమలోష్టాశ్మకాఞ్చనః=to whom a clod, stone and gold are alike"};
D["6.9"]={t:["సుహృన్మిత్రార్యుదాసీనమధ్యస్థద్వేష్యబన్ధుషు |","సాధుష్వపి చ పాపేషు సమబుద్ధిర్విశిష్యతే ||"],mt:"సుహృత్తులయందును, మిత్రులయందును, శత్రువులయందును, ఉదాసీనులయందును, మధ్యస్థులయందును, ద్వేషింపదగినవారియందును, బంధువులయందును, సాధువులయందును, పాపులయందును సమబుద్ధి గలవాడు శ్రేష్ఠుడు.",m:"One who is of equal mind toward well-wishers, friends, enemies, the neutral, mediators, the hateful, relatives, the virtuous and the sinful excels.",w:"సుహృత్=well-wisher; మిత్ర=friend; అరి=enemy; ఉదాసీన=neutral; మధ్యస్థ=mediator; ద్వేష్య=hateful; బన్ధుషు=among relatives; సాధుషు అపి చ పాపేషు=among the virtuous and the sinful; సమబుద్ధిః=of equal mind; విశిష్యతే=excels"};
D["6.10"]={t:["యోగీ యుఞ్జీత సతతమాత్మానం రహసి స్థితః |","ఏకాకీ యతచిత్తాత్మా నిరాశీరపరిగ్రహః ||"],mt:"యోగి ఏకాంతమున ఒంటరిగా ఉండి, మనస్సును దేహమును నిగ్రహించి, ఆశలేక, పరిగ్రహములేక ఎల్లప్పుడును ఆత్మను ధ్యానమున యోజింపవలెను.",m:"The yogi should constantly practise concentration of the mind, staying in a secluded place, alone, with mind and body controlled, free from expectation and possessions.",w:"యోగీ=the yogi; యుఞ్జీత=should practise; సతతమ్=constantly; ఆత్మానమ్=the mind; రహసి స్థితః=staying in solitude; ఏకాకీ=alone; యతచిత్తాత్మా=with controlled mind and body; నిరాశీః=free from expectation; అపరిగ్రహః=without possessions"};
D["6.11"]={t:["శుచౌ దేశే ప్రతిష్ఠాప్య స్థిరమాసనమాత్మనః |","నాత్యుచ్ఛ్రితం నాతినీచం చైలాజినకుశోత్తరమ్ ||"],mt:"పవిత్రమైన స్థలమున, మరీ ఎత్తుగాను మరీ పల్లముగాను కాని, వస్త్రమును జింకచర్మమును దర్భలను పరచిన స్థిరమైన ఆసనమును తనకై ఏర్పరచుకొని... (6.12 లో కొనసాగును)",m:"Having established in a clean place a firm seat for oneself, neither too high nor too low, covered with cloth, deerskin and kusha grass... (continues in 6.12)",w:"శుచౌ దేశే=in a clean place; ప్రతిష్ఠాప్య=establishing; స్థిరమ్=firm; ఆసనమ్=seat; ఆత్మనః=for oneself; న అత్యుచ్ఛ్రితమ్=not too high; న అతినీచమ్=not too low; చైలాజినకుశోత్తరమ్=covered with cloth, deerskin and kusha grass"};
D["6.12"]={t:["తత్రైకాగ్రం మనః కృత్వా యతచిత్తేన్ద్రియక్రియః |","ఉపవిశ్యాసనే యుఞ్జ్యాద్యోగమాత్మవిశుద్ధయే ||"],mt:"...అక్కడ ఆసనమున కూర్చుండి, మనస్సును ఏకాగ్రముచేసి, చిత్తేంద్రియ క్రియలను నిగ్రహించి, ఆత్మవిశుద్ధికై యోగాభ్యాసము చేయవలెను.",m:"...there, sitting on the seat, making the mind one-pointed and controlling the activity of mind and senses, one should practise yoga for the purification of the self.",w:"తత్ర=there; ఏకాగ్రమ్=one-pointed; మనః=mind; కృత్వా=making; యతచిత్తేన్ద్రియక్రియః=with controlled mind and senses; ఉపవిశ్య=sitting; ఆసనే=on the seat; యుఞ్జ్యాత్=should practise; యోగమ్=yoga; ఆత్మవిశుద్ధయే=for self-purification"};
D["6.13"]={t:["సమం కాయశిరోగ్రీవం ధారయన్నచలం స్థిరః |","సమ్ప్రేక్ష్య నాసికాగ్రం స్వం దిశశ్చానవలోకయన్ ||"],mt:"శరీరము, శిరస్సు, కంఠము సమముగా, నిశ్చలముగా ఉంచి, స్థిరుడై, తన ముక్కుకొనను చూచుచు, ఇతర దిక్కులను చూడక... (6.14 లో కొనసాగును)",m:"Holding the body, head and neck erect and still, steady, gazing at the tip of one’s nose without looking around... (continues in 6.14)",w:"సమమ్=erect; కాయశిరోగ్రీవమ్=body, head and neck; ధారయన్=holding; అచలమ్=still; స్థిరః=steady; సమ్ప్రేక్ష్య=gazing; నాసికాగ్రమ్ స్వమ్=at the tip of one’s nose; దిశః చ=and directions; అనవలోకయన్=not looking around"};
D["6.14"]={t:["ప్రశాన్తాత్మా విగతభీర్బ్రహ్మచారివ్రతే స్థితః |","మనః సంయమ్య మచ్చిత్తో యుక్త ఆసీత మత్పరః ||"],mt:"...ప్రశాంతాత్ముడై, భయరహితుడై, బ్రహ్మచర్యవ్రతమున నిలిచి, మనస్సును నిగ్రహించి, నాయందే చిత్తము నిలిపి, నన్నే పరమగతిగా భావించి కూర్చుండవలెను.",m:"...serene, fearless and firm in the vow of celibacy, restraining the mind, with thoughts fixed on me, the yogi should sit with me as the supreme goal.",w:"ప్రశాన్తాత్మా=serene; విగతభీః=fearless; బ్రహ్మచారివ్రతే=in the vow of celibacy; స్థితః=established; మనః=mind; సంయమ్య=restraining; మచ్చిత్తః=with mind on me; యుక్తః=disciplined; ఆసీత=should sit; మత్పరః=holding me as the goal"};
D["6.15"]={t:["యుఞ్జన్నేవం సదాత్మానం యోగీ నియతమానసః |","శాన్తిం నిర్వాణపరమాం మత్సంస్థామధిగచ్ఛతి ||"],mt:"ఇట్లు ఎల్లప్పుడును ఆత్మను యోజించుచు, నియతమనస్కుడైన యోగి నిర్వాణపరమమైన, నాయందు నెలకొనిన శాంతిని పొందును.",m:"Thus constantly practising, the yogi of disciplined mind attains the peace that culminates in liberation and rests in me.",w:"యుఞ్జన్=practising; ఏవమ్=thus; సదా=always; ఆత్మానమ్=the mind; యోగీ=the yogi; నియతమానసః=of disciplined mind; శాన్తిమ్=peace; నిర్వాణపరమామ్=culminating in liberation; మత్సంస్థామ్=resting in me; అధిగచ్ఛతి=attains"};
D["6.16"]={t:["నాత్యశ్నతస్తు యోగోఽస్తి న చైకాన్తమనశ్నతః |","న చాతిస్వప్నశీలస్య జాగ్రతో నైవ చార్జున ||"],mt:"ఓ అర్జునా! అతిగా తినువానికి యోగము లేదు, ఏమాత్రమూ తినని వానికి లేదు; అతి నిద్రించువానికి లేదు, అతిగా మేల్కొనువానికి కూడా లేదు.",m:"O Arjuna, yoga is not for one who eats too much, nor for one who does not eat at all; nor for one who sleeps too much, nor for one who stays awake too much.",w:"న అత్యశ్నతః=not of one who eats too much; తు=but; యోగః=yoga; అస్తి=is; న చ ఏకాన్తమ్ అనశ్నతః=nor of one who does not eat at all; న చ అతిస్వప్నశీలస్య=nor of one given to too much sleep; జాగ్రతః=of one who stays awake; న ఏవ చ=nor indeed; అర్జున=O Arjuna"};

// Chapter 6 – shlokas 6.17 to 6.32. Paste after your D object.
D["6.17"]={t:["యుక్తాహారవిహారస్య యుక్తచేష్టస్య కర్మసు |","యుక్తస్వప్నావబోధస్య యోగో భవతి దుఃఖహా ||"],mt:"నియమిత ఆహారవిహారములు, కర్మలయందు నియమిత చేష్టలు, నియమిత నిద్రాజాగరములు గలవానికి యోగము దుఃఖనాశకమగును.",m:"For one who is moderate in eating and recreation, moderate in effort in actions, and moderate in sleep and waking, yoga becomes the destroyer of sorrow.",w:"యుక్తాహారవిహారస్య=of one moderate in eating and recreation; యుక్తచేష్టస్య కర్మసు=moderate in effort in actions; యుక్తస్వప్నావబోధస్య=moderate in sleep and waking; యోగః=yoga; భవతి=becomes; దుఃఖహా=destroyer of sorrow"};
D["6.18"]={t:["యదా వినియతం చిత్తమాత్మన్యేవావతిష్ఠతే |","నిఃస్పృహః సర్వకామేభ్యో యుక్త ఇత్యుచ్యతే తదా ||"],mt:"చిత్తము చక్కగా నియమింపబడి ఆత్మయందే నిలిచినప్పుడు, సర్వకామములయందు స్పృహలేనివాడు యుక్తుడనబడును.",m:"When the well-controlled mind rests in the self alone, and one is free from longing for all desires, then that person is said to be established in yoga.",w:"యదా=when; వినియతమ్=well controlled; చిత్తమ్=mind; ఆత్మని ఏవ=in the self alone; అవతిష్ఠతే=rests; నిఃస్పృహః=free from longing; సర్వకామేభ్యః=for all desires; యుక్తః=established in yoga; ఇతి ఉచ్యతే=is said; తదా=then"};
D["6.19"]={t:["యథా దీపో నివాతస్థో నేఙ్గతే సోపమా స్మృతా |","యోగినో యతచిత్తస్య యుఞ్జతో యోగమాత్మనః ||"],mt:"గాలిలేని చోట దీపము కదలనట్లు, ఆత్మయోగమును అభ్యసించు నియతచిత్తుడైన యోగికి ఇది ఉపమానముగా చెప్పబడినది.",m:"As a lamp in a windless place does not flicker, so is the simile remembered for the yogi of controlled mind practising yoga of the self.",w:"యథా=as; దీపః=lamp; నివాతస్థః=in a windless place; న ఇఙ్గతే=does not flicker; సా ఉపమా స్మృతా=that simile is remembered; యోగినః=of the yogi; యతచిత్తస్య=of controlled mind; యుఞ్జతః=practising; యోగమ్ ఆత్మనః=yoga of the self"};
D["6.20"]={t:["యత్రోపరమతే చిత్తం నిరుద్ధం యోగసేవయా |","యత్ర చైవాత్మనాత్మానం పశ్యన్నాత్మని తుష్యతి ||"],mt:"యోగాభ్యాసముచే నిరోధింపబడిన చిత్తము ఎచట ఉపరమించునో, ఎచట ఆత్మచే ఆత్మను చూచి ఆత్మయందే సంతుష్టుడగునో... (6.23 వరకు కొనసాగును)",m:"Where the mind, restrained by the practice of yoga, becomes quiet, and where, seeing the self by the self, one is content in the self... (continues to 6.23)",w:"యత్ర=where; ఉపరమతే=becomes quiet; చిత్తమ్=mind; నిరుద్ధమ్=restrained; యోగసేవయా=by the practice of yoga; యత్ర చ ఏవ=and where; ఆత్మనా=by the self; ఆత్మానమ్=the self; పశ్యన్=seeing; ఆత్మని తుష్యతి=is content in the self"};
D["6.21"]={t:["సుఖమాత్యన్తికం యత్తద్బుద్ధిగ్రాహ్యమతీన్ద్రియమ్ |","వేత్తి యత్ర న చైవాయం స్థితశ్చలతి తత్త్వతః ||"],mt:"...బుద్ధిచే మాత్రమే గ్రహింపదగిన, ఇంద్రియాతీతమైన ఆత్యంతిక సుఖమును ఎచట తెలిసికొనునో, ఎచట నిలిచి తత్త్వమునుండి చలింపడో...",m:"...where one knows that infinite happiness, grasped by the intellect and beyond the senses, and being established in which one never deviates from the truth...",w:"సుఖమ్=happiness; ఆత్యన్తికమ్=infinite; యత్ తత్=that which; బుద్ధిగ్రాహ్యమ్=grasped by the intellect; అతీన్ద్రియమ్=beyond the senses; వేత్తి=knows; యత్ర=where; న చ ఏవ=and never; అయమ్=this one; స్థితః=established; చలతి=moves; తత్త్వతః=from the truth"};
D["6.22"]={t:["యం లబ్ధ్వా చాపరం లాభం మన్యతే నాధికం తతః |","యస్మిన్స్థితో న దుఃఖేన గురుణాపి విచాల్యతే ||"],mt:"...దేనిని పొంది దానికంటె అధికమైన లాభము లేదని తలచునో, దేనియందు నిలిచి గొప్ప దుఃఖముచేతనైనను చలింపడో...",m:"...having gained which one considers no other gain greater, and being established in which one is not shaken even by heavy sorrow...",w:"యమ్=which; లబ్ధ్వా=having obtained; చ=and; అపరమ్ లాభమ్=another gain; మన్యతే=considers; న అధికమ్ తతః=not greater than that; యస్మిన్ స్థితః=established in which; న దుఃఖేన గురుణా అపి=not even by heavy sorrow; విచాల్యతే=is shaken"};
