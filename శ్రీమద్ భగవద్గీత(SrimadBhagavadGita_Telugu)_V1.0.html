D["18.19"]={t:["జ్ఞానం కర్మ చ కర్తా చ త్రిధైవ గుణభేదతః |","ప్రోచ్యతే గుణసఙ్ఖ్యానే యథావచ్ఛృణు తాన్యపి ||"],mt:"గుణసంఖ్యానశాస్త్రమున జ్ఞానము, కర్మ, కర్త గుణభేదముచే మూడు విధములే అని చెప్పబడినది; వాటిని కూడా యథార్థముగా వినుము.",m:"In the doctrine of the gunas, knowledge, action and the doer are said to be of just three kinds according to the differences of the gunas; hear about these also as they are.",w:"జ్ఞానమ్=knowledge; కర్మ చ=and action; కర్తా చ=and the doer; త్రిధా ఏవ=in three ways only; గుణభేదతః=according to the differences of the gunas; ప్రోచ్యతే=is said; గుణసఙ్ఖ్యానే=in the doctrine of the gunas; యథావత్ శృణు=hear as they are; తాని అపి=those also"};
D["18.20"]={t:["సర్వభూతేషు యేనైకం భావమవ్యయమీక్షతే |","అవిభక్తం విభక్తేషు తజ్జ్ఞానం విద్ధి సాత్త్వికమ్ ||"],mt:"సర్వభూతములయందు విభక్తములైన వాటిలో అవిభక్తమైన ఒకే అవ్యయభావమును దేనిచే చూచునో ఆ జ్ఞానమును సాత్త్వికమని తెలిసికొనుము.",m:"That knowledge by which one sees one imperishable reality in all beings, undivided among the divided, know that to be sattvic.",w:"సర్వభూతేషు=in all beings; యేన=by which; ఏకమ్ భావమ్ అవ్యయమ్=one imperishable reality; ఈక్షతే=one sees; అవిభక్తమ్=undivided; విభక్తేషు=among the divided; తత్ జ్ఞానమ్ విద్ధి సాత్త్వికమ్=know that knowledge to be sattvic"};

// Chapter 18 – shlokas 18.21 to 18.40. Paste after your D object.
D["18.21"]={t:["పృథక్త్వేన తు యజ్జ్ఞానం నానాభావాన్పృథగ్విధాన్ |","వేత్తి సర్వేషు భూతేషు తజ్జ్ఞానం విద్ధి రాజసమ్ ||"],mt:"సర్వభూతములయందు వేర్వేరు విధములైన భావములను భేదదృష్టితో ఎరుగు జ్ఞానమును రాజసమని తెలిసికొనుము.",m:"That knowledge which sees, by separateness, various distinct entities of different kinds in all beings, know that to be rajasic.",w:"పృథక్త్వేన=by separateness; తు యత్ జ్ఞానమ్=but that knowledge; నానాభావాన్=various entities; పృథగ్విధాన్=of different kinds; వేత్తి=knows; సర్వేషు భూతేషు=in all beings; తత్ జ్ఞానమ్ విద్ధి రాజసమ్=know that knowledge to be rajasic"};
D["18.22"]={t:["యత్తు కృత్స్నవదేకస్మిన్కార్యే సక్తమహైతుకమ్ |","అతత్త్వార్థవదల్పం చ తత్తామసముదాహృతమ్ ||"],mt:"ఒక్క కార్యమునందే అదే సర్వమన్నట్లు ఆసక్తమైనది, హేతువులేనిది, తత్త్వార్థము లేనిది, అల్పమైనది అయిన జ్ఞానము తామసమని చెప్పబడినది.",m:"But that knowledge which clings to a single effect as if it were the whole, without reason, without grasp of the truth and trivial, is declared to be tamasic.",w:"యత్ తు=but that which; కృత్స్నవత్=as if it were the whole; ఏకస్మిన్ కార్యే=in a single effect; సక్తమ్=clinging; అహైతుకమ్=without reason; అతత్త్వార్థవత్=without grasp of the truth; అల్పమ్ చ=and trivial; తత్ తామసమ్ ఉదాహృతమ్=that is declared tamasic"};
D["18.23"]={t:["నియతం సఙ్గరహితమరాగద్వేషతః కృతమ్ |","అఫలప్రేప్సునా కర్మ యత్తత్సాత్త్వికముచ్యతే ||"],mt:"ఫలాపేక్షలేనివాడు ఆసక్తిరహితముగా, రాగద్వేషములు లేకుండా చేసిన నియతకర్మ సాత్త్వికమనబడును.",m:"An obligatory action performed without attachment, without attraction or aversion, by one who does not seek its fruit, is called sattvic.",w:"నియతమ్=obligatory; సఙ్గరహితమ్=without attachment; అరాగద్వేషతః కృతమ్=done without attraction or aversion; అఫలప్రేప్సునా=by one not seeking fruit; కర్మ యత్ తత్=that action; సాత్త్వికమ్ ఉచ్యతే=is called sattvic"};
D["18.24"]={t:["యత్తు కామేప్సునా కర్మ సాహఙ్కారేణ వా పునః |","క్రియతే బహులాయాసం తద్రాజసముదాహృతమ్ ||"],mt:"కామమును కోరువానిచేగాని అహంకారముతోగాని మిక్కిలి శ్రమతో చేయబడు కర్మ రాజసమని చెప్పబడినది.",m:"But the action performed by one who seeks to fulfil desires, or with egoism, and with great effort, is declared to be rajasic.",w:"యత్ తు కర్మ=but the action which; కామేప్సునా=by one seeking desires; సాహఙ్కారేణ వా పునః=or with egoism; క్రియతే=is performed; బహులాయాసమ్=with much effort; తత్ రాజసమ్ ఉదాహృతమ్=that is declared rajasic"};
D["18.25"]={t:["అనుబన్ధం క్షయం హింసామనపేక్ష్య చ పౌరుషమ్ |","మోహాదారభ్యతే కర్మ యత్తత్తామసముచ్యతే ||"],mt:"పరిణామమును, నష్టమును, హింసను, తన సామర్థ్యమును లెక్కింపక మోహముచే ఆరంభింపబడు కర్మ తామసమనబడును.",m:"The action undertaken through delusion, without regard for consequences, loss, injury or one’s own capacity, is called tamasic.",w:"అనుబన్ధమ్=consequences; క్షయమ్=loss; హింసామ్=injury; అనపేక్ష్య చ పౌరుషమ్=and without regard for one’s capacity; మోహాత్=through delusion; ఆరభ్యతే=is undertaken; కర్మ యత్ తత్=that action; తామసమ్ ఉచ్యతే=is called tamasic"};
D["18.26"]={t:["ముక్తసఙ్గోఽనహంవాదీ ధృత్యుత్సాహసమన్వితః |","సిద్ధ్యసిద్ధ్యోర్నిర్వికారః కర్తా సాత్త్విక ఉచ్యతే ||"],mt:"ఆసక్తి విడిచినవాడు, అహంకారపు మాటలు లేనివాడు, ధృతి ఉత్సాహములు కలవాడు, సిద్ధి అసిద్ధులయందు వికారము లేనివాడు అయిన కర్త సాత్త్వికుడనబడును.",m:"A doer who is free from attachment, not egotistic in speech, endowed with resolve and enthusiasm, and unaffected by success or failure is called sattvic.",w:"ముక్తసఙ్గః=free from attachment; అనహంవాదీ=not egotistic in speech; ధృత్యుత్సాహసమన్వితః=endowed with resolve and enthusiasm; సిద్ధ్యసిద్ధ్యోః=in success and failure; నిర్వికారః=unaffected; కర్తా=the doer; సాత్త్వికః ఉచ్యతే=is called sattvic"};
D["18.27"]={t:["రాగీ కర్మఫలప్రేప్సుర్లుబ్ధో హింసాత్మకోఽశుచిః |","హర్షశోకాన్వితః కర్తా రాజసః పరికీర్తితః ||"],mt:"రాగము గలవాడు, కర్మఫలమును కోరువాడు, లోభి, హింసాత్ముడు, అశుచి, హర్షశోకములతో కూడిన కర్త రాజసుడని చెప్పబడినాడు.",m:"A doer who is passionate, seeks the fruits of action, is greedy, violent, impure, and swayed by joy and sorrow is declared to be rajasic.",w:"రాగీ=passionate; కర్మఫలప్రేప్సుః=seeking the fruits of action; లుబ్ధః=greedy; హింసాత్మకః=violent; అశుచిః=impure; హర్షశోకాన్వితః=swayed by joy and sorrow; కర్తా=the doer; రాజసః పరికీర్తితః=is declared rajasic"};
D["18.28"]={t:["అయుక్తః ప్రాకృతః స్తబ్ధః శఠో నైష్కృతికోఽలసః |","విషాదీ దీర్ఘసూత్రీ చ కర్తా తామస ఉచ్యతే ||"],mt:"అయుక్తుడు, అసంస్కృతుడు, మొండివాడు, శఠుడు, ఇతరులను అవమానించువాడు, సోమరి, విషాదశీలుడు, కాలయాపన చేయువాడైన కర్త తామసుడనబడును.",m:"A doer who is undisciplined, vulgar, obstinate, deceitful, malicious, lazy, despondent and procrastinating is called tamasic.",w:"అయుక్తః=undisciplined; ప్రాకృతః=vulgar; స్తబ్ధః=obstinate; శఠః=deceitful; నైష్కృతికః=malicious; అలసః=lazy; విషాదీ=despondent; దీర్ఘసూత్రీ చ=and procrastinating; కర్తా=the doer; తామసః ఉచ్యతే=is called tamasic"};
D["18.29"]={t:["బుద్ధేర్భేదం ధృతేశ్చైవ గుణతస్త్రివిధం శృణు |","ప్రోచ్యమానమశేషేణ పృథక్త్వేన ధనఞ్జయ ||"],mt:"ఓ ధనంజయా! బుద్ధి ధృతుల భేదమును గుణములనుబట్టి మూడు విధములుగా, పూర్తిగా వేర్వేరుగా చెప్పుచున్నాను, వినుము.",m:"Hear, O Dhananjaya, the threefold division of intellect and resolve according to the gunas, as I describe it fully and separately.",w:"బుద్ధేః భేదమ్=the division of intellect; ధృతేః చ ఏవ=and of resolve; గుణతః=according to the gunas; త్రివిధమ్=threefold; శృణు=hear; ప్రోచ్యమానమ్=as it is being described; అశేషేణ=fully; పృథక్త్వేన=separately; ధనఞ్జయ=O Dhananjaya"};
D["18.30"]={t:["ప్రవృత్తిం చ నివృత్తిం చ కార్యాకార్యే భయాభయే |","బన్ధం మోక్షం చ యా వేత్తి బుద్ధిః సా పార్థ సాత్త్వికీ ||"],mt:"ఓ పార్థా! ప్రవృత్తిని, నివృత్తిని, కార్యాకార్యములను, భయాభయములను, బంధమోక్షములను ఎరుగు బుద్ధి సాత్త్వికము.",m:"The intellect that knows engagement and withdrawal, what ought and ought not to be done, fear and fearlessness, bondage and liberation, is sattvic, O Partha.",w:"ప్రవృత్తిమ్ చ నివృత్తిమ్ చ=engagement and withdrawal; కార్యాకార్యే=what ought and ought not to be done; భయాభయే=fear and fearlessness; బన్ధమ్ మోక్షమ్ చ=bondage and liberation; యా వేత్తి=which knows; బుద్ధిః సా=that intellect; పార్థ=O Partha; సాత్త్వికీ=sattvic"};
D["18.31"]={t:["యయా ధర్మమధర్మం చ కార్యం చాకార్యమేవ చ |","అయథావత్ప్రజానాతి బుద్ధిః సా పార్థ రాజసీ ||"],mt:"ఓ పార్థా! ధర్మాధర్మములను, కార్యాకార్యములను యథార్థముగా తెలియని బుద్ధి రాజసము.",m:"The intellect by which one does not rightly distinguish dharma from adharma, and what ought from what ought not to be done, is rajasic, O Partha.",w:"యయా=by which; ధర్మమ్ అధర్మమ్ చ=dharma and adharma; కార్యమ్ చ అకార్యమ్ ఏవ చ=and what ought and ought not to be done; అయథావత్ ప్రజానాతి=one knows wrongly; బుద్ధిః సా=that intellect; పార్థ=O Partha; రాజసీ=rajasic"};
D["18.32"]={t:["అధర్మం ధర్మమితి యా మన్యతే తమసావృతా |","సర్వార్థాన్విపరీతాంశ్చ బుద్ధిః సా పార్థ తామసీ ||"],mt:"ఓ పార్థా! అజ్ఞానముచే కప్పబడి అధర్మమును ధర్మమని, సర్వవిషయములను విపరీతముగా తలచు బుద్ధి తామసము.",m:"The intellect, shrouded in darkness, that takes adharma for dharma and sees all things in a perverted way is tamasic, O Partha.",w:"అధర్మమ్=adharma; ధర్మమ్ ఇతి యా మన్యతే=which takes for dharma; తమసా ఆవృతా=shrouded in darkness; సర్వార్థాన్=all things; విపరీతాన్ చ=and perverted; బుద్ధిః సా పార్థ తామసీ=that intellect, O Partha, is tamasic"};
D["18.33"]={t:["ధృత్యా యయా ధారయతే మనఃప్రాణేన్ద్రియక్రియాః |","యోగేనావ్యభిచారిణ్యా ధృతిః సా పార్థ సాత్త్వికీ ||"],mt:"అవ్యభిచారిణియైన యోగముచే మనస్సు ప్రాణము ఇంద్రియముల క్రియలను ధరించు ధృతి సాత్త్వికము.",m:"The resolve by which one sustains the activities of mind, life-breath and senses through unwavering yoga is sattvic, O Partha.",w:"ధృత్యా యయా=by which resolve; ధారయతే=one sustains; మనఃప్రాణేన్ద్రియక్రియాః=the activities of mind, breath and senses; యోగేన అవ్యభిచారిణ్యా=through unwavering yoga; ధృతిః సా పార్థ సాత్త్వికీ=that resolve, O Partha, is sattvic"};
D["18.34"]={t:["యయా తు ధర్మకామార్థాన్ధృత్యా ధారయతేఽర్జున |","ప్రసఙ్గేన ఫలాకాఙ్క్షీ ధృతిః సా పార్థ రాజసీ ||"],mt:"ఓ అర్జునా! ఆసక్తితో ఫలాపేక్షయై ధర్మకామార్థములను ధరించు ధృతి రాజసము.",m:"But the resolve by which one holds to dharma, pleasure and wealth out of attachment, desiring their fruits, is rajasic, O Arjuna.",w:"యయా తు ధృత్యా=but by which resolve; ధర్మకామార్థాన్=dharma, pleasure and wealth; ధారయతే=one holds; అర్జున=O Arjuna; ప్రసఙ్గేన=out of attachment; ఫలాకాఙ్క్షీ=desiring fruits; ధృతిః సా పార్థ రాజసీ=that resolve is rajasic"};
D["18.35"]={t:["యయా స్వప్నం భయం శోకం విషాదం మదమేవ చ |","న విముఞ్చతి దుర్మేధా ధృతిః సా పార్థ తామసీ ||"],mt:"ఓ పార్థా! దుర్బుద్ధి నిద్రను, భయమును, శోకమును, విషాదమును, మదమును దేనిచే విడువదో ఆ ధృతి తామసము.",m:"The resolve by which a dull-witted person does not give up sleep, fear, grief, despondency and arrogance is tamasic, O Partha.",w:"యయా=by which; స్వప్నమ్=sleep; భయమ్=fear; శోకమ్=grief; విషాదమ్=despondency; మదమ్ ఏవ చ=and arrogance; న విముఞ్చతి=does not give up; దుర్మేధాః=a dull-witted person; ధృతిః సా పార్థ తామసీ=that resolve is tamasic"};
D["18.36"]={t:["సుఖం త్విదానీం త్రివిధం శృణు మే భరతర్షభ |","అభ్యాసాద్రమతే యత్ర దుఃఖాన్తం చ నిగచ్ఛతి ||"],mt:"ఓ భరతశ్రేష్ఠా! ఇప్పుడు మూడు విధములైన సుఖమును వినుము; దేనియందు అభ్యాసముచే రమించునో, దుఃఖాంతమును పొందునో... (18.37 లో కొనసాగును)",m:"Now hear from me, O best of the Bharatas, of the threefold happiness, in which one delights through practice and reaches the end of sorrow... (continues in 18.37)",w:"సుఖమ్ తు=happiness indeed; ఇదానీమ్=now; త్రివిధమ్=threefold; శృణు మే=hear from me; భరతర్షభ=O best of the Bharatas; అభ్యాసాత్=through practice; రమతే యత్ర=in which one delights; దుఃఖాన్తమ్ చ నిగచ్ఛతి=and reaches the end of sorrow"};
D["18.37"]={t:["యత్తదగ్రే విషమివ పరిణామేఽమృతోపమమ్ |","తత్సుఖం సాత్త్వికం ప్రోక్తమాత్మబుద్ధిప్రసాదజమ్ ||"],mt:"...మొదట విషమువలెను, పరిణామమున అమృతమువలెను ఉండి, ఆత్మబుద్ధి ప్రసన్నతనుండి పుట్టు ఆ సుఖము సాత్త్వికమని చెప్పబడినది.",m:"...that which is like poison at first but like nectar in the end, born of the serenity of the mind turned to the self: that happiness is declared sattvic.",w:"యత్ తత్=that which; అగ్రే=at first; విషమ్ ఇవ=like poison; పరిణామే=in the end; అమృతోపమమ్=like nectar; తత్ సుఖమ్ సాత్త్వికమ్ ప్రోక్తమ్=that happiness is declared sattvic; ఆత్మబుద్ధిప్రసాదజమ్=born of the serenity of the mind turned to the self"};
D["18.38"]={t:["విషయేన్ద్రియసంయోగాద్యత్తదగ్రేఽమృతోపమమ్ |","పరిణామే విషమివ తత్సుఖం రాజసం స్మృతమ్ ||"],mt:"విషయేంద్రియసంయోగమువలన మొదట అమృతమువలెను, పరిణామమున విషమువలెను ఉండు ఆ సుఖము రాజసమని చెప్పబడినది.",m:"That happiness which arises from the contact of the senses with their objects, which is like nectar at first but like poison in the end, is considered rajasic.",w:"విషయేన్ద్రియసంయోగాత్=from the contact of senses with objects; యత్ తత్=that which; అగ్రే అమృతోపమమ్=like nectar at first; పరిణామే విషమ్ ఇవ=like poison in the end; తత్ సుఖమ్ రాజసమ్ స్మృతమ్=that happiness is considered rajasic"};
D["18.39"]={t:["యదగ్రే చానుబన్ధే చ సుఖం మోహనమాత్మనః |","నిద్రాలస్యప్రమాదోత్థం తత్తామసముదాహృతమ్ ||"],mt:"మొదటను చివరను ఆత్మను మోహపరచు, నిద్రాలస్యప్రమాదములనుండి పుట్టు సుఖము తామసమని చెప్పబడినది.",m:"That happiness which deludes the self both at the beginning and at the end, arising from sleep, laziness and negligence, is declared tamasic.",w:"యత్ అగ్రే చ అనుబన్ధే చ=which at the beginning and at the end; సుఖమ్=happiness; మోహనమ్ ఆత్మనః=deluding the self; నిద్రాలస్యప్రమాదోత్థమ్=arising from sleep, laziness and negligence; తత్ తామసమ్ ఉదాహృతమ్=that is declared tamasic"};
D["18.40"]={t:["న తదస్తి పృథివ్యాం వా దివి దేవేషు వా పునః |","సత్త్వం ప్రకృతిజైర్ముక్తం యదేభిః స్యాత్త్రిభిర్గుణైః ||"],mt:"ప్రకృతిజములైన ఈ మూడు గుణములనుండి విముక్తమైన సత్త్వము (ప్రాణి) భూమిపైనగాని, స్వర్గమున దేవతలలోగాని ఎక్కడను లేదు.",m:"There is no being on earth, or again among the gods in heaven, that is free from these three gunas born of nature.",w:"న తత్ అస్తి=there is nothing; పృథివ్యామ్ వా=on earth; దివి దేవేషు వా పునః=or again in heaven among the gods; సత్త్వమ్=being; ప్రకృతిజైః ముక్తమ్=free from those born of nature; యత్ ఏభిః స్యాత్=that would be free from these; త్రిభిః గుణైః=three gunas"};

// Chapter 18 – shlokas 18.41 to 18.60. Paste after your D object.
D["18.41"]={t:["బ్రాహ్మణక్షత్రియవిశాం శూద్రాణాం చ పరన్తప |","కర్మాణి ప్రవిభక్తాని స్వభావప్రభవైర్గుణైః ||"],mt:"ఓ పరంతపా! బ్రాహ్మణ క్షత్రియ వైశ్య శూద్రుల కర్మలు స్వభావమునుండి పుట్టిన గుణములను బట్టి విభజింపబడినవి.",m:"The duties of brahmins, kshatriyas, vaishyas and shudras, O scorcher of foes, are distributed according to the gunas born of their own nature.",w:"బ్రాహ్మణక్షత్రియవిశామ్=of brahmins, kshatriyas and vaishyas; శూద్రాణామ్ చ=and of shudras; పరన్తప=O scorcher of foes; కర్మాణి=duties; ప్రవిభక్తాని=are distributed; స్వభావప్రభవైః గుణైః=according to the gunas born of one’s own nature"};
D["18.42"]={t:["శమో దమస్తపః శౌచం క్షాన్తిరార్జవమేవ చ |","జ్ఞానం విజ్ఞానమాస్తిక్యం బ్రహ్మకర్మ స్వభావజమ్ ||"],mt:"శమము, దమము, తపస్సు, శౌచము, క్షమ, ఆర్జవము, జ్ఞానము, విజ్ఞానము, ఆస్తిక్యము — ఇవి స్వభావజమైన బ్రాహ్మణకర్మ.",m:"Tranquillity, self-control, austerity, purity, forgiveness, uprightness, knowledge, realisation and faith in the divine are the natural duties of a brahmin.",w:"శమః=tranquillity; దమః=self-control; తపః=austerity; శౌచమ్=purity; క్షాన్తిః=forgiveness; ఆర్జవమ్ ఏవ చ=and uprightness; జ్ఞానమ్=knowledge; విజ్ఞానమ్=realisation; ఆస్తిక్యమ్=faith; బ్రహ్మకర్మ=the duty of a brahmin; స్వభావజమ్=born of nature"};
D["18.43"]={t:["శౌర్యం తేజో ధృతిర్దాక్ష్యం యుద్ధే చాప్యపలాయనమ్ |","దానమీశ్వరభావశ్చ క్షాత్రం కర్మ స్వభావజమ్ ||"],mt:"శౌర్యము, తేజస్సు, ధృతి, దక్షత, యుద్ధమున పారిపోకుండుట, దానము, నాయకత్వభావము — ఇవి స్వభావజమైన క్షత్రియకర్మ.",m:"Heroism, vigour, fortitude, skill, not fleeing from battle, charity and the quality of leadership are the natural duties of a kshatriya.",w:"శౌర్యమ్=heroism; తేజః=vigour; ధృతిః=fortitude; దాక్ష్యమ్=skill; యుద్ధే చ అపి అపలాయనమ్=and not fleeing even in battle; దానమ్=charity; ఈశ్వరభావః చ=and the quality of leadership; క్షాత్రమ్ కర్మ=the duty of a kshatriya; స్వభావజమ్=born of nature"};
D["18.44"]={t:["కృషిగోరక్ష్యవాణిజ్యం వైశ్యకర్మ స్వభావజమ్ |","పరిచర్యాత్మకం కర్మ శూద్రస్యాపి స్వభావజమ్ ||"],mt:"వ్యవసాయము, గోరక్షణ, వాణిజ్యము స్వభావజమైన వైశ్యకర్మ; సేవారూపమైన కర్మ శూద్రునికి స్వభావజము.",m:"Farming, cow-protection and trade are the natural duties of a vaishya; work of the nature of service is the natural duty of a shudra.",w:"కృషిగోరక్ష్యవాణిజ్యమ్=farming, cow-protection and trade; వైశ్యకర్మ=the duty of a vaishya; స్వభావజమ్=born of nature; పరిచర్యాత్మకమ్ కర్మ=work of the nature of service; శూద్రస్య అపి=of a shudra too; స్వభావజమ్=born of nature"};
D["18.45"]={t:["స్వే స్వే కర్మణ్యభిరతః సంసిద్ధిం లభతే నరః |","స్వకర్మనిరతః సిద్ధిం యథా విన్దతి తచ్ఛృణు ||"],mt:"తన తన కర్మయందు అభిరతుడైన మనుష్యుడు సంసిద్ధిని పొందును; స్వకర్మయందు నిరతుడై సిద్ధిని ఎట్లు పొందునో వినుము.",m:"Devoted to his own duty, a person attains perfection. Hear how one engaged in one’s own duty finds perfection.",w:"స్వే స్వే కర్మణి=in one’s own duty; అభిరతః=devoted; సంసిద్ధిమ్ లభతే=attains perfection; నరః=a person; స్వకర్మనిరతః=engaged in one’s own duty; సిద్ధిమ్ యథా విన్దతి=how one finds perfection; తత్ శృణు=hear that"};
D["18.46"]={t:["యతః ప్రవృత్తిర్భూతానాం యేన సర్వమిదం తతమ్ |","స్వకర్మణా తమభ్యర్చ్య సిద్ధిం విన్దతి మానవః ||"],mt:"ఎవనినుండి భూతముల ప్రవృత్తి కలిగెనో, ఎవనిచే ఈ సర్వము వ్యాపింపబడినదో ఆయనను స్వకర్మచే అర్చించి మనుష్యుడు సిద్ధిని పొందును.",m:"By worshipping with one’s own duty that from which all beings arise and by which all this is pervaded, a person attains perfection.",w:"యతః=from whom; ప్రవృత్తిః భూతానామ్=the origin of beings; యేన=by whom; సర్వమ్ ఇదమ్=all this; తతమ్=is pervaded; స్వకర్మణా=by one’s own duty; తమ్ అభ్యర్చ్య=worshipping him; సిద్ధిమ్ విన్దతి=attains perfection; మానవః=a person"};
D["18.47"]={t:["శ్రేయాన్స్వధర్మో విగుణః పరధర్మాత్స్వనుష్ఠితాత్ |","స్వభావనియతం కర్మ కుర్వన్నాప్నోతి కిల్బిషమ్ ||"],mt:"బాగుగా ఆచరింపబడిన పరధర్మముకంటె గుణరహితమైనను స్వధర్మము శ్రేష్ఠము; స్వభావనియతమైన కర్మను చేయువాడు పాపమును పొందడు.",m:"One’s own duty, though imperfect, is better than another’s duty well performed; performing the duty ordained by one’s nature, one incurs no sin.",w:"శ్రేయాన్=better; స్వధర్మః=one’s own duty; విగుణః=imperfect; పరధర్మాత్=than another’s duty; స్వనుష్ఠితాత్=well performed; స్వభావనియతమ్=ordained by one’s nature; కర్మ కుర్వన్=performing action; న ఆప్నోతి కిల్బిషమ్=incurs no sin"};
D["18.48"]={t:["సహజం కర్మ కౌన్తేయ సదోషమపి న త్యజేత్ |","సర్వారమ్భా హి దోషేణ ధూమేనాగ్నిరివావృతాః ||"],mt:"ఓ కౌంతేయా! సహజకర్మ దోషయుక్తమైనను విడువరాదు; ఎందుకనగా అగ్ని పొగచే వలె సర్వకర్మారంభములు దోషముచే కప్పబడియున్నవి.",m:"One should not give up one’s natural duty, O son of Kunti, even if it is flawed; for all undertakings are covered by some fault, as fire is by smoke.",w:"సహజమ్ కర్మ=natural duty; కౌన్తేయ=O son of Kunti; సదోషమ్ అపి=even if flawed; న త్యజేత్=should not give up; సర్వారమ్భాః హి=all undertakings indeed; దోషేణ ఆవృతాః=are covered by fault; ధూమేన అగ్నిః ఇవ=as fire by smoke"};
D["18.49"]={t:["అసక్తబుద్ధిః సర్వత్ర జితాత్మా విగతస్పృహః |","నైష్కర్మ్యసిద్ధిం పరమాం సన్న్యాసేనాధిగచ్ఛతి ||"],mt:"అన్నిచోట్ల ఆసక్తిలేని బుద్ధి గలవాడు, జితాత్ముడు, కోరికలు లేనివాడు సన్న్యాసముచే పరమమైన నైష్కర్మ్యసిద్ధిని పొందును.",m:"One whose intellect is unattached everywhere, who has conquered the self and is free from desire, attains through renunciation the supreme perfection of freedom from action.",w:"అసక్తబుద్ధిః=with an unattached intellect; సర్వత్ర=everywhere; జితాత్మా=self-conquered; విగతస్పృహః=free from desire; నైష్కర్మ్యసిద్ధిమ్ పరమామ్=the supreme perfection of freedom from action; సన్న్యాసేన=through renunciation; అధిగచ్ఛతి=attains"};
D["18.50"]={t:["సిద్ధిం ప్రాప్తో యథా బ్రహ్మ తథాప్నోతి నిబోధ మే |","సమాసేనైవ కౌన్తేయ నిష్ఠా జ్ఞానస్య యా పరా ||"],mt:"ఓ కౌంతేయా! సిద్ధిని పొందినవాడు బ్రహ్మమును ఎట్లు పొందునో, జ్ఞానము యొక్క పరమనిష్ఠ ఏదో దానిని సంగ్రహముగా నా నుండి తెలిసికొనుము.",m:"Learn from me in brief, O son of Kunti, how one who has attained perfection reaches Brahman, which is the supreme culmination of knowledge.",w:"సిద్ధిమ్ ప్రాప్తః=one who has attained perfection; యథా బ్రహ్మ తథా ఆప్నోతి=how he reaches Brahman; నిబోధ మే=learn from me; సమాసేన ఏవ=in brief; కౌన్తేయ=O son of Kunti; నిష్ఠా జ్ఞానస్య యా పరా=the supreme culmination of knowledge"};
D["18.51"]={t:["బుద్ధ్యా విశుద్ధయా యుక్తో ధృత్యాత్మానం నియమ్య చ |","శబ్దాదీన్విషయాంస్త్యక్త్వా రాగద్వేషౌ వ్యుదస్య చ ||"],mt:"విశుద్ధబుద్ధితో కూడి, ధృతిచే ఆత్మను నియమించి, శబ్దాది విషయములను విడిచి, రాగద్వేషములను తొలగించి... (18.53 వరకు కొనసాగును)",m:"Endowed with a purified intellect, restraining the self with resolve, giving up sound and other sense objects, and casting aside attraction and aversion... (continues to 18.53)",w:"బుద్ధ్యా విశుద్ధయా యుక్తః=endowed with a purified intellect; ధృత్యా=with resolve; ఆత్మానమ్ నియమ్య చ=and restraining the self; శబ్దాదీన్ విషయాన్=sound and other sense objects; త్యక్త్వా=giving up; రాగద్వేషౌ=attraction and aversion; వ్యుదస్య చ=and casting aside"};
D["18.52"]={t:["వివిక్తసేవీ లఘ్వాశీ యతవాక్కాయమానసః |","ధ్యానయోగపరో నిత్యం వైరాగ్యం సముపాశ్రితః ||"],mt:"...ఏకాంతసేవి, మితాహారి, వాక్కాయమనస్సులను నియమించినవాడు, నిత్యము ధ్యానయోగపరుడై వైరాగ్యమును ఆశ్రయించినవాడు...",m:"...resorting to solitude, eating lightly, with speech, body and mind controlled, always devoted to meditation and taking refuge in dispassion...",w:"వివిక్తసేవీ=resorting to solitude; లఘ్వాశీ=eating lightly; యతవాక్కాయమానసః=with speech, body and mind controlled; ధ్యానయోగపరః=devoted to meditation; నిత్యమ్=always; వైరాగ్యమ్=dispassion; సముపాశ్రితః=taking refuge in"};
D["18.53"]={t:["అహఙ్కారం బలం దర్పం కామం క్రోధం పరిగ్రహమ్ |","విముచ్య నిర్మమః శాన్తో బ్రహ్మభూయాయ కల్పతే ||"],mt:"...అహంకారము, బలము, దర్పము, కామము, క్రోధము, పరిగ్రహమును విడిచి, మమకారరహితుడై శాంతుడైనవాడు బ్రహ్మభావమునకు అర్హుడగును.",m:"...having given up ego, force, arrogance, desire, anger and possessions, free from possessiveness and tranquil, one becomes fit for oneness with Brahman.",w:"అహఙ్కారమ్=ego; బలమ్=force; దర్పమ్=arrogance; కామమ్=desire; క్రోధమ్=anger; పరిగ్రహమ్=possessions; విముచ్య=giving up; నిర్మమః=free from possessiveness; శాన్తః=tranquil; బ్రహ్మభూయాయ కల్పతే=becomes fit for oneness with Brahman"};
D["18.54"]={t:["బ్రహ్మభూతః ప్రసన్నాత్మా న శోచతి న కాఙ్క్షతి |","సమః సర్వేషు భూతేషు మద్భక్తిం లభతే పరామ్ ||"],mt:"బ్రహ్మభూతుడై ప్రసన్నాత్ముడై శోకింపడు, కోరడు; సర్వభూతములయందు సముడై నా పరమభక్తిని పొందును.",m:"Having become one with Brahman and serene in mind, one neither grieves nor desires; equal toward all beings, one attains supreme devotion to me.",w:"బ్రహ్మభూతః=one with Brahman; ప్రసన్నాత్మా=serene in mind; న శోచతి=does not grieve; న కాఙ్క్షతి=does not desire; సమః సర్వేషు భూతేషు=equal toward all beings; మద్భక్తిమ్ లభతే పరామ్=attains supreme devotion to me"};
D["18.55"]={t:["భక్త్యా మామభిజానాతి యావాన్యశ్చాస్మి తత్త్వతః |","తతో మాం తత్త్వతో జ్ఞాత్వా విశతే తదనన్తరమ్ ||"],mt:"భక్తిచేతనే నేను ఎంతటివాడనో, ఎవడనో తత్త్వముగా తెలిసికొనును; అంతట నన్ను తత్త్వముగా ఎరిగి వెంటనే నాయందు ప్రవేశించును.",m:"By devotion one comes to know me in truth, what and who I am; then, knowing me in truth, one immediately enters into me.",w:"భక్త్యా=by devotion; మామ్ అభిజానాతి=comes to know me; యావాన్ యః చ అస్మి=how much and who I am; తత్త్వతః=in truth; తతః=then; మామ్ తత్త్వతః జ్ఞాత్వా=knowing me in truth; విశతే=enters; తదనన్తరమ్=immediately after"};
D["18.56"]={t:["సర్వకర్మాణ్యపి సదా కుర్వాణో మద్వ్యపాశ్రయః |","మత్ప్రసాదాదవాప్నోతి శాశ్వతం పదమవ్యయమ్ ||"],mt:"నన్ను ఆశ్రయించినవాడు సర్వకర్మలను ఎల్లప్పుడును చేయుచున్నను నా ప్రసాదముచే శాశ్వతమైన అవ్యయపదమును పొందును.",m:"Even while always performing all actions, one who takes refuge in me attains, by my grace, the eternal imperishable state.",w:"సర్వకర్మాణి అపి=all actions even; సదా కుర్వాణః=always performing; మద్వ్యపాశ్రయః=taking refuge in me; మత్ప్రసాదాత్=by my grace; అవాప్నోతి=attains; శాశ్వతమ్ పదమ్ అవ్యయమ్=the eternal imperishable state"};
D["18.57"]={t:["చేతసా సర్వకర్మాణి మయి సన్న్యస్య మత్పరః |","బుద్ధియోగముపాశ్రిత్య మచ్చిత్తః సతతం భవ ||"],mt:"మనస్సుచే సర్వకర్మలను నాయందు సమర్పించి, నన్నే పరమగతిగా భావించి, బుద్ధియోగమును ఆశ్రయించి ఎల్లప్పుడును నాయందే చిత్తము గలవాడవు కమ్ము.",m:"Surrendering all actions to me in your mind, regarding me as the supreme goal, and resorting to the yoga of the intellect, always keep your mind fixed on me.",w:"చేతసా=with the mind; సర్వకర్మాణి=all actions; మయి సన్న్యస్య=surrendering to me; మత్పరః=holding me as the supreme goal; బుద్ధియోగమ్ ఉపాశ్రిత్య=resorting to the yoga of the intellect; మచ్చిత్తః సతతమ్ భవ=always keep your mind on me"};
D["18.58"]={t:["మచ్చిత్తః సర్వదుర్గాణి మత్ప్రసాదాత్తరిష్యసి |","అథ చేత్త్వమహఙ్కారాన్న శ్రోష్యసి వినఙ్క్ష్యసి ||"],mt:"నాయందే చిత్తము గలవాడవై నా ప్రసాదముచే సర్వ కష్టములను దాటెదవు; అహంకారముచే వినకున్నచో నశించెదవు.",m:"With your mind on me, by my grace you will cross over all difficulties; but if out of egoism you do not listen, you will perish.",w:"మచ్చిత్తః=with your mind on me; సర్వదుర్గాణి=all difficulties; మత్ప్రసాదాత్=by my grace; తరిష్యసి=you will cross; అథ చేత్ త్వమ్=but if you; అహఙ్కారాత్=out of egoism; న శ్రోష్యసి=do not listen; వినఙ్క్ష్యసి=you will perish"};
D["18.59"]={t:["యదహఙ్కారమాశ్రిత్య న యోత్స్య ఇతి మన్యసే |","మిథ్యైష వ్యవసాయస్తే ప్రకృతిస్త్వాం నియోక్ష్యతి ||"],mt:"అహంకారమును ఆశ్రయించి “నేను యుద్ధము చేయను” అని నీవు తలచుచున్నచో ఈ నీ నిశ్చయము అసత్యము; ప్రకృతి నిన్ను ప్రేరేపించును.",m:"If, taking refuge in egoism, you think, “I will not fight,” this resolve of yours is vain; nature will compel you.",w:"యత్ అహఙ్కారమ్ ఆశ్రిత్య=if taking refuge in egoism; న యోత్స్యే ఇతి మన్యసే=you think “I will not fight”; మిథ్యా ఏషః వ్యవసాయః తే=this resolve of yours is false; ప్రకృతిః త్వామ్ నియోక్ష్యతి=nature will engage you"};
D["18.60"]={t:["స్వభావజేన కౌన్తేయ నిబద్ధః స్వేన కర్మణా |","కర్తుం నేచ్ఛసి యన్మోహాత్కరిష్యస్యవశోఽపి తత్ ||"],mt:"ఓ కౌంతేయా! స్వభావజమైన నీ స్వకర్మచే బంధింపబడి, మోహముచే ఏది చేయగోరవో దానిని అవశుడవై చేయుదువు.",m:"Bound by your own action born of your nature, O son of Kunti, that which you do not wish to do out of delusion, you will do even helplessly.",w:"స్వభావజేన=born of one’s nature; కౌన్తేయ=O son of Kunti; నిబద్ధః=bound; స్వేన కర్మణా=by your own action; కర్తుమ్ న ఇచ్ఛసి యత్=what you do not wish to do; మోహాత్=out of delusion; కరిష్యసి=you will do; అవశః అపి తత్=even helplessly that"};


// Chapter 18 – shlokas 18.41 to 18.60. Paste after your D object.
D["18.41"]={t:["బ్రాహ్మణక్షత్రియవిశాం శూద్రాణాం చ పరన్తప |","కర్మాణి ప్రవిభక్తాని స్వభావప్రభవైర్గుణైః ||"],mt:"ఓ పరంతపా! బ్రాహ్మణ క్షత్రియ వైశ్య శూద్రుల కర్మలు స్వభావమునుండి పుట్టిన గుణములను బట్టి విభజింపబడినవి.",m:"The duties of brahmins, kshatriyas, vaishyas and shudras, O scorcher of foes, are distributed according to the gunas born of their own nature.",w:"బ్రాహ్మణక్షత్రియవిశామ్=of brahmins, kshatriyas and vaishyas; శూద్రాణామ్ చ=and of shudras; పరన్తప=O scorcher of foes; కర్మాణి=duties; ప్రవిభక్తాని=are distributed; స్వభావప్రభవైః గుణైః=according to the gunas born of one’s own nature"};
D["18.42"]={t:["శమో దమస్తపః శౌచం క్షాన్తిరార్జవమేవ చ |","జ్ఞానం విజ్ఞానమాస్తిక్యం బ్రహ్మకర్మ స్వభావజమ్ ||"],mt:"శమము, దమము, తపస్సు, శౌచము, క్షమ, ఆర్జవము, జ్ఞానము, విజ్ఞానము, ఆస్తిక్యము — ఇవి స్వభావజమైన బ్రాహ్మణకర్మ.",m:"Tranquillity, self-control, austerity, purity, forgiveness, uprightness, knowledge, realisation and faith in the divine are the natural duties of a brahmin.",w:"శమః=tranquillity; దమః=self-control; తపః=austerity; శౌచమ్=purity; క్షాన్తిః=forgiveness; ఆర్జవమ్ ఏవ చ=and uprightness; జ్ఞానమ్=knowledge; విజ్ఞానమ్=realisation; ఆస్తిక్యమ్=faith; బ్రహ్మకర్మ=the duty of a brahmin; స్వభావజమ్=born of nature"};
D["18.43"]={t:["శౌర్యం తేజో ధృతిర్దాక్ష్యం యుద్ధే చాప్యపలాయనమ్ |","దానమీశ్వరభావశ్చ క్షాత్రం కర్మ స్వభావజమ్ ||"],mt:"శౌర్యము, తేజస్సు, ధృతి, దక్షత, యుద్ధమున పారిపోకుండుట, దానము, నాయకత్వభావము — ఇవి స్వభావజమైన క్షత్రియకర్మ.",m:"Heroism, vigour, fortitude, skill, not fleeing from battle, charity and the quality of leadership are the natural duties of a kshatriya.",w:"శౌర్యమ్=heroism; తేజః=vigour; ధృతిః=fortitude; దాక్ష్యమ్=skill; యుద్ధే చ అపి అపలాయనమ్=and not fleeing even in battle; దానమ్=charity; ఈశ్వరభావః చ=and the quality of leadership; క్షాత్రమ్ కర్మ=the duty of a kshatriya; స్వభావజమ్=born of nature"};
D["18.44"]={t:["కృషిగోరక్ష్యవాణిజ్యం వైశ్యకర్మ స్వభావజమ్ |","పరిచర్యాత్మకం కర్మ శూద్రస్యాపి స్వభావజమ్ ||"],mt:"వ్యవసాయము, గోరక్షణ, వాణిజ్యము స్వభావజమైన వైశ్యకర్మ; సేవారూపమైన కర్మ శూద్రునికి స్వభావజము.",m:"Farming, cow-protection and trade are the natural duties of a vaishya; work of the nature of service is the natural duty of a shudra.",w:"కృషిగోరక్ష్యవాణిజ్యమ్=farming, cow-protection and trade; వైశ్యకర్మ=the duty of a vaishya; స్వభావజమ్=born of nature; పరిచర్యాత్మకమ్ కర్మ=work of the nature of service; శూద్రస్య అపి=of a shudra too; స్వభావజమ్=born of nature"};
D["18.45"]={t:["స్వే స్వే కర్మణ్యభిరతః సంసిద్ధిం లభతే నరః |","స్వకర్మనిరతః సిద్ధిం యథా విన్దతి తచ్ఛృణు ||"],mt:"తన తన కర్మయందు అభిరతుడైన మనుష్యుడు సంసిద్ధిని పొందును; స్వకర్మయందు నిరతుడై సిద్ధిని ఎట్లు పొందునో వినుము.",m:"Devoted to his own duty, a person attains perfection. Hear how one engaged in one’s own duty finds perfection.",w:"స్వే స్వే కర్మణి=in one’s own duty; అభిరతః=devoted; సంసిద్ధిమ్ లభతే=attains perfection; నరః=a person; స్వకర్మనిరతః=engaged in one’s own duty; సిద్ధిమ్ యథా విన్దతి=how one finds perfection; తత్ శృణు=hear that"};
D["18.46"]={t:["యతః ప్రవృత్తిర్భూతానాం యేన సర్వమిదం తతమ్ |","స్వకర్మణా తమభ్యర్చ్య సిద్ధిం విన్దతి మానవః ||"],mt:"ఎవనినుండి భూతముల ప్రవృత్తి కలిగెనో, ఎవనిచే ఈ సర్వము వ్యాపింపబడినదో ఆయనను స్వకర్మచే అర్చించి మనుష్యుడు సిద్ధిని పొందును.",m:"By worshipping with one’s own duty that from which all beings arise and by which all this is pervaded, a person attains perfection.",w:"యతః=from whom; ప్రవృత్తిః భూతానామ్=the origin of beings; యేన=by whom; సర్వమ్ ఇదమ్=all this; తతమ్=is pervaded; స్వకర్మణా=by one’s own duty; తమ్ అభ్యర్చ్య=worshipping him; సిద్ధిమ్ విన్దతి=attains perfection; మానవః=a person"};
D["18.47"]={t:["శ్రేయాన్స్వధర్మో విగుణః పరధర్మాత్స్వనుష్ఠితాత్ |","స్వభావనియతం కర్మ కుర్వన్నాప్నోతి కిల్బిషమ్ ||"],mt:"బాగుగా ఆచరింపబడిన పరధర్మముకంటె గుణరహితమైనను స్వధర్మము శ్రేష్ఠము; స్వభావనియతమైన కర్మను చేయువాడు పాపమును పొందడు.",m:"One’s own duty, though imperfect, is better than another’s duty well performed; performing the duty ordained by one’s nature, one incurs no sin.",w:"శ్రేయాన్=better; స్వధర్మః=one’s own duty; విగుణః=imperfect; పరధర్మాత్=than another’s duty; స్వనుష్ఠితాత్=well performed; స్వభావనియతమ్=ordained by one’s nature; కర్మ కుర్వన్=performing action; న ఆప్నోతి కిల్బిషమ్=incurs no sin"};
D["18.48"]={t:["సహజం కర్మ కౌన్తేయ సదోషమపి న త్యజేత్ |","సర్వారమ్భా హి దోషేణ ధూమేనాగ్నిరివావృతాః ||"],mt:"ఓ కౌంతేయా! సహజకర్మ దోషయుక్తమైనను విడువరాదు; ఎందుకనగా అగ్ని పొగచే వలె సర్వకర్మారంభములు దోషముచే కప్పబడియున్నవి.",m:"One should not give up one’s natural duty, O son of Kunti, even if it is flawed; for all undertakings are covered by some fault, as fire is by smoke.",w:"సహజమ్ కర్మ=natural duty; కౌన్తేయ=O son of Kunti; సదోషమ్ అపి=even if flawed; న త్యజేత్=should not give up; సర్వారమ్భాః హి=all undertakings indeed; దోషేణ ఆవృతాః=are covered by fault; ధూమేన అగ్నిః ఇవ=as fire by smoke"};
D["18.49"]={t:["అసక్తబుద్ధిః సర్వత్ర జితాత్మా విగతస్పృహః |","నైష్కర్మ్యసిద్ధిం పరమాం సన్న్యాసేనాధిగచ్ఛతి ||"],mt:"అన్నిచోట్ల ఆసక్తిలేని బుద్ధి గలవాడు, జితాత్ముడు, కోరికలు లేనివాడు సన్న్యాసముచే పరమమైన నైష్కర్మ్యసిద్ధిని పొందును.",m:"One whose intellect is unattached everywhere, who has conquered the self and is free from desire, attains through renunciation the supreme perfection of freedom from action.",w:"అసక్తబుద్ధిః=with an unattached intellect; సర్వత్ర=everywhere; జితాత్మా=self-conquered; విగతస్పృహః=free from desire; నైష్కర్మ్యసిద్ధిమ్ పరమామ్=the supreme perfection of freedom from action; సన్న్యాసేన=through renunciation; అధిగచ్ఛతి=attains"};
D["18.50"]={t:["సిద్ధిం ప్రాప్తో యథా బ్రహ్మ తథాప్నోతి నిబోధ మే |","సమాసేనైవ కౌన్తేయ నిష్ఠా జ్ఞానస్య యా పరా ||"],mt:"ఓ కౌంతేయా! సిద్ధిని పొందినవాడు బ్రహ్మమును ఎట్లు పొందునో, జ్ఞానము యొక్క పరమనిష్ఠ ఏదో దానిని సంగ్రహముగా నా నుండి తెలిసికొనుము.",m:"Learn from me in brief, O son of Kunti, how one who has attained perfection reaches Brahman, which is the supreme culmination of knowledge.",w:"సిద్ధిమ్ ప్రాప్తః=one who has attained perfection; యథా బ్రహ్మ తథా ఆప్నోతి=how he reaches Brahman; నిబోధ మే=learn from me; సమాసేన ఏవ=in brief; కౌన్తేయ=O son of Kunti; నిష్ఠా జ్ఞానస్య యా పరా=the supreme culmination of knowledge"};
D["18.51"]={t:["బుద్ధ్యా విశుద్ధయా యుక్తో ధృత్యాత్మానం నియమ్య చ |","శబ్దాదీన్విషయాంస్త్యక్త్వా రాగద్వేషౌ వ్యుదస్య చ ||"],mt:"విశుద్ధబుద్ధితో కూడి, ధృతిచే ఆత్మను నియమించి, శబ్దాది విషయములను విడిచి, రాగద్వేషములను తొలగించి... (18.53 వరకు కొనసాగును)",m:"Endowed with a purified intellect, restraining the self with resolve, giving up sound and other sense objects, and casting aside attraction and aversion... (continues to 18.53)",w:"బుద్ధ్యా విశుద్ధయా యుక్తః=endowed with a purified intellect; ధృత్యా=with resolve; ఆత్మానమ్ నియమ్య చ=and restraining the self; శబ్దాదీన్ విషయాన్=sound and other sense objects; త్యక్త్వా=giving up; రాగద్వేషౌ=attraction and aversion; వ్యుదస్య చ=and casting aside"};
D["18.52"]={t:["వివిక్తసేవీ లఘ్వాశీ యతవాక్కాయమానసః |","ధ్యానయోగపరో నిత్యం వైరాగ్యం సముపాశ్రితః ||"],mt:"...ఏకాంతసేవి, మితాహారి, వాక్కాయమనస్సులను నియమించినవాడు, నిత్యము ధ్యానయోగపరుడై వైరాగ్యమును ఆశ్రయించినవాడు...",m:"...resorting to solitude, eating lightly, with speech, body and mind controlled, always devoted to meditation and taking refuge in dispassion...",w:"వివిక్తసేవీ=resorting to solitude; లఘ్వాశీ=eating lightly; యతవాక్కాయమానసః=with speech, body and mind controlled; ధ్యానయోగపరః=devoted to meditation; నిత్యమ్=always; వైరాగ్యమ్=dispassion; సముపాశ్రితః=taking refuge in"};
D["18.53"]={t:["అహఙ్కారం బలం దర్పం కామం క్రోధం పరిగ్రహమ్ |","విముచ్య నిర్మమః శాన్తో బ్రహ్మభూయాయ కల్పతే ||"],mt:"...అహంకారము, బలము, దర్పము, కామము, క్రోధము, పరిగ్రహమును విడిచి, మమకారరహితుడై శాంతుడైనవాడు బ్రహ్మభావమునకు అర్హుడగును.",m:"...having given up ego, force, arrogance, desire, anger and possessions, free from possessiveness and tranquil, one becomes fit for oneness with Brahman.",w:"అహఙ్కారమ్=ego; బలమ్=force; దర్పమ్=arrogance; కామమ్=desire; క్రోధమ్=anger; పరిగ్రహమ్=possessions; విముచ్య=giving up; నిర్మమః=free from possessiveness; శాన్తః=tranquil; బ్రహ్మభూయాయ కల్పతే=becomes fit for oneness with Brahman"};
D["18.54"]={t:["బ్రహ్మభూతః ప్రసన్నాత్మా న శోచతి న కాఙ్క్షతి |","సమః సర్వేషు భూతేషు మద్భక్తిం లభతే పరామ్ ||"],mt:"బ్రహ్మభూతుడై ప్రసన్నాత్ముడై శోకింపడు, కోరడు; సర్వభూతములయందు సముడై నా పరమభక్తిని పొందును.",m:"Having become one with Brahman and serene in mind, one neither grieves nor desires; equal toward all beings, one attains supreme devotion to me.",w:"బ్రహ్మభూతః=one with Brahman; ప్రసన్నాత్మా=serene in mind; న శోచతి=does not grieve; న కాఙ్క్షతి=does not desire; సమః సర్వేషు భూతేషు=equal toward all beings; మద్భక్తిమ్ లభతే పరామ్=attains supreme devotion to me"};
D["18.55"]={t:["భక్త్యా మామభిజానాతి యావాన్యశ్చాస్మి తత్త్వతః |","తతో మాం తత్త్వతో జ్ఞాత్వా విశతే తదనన్తరమ్ ||"],mt:"భక్తిచేతనే నేను ఎంతటివాడనో, ఎవడనో తత్త్వముగా తెలిసికొనును; అంతట నన్ను తత్త్వముగా ఎరిగి వెంటనే నాయందు ప్రవేశించును.",m:"By devotion one comes to know me in truth, what and who I am; then, knowing me in truth, one immediately enters into me.",w:"భక్త్యా=by devotion; మామ్ అభిజానాతి=comes to know me; యావాన్ యః చ అస్మి=how much and who I am; తత్త్వతః=in truth; తతః=then; మామ్ తత్త్వతః జ్ఞాత్వా=knowing me in truth; విశతే=enters; తదనన్తరమ్=immediately after"};
D["18.56"]={t:["సర్వకర్మాణ్యపి సదా కుర్వాణో మద్వ్యపాశ్రయః |","మత్ప్రసాదాదవాప్నోతి శాశ్వతం పదమవ్యయమ్ ||"],mt:"నన్ను ఆశ్రయించినవాడు సర్వకర్మలను ఎల్లప్పుడును చేయుచున్నను నా ప్రసాదముచే శాశ్వతమైన అవ్యయపదమును పొందును.",m:"Even while always performing all actions, one who takes refuge in me attains, by my grace, the eternal imperishable state.",w:"సర్వకర్మాణి అపి=all actions even; సదా కుర్వాణః=always performing; మద్వ్యపాశ్రయః=taking refuge in me; మత్ప్రసాదాత్=by my grace; అవాప్నోతి=attains; శాశ్వతమ్ పదమ్ అవ్యయమ్=the eternal imperishable state"};
D["18.57"]={t:["చేతసా సర్వకర్మాణి మయి సన్న్యస్య మత్పరః |","బుద్ధియోగముపాశ్రిత్య మచ్చిత్తః సతతం భవ ||"],mt:"మనస్సుచే సర్వకర్మలను నాయందు సమర్పించి, నన్నే పరమగతిగా భావించి, బుద్ధియోగమును ఆశ్రయించి ఎల్లప్పుడును నాయందే చిత్తము గలవాడవు కమ్ము.",m:"Surrendering all actions to me in your mind, regarding me as the supreme goal, and resorting to the yoga of the intellect, always keep your mind fixed on me.",w:"చేతసా=with the mind; సర్వకర్మాణి=all actions; మయి సన్న్యస్య=surrendering to me; మత్పరః=holding me as the supreme goal; బుద్ధియోగమ్ ఉపాశ్రిత్య=resorting to the yoga of the intellect; మచ్చిత్తః సతతమ్ భవ=always keep your mind on me"};
D["18.58"]={t:["మచ్చిత్తః సర్వదుర్గాణి మత్ప్రసాదాత్తరిష్యసి |","అథ చేత్త్వమహఙ్కారాన్న శ్రోష్యసి వినఙ్క్ష్యసి ||"],mt:"నాయందే చిత్తము గలవాడవై నా ప్రసాదముచే సర్వ కష్టములను దాటెదవు; అహంకారముచే వినకున్నచో నశించెదవు.",m:"With your mind on me, by my grace you will cross over all difficulties; but if out of egoism you do not listen, you will perish.",w:"మచ్చిత్తః=with your mind on me; సర్వదుర్గాణి=all difficulties; మత్ప్రసాదాత్=by my grace; తరిష్యసి=you will cross; అథ చేత్ త్వమ్=but if you; అహఙ్కారాత్=out of egoism; న శ్రోష్యసి=do not listen; వినఙ్క్ష్యసి=you will perish"};
D["18.59"]={t:["యదహఙ్కారమాశ్రిత్య న యోత్స్య ఇతి మన్యసే |","మిథ్యైష వ్యవసాయస్తే ప్రకృతిస్త్వాం నియోక్ష్యతి ||"],mt:"అహంకారమును ఆశ్రయించి “నేను యుద్ధము చేయను” అని నీవు తలచుచున్నచో ఈ నీ నిశ్చయము అసత్యము; ప్రకృతి నిన్ను ప్రేరేపించును.",m:"If, taking refuge in egoism, you think, “I will not fight,” this resolve of yours is vain; nature will compel you.",w:"యత్ అహఙ్కారమ్ ఆశ్రిత్య=if taking refuge in egoism; న యోత్స్యే ఇతి మన్యసే=you think “I will not fight”; మిథ్యా ఏషః వ్యవసాయః తే=this resolve of yours is false; ప్రకృతిః త్వామ్ నియోక్ష్యతి=nature will engage you"};
D["18.60"]={t:["స్వభావజేన కౌన్తేయ నిబద్ధః స్వేన కర్మణా |","కర్తుం నేచ్ఛసి యన్మోహాత్కరిష్యస్యవశోఽపి తత్ ||"],mt:"ఓ కౌంతేయా! స్వభావజమైన నీ స్వకర్మచే బంధింపబడి, మోహముచే ఏది చేయగోరవో దానిని అవశుడవై చేయుదువు.",m:"Bound by your own action born of your nature, O son of Kunti, that which you do not wish to do out of delusion, you will do even helplessly.",w:"స్వభావజేన=born of one’s nature; కౌన్తేయ=O son of Kunti; నిబద్ధః=bound; స్వేన కర్మణా=by your own action; కర్తుమ్ న ఇచ్ఛసి యత్=what you do not wish to do; మోహాత్=out of delusion; కరిష్యసి=you will do; అవశః అపి తత్=even helplessly that"};

// Chapter 18 – shlokas 18.61 to 18.78 (completes the Gita; D["18.66"] replaces the earlier sample). Paste after your D object.
D["18.61"]={t:["ఈశ్వరః సర్వభూతానాం హృద్దేశేఽర్జున తిష్ఠతి |","భ్రామయన్సర్వభూతాని యన్త్రారూఢాని మాయయా ||"],mt:"ఓ అర్జునా! ఈశ్వరుడు సర్వభూతముల హృదయమున నిలిచి, యంత్రముపై ఎక్కినవానివలె ఉన్న సర్వభూతములను తన మాయచే తిప్పుచున్నాడు.",m:"The Lord dwells in the heart of all beings, O Arjuna, causing all beings, mounted on a machine, to revolve by his maya.",w:"ఈశ్వరః=the Lord; సర్వభూతానామ్=of all beings; హృద్దేశే=in the region of the heart; అర్జున=O Arjuna; తిష్ఠతి=dwells; భ్రామయన్=causing to revolve; సర్వభూతాని=all beings; యన్త్రారూఢాని=mounted on a machine; మాయయా=by his maya"};
D["18.62"]={t:["తమేవ శరణం గచ్ఛ సర్వభావేన భారత |","తత్ప్రసాదాత్పరాం శాన్తిం స్థానం ప్రాప్స్యసి శాశ్వతమ్ ||"],mt:"ఓ భారతా! సర్వభావముతో ఆయననే శరణుజొచ్చుము; ఆయన ప్రసాదముచే పరమశాంతిని శాశ్వతమైన స్థానమును పొందెదవు.",m:"Take refuge in him alone with your whole being, O Bharata; by his grace you will attain supreme peace and the eternal abode.",w:"తమ్ ఏవ=him alone; శరణమ్ గచ్ఛ=take refuge; సర్వభావేన=with your whole being; భారత=O Bharata; తత్ప్రసాదాత్=by his grace; పరామ్ శాన్తిమ్=supreme peace; స్థానమ్ ప్రాప్స్యసి శాశ్వతమ్=you will attain the eternal abode"};
D["18.63"]={t:["ఇతి తే జ్ఞానమాఖ్యాతం గుహ్యాద్గుహ్యతరం మయా |","విమృశ్యైతదశేషేణ యథేచ్ఛసి తథా కురు ||"],mt:"ఇట్లు రహస్యములకంటె రహస్యమైన జ్ఞానము నాచే నీకు చెప్పబడినది; దీనిని పూర్తిగా ఆలోచించి నీ ఇష్టమైనట్లు చేయుము.",m:"Thus I have told you this knowledge, more secret than all secrets; reflect on it fully and then do as you wish.",w:"ఇతి=thus; తే=to you; జ్ఞానమ్ ఆఖ్యాతమ్=knowledge has been told; గుహ్యాత్ గుహ్యతరమ్=more secret than the secret; మయా=by me; విమృశ్య ఏతత్=reflecting on this; అశేషేణ=fully; యథా ఇచ్ఛసి తథా కురు=do as you wish"};
D["18.64"]={t:["సర్వగుహ్యతమం భూయః శృణు మే పరమం వచః |","ఇష్టోఽసి మే దృఢమితి తతో వక్ష్యామి తే హితమ్ ||"],mt:"సర్వరహస్యములలో అతిగుహ్యమైన నా పరమవచనమును మరల వినుము; నీవు నాకు మిక్కిలి ప్రియుడవు, కావున నీ హితమును చెప్పెదను.",m:"Hear again my supreme word, the most secret of all; you are dearly loved by me, therefore I shall tell you what is for your good.",w:"సర్వగుహ్యతమమ్=the most secret of all; భూయః శృణు=hear again; మే పరమమ్ వచః=my supreme word; ఇష్టః అసి మే దృఢమ్=you are firmly beloved to me; ఇతి తతః=therefore; వక్ష్యామి తే హితమ్=I shall tell you what is good for you"};
D["18.65"]={t:["మన్మనా భవ మద్భక్తో మద్యాజీ మాం నమస్కురు |","మామేవైష్యసి సత్యం తే ప్రతిజానే ప్రియోఽసి మే ||"],mt:"నాయందే మనస్సు నిలుపుము, నా భక్తుడవు కమ్ము, నన్ను పూజింపుము, నాకు నమస్కరింపుము; నన్నే పొందెదవు — ఇది సత్యము; నీవు నాకు ప్రియుడవు కావున ప్రతిజ్ఞ చేయుచున్నాను.",m:"Fix your mind on me, be my devotee, worship me and bow to me; you will come to me alone. I promise you truly, for you are dear to me.",w:"మన్మనాః భవ=fix your mind on me; మద్భక్తః=my devotee; మద్యాజీ=my worshipper; మామ్ నమస్కురు=bow to me; మామ్ ఏవ ఏష్యసి=you will come to me alone; సత్యమ్ తే ప్రతిజానే=I promise you truly; ప్రియః అసి మే=you are dear to me"};
D["18.66"]={t:["సర్వధర్మాన్పరిత్యజ్య మామేకం శరణం వ్రజ |","అహం త్వా సర్వపాపేభ్యో మోక్షయిష్యామి మా శుచః ||"],mt:"సర్వధర్మములను విడిచి నన్ను ఒక్కనినే శరణుజొచ్చుము; నేను నిన్ను సర్వపాపములనుండి విముక్తుని చేయుదును; శోకింపకుము.",m:"Abandoning all duties, take refuge in me alone. I shall free you from all sins; do not grieve.",w:"సర్వధర్మాన్=all duties; పరిత్యజ్య=abandoning; మామ్=to me; ఏకమ్=alone; శరణమ్=refuge; వ్రజ=take; అహమ్=I; త్వా=you; సర్వపాపేభ్యః=from all sins; మోక్షయిష్యామి=will liberate; మా శుచః=do not grieve"};
D["18.67"]={t:["ఇదం తే నాతపస్కాయ నాభక్తాయ కదాచన |","న చాశుశ్రూషవే వాచ్యం న చ మాం యోఽభ్యసూయతి ||"],mt:"ఇది తపస్సు లేనివానికి, భక్తిలేనివానికి, వినగోరనివానికి, నన్ను అసూయపడువానికి ఎన్నడును చెప్పరాదు.",m:"This should never be told to one who is without austerity, nor to one without devotion, nor to one who does not wish to listen, nor to one who envies me.",w:"ఇదమ్ తే=this of yours; న అతపస్కాయ=not to one without austerity; న అభక్తాయ కదాచన=never to one without devotion; న చ అశుశ్రూషవే వాచ్యమ్=nor to be told to one who does not wish to listen; న చ మామ్ యః అభ్యసూయతి=nor to one who envies me"};
D["18.68"]={t:["య ఇదం పరమం గుహ్యం మద్భక్తేష్వభిధాస్యతి |","భక్తిం మయి పరాం కృత్వా మామేవైష్యత్యసంశయః ||"],mt:"ఈ పరమగుహ్యమును నా భక్తులకు చెప్పువాడు నాయందు పరమభక్తి కలిగి నిస్సందేహముగా నన్నే పొందును.",m:"One who teaches this supreme secret to my devotees, offering supreme devotion to me, will come to me alone, without doubt.",w:"యః=who; ఇదమ్ పరమమ్ గుహ్యమ్=this supreme secret; మద్భక్తేషు=among my devotees; అభిధాస్యతి=will teach; భక్తిమ్ మయి పరామ్ కృత్వా=offering supreme devotion to me; మామ్ ఏవ ఏష్యతి=will come to me alone; అసంశయః=without doubt"};
D["18.69"]={t:["న చ తస్మాన్మనుష్యేషు కశ్చిన్మే ప్రియకృత్తమః |","భవితా న చ మే తస్మాదన్యః ప్రియతరో భువి ||"],mt:"మనుష్యులలో అతనికంటె నాకు ప్రియమైనది చేయువాడెవడును లేడు; భూమిపై అతనికంటె నాకు ప్రియతరుడు మరెవడును కాబోడు.",m:"There is no one among men who does me a dearer service than he, nor will anyone on earth be dearer to me than he.",w:"న చ తస్మాత్=nor than him; మనుష్యేషు=among men; కశ్చిత్ మే ప్రియకృత్తమః=anyone who does me a dearer service; భవితా న చ=nor will there be; మే తస్మాత్ అన్యః ప్రియతరః భువి=another dearer to me on earth than him"};
D["18.70"]={t:["అధ్యేష్యతే చ య ఇమం ధర్మ్యం సంవాదమావయోః |","జ్ఞానయజ్ఞేన తేనాహమిష్టః స్యామితి మే మతిః ||"],mt:"మన ఇద్దరి ఈ ధర్మయుక్తమైన సంవాదమును ఎవడు అధ్యయనము చేయునో, అతనిచే జ్ఞానయజ్ఞముతో నేను పూజింపబడినవాడనగుదునని నా అభిప్రాయము.",m:"And whoever studies this sacred dialogue of ours, by him I shall be worshipped with the sacrifice of knowledge: such is my conviction.",w:"అధ్యేష్యతే చ=and will study; యః ఇమమ్=who this; ధర్మ్యమ్ సంవాదమ్ ఆవయోః=sacred dialogue of ours; జ్ఞానయజ్ఞేన తేన=by that sacrifice of knowledge; అహమ్ ఇష్టః స్యామ్=I shall be worshipped; ఇతి మే మతిః=so is my conviction"};
D["18.71"]={t:["శ్రద్ధావానననసూయశ్చ శృణుయాదపి యో నరః |","సోఽపి ముక్తః శుభాఁల్లోకాన్ప్రాప్నుయాత్పుణ్యకర్మణామ్ ||"],mt:"శ్రద్ధతో అసూయలేక కేవలము వినువాడు కూడా విముక్తుడై పుణ్యకర్ములు పొందు శుభలోకములను పొందును.",m:"Even a person who merely listens with faith and without envy, being freed, attains the auspicious worlds of those of virtuous deeds.",w:"శ్రద్ధావాన్=full of faith; అనసూయః చ=and without envy; శృణుయాత్ అపి=even listens; యః నరః=the person who; సః అపి ముక్తః=he too, freed; శుభాన్ లోకాన్=auspicious worlds; ప్రాప్నుయాత్=attains; పుణ్యకర్మణామ్=of those of virtuous deeds"};
D["18.72"]={t:["కచ్చిదేతచ్ఛ్రుతం పార్థ త్వయైకాగ్రేణ చేతసా |","కచ్చిదజ్ఞానసమ్మోహః ప్రణష్టస్తే ధనఞ్జయ ||"],mt:"ఓ పార్థా! దీనిని నీవు ఏకాగ్రచిత్తముతో వింటివా? ఓ ధనంజయా! అజ్ఞానజనితమైన నీ మోహము నశించినదా?",m:"O Partha, have you heard this with a one-pointed mind? O Dhananjaya, has your delusion born of ignorance been destroyed?",w:"కచ్చిత్=whether; ఏతత్ శ్రుతమ్=this has been heard; పార్థ=O Partha; త్వయా=by you; ఏకాగ్రేణ చేతసా=with a one-pointed mind; అజ్ఞానసమ్మోహః=the delusion born of ignorance; ప్రణష్టః తే=has been destroyed for you; ధనఞ్జయ=O Dhananjaya"};
D["18.73"]={t:["అర్జున ఉవాచ |","నష్టో మోహః స్మృతిర్లబ్ధా త్వత్ప్రసాదాన్మయాచ్యుత |","స్థితోఽస్మి గతసన్దేహః కరిష్యే వచనం తవ ||"],mt:"అర్జునుడు పలికెను: ఓ అచ్యుతా! నీ ప్రసాదముచే నా మోహము నశించినది; స్మృతి లభించినది; సందేహములు తొలగి స్థిరుడనైతిని; నీ వచనమును చేయుదును.",m:"Arjuna said: My delusion is destroyed, O Achyuta, and I have regained my memory by your grace. I stand firm, with my doubts gone; I shall act according to your word.",w:"అర్జునః ఉవాచ=Arjuna said; నష్టః మోహః=delusion is destroyed; స్మృతిః లబ్ధా=memory is regained; త్వత్ప్రసాదాత్=by your grace; మయా=by me; అచ్యుత=O Achyuta; స్థితః అస్మి=I stand firm; గతసన్దేహః=with doubts gone; కరిష్యే వచనమ్ తవ=I shall act according to your word"};
D["18.74"]={t:["సఞ్జయ ఉవాచ |","ఇత్యహం వాసుదేవస్య పార్థస్య చ మహాత్మనః |","సంవాదమిమమశ్రౌషమద్భుతం రోమహర్షణమ్ ||"],mt:"సంజయుడు పలికెను: ఇట్లు నేను వాసుదేవుని, మహాత్ముడైన పార్థుని యొక్క అద్భుతమైన, రోమాంచకరమైన ఈ సంవాదమును వింటిని.",m:"Sanjaya said: Thus I have heard this wondrous, hair-raising dialogue between Vasudeva and the great-souled Partha.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఇతి=thus; అహమ్=I; వాసుదేవస్య=of Vasudeva; పార్థస్య చ మహాత్మనః=and of the great-souled Partha; సంవాదమ్ ఇమమ్=this dialogue; అశ్రౌషమ్=I heard; అద్భుతమ్=wondrous; రోమహర్షణమ్=hair-raising"};
D["18.75"]={t:["వ్యాసప్రసాదాచ్ఛ్రుతవానేతద్గుహ్యమహం పరమ్ |","యోగం యోగేశ్వరాత్కృష్ణాత్సాక్షాత్కథయతః స్వయమ్ ||"],mt:"వ్యాసుని ప్రసాదముచే ఈ పరమగుహ్యమైన యోగమును స్వయముగా చెప్పుచున్న యోగేశ్వరుడైన కృష్ణునినుండి ప్రత్యక్షముగా వింటిని.",m:"By the grace of Vyasa I heard this supreme secret yoga directly from Krishna, the Lord of yoga, as he himself was speaking.",w:"వ్యాసప్రసాదాత్=by the grace of Vyasa; శ్రుతవాన్=I heard; ఏతత్ గుహ్యమ్ అహమ్ పరమ్=this supreme secret; యోగమ్=yoga; యోగేశ్వరాత్ కృష్ణాత్=from Krishna, the Lord of yoga; సాక్షాత్=directly; కథయతః స్వయమ్=as he himself was speaking"};

"Krishna begins the teaching: the self is eternal and the body perishable, so grief is misplaced. He introduces action without attachment to results (nishkama karma) and describes the steady-minded person. Often called the essence of the whole Gita.",
"Why action cannot be given up. Krishna presents duty as selfless service and sacrifice, stresses setting an example for others, and names desire and anger as the enemy that must be conquered.",
"The lineage of this teaching, Krishna’s descent whenever dharma declines (4.7–4.8), the many kinds of sacrifice, and how the fire of knowledge burns away the bondage of action.",
"Compares renunciation of action with the yoga of action and shows both lead to the same goal. The wise act without attachment, like a lotus leaf untouched by water, and find lasting peace.",
"The practice of meditation: posture, moderation in living and discipline of the restless mind, which can be a friend or an enemy. Krishna also reassures those who fall short and calls the devoted yogi the highest.",
"Krishna reveals his higher and lower natures and himself as the source of everything, the deluding power of the gunas, and four kinds of devotees, of whom the wise are dearest to him.",
"Answers Arjuna’s questions on Brahman, the self and action. Teaches remembering the Lord at the time of death, the syllable Om, and the bright and dark paths of departure.",
"The “royal knowledge and royal secret”: the Lord pervades creation yet is not bound by it; simple loving offerings (a leaf, flower, fruit, water) are accepted, and even the most sinful who turn to him become righteous.",
"Krishna describes his divine glories, the finest expression of himself in every class of beings, so that devotees may contemplate him everywhere, ending with the insight that the whole universe rests on a fraction of him.",
"Arjuna is given divine sight and beholds the cosmic form that holds all creation, including time the destroyer. Awestruck, he asks to see the gentle form again. The chapter closes affirming single-minded devotion as the way.",
"Compares worship of the personal God with meditation on the unmanifest, and gives a portrait of the dear devotee: free from hatred, balanced in joy and sorrow, humble and content.",
"Distinguishes the field (body, mind and nature) from the knower of the field (the self), describes the qualities that make up true knowledge, and shows the Supreme dwelling equally in all beings.",
"Explains the three gunas (sattva, rajas and tamas), how each binds the embodied self, what each produces, and the marks of one who has gone beyond them.",
"Uses the image of the inverted peepal tree of worldly existence, to be cut with the weapon of detachment, and teaches the perishable, the imperishable and the Supreme Person beyond both.",
"Contrasts divine and demonic qualities and their outcomes, names lust, anger and greed as three gates of hell, and stresses the scriptures as the guide to right and wrong action.",
"Shows that faith, food, sacrifice, austerity and charity each take three forms according to the gunas, and explains the sacred formula “Om Tat Sat”.",
"A summary of the whole Gita: renunciation and action, the factors of action, the gunas in knowledge, action and the doer, duty according to one’s nature, and Krishna’s final call to surrender (18.66). Sanjaya closes with his conviction that victory lies where Krishna and Arjuna are."];
var OVT=[["కురుక్షేత్ర యుద్ధానికి ముందు రెండు సేనల మధ్య రథాన్ని నిలపమని అర్జునుడు కోరతాడు. ఎదురుగా తాతలు, గురువులు, బంధువులను చూసి శరీరం వణికి, నోరు ఎండి, గాండీవం జారిపోతుంది. యుద్ధం చేయనని రథంపై కూలబడతాడు.", "మొదటి శ్లోకంలో ధృతరాష్ట్రుని ప్రశ్న (1.1), 1.28–30లో అర్జునుని శారీరక స్థితి, 1.47లో ధనుస్సు విడవడం. ఈ అధ్యాయంలో కృష్ణుడు దాదాపు మాట్లాడడు; ఉపదేశం రెండో అధ్యాయం నుంచే మొదలవుతుంది.", "కష్టమైన నిర్ణయం ముందు మనసు చలించడం సహజం. ఆ గందరగోళాన్ని దాచుకోకుండా, తెలిసినవారి సలహా కోరడమే మొదటి అడుగని ఈ అధ్యాయం చెబుతుంది."], ["అర్జునుడు శిష్యుడిగా శరణు వేడగా (2.7) కృష్ణుడు ఉపదేశం ప్రారంభిస్తాడు. ఆత్మకు పుట్టుక, చావు లేవని, పాత బట్టలు విడిచినట్లు ఆత్మ శరీరాన్ని మారుస్తుందని చెబుతాడు. స్వధర్మం, కర్మయోగం, స్థితప్రజ్ఞుని లక్షణాలతో అధ్యాయం ముగుస్తుంది.", "2.20 (ఆత్మ నిత్యత), 2.22 (వస్త్ర ఉపమానం), 2.47 (కర్మణ్యేవాధికారస్తే — గీతలో అత్యంత ప్రసిద్ధ శ్లోకం), 2.54–72 (స్థితప్రజ్ఞుడు). ఇది అతి పెద్ద అధ్యాయాల్లో ఒకటి, 72 శ్లోకాలు.", "పరీక్షలో ఫలితం, వ్యాపారంలో లాభనష్టాలు మన చేతిలో ఉండవు; ప్రయత్నం మాత్రమే మనది. ఇలా ఆలోచిస్తే ఒత్తిడి తగ్గి, సుఖదుఃఖాల్లో సమతుల్యత వస్తుంది."], ["జ్ఞానమే గొప్పదైతే నన్ను యుద్ధంలోకి ఎందుకు నెడుతున్నావని అర్జునుడు అడుగుతాడు. ప్రకృతి గుణాల వల్ల ఎవరూ క్షణం కూడా పని మానలేరని, స్వార్థం లేకుండా యజ్ఞభావంతో చేసే పని బంధం కలిగించదని కృష్ణుడు చెబుతాడు. మనిషిని పాపం వైపు నెట్టేది కామక్రోధాలే.", "3.35 (స్వధర్మమే శ్రేయస్కరం), 3.21 (గొప్పవారు ఆచరించిందే లోకం అనుసరిస్తుంది), 3.37 (కామక్రోధాలే శత్రువులు). ఇక్కడ 'యజ్ఞం' అంటే పరస్పర సహకారం, సేవ అనే విస్తృత అర్థం కూడా ఉంది.", "ఇంట్లో, ఆఫీసులో పనిని బాధ్యతగా చేయడం, పిల్లలకు మాటల కన్నా మన ప్రవర్తనతో నేర్పడం, కోపాన్ని అదుపులో ఉంచుకోవడం — ఇవే ఈ అధ్యాయం పాఠాలు."], ["ఈ యోగం మొదట సూర్యునికి, తర్వాత పరంపరగా రాజర్షులకు చేరిందని కృష్ణుడు చెబుతాడు. ధర్మం క్షీణించినప్పుడు తాను అవతరిస్తానని ప్రకటిస్తాడు. ద్రవ్యయజ్ఞం, జ్ఞానయజ్ఞం వంటి అనేక యజ్ఞాలను వివరించి, గురువును సేవించి జ్ఞానం పొందమంటాడు.", "4.7–8 (ధర్మ సంస్థాపన కోసం అవతారం), 4.18 (కర్మలో అకర్మను, అకర్మలో కర్మను చూడగలగడం), 4.34 (గురువును ప్రశ్నించి, సేవించి నేర్చుకో), 4.38 (జ్ఞానంతో సమానమైన పవిత్రమైనది లేదు).", "పని చేస్తూనే నేర్చుకుంటూ ఉండాలి; తెలుసుకున్నది ఆచరణలో పెట్టినప్పుడే దానికి విలువ. అనవసర సందేహాలు వదిలి శ్రద్ధగా నేర్చుకునేవారికి మనశ్శాంతి దొరుకుతుంది."], ["కర్మ త్యాగం గొప్పదా, కర్మయోగం గొప్పదా అని అర్జునుడు అడుగుతాడు. రెండూ మోక్షమిస్తాయి, కానీ కర్మయోగం సులభమని కృష్ణుడు చెబుతాడు. ఫలాపేక్ష లేకుండా పని చేసేవాడు నీటిలో ఉన్నా తడవని తామరాకులా ఉంటాడని, అతనికి శాశ్వత శాంతి లభిస్తుందని వివరిస్తాడు.", "5.10 (తామరాకు ఉపమానం), 5.18 (జ్ఞాని బ్రాహ్మణుడిని, ఆవును, ఏనుగును, కుక్కను సమంగా చూస్తాడు), 5.29 (భగవంతుడు సకల ప్రాణులకు మిత్రుడని తెలిసినవాడు శాంతి పొందుతాడు). 29 శ్లోకాల చిన్న అధ్యాయం.", "సంసారంలో ఉంటూనే బంధాలకు, లాభనష్టాలకు అతిగా అంటుకోకుండా ఉండటం నేర్చుకుంటే, అందరినీ సమానంగా చూసే ప్రశాంతమైన మనసు అలవడుతుంది."], ["ధ్యానానికి తగిన ప్రదేశం, ఆసనం, శరీర స్థితిని కృష్ణుడు వివరిస్తాడు. అతిగా తినడం, అసలు తినకపోవడం, అతి నిద్ర, నిద్రలేమి యోగానికి అడ్డమని చెబుతాడు. మనసు గాలిలా చంచలమని అర్జునుడు అంటే, అభ్యాసం, వైరాగ్యంతో అదుపు చేయవచ్చంటాడు; యోగం మధ్యలో ఆగినవాడు నశించడని అభయమిస్తాడు.", "6.5 (నిన్ను నువ్వే ఉద్ధరించుకో), 6.17 (మితాహార-విహారాలు), 6.35 (అభ్యాస వైరాగ్యాలు), 6.40 (మంచి చేసినవాడికి ఎన్నడూ దుర్గతి ఉండదు), 6.47 (యోగులందరిలో భక్తుడే శ్రేష్ఠుడు).", "రోజూ కొద్ది నిమిషాలు ప్రశాంతంగా కూర్చోవడం, తిండి-నిద్ర-పనిలో అతి లేకుండా మితం పాటించడం ఆరోగ్యానికి, ఏకాగ్రతకు తోడ్పడతాయి. తడబడినా మళ్ళీ ప్రయత్నించవచ్చనే భరోసా కూడా ఇందులో ఉంది."], ["ఇక్కడి నుంచి భక్తి, జ్ఞానాల వివరణ మొదలవుతుంది. భగవంతుని ఎనిమిది రకాల అపరా ప్రకృతిని, జీవరూపమైన పరా ప్రకృతిని చెబుతాడు; దారంలో మణుల్లా సమస్తం ఆయనలో గ్రుచ్చబడి ఉందంటాడు. త్రిగుణమయమైన మాయను దాటడం కష్టం, కానీ శరణు పొందినవారు దాటుతారని చెబుతాడు.", "7.3 (వేలమందిలో ఒక్కడే ప్రయత్నిస్తాడు), 7.14 (మాయను దాటే మార్గం శరణాగతి), 7.16 (నాలుగు రకాల భక్తులు), 7.19 (అనేక జన్మల తర్వాత 'వాసుదేవుడే సర్వం' అని తెలుసుకుంటాడు).", "ఆపదలో దేవుణ్ణి తలచుకోవడం తప్పు కాదు; కానీ తెలుసుకోవాలనే తపనతో, కృతజ్ఞతతో స్మరించడం మనసును మరింత దృఢంగా, స్థిరంగా ఉంచుతుంది."], ["బ్రహ్మం, అధ్యాత్మం, కర్మ వంటి ఏడు ప్రశ్నలను అర్జునుడు అడుగుతాడు; కృష్ణుడు ఒక్కొక్కటిగా సమాధానమిస్తాడు. మరణ సమయంలో ఏ భావంతో శరీరం విడుస్తామో ఆ గతి పొందుతామని, అందుకే ఎల్లప్పుడూ స్మరణ అవసరమని చెబుతాడు. ఓంకారం, ఉత్తరాయణ-దక్షిణాయన మార్గాలను వివరిస్తాడు.", "8.5–6 (అంత్యకాల స్మరణ), 8.7 (ఎల్లప్పుడూ నన్ను స్మరించు, యుద్ధం కూడా చేయి), 8.13 (ఓం అనే ఏకాక్షరం), 8.16 (బ్రహ్మలోకం వరకు పునర్జన్మ ఉంది; భగవంతుని చేరినవారికి లేదు).", "మనం ఎక్కువగా ఏమి ఆలోచిస్తామో అదే మన స్వభావమవుతుంది. అందుకే రోజువారీ పనుల మధ్య కూడా మంచి ఆలోచనను, భగవన్నామాన్ని అలవాటు చేసుకోవాలి."], ["కృష్ణుడు అత్యంత రహస్యమైన జ్ఞానాన్ని చెబుతాడు. సృష్టి ఆయన నుంచి పుట్టి ఆయనలోనే లయమవుతుంది; ఆయన అందరిలో ఉన్నా దేనికీ అంటడు. అనన్యభక్తుల యోగక్షేమాలను తానే చూసుకుంటానని, భక్తితో ఇచ్చిన ఆకు, పువ్వు, పండు, నీటిని స్వీకరిస్తానని, పాపులు శరణు వేడినా ఉద్ధరిస్తానని వాగ్దానం చేస్తాడు.", "9.22 (యోగక్షేమం వహామ్యహమ్), 9.26 (పత్రం పుష్పం ఫలం తోయం), 9.27 (నువ్వు చేసేదంతా నాకు అర్పించు), 9.30–31 (దురాచారుడు కూడా సాధువవుతాడు), 9.34 (మన్మనా భవ మద్భక్తః).", "భక్తికి ఖరీదైన పూజలు అక్కర్లేదు; స్వచ్ఛమైన మనసే చాలు. తప్పు చేసినవారు కూడా మారడానికి ఎప్పుడూ అవకాశం ఉందనే ఆశను ఇది ఇస్తుంది."], ["అర్జునుడు ఆయన విభూతులను చెప్పమని కోరతాడు. నేనే అందరి ఆత్మను, ఆదిమధ్యాంతాలను అని ప్రారంభించి, ఆదిత్యులలో విష్ణువు, నక్షత్రాలలో చంద్రుడు, నదులలో గంగ, వేదాలలో సామవేదం, ఇంద్రియాలలో మనస్సు వంటి శ్రేష్ఠమైనవన్నీ తానేనని చెబుతాడు. చివరకు ఒక్క అంశతో ఈ జగత్తును నిలుపుతున్నానంటాడు.", "10.8 (నేనే సర్వానికి మూలం), 10.20 (అందరి హృదయంలోని ఆత్మను నేనే), 10.41 (గొప్పతనం, శక్తి ఉన్నదంతా నా తేజస్సులో అంశం), 10.42 (ఒక్క అంశతో జగత్తును నిలుపుతున్నాను).", "చుట్టూ ఉన్న ప్రకృతిలో, మనుషుల ప్రతిభలో, మంచితనంలో గొప్పతనాన్ని గుర్తించడం నేర్చుకుంటే అసూయ తగ్గి, కృతజ్ఞత, వినయం పెరుగుతాయి."], ["అర్జునుడు విశ్వరూపం చూపమని కోరగా, కృష్ణుడు దివ్యదృష్టి ఇస్తాడు. వేల సూర్యుల తేజస్సు, అనేక ముఖాలు, భీష్మద్రోణాదులు ఆయన నోళ్లలోకి ప్రవేశించడం చూసి అర్జునుడు వణికిపోతాడు. 'నేనే లోకాలను నాశనం చేసే కాలాన్ని' అని కృష్ణుడు చెప్పి, నిమిత్తమాత్రుడవై యుద్ధం చేయమంటాడు.", "11.12 (ఆకాశంలో వేల సూర్యులు ఒకేసారి ఉదయిస్తే), 11.32 (కాలోఽస్మి), 11.33 (నిమిత్తమాత్రం భవ సవ్యసాచిన్), 11.54 (అనన్యభక్తితోనే ఈ రూపాన్ని చూడగలం), 11.55 (నా కోసం కర్మ చేసేవాడు నన్ను చేరతాడు).", "మన జీవితం, మన సమస్యలు ఎంతో విశాలమైన సృష్టిలో చిన్న భాగమని గుర్తిస్తే అహంకారం తగ్గుతుంది; కాలం విలువ తెలిసి ఉన్న సమయాన్ని సద్వినియోగం చేసుకుంటాం."], ["సగుణ భగవంతుని భక్తులు గొప్పవారా, నిర్గుణ బ్రహ్మను ధ్యానించేవారా అని అర్జునుడు అడుగుతాడు. నిరాకార ఉపాసన దేహధారులకు కష్టమని, సాకార భక్తి సులభమని కృష్ణుడు చెబుతాడు. అది కుదరకపోతే అభ్యాసం, జ్ఞానం, ధ్యానం, కర్మఫలత్యాగం క్రమంగా ఎంచుకోమని, తనకు ప్రియభక్తుని లక్షణాలను (12.13–19) వివరిస్తాడు.", "12.2 (సాకార భక్తి సులభం), 12.13 (అద్వేష్టా సర్వభూతానామ్ — ద్వేషం లేనివాడు, మైత్రి, కరుణ కలవాడు), 12.15 (లోకాన్ని బాధించనివాడు, లోకంతో బాధపడనివాడు). 20 శ్లోకాల చిన్న అధ్యాయం.", "ఎవరినీ ద్వేషించకుండా, దయతో, కృతజ్ఞతతో, ఉన్నదానితో తృప్తిగా ఉండటం — ఈ లక్షణాలు కుటుంబంలో, సమాజంలో సంబంధాలను మధురంగా మారుస్తాయి."], ["శరీరం క్షేత్రమని, దాన్ని తెలుసుకునేవాడు క్షేత్రజ్ఞుడని, అన్ని క్షేత్రాలలో క్షేత్రజ్ఞుడు తానేనని కృష్ణుడు చెబుతాడు. అమానిత్వం, అదంభిత్వం, అహింస, క్షమ, గురుసేవ వంటి అనేక లక్షణాలే జ్ఞానమని నిర్వచిస్తాడు. ప్రకృతి-పురుష తత్త్వాన్ని వివరిస్తాడు.", "13.1–2 (క్షేత్ర-క్షేత్రజ్ఞ నిర్వచనం), 13.7–11 (జ్ఞాన లక్షణాల జాబితా), 13.22 (శరీరంలోని పరమాత్మ సాక్షి, అనుమతించేవాడు), 13.28 (అన్నిటా సమంగా ఉన్న పరమేశ్వరుని చూసేవాడే నిజంగా చూసేవాడు).", "నేను శరీరాన్ని మాత్రమే కాదు, దాన్ని చూసే సాక్షిని అనే భావన అనారోగ్యం, వృద్ధాప్యం, నిందలు వంటి వాటిని ధైర్యంగా ఎదుర్కొనే శక్తినిస్తుంది."], ["ప్రకృతి నుంచి పుట్టిన సత్త్వ, రజస్సు, తమస్సు జీవుడిని బంధిస్తాయని కృష్ణుడు చెబుతాడు. సత్త్వం సుఖం, జ్ఞానంతో; రజస్సు ఆశ, చలనంతో; తమస్సు అజ్ఞానం, సోమరితనం, నిద్రతో బంధిస్తాయి. ఈ మూడింటినీ దాటినవాని లక్షణాలను, దాటే మార్గం భక్తి అని చెబుతాడు.", "14.5 (త్రిగుణాల పరిచయం), 14.6–8 (ప్రతి గుణం లక్షణం), 14.22–25 (గుణాతీతుని లక్షణాలు: పొగడ్త, నింద, మిత్రుడు, శత్రువు సమానం), 14.26 (అవ్యభిచార భక్తి).", "మనలోని సోమరితనం (తమస్సు), ఆరాటం (రజస్సు), ప్రశాంతత-జ్ఞానం (సత్త్వం) గుర్తించి, ఆహారం, సావాసం, అలవాట్ల ద్వారా సత్త్వాన్ని పెంచుకుంటే జీవితం తేలికవుతుంది."], ["మూలం పైన, కొమ్మలు కింద ఉండే రావిచెట్టులా సంసారాన్ని కృష్ణుడు వర్ణిస్తాడు; వేదాలు దాని ఆకులు. దాన్ని అసంగమనే ఖడ్గంతో ఛేదించి, శరణు పొందాల్సిన ఆదిపురుషుని వెతకాలంటాడు. జీవుడు ఆయన అంశమని, ఆయనే జఠరాగ్నిగా ఆహారాన్ని జీర్ణం చేస్తాడని, క్షర-అక్షరులకు అతీతుడైన పురుషోత్తముడు తానేనని ప్రకటిస్తాడు.", "15.1 (ఊర్ధ్వమూలమధఃశాఖం), 15.7 (జీవుడు నా అంశయే), 15.14 (జఠరాగ్ని రూపంలో నేనే), 15.15 (అందరి హృదయంలో ఉన్నాను), 15.16–18 (క్షర, అక్షర, పురుషోత్తమ).", "బాధ్యతగా జీవిస్తూనే వస్తువులు, పదవులపై అతి మమకారాన్ని తగ్గించుకుంటే ఆందోళనలు తగ్గుతాయి. అన్నీ మారిపోయేవేనని గుర్తుంచుకోవడం మనసుకు స్థిరత్వాన్నిస్తుంది."], ["దైవ సంపద వల్ల మోక్షం, ఆసురీ సంపద వల్ల బంధనం కలుగుతాయని కృష్ణుడు చెబుతాడు. అభయం, దానం, సత్యం, దయ వంటి దైవగుణాలను; దంభం, అహంకారం, క్రోధం వంటి ఆసురగుణాలను వివరిస్తాడు. 'ఇది ఈ రోజు సంపాదించాను, అది రేపు సంపాదిస్తాను' అనే ఆలోచన ఆసురుల లక్షణమని, కామక్రోధలోభాలు నరక ద్వారాలని హెచ్చరిస్తాడు.", "16.1–3 (దైవగుణాల జాబితా), 16.4 (ఆసురగుణాలు), 16.13–15 (అంతులేని సంపాదన, అహంకార ఆలోచనలు), 16.21 (నరకానికి మూడు ద్వారాలు), 16.24 (ఏది చేయాలో ఏది చేయకూడదో శాస్త్రమే ప్రమాణం).", "నిజాయితీ, దయ, క్షమ, నిగ్రహం వంటి మంచి గుణాలను పెంచుకుని, అత్యాశ, అహంకారం, కోపాన్ని అదుపులో ఉంచుకోవడం ఇంట్లో, వ్యాపారంలో శాంతిని నిలుపుతుంది."], ["శాస్త్రవిధి తెలియకపోయినా శ్రద్ధతో పూజించేవారి గతి ఏమిటని అర్జునుడు అడుగుతాడు. ప్రతి వ్యక్తి శ్రద్ధ అతని స్వభావాన్ని బట్టి సాత్త్విక, రాజస, తామస అని మూడు రకాలని కృష్ణుడు చెబుతాడు. ఆహారం, యజ్ఞం, తపస్సు (శరీర, వాక్, మానస తపస్సులు), దానానికి కూడా ఈ మూడు భేదాలను వివరించి, 'ఓం తత్ సత్' అర్థం చెబుతాడు.", "17.3 (మనిషి అతని శ్రద్ధ స్వరూపమే), 17.8–10 (మూడు రకాల ఆహారం), 17.15 (ఎదుటివారిని నొప్పించని, సత్యమైన, ప్రియమైన, హితమైన మాట వాక్ తపస్సు), 17.23 (ఓం తత్ సత్).", "తాజా, తేలికైన ఆహారం, ప్రతిఫలం ఆశించకుండా తగిన సమయంలో చేసే దానం, మంచి మాట, సేవ వంటి అలవాట్లు శరీరానికి, మనసుకు మేలు చేస్తాయి."], ["అతి పెద్ద అధ్యాయం (78 శ్లోకాలు) మొత్తం గీతను సంగ్రహిస్తుంది. సన్న్యాసం, త్యాగం తేడా; కర్మకు ఐదు కారణాలు; జ్ఞానం, కర్మ, కర్త, బుద్ధి, ధృతి, సుఖం మూడు గుణాల ప్రకారం; స్వభావానుసార కర్మలు వివరించబడతాయి. చివరగా 'అన్ని ధర్మాలను వదిలి నన్నే శరణు పొందు' అని అభయమిస్తాడు; అర్జునుని మోహం తొలగి 'నీ మాట చేస్తాను' అంటాడు; సంజయుడు ముగింపు పలుకుతాడు.", "18.46 (స్వకర్మతో భగవంతుని పూజించు), 18.47 (లోపం ఉన్నా స్వధర్మమే మేలు), 18.61 (ఈశ్వరుడు అందరి హృదయంలో ఉంటాడు), 18.66 (శరణాగతి శ్లోకం), 18.73 (అర్జునుని సంశయ నివృత్తి), 18.78 (కృష్ణార్జునులున్నచోట విజయం).", "మన స్వభావానికి, సామర్థ్యానికి తగిన పనిని నిజాయితీగా చేస్తూ, ఫలితాన్ని భగవంతునికి వదిలేస్తే భయం, పశ్చాత్తాపం తగ్గి, ఎలాంటి పరిస్థితినైనా నిలకడగా ఎదుర్కొనగలం."]];
