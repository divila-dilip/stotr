<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanuman Chalisa – Telugu / Hindi Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Telugu:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<style>
:root{--pri:#0B57D0;--bg:#F1F3F4;--paper:#FFFFFF;--tx:#1E1E1E;--tx2:#5E5E5E;--neu:#E8EAED;--err:#D32F2F;--div:#E0E0E0;--onpri:#fff;--hov:#0A47A6;--bd:#BDBDBD;--saf:#E65100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--pri:#8AB4F8;--bg:#1F1F1F;--paper:#2B2B2B;--tx:#FFFFFF;--tx2:#B0B0B0;--neu:#424242;--err:#FF6B6B;--div:#404040;--onpri:#1F1F1F;--hov:#7CA8E8;--bd:#424242;--saf:#FFB74D;color-scheme:dark}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--div)}
.home-link{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--neu);border:1px solid var(--div);color:var(--tx);text-decoration:none;font-weight:600;line-height:1}
.home-link:hover{background:var(--div)}
.home-link .icon{font-size:18px;line-height:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:6}
header h1{font-size:18px;font-weight:600;margin:0;line-height:1.3;flex:1;font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif}
button,input{font:500 14px Inter,sans-serif}
button{background:var(--pri);color:var(--onpri);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:hover{background:var(--hov)}
button:disabled{background:var(--neu);color:#BDBDBD;box-shadow:none;cursor:default}
button.sec{background:var(--neu);color:var(--tx)}
button.sec:hover{background:var(--div)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg{display:flex;background:var(--neu);border-radius:20px;padding:2px}
.seg button{background:none;color:var(--tx);box-shadow:none;padding:6px 14px;font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
#jump{width:84px;padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--paper);color:var(--tx)}
#jump:focus{border-color:var(--pri);outline:0}
#jump.bad{border-color:var(--err);color:var(--err)}
main{padding:16px 16px 24px;max-width:900px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.meta{color:var(--tx2);font-size:12px}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.chips span{color:var(--tx2);font-size:12px;margin-right:2px}
.chips button{background:var(--neu);color:var(--tx);box-shadow:none;border-radius:16px;padding:4px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
.card{background:var(--paper);border:1px solid var(--div);border-radius:12px;padding:8px 24px}
.fnt{font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif}
.fnt.hi{font-family:"Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif}
.sect{margin:20px 0 4px;text-align:center;font-size:15px;font-weight:600;color:var(--pri)}
.st{padding:16px 0;border-bottom:1px solid var(--div);text-align:center;scroll-margin-top:72px}
.st:last-child{border-bottom:0}
.no{display:inline-block;background:var(--neu);color:var(--tx2);border-radius:12px;padding:2px 12px;font:600 12px Inter,sans-serif;margin-bottom:6px}
.sl{margin:0;font-size:clamp(18px,4.6vw,23px);line-height:1.95;font-weight:400;overflow-wrap:anywhere}
.st.flash{animation:fl 1.8s}@keyframes fl{0%,60%{background:var(--neu)}100%{background:transparent}}
body.saf .sl{color:var(--saf)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.ctl button{min-width:110px}
#pos{text-align:center}
@media(max-width:1024px){.ctl{position:fixed;left:0;right:0;bottom:0;z-index:4;margin:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--div)}main{padding-bottom:88px}}
@media(max-width:600px){header{gap:4px;padding:8px}header h1{display:none}header button{padding:6px 9px}.seg button{padding:6px 8px}#jump{width:48px;padding:6px}.card{padding:4px 12px}}
html{overflow-x:hidden}.sl,.mn{word-break:break-word;max-width:100%}
@media(prefers-reduced-motion:reduce){.st.flash{animation:none}}
/* v2.2 realistic page turn */
#stage{position:relative;perspective:2400px;perspective-origin:50% 40%}
#slide{box-shadow:1px 1px 0 var(--paper),2px 2px 0 var(--div),3px 3px 0 var(--paper),4px 4px 0 var(--div),6px 8px 14px rgba(0,0,0,.12)}
.leaf{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none;z-index:3}
.strip{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{transform:rotateY(180deg);background:var(--paper) linear-gradient(90deg,rgba(0,0,0,.05),transparent 40%)}
.pg{position:absolute;top:0;margin:0}
.ghost{background:transparent;border-color:transparent;opacity:.08}
.sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.spine::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 16px);pointer-events:none}
.cast{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:2}
main{touch-action:pan-y}
#ft{margin:32px 0 8px;text-align:center;color:var(--tx2);font-size:12px}#ft b{color:var(--tx)}#ft button{margin-top:8px}
.inf{background:none;color:var(--pri);box-shadow:none;padding:0 4px;margin-left:4px;font-size:17px;line-height:1;border-radius:50%;vertical-align:middle}.inf:hover{background:var(--neu)}
.mn{display:none;margin:6px auto 0;max-width:62ch;font-size:15px;line-height:1.85;color:var(--tx2)}.st.open .mn{display:block}
.chips .mb{margin-left:8px}
</style>
</head>

<header>
 <a class="home-link" href="index.html" aria-label="Go to home page"><span class="icon" aria-hidden="true">🏠</span><span>Home</span></a>
 <h1 id="ttl"></h1>
 <div class="seg" role="group" aria-label="Language"><button id="lte" aria-pressed="true">తెలుగు</button><button id="lhi" aria-pressed="false">हिन्दी</button></div>

 <button id="go">Go</button>

</header>
<main>
 <div class="bar"><span class="meta" id="info"></span><div class="chips" id="pp" role="group" aria-label="Stanzas per page"></div></div>

<footer id="ft"><div>Prepared by: <b>Dilip Raju Divila</b></div><button id="fb" class="sec">✎ Report a mistake / Suggest</button></footer>
</main>

function dragSndEnd(){if(!DV||!AC)return;var v=DV,t=AC.currentTime;DV=null;v.g.gain.cancelScheduledValues(t);v.g.gain.setTargetAtTime(0,t,.04);v.s.stop(t+.3)}

var TA=null,RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function endTurn(){if(!TA)return;var a=TA;TA=null;cancelAnimationFrame(a.raf);a.leaf.remove();a.cast.remove();$("slide").innerHTML=a.fin;if(a.go)go(a.go[0])}
function mkLeaf(front,W,H){
 var st=$("stage"),n=14,sw=W/n,leaf=document.createElement("div"),cast=document.createElement("div"),S=[],SH=[],par=leaf,R=Math.PI/180;
 leaf.className="leaf";leaf.style.width=W+"px";leaf.style.height=H+"px";
 leaf.setAttribute("inert","");leaf.setAttribute("aria-hidden","true");cast.className="cast";
 for(var i=0;i<n;i++){
  var s=document.createElement("div"),pos='left:'+(-i*sw)+'px;width:'+W+'px;height:'+H+'px';
  s.className="strip";s.style.cssText="left:"+(i?sw:0)+"px;width:"+(sw+.7)+"px;height:"+H+"px";
  s.innerHTML='<div class="face fr'+(i?'':' spine')+'"><div class="card pg '+FC()+'" style="'+pos+'">'+front+'</div><i class="sh"></i></div><div class="face bk"><div class="card pg ghost '+FC()+'" style="'+pos+'">'+front+'</div><i class="sh"></i></div>';
  par.appendChild(s);par=s;S.push(s);SH.push(s.querySelectorAll(".sh"))
 }
 st.appendChild(cast);st.appendChild(leaf);TA={raf:0,leaf:leaf,cast:cast,fin:""};
 return function(p){
  var m=p*180,bend=1.3*Math.sin(2*Math.PI*p),cum=0;
  for(var i=0;i<n;i++){
   var ang=m/n+(i?bend:0);cum+=ang;S[i].style.transform="rotateY("+(-ang)+"deg)";
   var sh=.42*Math.pow(Math.abs(Math.sin(cum*R)),1.1);SH[i][0].style.opacity=sh;SH[i][1].style.opacity=sh
  }
  var px=W*Math.max(0,Math.cos(cum*R)),a=.3*Math.sin(Math.PI*p);
  cast.style.background="linear-gradient(90deg,rgba(0,0,0,"+a+") "+px+"px,rgba(0,0,0,0) "+(px+W*.4)+"px)";
  leaf.style.opacity=p>.7?Math.max(0,1-(p-.7)/.3):1
 }
}
function runTo(set,from,to,dur,done){var T=performance.now();
 function f(now){var t=Math.min(1,(now-T)/dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;set(from+(to-from)*e);if(t<1)TA.raf=requestAnimationFrame(f);else done()}
 TA.raf=requestAnimationFrame(f)}
function setup(oldH,newH,dir){ // returns {set,W}
 var sl=$("slide"),next=dir=="next",W=sl.offsetWidth,H,front;
 if(next){H=sl.offsetHeight;front=oldH;sl.innerHTML=newH}
 else{sl.innerHTML=newH;H=sl.offsetHeight;front=newH;sl.innerHTML=oldH}
 return{set:mkLeaf(front,W,H),W:W}}
function turnPage(h,dir){
 var sl=$("slide");endTurn();var oldH=sl.innerHTML;
 if(!dir||RM||!oldH){sl.innerHTML=h;return}
 var next=dir=="next",set=setup(oldH,h,dir).set;TA.fin=h;set(next?0:1);rustle(1,.5);
 runTo(set,next?0:1,next?1:0,1000,function(){slap(.6);endTurn()})
}


function FC(){return "fnt"+(L=="hi"?" hi":"")}
function pageHTML(p){var a=(p-1)*PP,b=Math.min(N,p*PP),h="",i,v;
 for(i=a;i<b;i++){v=RAW[i];if(HD[i])h+='<h2 class="sect">'+esc(T(HD[i]))+'</h2>';
  h+='<section class="st'+(SHOWM?' open':'')+'" data-i="'+i+'"><span class="no">'+esc(lab(v.k))+'</span><button class="inf" aria-expanded="'+SHOWM+'" aria-label="Meaning" title="Meaning">ⓘ</button><p class="sl">'+esc(T(v.a))+'<br>'+esc(T(v.b))+'</p><p class="mn">'+esc((L=="hi"?MH:MT)[i])+'</p></section>'}
 return h}
function render(focus,dir){var a=(c-1)*PP,b=Math.min(N,c*PP),s=$("slide");
 s.className="card fnt"+(L=="hi"?" hi":"");s.lang=L;document.documentElement.lang=L;
 turnPage(pageHTML(c),dir);$("ttl").textContent=L=="te"?"శ్రీ హనుమాన్ చాలీసా":TT;
 $("info").textContent="Verses "+(a+1)+"–"+b+" of "+N+" · "+(b-a)*2+" lines";
 $("pos").textContent="Page "+c+" / "+pages();
 $("prev").disabled=c<=1;$("next").disabled=c>=pages();
 $("lte").setAttribute("aria-pressed",L=="te");$("lhi").setAttribute("aria-pressed",L=="hi");
 $("pp").innerHTML="<span>Per page</span>"+PPS.map(function(n){return '<button data-n="'+n+'" aria-pressed="'+(n==PP)+'">'+(n==N?"All":n)+'</button>'}).join("")+'<button class="mb" data-m="1" aria-pressed="'+SHOWM+'">ⓘ Meanings</button>';
 try{localStorage.setItem("hc-pos",a)}catch(e){}
 var el=focus!=null&&s.querySelector('[data-i="'+focus+'"]');
 if(el){el.classList.add("flash");el.scrollIntoView({block:"start"})}else scrollTo(0,0)}
function go(n,dir){if(n>=1&&n<=pages()){c=n;render(null,dir)}}
function setLang(l){L=l;try{localStorage.setItem("hc-lang",l)}catch(e){}var y=scrollY;render();scrollTo(0,y)}
$("lte").onclick=function(){setLang("te")};$("lhi").onclick=function(){setLang("hi")};
$("next").onclick=function(){go(c+1,"next")};$("prev").onclick=function(){go(c-1,"prev")};
$("pp").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.m){SHOWM=!SHOWM;try{localStorage.setItem("hc-showm",SHOWM?"1":"0")}catch(x){}var y=scrollY;render();scrollTo(0,y);return}var first=(c-1)*PP;PP=+b.dataset.n;c=Math.floor(first/PP)+1;try{localStorage.setItem("hc-pp",PP)}catch(x){}render()};
function jump(){var k=+$("jump").value,ok=/^\s*\d{1,2}\s*$/.test($("jump").value)&&k>=1&&k<=40;$("jump").className=ok?"":"bad";
 if(ok){var i=k+1;c=Math.floor(i/PP)+1;render(i);$("jump").blur()}}
$("go").onclick=jump;$("jump").onkeydown=function(e){if(e.key=="Enter")jump()};
document.onkeydown=function(e){if(e.target.tagName=="INPUT")return;if(e.key=="ArrowRight")go(c+1,"next");if(e.key=="ArrowLeft")go(c-1,"prev")};
var mn=document.querySelector("main"),G=null;
mn.addEventListener("touchstart",function(e){if(e.touches.length>1||e.target.closest(".ctl"))return;endTurn();var t=e.touches[0];G={x:t.clientX,y:t.clientY,t:performance.now()}},{passive:true});
mn.addEventListener("touchmove",function(e){if(!G)return;var t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y,now=performance.now();
 if(!G.set){
  if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.3){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx))G=null;return}
  if(RM)return;
  var dir=dx<0?"next":"prev",nb=nbr(dir);if(!nb){G=null;return}
  var fin=pageHTML(nb[0]),old=$("slide").innerHTML,L=setup(old,fin,dir);
  TA.fin=old;G.set=L.set;G.dir=dir;G.nb=nb;G.fin=fin;G.old=old;G.W=L.W;G.sx=t.clientX;G.lp=dir=="next"?0:1;G.lq=0;G.v=0;G.lt=now;G.q=0;G.set(G.lp);ac()
 }
 var span=Math.min(G.W*.85,420),d=t.clientX-G.sx,q=Math.max(0,Math.min(1,(G.dir=="next"?-d:d)/span)),p=G.dir=="next"?q:1-q,dt=Math.max(1,now-G.lt);
 G.v=.6*G.v+.4*(q-G.lq)/dt;dragSnd(Math.min(.3,Math.abs(p-G.lp)/dt*75));
 G.q=q;G.lq=q;G.lp=p;G.lt=now;G.set(p)
},{passive:true});
mn.addEventListener("touchend",function(e){var g=G;G=null;if(!g)return;
 if(!g.set){if(RM){var t=e.changedTouches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():prev()}}return}
 dragSndEnd();
 var nx=g.dir=="next",commit=g.q>.4||(g.v>.0012&&g.q>.08),p=nx?g.q:1-g.q,tp=commit?(nx?1:0):(nx?0:1),dur=150+700*Math.abs(tp-p);
 if(commit){TA.fin=g.fin;TA.go=g.nb;rustle(dur/1000,.4)}
 runTo(g.set,p,tp,dur,function(){slap(commit?.6:.2);endTurn()})
},{passive:true});
mn.addEventListener("touchcancel",function(){var g=G;G=null;if(g&&g.set){dragSndEnd();endTurn()}},{passive:true});
function sndUI(){var b=$("snd");b.textContent=SND?"🔊":"🔇";b.setAttribute("aria-pressed",SND)}
$("snd").onclick=function(){SND=!SND;try{localStorage.setItem("widu-snd",SND?"1":"0")}catch(e){}sndUI();if(SND)rustle(.5,.4);else dragSndEnd()};sndUI();

$("slide").addEventListener("click",function(e){var b=e.target.closest(".inf");if(b){var o=b.closest(".st").classList.toggle("open");b.setAttribute("aria-expanded",o)}});
$("saf").onclick=function(){saf=!saf;document.body.classList.toggle("saf",saf);this.setAttribute("aria-pressed",saf)};
function setTheme(m){document.documentElement.setAttribute("data-theme",m)}
var mode;try{mode=localStorage.getItem("widu-theme-mode")}catch(e){}
setTheme(mode||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=function(){var n=document.documentElement.getAttribute("data-theme")=="light"?"dark":"light";setTheme(n);try{localStorage.setItem("widu-theme-mode",n)}catch(e){}};
try{var r=+localStorage.getItem("hc-pos");if(r>0&&r<N)c=Math.floor(r/PP)+1}catch(e){}
var FEEDBACK_URL="https://forms.gle/q34LuE2QsMxpFwww8";   // Google Form link (the one ending in /viewform)
var FB_FIELD="";       // optional: the form's verse field id, like entry.123456789 (auto-fills the verse number)
$("fb").onclick=function(){if(!FEEDBACK_URL){alert("Feedback link is not set yet.");return}var u=FEEDBACK_URL;if(FB_FIELD)u+=(u.indexOf("?")>0?"&":"?")+"usp=pp_url&"+FB_FIELD+"="+encodeURIComponent(RAW[(c-1)*PP].k);window.open(u,"_blank","noopener")};
render();
</script>
