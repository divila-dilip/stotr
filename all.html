<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>స్తోత్ర నిధి</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Telugu:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<style>
:root{--pri:#0B57D0;--bg:#F1F3F4;--paper:#fff;--tx:#1E1E1E;--tx2:#5E5E5E;--neu:#E8EAED;--div:#E0E0E0;--onpri:#fff;--hov:#0A47A6;--bd:#BDBDBD;--saf:#E65100;color-scheme:light}
:root[data-theme="dark"]{--pri:#8AB4F8;--bg:#1F1F1F;--paper:#2B2B2B;--tx:#fff;--tx2:#B0B0B0;--neu:#424242;--div:#404040;--onpri:#1F1F1F;--hov:#7CA8E8;--bd:#424242;--saf:#FFB74D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.serif{font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif}
:lang(hi) .serif{font-family:"Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif}
button,input{font:500 14px Inter,"Noto Serif Telugu","Noto Serif Devanagari",sans-serif}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:56px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--div)}
.home-link{order:-2;flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--pri);border:1px solid var(--pri);color:var(--onpri);text-decoration:none;font-weight:600;line-height:1;white-space:nowrap}
.home-link:hover{background:var(--hov)}
.home-link .icon{font-size:18px;line-height:1}
header h1{order:-1;flex:1 1 0;min-width:0;margin:0;font-size:18px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:var(--pri);color:var(--onpri);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:hover{background:var(--hov)}
button.sec{background:var(--neu);color:var(--tx)}
button.sec:hover{background:var(--div)}
#theme{order:99;flex:none}
.seg{display:flex;background:var(--neu);border-radius:20px;padding:2px}
.seg button{background:none;color:var(--tx);box-shadow:none;border:0;border-radius:18px;padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;height:48px;padding:0 20px 0 50px;border:2px solid var(--bd);border-radius:30px;background:var(--paper);color:var(--tx);font-size:16px}
.search input:focus{border-color:var(--pri);outline:0}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--tx2);fill:none;stroke-width:2;stroke-linecap:round}
.count{color:var(--tx2);font-size:13px;margin:0 0 12px}
details{background:var(--paper);border:1px solid var(--div);border-radius:12px;margin-bottom:12px;overflow:hidden}
summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--tx2);border-bottom:2px solid var(--tx2);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details[open]>summary::before{transform:rotate(45deg)}
summary h2{margin:0;font-size:17px;font-weight:600;flex:1;line-height:1.4}
summary .n{background:var(--neu);border-radius:12px;padding:2px 10px;font-size:12px;color:var(--tx2)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--div)}
li+li{border-top:1px solid var(--div)}
li a{display:flex;align-items:center;gap:14px;padding:12px 16px;color:var(--tx);text-decoration:none}
li a:hover{background:var(--neu)}
.badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--neu);color:var(--saf);display:grid;place-items:center;font-size:19px;font-weight:600}
li a:hover .badge{background:var(--paper)}
.name{min-width:0;display:flex;flex-direction:column}
.name b{font-size:16px;font-weight:600;line-height:1.4}
.name small{color:var(--tx2);font-size:12px}
.msg{color:var(--tx2);text-align:center;padding:32px 0}
.hide{display:none!important}
@media(max-width:600px){header{padding:8px;gap:4px}.home-link{padding:8px 10px}.home-link span:last-child{display:none}.seg button{padding:6px 10px}.tools .sec{flex:1}}
@media(prefers-reduced-motion:reduce){summary::before{transition:none}}
</style>
</head>
<body>
<header>
  <a class="home-link" href="index.html"><span class="icon" aria-hidden="true">🏠</span><span id="homeLbl">Home</span></a>
  <h1 class="serif" id="brand"></h1>
  <div class="seg serif" role="group" aria-label="Language">
    <button data-l="te">తె</button><button data-l="hi">हि</button><button data-l="en">EN</button>
  </div>
  <button id="theme" class="sec" aria-label="Toggle theme">◐</button>
</header>
<main>
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    </div>
    <button id="exp" class="sec"></button>
    <button id="col" class="sec"></button>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="groups"></div>
  <p class="msg hide" id="none"></p>
</main>
<script>
var UI={
 te:{brand:"అన్నీ చూడండి",home:"Home",ph:"గ్రంథం పేరు వెతకండి…",none:"ఏమీ దొరకలేదు. వేరే పేరుతో ప్రయత్నించండి.",exp:"అన్నీ తెరువు",col:"అన్నీ మూసివేయి",cnt:"గ్రంథాలు",err:"items.json లోడ్ కాలేదు. వెబ్ సర్వర్ నుండి తెరవండి.",other:"ఇతరాలు"},
 hi:{brand:"सभी देखें",home:"Home",ph:"ग्रंथ का नाम खोजें…",none:"कुछ नहीं मिला। दूसरा नाम आज़माएँ।",exp:"सभी खोलें",col:"सभी बंद करें",cnt:"ग्रंथ",err:"items.json लोड नहीं हुआ। वेब सर्वर से खोलें।",other:"अन्य"},
 en:{brand:"View All",home:"Home",ph:"Search a stotram or scripture…",none:"No match found. Try another name.",exp:"Expand all",col:"Collapse all",cnt:"items",err:"Could not load items.json. Open this page from a web server.",other:"Other"}
};
var L="te",CATS=[],ITEMS=[],closed={},loaded=false,$=function(i){return document.getElementById(i)},root=document.documentElement;
try{L=localStorage.getItem("widu-lang")||"te"}catch(e){}
if(!UI[L])L="te";

function norm(s){return (s||"").toLowerCase().replace(/\s+/g," ").trim()}
function hay(it){return norm(it.t.te+" "+it.t.hi+" "+it.t.en+" "+(it.k||""))}
function other(it){return L==="en"?it.t.te:it.t.en}

function render(){
  var u=UI[L],q=norm($("q").value),total=0;
  root.lang=L;document.title=u.brand;
  $("brand").textContent=u.brand;$("homeLbl").textContent=u.home;
  $("q").placeholder=u.ph;$("q").setAttribute("aria-label",u.ph);
  $("exp").textContent=u.exp;$("col").textContent=u.col;
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===L)});
  var g=$("groups");g.innerHTML="";
  if(!loaded){$("count").textContent="";return}

  // categories in JSON order; any unknown category id gets its own group at the end
  var cats=CATS.slice(),known={};
  CATS.forEach(function(c){known[c.id]=1});
  ITEMS.forEach(function(it){if(!known[it.cat]){known[it.cat]=1;cats.push({id:it.cat||"_",t:{te:u.other,hi:u.other,en:u.other}})}});

  cats.forEach(function(c){
    var list=ITEMS.filter(function(it){return (it.cat||"_")===c.id&&(!q||hay(it).indexOf(q)>=0||norm(c.t[L]).indexOf(q)>=0)});
    if(!list.length)return;
    total+=list.length;
    var d=document.createElement("details");
    d.open=q?true:!closed[c.id];
    d.dataset.id=c.id;
    d.innerHTML='<summary><h2 class="serif"></h2><span class="n"></span></summary><ul></ul>';
    d.querySelector("h2").textContent=c.t[L]||c.t.en;
    d.querySelector(".n").textContent=list.length;
    var ul=d.querySelector("ul");
    list.forEach(function(it){
      var li=document.createElement("li"),a=document.createElement("a");
      a.href=encodeURI(it.file);
      a.innerHTML='<span class="badge serif"></span><span class="name"><b class="serif"></b><small></small></span>';
      a.querySelector(".badge").textContent=it.g||"•";
      a.querySelector("b").textContent=it.t[L];
      a.querySelector("small").textContent=other(it);
      li.appendChild(a);ul.appendChild(li);
    });
    d.addEventListener("toggle",function(){if(!$("q").value.trim())closed[c.id]=!d.open});
    g.appendChild(d);
  });
  $("count").textContent=total+" "+u.cnt;
  $("none").textContent=u.none;$("none").classList.toggle("hide",total>0);
}
function setAll(open){
  CATS.forEach(function(c){closed[c.id]=!open});
  document.querySelectorAll("details").forEach(function(d){closed[d.dataset.id]=!open;d.open=open});
}
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem("widu-lang",L)}catch(e){}render()}});
$("q").oninput=render;
$("q").onkeydown=function(e){
  if(e.key==="Enter"){var a=document.querySelector("#groups a");if(a)location.href=a.href}
  if(e.key==="Escape"){this.value="";render()}
};
$("exp").onclick=function(){$("q").value="";render();setAll(true)};
$("col").onclick=function(){$("q").value="";render();setAll(false)};

function applyTheme(m){
  var d=m==="dark"||(m!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme",d?"dark":"light");
}
var TM="auto";try{TM=localStorage.getItem("widu-theme-mode")||"auto"}catch(e){}
applyTheme(TM);
$("theme").onclick=function(){
  TM=root.getAttribute("data-theme")==="dark"?"light":"dark";
  try{localStorage.setItem("widu-theme-mode",TM)}catch(e){}applyTheme(TM);
};
render();
fetch("items.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  CATS=d.categories||[];ITEMS=d.items||[];loaded=true;render();
}).catch(function(){render();$("none").textContent=UI[L].err;$("none").classList.remove("hide")});
</script>
</body>
</html>
