D["13.21"]={t:["కార్యకారణకర్తృత్వే హేతుః ప్రకృతిరుచ్యతే |","పురుషః సుఖదుఃఖానాం భోక్తృత్వే హేతురుచ్యతే ||"],mt:"కార్యకారణకర్తృత్వమునకు ప్రకృతి హేతువని చెప్పబడును; సుఖదుఃఖానుభవమునకు పురుషుడు హేతువని చెప్పబడును.",m:"Nature is said to be the cause of the agency of effect and cause; the person is said to be the cause of the experiencing of pleasure and pain.",w:"కార్యకారణకర్తృత్వే=in the agency of effect and cause; హేతుః=the cause; ప్రకృతిః=nature; ఉచ్యతే=is said; పురుషః=the person; సుఖదుఃఖానామ్=of pleasure and pain; భోక్తృత్వే=in the experiencing; హేతుః ఉచ్యతే=is said to be the cause"};
D["13.22"]={t:["పురుషః ప్రకృతిస్థో హి భుఙ్క్తే ప్రకృతిజాన్గుణాన్ |","కారణం గుణసఙ్గోఽస్య సదసద్యోనిజన్మసు ||"],mt:"ప్రకృతియందున్న పురుషుడు ప్రకృతిజన్యగుణములను అనుభవించును; సదసద్యోనులయందు జన్మించుటకు గుణసంగమే కారణము.",m:"The person, abiding in nature, experiences the gunas born of nature; attachment to the gunas is the cause of birth in good and evil wombs.",w:"పురుషః=the person; ప్రకృతిస్థః=abiding in nature; హి=indeed; భుఙ్క్తే=experiences; ప్రకృతిజాన్ గుణాన్=the gunas born of nature; కారణమ్=the cause; గుణసఙ్గః అస్య=his attachment to the gunas; సదసద్యోనిజన్మసు=in births in good and evil wombs"};
D["13.23"]={t:["ఉపద్రష్టానుమన్తా చ భర్తా భోక్తా మహేశ్వరః |","పరమాత్మేతి చాప్యుక్తో దేహేఽస్మిన్పురుషః పరః ||"],mt:"ఈ దేహమున ఉన్న పరమపురుషుడు ఉపద్రష్ట, అనుమంత, భర్త, భోక్త, మహేశ్వరుడు, పరమాత్మ అని చెప్పబడును.",m:"The Supreme Person in this body is called the witness, the permitter, the supporter, the enjoyer, the great Lord, and also the Supreme Self.",w:"ఉపద్రష్టా=the witness; అనుమన్తా చ=and the permitter; భర్తా=the supporter; భోక్తా=the enjoyer; మహేశ్వరః=the great Lord; పరమాత్మా ఇతి చ అపి ఉక్తః=and also called the Supreme Self; దేహే అస్మిన్=in this body; పురుషః పరః=the Supreme Person"};
D["13.24"]={t:["య ఏవం వేత్తి పురుషం ప్రకృతిం చ గుణైః సహ |","సర్వథా వర్తమానోఽపి న స భూయోఽభిజాయతే ||"],mt:"ఇట్లు పురుషుని, గుణములతో కూడిన ప్రకృతిని ఎరిగినవాడు ఎట్లు వర్తించినను మరల జన్మింపడు.",m:"One who thus knows the person and nature together with the gunas is not born again, however he may live.",w:"యః=who; ఏవమ్=thus; వేత్తి=knows; పురుషమ్=the person; ప్రకృతిమ్ చ=and nature; గుణైః సహ=together with the gunas; సర్వథా వర్తమానః అపి=in whatever way he lives; న సః భూయః అభిజాయతే=he is not born again"};


// Chapter 13 – shlokas 13.25 to 13.35 (completes chapter 13). Paste after your D object.
D["13.25"]={t:["ధ్యానేనాత్మని పశ్యన్తి కేచిదాత్మానమాత్మనా |","అన్యే సాఙ్ఖ్యేన యోగేన కర్మయోగేన చాపరే ||"],mt:"కొందరు ధ్యానముచే ఆత్మయందు ఆత్మను ఆత్మచే చూతురు; కొందరు సాంఖ్యయోగముచే, మరికొందరు కర్మయోగముచే.",m:"Some perceive the self in the self by the self through meditation; others through the yoga of knowledge, and still others through the yoga of action.",w:"ధ్యానేన=through meditation; ఆత్మని=in the self; పశ్యన్తి=perceive; కేచిత్=some; ఆత్మానమ్=the self; ఆత్మనా=by the self; అన్యే=others; సాఙ్ఖ్యేన యోగేన=through the yoga of knowledge; కర్మయోగేన=through the yoga of action; చ అపరే=and others"};
D["13.26"]={t:["అన్యే త్వేవమజానన్తః శ్రుత్వాన్యేభ్య ఉపాసతే |","తేఽపి చాతితరన్త్యేవ మృత్యుం శ్రుతిపరాయణాః ||"],mt:"మరికొందరు ఇట్లు తెలియక ఇతరులనుండి విని ఉపాసింతురు; శ్రవణపరాయణులైన వారును మృత్యువును దాటుదురు.",m:"Others, not knowing thus, worship having heard from others; those too, devoted to what they have heard, certainly cross beyond death.",w:"అన్యే తు=but others; ఏవమ్ అజానన్తః=not knowing thus; శ్రుత్వా=having heard; అన్యేభ్యః=from others; ఉపాసతే=worship; తే అపి చ=they also; అతితరన్తి ఏవ=certainly cross over; మృత్యుమ్=death; శ్రుతిపరాయణాః=devoted to what they have heard"};
D["13.27"]={t:["యావత్సఞ్జాయతే కిఞ్చిత్సత్త్వం స్థావరజఙ్గమమ్ |","క్షేత్రక్షేత్రజ్ఞసంయోగాత్తద్విద్ధి భరతర్షభ ||"],mt:"ఓ భరతశ్రేష్ఠా! స్థావరజంగమములలో ఏది పుట్టునో అది క్షేత్రక్షేత్రజ్ఞసంయోగమువలననే అని తెలిసికొనుము.",m:"Whatever being, moving or unmoving, comes into existence, know that it arises from the union of the field and the knower of the field, O best of the Bharatas.",w:"యావత్=whatever; సఞ్జాయతే=comes into existence; కిఞ్చిత్=any; సత్త్వమ్=being; స్థావరజఙ్గమమ్=unmoving or moving; క్షేత్రక్షేత్రజ్ఞసంయోగాత్=from the union of the field and its knower; తత్ విద్ధి=know that; భరతర్షభ=O best of the Bharatas"};
D["13.28"]={t:["సమం సర్వేషు భూతేషు తిష్ఠన్తం పరమేశ్వరమ్ |","వినశ్యత్స్వవినశ్యన్తం యః పశ్యతి స పశ్యతి ||"],mt:"సర్వభూతములయందు సమముగా నిలిచియున్న, నశించువాటియందు నశింపని పరమేశ్వరుని ఎవడు చూచునో వాడే నిజముగా చూచువాడు.",m:"One who sees the Supreme Lord abiding equally in all beings, imperishable among the perishing, truly sees.",w:"సమమ్=equally; సర్వేషు భూతేషు=in all beings; తిష్ఠన్తమ్=abiding; పరమేశ్వరమ్=the Supreme Lord; వినశ్యత్సు=among the perishing; అవినశ్యన్తమ్=imperishable; యః పశ్యతి=who sees; సః పశ్యతి=he truly sees"};
D["13.29"]={t:["సమం పశ్యన్హి సర్వత్ర సమవస్థితమీశ్వరమ్ |","న హినస్త్యాత్మనాత్మానం తతో యాతి పరాం గతిమ్ ||"],mt:"సర్వత్ర సమముగా నెలకొనియున్న ఈశ్వరుని సమముగా చూచువాడు ఆత్మచే ఆత్మను హింసింపడు; అందువలన పరమగతిని పొందును.",m:"Seeing the Lord equally present everywhere, one does not injure the self by the self, and therefore reaches the supreme goal.",w:"సమమ్ పశ్యన్=seeing equally; హి=indeed; సర్వత్ర=everywhere; సమవస్థితమ్=equally present; ఈశ్వరమ్=the Lord; న హినస్తి=does not injure; ఆత్మనా ఆత్మానమ్=the self by the self; తతః=therefore; యాతి=reaches; పరామ్ గతిమ్=the supreme goal"};
D["13.30"]={t:["ప్రకృత్యైవ చ కర్మాణి క్రియమాణాని సర్వశః |","యః పశ్యతి తథాత్మానమకర్తారం స పశ్యతి ||"],mt:"సర్వకర్మలు ప్రకృతిచేతనే చేయబడుచున్నవని, ఆత్మ అకర్త అని ఎవడు చూచునో వాడే నిజముగా చూచువాడు.",m:"One who sees that all actions are performed by nature alone, and that the self is a non-doer, truly sees.",w:"ప్రకృత్యా ఏవ చ=by nature alone; కర్మాణి=actions; క్రియమాణాని=are being performed; సర్వశః=in every way; యః పశ్యతి=who sees; తథా=and; ఆత్మానమ్=the self; అకర్తారమ్=as a non-doer; సః పశ్యతి=he sees"};
D["13.31"]={t:["యదా భూతపృథగ్భావమేకస్థమనుపశ్యతి |","తత ఏవ చ విస్తారం బ్రహ్మ సమ్పద్యతే తదా ||"],mt:"ఎప్పుడు భూతములయొక్క వేర్వేరు భావమును ఒకే చోట నిలిచినదిగా చూచునో, అక్కడినుండియే వ్యాపించినదిగా చూచునో అప్పుడు బ్రహ్మమును పొందును.",m:"When one sees the diversity of beings as resting in the one, and as spreading out from that alone, then one attains Brahman.",w:"యదా=when; భూతపృథగ్భావమ్=the diversity of beings; ఏకస్థమ్=resting in the one; అనుపశ్యతి=sees; తతః ఏవ చ=and from that alone; విస్తారమ్=the spreading out; బ్రహ్మ=Brahman; సమ్పద్యతే=one attains; తదా=then"};
D["13.32"]={t:["అనాదిత్వాన్నిర్గుణత్వాత్పరమాత్మాయమవ్యయః |","శరీరస్థోఽపి కౌన్తేయ న కరోతి న లిప్యతే ||"],mt:"ఓ కౌంతేయా! అనాదియు నిర్గుణమును అగుటచే ఈ అవ్యయుడైన పరమాత్మ శరీరమున ఉండియు చేయడు, అంటబడడు.",m:"Because it is beginningless and free of the gunas, this imperishable Supreme Self, though dwelling in the body, O son of Kunti, neither acts nor is tainted.",w:"అనాదిత్వాత్=because of being beginningless; నిర్గుణత్వాత్=because of being free of the gunas; పరమాత్మా అయమ్=this Supreme Self; అవ్యయః=imperishable; శరీరస్థః అపి=though dwelling in the body; కౌన్తేయ=O son of Kunti; న కరోతి=does not act; న లిప్యతే=is not tainted"};
D["13.33"]={t:["యథా సర్వగతం సౌక్ష్మ్యాదాకాశం నోపలిప్యతే |","సర్వత్రావస్థితో దేహే తథాత్మా నోపలిప్యతే ||"],mt:"సర్వత్ర వ్యాపించిన ఆకాశము సూక్ష్మత్వముచే అంటబడనట్లు, దేహమున సర్వత్ర ఉన్న ఆత్మ అంటబడదు.",m:"As all-pervading space is not tainted because of its subtlety, so the self, present everywhere in the body, is not tainted.",w:"యథా=as; సర్వగతమ్=all-pervading; సౌక్ష్మ్యాత్=because of subtlety; ఆకాశమ్=space; న ఉపలిప్యతే=is not tainted; సర్వత్ర అవస్థితః=present everywhere; దేహే=in the body; తథా=so; ఆత్మా=the self; న ఉపలిప్యతే=is not tainted"};
D["13.34"]={t:["యథా ప్రకాశయత్యేకః కృత్స్నం లోకమిమం రవిః |","క్షేత్రం క్షేత్రీ తథా కృత్స్నం ప్రకాశయతి భారత ||"],mt:"ఒక్క సూర్యుడు ఈ లోకమంతటిని ప్రకాశింపజేయునట్లు, ఓ భారతా! క్షేత్రి (ఆత్మ) క్షేత్రమునంతటిని ప్రకాశింపజేయును.",m:"As the one sun illumines this whole world, so the knower of the field illumines the entire field, O Bharata.",w:"యథా=as; ప్రకాశయతి=illumines; ఏకః=one; కృత్స్నమ్ లోకమ్ ఇమమ్=this whole world; రవిః=the sun; క్షేత్రమ్=the field; క్షేత్రీ=the knower of the field; తథా=so; కృత్స్నమ్=entire; ప్రకాశయతి=illumines; భారత=O Bharata"};
D["13.35"]={t:["క్షేత్రక్షేత్రజ్ఞయోరేవమన్తరం జ్ఞానచక్షుషా |","భూతప్రకృతిమోక్షం చ యే విదుర్యాన్తి తే పరమ్ ||"],mt:"ఇట్లు జ్ఞానచక్షువుచే క్షేత్రక్షేత్రజ్ఞుల భేదమును, భూతప్రకృతినుండి మోక్షమును ఎరిగినవారు పరమును పొందుదురు.",m:"Those who thus perceive with the eye of knowledge the difference between the field and the knower of the field, and the liberation of beings from nature, attain the Supreme.",w:"క్షేత్రక్షేత్రజ్ఞయోః=between the field and its knower; ఏవమ్=thus; అన్తరమ్=the difference; జ్ఞానచక్షుషా=with the eye of knowledge; భూతప్రకృతిమోక్షమ్ చ=and the liberation of beings from nature; యే విదుః=who know; యాన్తి=attain; తే=they; పరమ్=the Supreme"};

// Chapter 14 – shlokas 14.1 to 14.14. Paste after your D object.
D["14.1"]={t:["శ్రీభగవానువాచ |","పరం భూయః ప్రవక్ష్యామి జ్ఞానానాం జ్ఞానముత్తమమ్ |","యజ్జ్ఞాత్వా మునయః సర్వే పరాం సిద్ధిమితో గతాః ||"],mt:"శ్రీభగవానుడు పలికెను: దేనిని తెలిసికొని మునులందరును ఇక్కడినుండి పరమసిద్ధిని పొందిరో, జ్ఞానములలో ఉత్తమమైన ఆ పరమజ్ఞానమును మరల చెప్పెదను.",m:"The Blessed Lord said: I shall again declare the supreme knowledge, the best of all knowledge, knowing which all the sages have attained supreme perfection from this world.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; పరమ్=supreme; భూయః=again; ప్రవక్ష్యామి=I shall declare; జ్ఞానానామ్ జ్ఞానమ్ ఉత్తమమ్=the best of all knowledge; యత్ జ్ఞాత్వా=knowing which; మునయః సర్వే=all the sages; పరామ్ సిద్ధిమ్=supreme perfection; ఇతః=from this world; గతాః=have attained"};
D["14.2"]={t:["ఇదం జ్ఞానముపాశ్రిత్య మమ సాధర్మ్యమాగతాః |","సర్గేఽపి నోపజాయన్తే ప్రలయే న వ్యథన్తి చ ||"],mt:"ఈ జ్ఞానమును ఆశ్రయించి నా సాధర్మ్యమును పొందినవారు సృష్టియందు జన్మింపరు, ప్రళయమునందు వ్యథ చెందరు.",m:"Those who, resorting to this knowledge, have attained likeness to my nature are not born again at creation and are not disturbed at dissolution.",w:"ఇదమ్ జ్ఞానమ్ ఉపాశ్రిత్య=resorting to this knowledge; మమ సాధర్మ్యమ్ ఆగతాః=who have attained likeness to my nature; సర్గే అపి=even at creation; న ఉపజాయన్తే=are not born; ప్రలయే=at dissolution; న వ్యథన్తి చ=and are not disturbed"};
D["14.3"]={t:["మమ యోనిర్మహద్బ్రహ్మ తస్మిన్గర్భం దధామ్యహమ్ |","సమ్భవః సర్వభూతానాం తతో భవతి భారత ||"],mt:"ఓ భారతా! మహద్బ్రహ్మము (మూలప్రకృతి) నా గర్భస్థానము; దానియందు నేను గర్భమును ఉంచుదును; దానినుండి సర్వభూతముల పుట్టుక కలుగును.",m:"The great Brahman (primordial nature) is my womb; in it I place the seed, and from that arises the birth of all beings, O Bharata.",w:"మమ యోనిః=my womb; మహత్ బ్రహ్మ=the great Brahman (primordial nature); తస్మిన్=in that; గర్భమ్ దధామి అహమ్=I place the seed; సమ్భవః=birth; సర్వభూతానామ్=of all beings; తతః భవతి=arises from that; భారత=O Bharata"};
D["14.4"]={t:["సర్వయోనిషు కౌన్తేయ మూర్తయః సమ్భవన్తి యాః |","తాసాం బ్రహ్మ మహద్యోనిరహం బీజప్రదః పితా ||"],mt:"ఓ కౌంతేయా! సర్వయోనులయందు ఏ రూపములు పుట్టునో వాటికి మహద్బ్రహ్మమే యోని; నేను బీజమునిచ్చు తండ్రిని.",m:"Whatever forms arise in all wombs, O son of Kunti, the great Brahman is their womb, and I am the seed-giving father.",w:"సర్వయోనిషు=in all wombs; కౌన్తేయ=O son of Kunti; మూర్తయః=forms; సమ్భవన్తి యాః=which arise; తాసామ్=of them; బ్రహ్మ మహత్=the great Brahman; యోనిః=the womb; అహమ్=I; బీజప్రదః పితా=the seed-giving father"};
D["14.5"]={t:["సత్త్వం రజస్తమ ఇతి గుణాః ప్రకృతిసమ్భవాః |","నిబధ్నన్తి మహాబాహో దేహే దేహినమవ్యయమ్ ||"],mt:"ఓ మహాబాహో! సత్త్వము, రజస్సు, తమస్సు అను ప్రకృతిజన్యములైన గుణములు దేహమున అవ్యయుడైన దేహిని బంధించును.",m:"Goodness, passion and ignorance: these gunas, born of nature, bind the imperishable embodied self in the body, O mighty-armed one.",w:"సత్త్వమ్ రజః తమః ఇతి=goodness, passion and ignorance; గుణాః=the gunas; ప్రకృతిసమ్భవాః=born of nature; నిబధ్నన్తి=bind; మహాబాహో=O mighty-armed; దేహే=in the body; దేహినమ్=the embodied; అవ్యయమ్=imperishable"};
D["14.6"]={t:["తత్ర సత్త్వం నిర్మలత్వాత్ప్రకాశకమనామయమ్ |","సుఖసఙ్గేన బధ్నాతి జ్ఞానసఙ్గేన చానఘ ||"],mt:"ఓ అనఘా! వాటిలో సత్త్వము నిర్మలమగుటచే ప్రకాశకము, నిరామయము; సుఖసంగముచేతను జ్ఞానసంగముచేతను బంధించును.",m:"Of these, goodness, being pure, is luminous and free from affliction; it binds by attachment to happiness and attachment to knowledge, O sinless one.",w:"తత్ర=among them; సత్త్వమ్=goodness; నిర్మలత్వాత్=due to purity; ప్రకాశకమ్=illuminating; అనామయమ్=free from affliction; సుఖసఙ్గేన=by attachment to happiness; బధ్నాతి=binds; జ్ఞానసఙ్గేన చ=and by attachment to knowledge; అనఘ=O sinless one"};
D["14.7"]={t:["రజో రాగాత్మకం విద్ధి తృష్ణాసఙ్గసముద్భవమ్ |","తన్నిబధ్నాతి కౌన్తేయ కర్మసఙ్గేన దేహినమ్ ||"],mt:"ఓ కౌంతేయా! రజస్సు రాగాత్మకమని, తృష్ణాసంగములనుండి పుట్టినదని తెలిసికొనుము; అది కర్మసంగముచే దేహిని బంధించును.",m:"Know passion to be of the nature of attraction, born of craving and attachment; it binds the embodied self by attachment to action, O son of Kunti.",w:"రజః=passion; రాగాత్మకమ్=of the nature of attraction; విద్ధి=know; తృష్ణాసఙ్గసముద్భవమ్=born of craving and attachment; తత్ నిబధ్నాతి=that binds; కౌన్తేయ=O son of Kunti; కర్మసఙ్గేన=by attachment to action; దేహినమ్=the embodied"};
D["14.8"]={t:["తమస్త్వజ్ఞానజం విద్ధి మోహనం సర్వదేహినామ్ |","ప్రమాదాలస్యనిద్రాభిస్తన్నిబధ్నాతి భారత ||"],mt:"ఓ భారతా! తమస్సు అజ్ఞానమునుండి పుట్టినదని, సర్వదేహులను మోహపరచునదని తెలిసికొనుము; అది ప్రమాదము, ఆలస్యము, నిద్రలచే బంధించును.",m:"Know ignorance to be born of unawareness, deluding all embodied beings; it binds through negligence, laziness and sleep, O Bharata.",w:"తమః తు=ignorance indeed; అజ్ఞానజమ్=born of unawareness; విద్ధి=know; మోహనమ్=deluding; సర్వదేహినామ్=of all embodied beings; ప్రమాదాలస్యనిద్రాభిః=by negligence, laziness and sleep; తత్ నిబధ్నాతి=that binds; భారత=O Bharata"};
D["14.9"]={t:["సత్త్వం సుఖే సఞ్జయతి రజః కర్మణి భారత |","జ్ఞానమావృత్య తు తమః ప్రమాదే సఞ్జయత్యుత ||"],mt:"ఓ భారతా! సత్త్వము సుఖమునందును, రజస్సు కర్మయందును అంటించును; తమస్సు జ్ఞానమును కప్పి ప్రమాదమునందు అంటించును.",m:"Goodness attaches one to happiness, passion to action, O Bharata; but ignorance, covering knowledge, attaches one to negligence.",w:"సత్త్వమ్=goodness; సుఖే సఞ్జయతి=attaches to happiness; రజః=passion; కర్మణి=to action; భారత=O Bharata; జ్ఞానమ్ ఆవృత్య=covering knowledge; తు తమః=but ignorance; ప్రమాదే సఞ్జయతి=attaches to negligence; ఉత=indeed"};
D["14.10"]={t:["రజస్తమశ్చాభిభూయ సత్త్వం భవతి భారత |","రజః సత్త్వం తమశ్చైవ తమః సత్త్వం రజస్తథా ||"],mt:"ఓ భారతా! రజస్తమస్సులను అణచి సత్త్వము ప్రబలమగును; సత్త్వతమస్సులను అణచి రజస్సు; సత్త్వరజస్సులను అణచి తమస్సు ప్రబలమగును.",m:"Overpowering passion and ignorance, goodness prevails, O Bharata; likewise passion prevails over goodness and ignorance, and ignorance over goodness and passion.",w:"రజః తమః చ అభిభూయ=overpowering passion and ignorance; సత్త్వమ్ భవతి=goodness prevails; భారత=O Bharata; రజః=passion; సత్త్వమ్ తమః చ ఏవ=over goodness and ignorance; తమః=ignorance; సత్త్వమ్ రజః తథా=over goodness and passion likewise"};
D["14.11"]={t:["సర్వద్వారేషు దేహేఽస్మిన్ప్రకాశ ఉపజాయతే |","జ్ఞానం యదా తదా విద్యాద్వివృద్ధం సత్త్వమిత్యుత ||"],mt:"ఈ దేహమున అన్ని ద్వారములయందు ప్రకాశము, జ్ఞానము ఎప్పుడు కలుగునో అప్పుడు సత్త్వము వృద్ధి చెందినదని తెలిసికొనవలెను.",m:"When the light of knowledge shines through all the gates of this body, then one should know that goodness has increased.",w:"సర్వద్వారేషు=in all the gates (senses); దేహే అస్మిన్=in this body; ప్రకాశః=light; ఉపజాయతే=arises; జ్ఞానమ్=knowledge; యదా తదా=when, then; విద్యాత్=one should know; వివృద్ధమ్=increased; సత్త్వమ్=goodness; ఇతి ఉత=thus indeed"};
D["14.12"]={t:["లోభః ప్రవృత్తిరారమ్భః కర్మణామశమః స్పృహా |","రజస్యేతాని జాయన్తే వివృద్ధే భరతర్షభ ||"],mt:"ఓ భరతశ్రేష్ఠా! లోభము, ప్రవృత్తి, కర్మారంభము, అశాంతి, స్పృహ — రజస్సు వృద్ధియైనప్పుడు ఇవి పుట్టును.",m:"Greed, activity, the undertaking of actions, restlessness and craving: these arise when passion increases, O best of the Bharatas.",w:"లోభః=greed; ప్రవృత్తిః=activity; ఆరమ్భః కర్మణామ్=undertaking of actions; అశమః=restlessness; స్పృహా=craving; రజసి=when passion; ఏతాని=these; జాయన్తే=arise; వివృద్ధే=increases; భరతర్షభ=O best of the Bharatas"};
D["14.13"]={t:["అప్రకాశోఽప్రవృత్తిశ్చ ప్రమాదో మోహ ఏవ చ |","తమస్యేతాని జాయన్తే వివృద్ధే కురునన్దన ||"],mt:"ఓ కురునందనా! అప్రకాశము, అప్రవృత్తి, ప్రమాదము, మోహము — తమస్సు వృద్ధియైనప్పుడు ఇవి పుట్టును.",m:"Darkness, inactivity, negligence and delusion: these arise when ignorance increases, O joy of the Kurus.",w:"అప్రకాశః=darkness; అప్రవృత్తిః చ=and inactivity; ప్రమాదః=negligence; మోహః ఏవ చ=and delusion; తమసి=when ignorance; ఏతాని జాయన్తే=these arise; వివృద్ధే=increases; కురునన్దన=O joy of the Kurus"};
D["14.14"]={t:["యదా సత్త్వే ప్రవృద్ధే తు ప్రలయం యాతి దేహభృత్ |","తదోత్తమవిదాం లోకానమలాన్ప్రతిపద్యతే ||"],mt:"సత్త్వము ప్రబలమై ఉండగా దేహధారి మరణించినప్పుడు ఉత్తమవిదుల నిర్మలలోకములను పొందును.",m:"When the embodied self dies while goodness prevails, it attains the pure worlds of those who know the highest.",w:"యదా=when; సత్త్వే ప్రవృద్ధే=when goodness prevails; తు=but; ప్రలయమ్ యాతి=dies; దేహభృత్=the embodied; తదా=then; ఉత్తమవిదామ్ లోకాన్=the worlds of the knowers of the highest; అమలాన్=pure; ప్రతిపద్యతే=attains"};

// Chapter 14 – shlokas 14.15 to 14.27 (completes chapter 14). Paste after your D object.
D["14.15"]={t:["రజసి ప్రలయం గత్వా కర్మసఙ్గిషు జాయతే |","తథా ప్రలీనస్తమసి మూఢయోనిషు జాయతే ||"],mt:"రజస్సునందు మరణించినవాడు కర్మసంగులలో జన్మించును; అట్లే తమస్సునందు మరణించినవాడు మూఢయోనులలో జన్మించును.",m:"One who dies in passion is born among those attached to action; and one who dies in ignorance is born in the wombs of the deluded.",w:"రజసి ప్రలయమ్ గత్వా=dying in passion; కర్మసఙ్గిషు జాయతే=is born among those attached to action; తథా=so; ప్రలీనః తమసి=dying in ignorance; మూఢయోనిషు జాయతే=is born in the wombs of the deluded"};
D["14.16"]={t:["కర్మణః సుకృతస్యాహుః సాత్త్వికం నిర్మలం ఫలమ్ |","రజసస్తు ఫలం దుఃఖమజ్ఞానం తమసః ఫలమ్ ||"],mt:"సుకృతకర్మకు ఫలము సాత్త్వికము, నిర్మలమని చెప్పుదురు; రజస్సునకు ఫలము దుఃఖము; తమస్సునకు ఫలము అజ్ఞానము.",m:"The fruit of virtuous action is said to be pure and of the nature of goodness; the fruit of passion is pain; the fruit of ignorance is lack of knowledge.",w:"కర్మణః సుకృతస్య=of virtuous action; ఆహుః=they say; సాత్త్వికమ్=of the nature of goodness; నిర్మలమ్=pure; ఫలమ్=fruit; రజసః తు=but of passion; ఫలమ్ దుఃఖమ్=the fruit is pain; అజ్ఞానమ్=ignorance; తమసః ఫలమ్=the fruit of ignorance"};
D["14.17"]={t:["సత్త్వాత్సఞ్జాయతే జ్ఞానం రజసో లోభ ఏవ చ |","ప్రమాదమోహౌ తమసో భవతోఽజ్ఞానమేవ చ ||"],mt:"సత్త్వమునుండి జ్ఞానము, రజస్సునుండి లోభము కలుగును; తమస్సునుండి ప్రమాదమోహములును అజ్ఞానమును కలుగును.",m:"From goodness arises knowledge; from passion, greed; from ignorance arise negligence, delusion and ignorance itself.",w:"సత్త్వాత్=from goodness; సఞ్జాయతే=arises; జ్ఞానమ్=knowledge; రజసః=from passion; లోభః ఏవ చ=greed; ప్రమాదమోహౌ=negligence and delusion; తమసః=from ignorance; భవతః=arise; అజ్ఞానమ్ ఏవ చ=and ignorance itself"};
D["14.18"]={t:["ఊర్ధ్వం గచ్ఛన్తి సత్త్వస్థా మధ్యే తిష్ఠన్తి రాజసాః |","జఘన్యగుణవృత్తిస్థా అధో గచ్ఛన్తి తామసాః ||"],mt:"సత్త్వస్థులు ఊర్ధ్వలోకములకు పోవుదురు; రాజసులు మధ్యలో ఉందురు; నికృష్టగుణవృత్తి గల తామసులు అధోగతికి పోవుదురు.",m:"Those established in goodness go upward; the passionate remain in the middle; the ignorant, abiding in the lowest guna, go downward.",w:"ఊర్ధ్వమ్ గచ్ఛన్తి=go upward; సత్త్వస్థాః=those established in goodness; మధ్యే తిష్ఠన్తి=remain in the middle; రాజసాః=the passionate; జఘన్యగుణవృత్తిస్థాః=abiding in the lowest guna; అధః గచ్ఛన్తి=go downward; తామసాః=the ignorant"};
D["14.19"]={t:["నాన్యం గుణేభ్యః కర్తారం యదా ద్రష్టానుపశ్యతి |","గుణేభ్యశ్చ పరం వేత్తి మద్భావం సోఽధిగచ్ఛతి ||"],mt:"ద్రష్ట గుణములకంటె వేరైన కర్తను చూడనప్పుడు, గుణములకు పరమైనదానిని ఎరిగినప్పుడు నా భావమును పొందును.",m:"When the seer sees no agent other than the gunas and knows what is beyond the gunas, he attains my nature.",w:"న అన్యమ్ గుణేభ్యః కర్తారమ్=no agent other than the gunas; యదా=when; ద్రష్టా=the seer; అనుపశ్యతి=sees; గుణేభ్యః చ పరమ్=and what is beyond the gunas; వేత్తి=knows; మద్భావమ్=my nature; సః=he; అధిగచ్ఛతి=attains"};
D["14.20"]={t:["గుణానేతానతీత్య త్రీన్దేహీ దేహసముద్భవాన్ |","జన్మమృత్యుజరాదుఃఖైర్విముక్తోఽమృతమశ్నుతే ||"],mt:"దేహసముద్భవములైన ఈ మూడు గుణములను అతిక్రమించి, దేహి జన్మమృత్యుజరాదుఃఖములనుండి విముక్తుడై అమృతత్వమును పొందును.",m:"Transcending these three gunas that originate in the body, the embodied self, freed from birth, death, old age and sorrow, attains immortality.",w:"గుణాన్ ఏతాన్ త్రీన్ అతీత్య=transcending these three gunas; దేహీ=the embodied; దేహసముద్భవాన్=originating in the body; జన్మమృత్యుజరాదుఃఖైః=from birth, death, old age and sorrow; విముక్తః=freed; అమృతమ్ అశ్నుతే=attains immortality"};
D["14.21"]={t:["అర్జున ఉవాచ |","కైర్లిఙ్గైస్త్రీన్గుణానేతానతీతో భవతి ప్రభో |","కిమాచారః కథం చైతాంస్త్రీన్గుణానతివర్తతే ||"],mt:"అర్జునుడు పలికెను: ఓ ప్రభూ! ఈ మూడు గుణములను అతిక్రమించినవాడు ఏ లక్షణములు గలవాడు? ఏ ఆచారము గలవాడు? ఈ మూడు గుణములను ఎట్లు దాటును?",m:"Arjuna said: O Lord, by what marks is one who has transcended these three gunas known? What is his conduct, and how does he go beyond these three gunas?",w:"అర్జునః ఉవాచ=Arjuna said; కైః లిఙ్గైః=by what marks; త్రీన్ గుణాన్ ఏతాన్=these three gunas; అతీతః భవతి=has transcended; ప్రభో=O Lord; కిమాచారః=what conduct; కథమ్ చ=and how; ఏతాన్ త్రీన్ గుణాన్=these three gunas; అతివర్తతే=he goes beyond"};
D["14.22"]={t:["శ్రీభగవానువాచ |","ప్రకాశం చ ప్రవృత్తిం చ మోహమేవ చ పాణ్డవ |","న ద్వేష్టి సమ్ప్రవృత్తాని న నివృత్తాని కాఙ్క్షతి ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ పాండవా! ప్రకాశము, ప్రవృత్తి, మోహము కలిగినప్పుడు ద్వేషింపడు, అవి పోయినప్పుడు కోరడు... (14.25 వరకు కొనసాగును)",m:"The Blessed Lord said: O Pandava, one who does not hate illumination, activity and delusion when they arise, nor long for them when they cease... (continues to 14.25)",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ప్రకాశమ్ చ=illumination; ప్రవృత్తిమ్ చ=and activity; మోహమ్ ఏవ చ=and delusion; పాణ్డవ=O Pandava; న ద్వేష్టి=does not hate; సమ్ప్రవృత్తాని=when they are present; న నివృత్తాని కాఙ్క్షతి=nor desires them when they cease"};
D["14.23"]={t:["ఉదాసీనవదాసీనో గుణైర్యో న విచాల్యతే |","గుణా వర్తన్త ఇత్యేవ యోఽవతిష్ఠతి నేఙ్గతే ||"],mt:"...ఉదాసీనునివలె ఉండి గుణములచే చలింపనివాడు, “గుణములే ప్రవర్తించుచున్నవి” అని నిలిచి కదలనివాడు...",m:"...who sits like one indifferent, not disturbed by the gunas, and who stands firm without wavering, knowing that the gunas alone operate...",w:"ఉదాసీనవత్=like one indifferent; ఆసీనః=seated; గుణైః=by the gunas; యః న విచాల్యతే=who is not disturbed; గుణాః వర్తన్తే=the gunas operate; ఇతి ఏవ=thus; యః అవతిష్ఠతి=who stands firm; న ఇఙ్గతే=does not waver"};
D["14.24"]={t:["సమదుఃఖసుఖః స్వస్థః సమలోష్టాశ్మకాఞ్చనః |","తుల్యప్రియాప్రియో ధీరస్తుల్యనిన్దాత్మసంస్తుతిః ||"],mt:"...సుఖదుఃఖములయందు సమముగా, స్వస్థుడై, మట్టిపెళ్ళ రాయి బంగారములను సమముగా, ప్రియాప్రియములను సమముగా, ధీరుడై, నిందాత్మస్తుతులను సమముగా చూచువాడు...",m:"...equal in pleasure and pain, self-abiding, regarding a clod, a stone and gold alike, equal toward the dear and the unfriendly, steadfast, and equal in blame and praise of himself...",w:"సమదుఃఖసుఖః=equal in pain and pleasure; స్వస్థః=self-abiding; సమలోష్టాశ్మకాఞ్చనః=to whom a clod, stone and gold are alike; తుల్యప్రియాప్రియః=equal toward the dear and the unfriendly; ధీరః=steadfast; తుల్యనిన్దాత్మసంస్తుతిః=equal in blame and praise of himself"};
D["14.25"]={t:["మానాపమానయోస్తుల్యస్తుల్యో మిత్రారిపక్షయోః |","సర్వారమ్భపరిత్యాగీ గుణాతీతః స ఉచ్యతే ||"],mt:"...మానాపమానములయందు సమముగా, మిత్రశత్రుపక్షములయందు సమముగా, సర్వారంభపరిత్యాగియైనవాడు గుణాతీతుడనబడును.",m:"...equal in honour and dishonour, equal toward the side of friends and enemies, who has renounced all undertakings: such a person is said to have transcended the gunas.",w:"మానాపమానయోః తుల్యః=equal in honour and dishonour; తుల్యః మిత్రారిపక్షయోః=equal toward the sides of friend and enemy; సర్వారమ్భపరిత్యాగీ=renouncer of all undertakings; గుణాతీతః=one who has transcended the gunas; సః ఉచ్యతే=he is said"};
D["14.26"]={t:["మాం చ యోఽవ్యభిచారేణ భక్తియోగేన సేవతే |","స గుణాన్సమతీత్యైతాన్బ్రహ్మభూయాయ కల్పతే ||"],mt:"అవ్యభిచారియైన భక్తియోగముచే నన్ను సేవించువాడు ఈ గుణములను అతిక్రమించి బ్రహ్మభావమునకు అర్హుడగును.",m:"One who serves me with unswerving devotion, going beyond these gunas, becomes fit for oneness with Brahman.",w:"మామ్ చ=and me; యః=who; అవ్యభిచారేణ=with unswerving; భక్తియోగేన=with the yoga of devotion; సేవతే=serves; సః=he; గుణాన్ ఏతాన్ సమతీత్య=going beyond these gunas; బ్రహ్మభూయాయ=for oneness with Brahman; కల్పతే=becomes fit"};
D["14.27"]={t:["బ్రహ్మణో హి ప్రతిష్ఠాహమమృతస్యావ్యయస్య చ |","శాశ్వతస్య చ ధర్మస్య సుఖస్యైకాన్తికస్య చ ||"],mt:"అమృతమునకును అవ్యయమునకును శాశ్వతధర్మమునకును ఏకాంతిక సుఖమునకును ప్రతిష్ఠను, ఆశ్రయమును బ్రహ్మమునకు నేనే.",m:"For I am the foundation of Brahman, the immortal and imperishable, of eternal dharma and of absolute happiness.",w:"బ్రహ్మణః=of Brahman; హి=indeed; ప్రతిష్ఠా=the foundation; అహమ్=I; అమృతస్య=of the immortal; అవ్యయస్య చ=and imperishable; శాశ్వతస్య చ ధర్మస్య=and of eternal dharma; సుఖస్య ఏకాన్తికస్య చ=and of absolute happiness"};

// Chapter 15 – shlokas 15.1 to 15.10. Paste after your D object.
D["15.1"]={t:["శ్రీభగవానువాచ |","ఊర్ధ్వమూలమధఃశాఖమశ్వత్థం ప్రాహురవ్యయమ్ |","ఛన్దాంసి యస్య పర్ణాని యస్తం వేద స వేదవిత్ ||"],mt:"శ్రీభగవానుడు పలికెను: మూలము పైనను శాఖలు క్రిందను గల అవ్యయమైన అశ్వత్థవృక్షమును చెప్పుదురు; వేదచ్ఛందస్సులు దాని ఆకులు; దానిని ఎరిగినవాడు వేదవిదుడు.",m:"The Blessed Lord said: They speak of the imperishable peepal tree with roots above and branches below, whose leaves are the Vedic hymns; one who knows it is a knower of the Veda.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ఊర్ధ్వమూలమ్=with roots above; అధఃశాఖమ్=with branches below; అశ్వత్థమ్=the peepal tree; ప్రాహుః=they speak of; అవ్యయమ్=imperishable; ఛన్దాంసి=the Vedic hymns; యస్య=whose; పర్ణాని=leaves; యః తమ్ వేద=who knows it; సః వేదవిత్=he is a knower of the Veda"};
D["15.2"]={t:["అధశ్చోర్ధ్వం ప్రసృతాస్తస్య శాఖా గుణప్రవృద్ధా విషయప్రవాలాః |","అధశ్చ మూలాన్యనుసన్తతాని కర్మానుబన్ధీని మనుష్యలోకే ||"],mt:"దాని శాఖలు గుణములచే పోషింపబడి, ఇంద్రియవిషయములు చిగుళ్ళుగా గలవై, క్రిందను పైనను వ్యాపించియున్నవి; మనుష్యలోకమున కర్మానుబంధములైన వేళ్ళు క్రిందకును వ్యాపించియున్నవి.",m:"Its branches spread downward and upward, nourished by the gunas, with sense objects as buds; its roots, binding one to action, extend downward in the human world.",w:"అధః చ ఊర్ధ్వమ్ చ ప్రసృతాః=spread downward and upward; తస్య శాఖాః=its branches; గుణప్రవృద్ధాః=nourished by the gunas; విషయప్రవాలాః=with sense objects as buds; అధః చ మూలాని=and roots downward; అనుసన్తతాని=extended; కర్మానుబన్ధీని=binding to action; మనుష్యలోకే=in the human world"};
D["15.3"]={t:["న రూపమస్యేహ తథోపలభ్యతే నాన్తో న చాదిర్న చ సమ్ప్రతిష్ఠా |","అశ్వత్థమేనం సువిరూఢమూలమసఙ్గశస్త్రేణ దృఢేన ఛిత్త్వా ||"],mt:"దీని రూపము ఇచట అట్లు తెలియబడదు; దీనికి అంతమును ఆదియు నిలకడయును లేవు; బాగుగా లోతుగా పాతుకొనిన వేళ్ళుగల ఈ అశ్వత్థవృక్షమును దృఢమైన అసంగశస్త్రముచే ఛేదించి... (15.4 లో కొనసాగును)",m:"Its form is not perceived here as such, nor its end, nor its beginning, nor its foundation. Cutting down this deeply rooted peepal tree with the strong weapon of detachment... (continues in 15.4)",w:"న రూపమ్ అస్య=its form is not; ఇహ=here; తథా ఉపలభ్యతే=perceived as such; న అన్తః=no end; న చ ఆదిః=nor beginning; న చ సమ్ప్రతిష్ఠా=nor foundation; అశ్వత్థమ్ ఏనమ్=this peepal tree; సువిరూఢమూలమ్=with deeply grown roots; అసఙ్గశస్త్రేణ దృఢేన=with the strong weapon of detachment; ఛిత్త్వా=cutting down"};
D["15.4"]={t:["తతః పదం తత్పరిమార్గితవ్యం యస్మిన్గతా న నివర్తన్తి భూయః |","తమేవ చాద్యం పురుషం ప్రపద్యే యతః ప్రవృత్తిః ప్రసృతా పురాణీ ||"],mt:"...అప్పుడు ఏ స్థానమును పొందినవారు తిరిగి రారో ఆ పదమును వెదకవలెను; ఎవనినుండి ఈ పురాతన ప్రవృత్తి వ్యాపించినదో ఆ ఆదిపురుషుని శరణు పొందుచున్నాను (అని సంకల్పింపవలెను).",m:"...then that state should be sought, reaching which none return again; and one should resolve: “I take refuge in that primal Person from whom this ancient activity has flowed forth.”",w:"తతః=then; పదమ్ తత్=that state; పరిమార్గితవ్యమ్=should be sought; యస్మిన్ గతాః=reaching which; న నివర్తన్తి భూయః=do not return again; తమ్ ఏవ చ ఆద్యమ్ పురుషమ్=that very primal Person; ప్రపద్యే=I take refuge; యతః=from whom; ప్రవృత్తిః=activity; ప్రసృతా పురాణీ=has flowed forth from of old"};
D["15.5"]={t:["నిర్మానమోహా జితసఙ్గదోషా అధ్యాత్మనిత్యా వినివృత్తకామాః |","ద్వన్ద్వైర్విముక్తాః సుఖదుఃఖసంజ్ఞైర్గచ్ఛన్త్యమూఢాః పదమవ్యయం తత్ ||"],mt:"మానమోహములు లేనివారు, ఆసక్తిదోషమును జయించినవారు, నిత్యము అధ్యాత్మనిష్ఠులు, కామములు తొలగినవారు, సుఖదుఃఖములనబడు ద్వంద్వములనుండి విముక్తులైన అమూఢులు ఆ అవ్యయపదమును పొందుదురు.",m:"Free from pride and delusion, having conquered the evil of attachment, ever devoted to the self, their desires stilled, freed from the dualities known as pleasure and pain, the undeluded reach that imperishable state.",w:"నిర్మానమోహాః=free from pride and delusion; జితసఙ్గదోషాః=who have conquered the evil of attachment; అధ్యాత్మనిత్యాః=ever devoted to the self; వినివృత్తకామాః=whose desires have ceased; ద్వన్ద్వైః విముక్తాః=freed from dualities; సుఖదుఃఖసంజ్ఞైః=known as pleasure and pain; గచ్ఛన్తి అమూఢాః=the undeluded reach; పదమ్ అవ్యయమ్ తత్=that imperishable state"};
D["15.6"]={t:["న తద్భాసయతే సూర్యో న శశాఙ్కో న పావకః |","యద్గత్వా న నివర్తన్తే తద్ధామ పరమం మమ ||"],mt:"దానిని సూర్యుడు ప్రకాశింపజేయడు, చంద్రుడు కాదు, అగ్ని కాదు; దేనిని పొందినవారు తిరిగి రారో అదే నా పరమధామము.",m:"Neither the sun, nor the moon, nor fire illumines that; having gone there, none return. That is my supreme abode.",w:"న తత్ భాసయతే=does not illumine that; సూర్యః=the sun; న శశాఙ్కః=nor the moon; న పావకః=nor fire; యత్ గత్వా=having gone to which; న నివర్తన్తే=none return; తత్ ధామ పరమమ్ మమ=that is my supreme abode"};
D["15.7"]={t:["మమైవాంశో జీవలోకే జీవభూతః సనాతనః |","మనఃషష్ఠానీన్ద్రియాణి ప్రకృతిస్థాని కర్షతి ||"],mt:"జీవలోకమున సనాతనమైన జీవభూతమైనది నా అంశమే; అది ప్రకృతియందున్న, మనస్సు ఆరవదిగా గల ఇంద్రియములను ఆకర్షించును.",m:"A portion of me alone, eternal, having become the individual soul in the world of living beings, draws to itself the senses, with the mind as the sixth, which abide in nature.",w:"మమ ఏవ అంశః=a portion of me alone; జీవలోకే=in the world of living beings; జీవభూతః=having become the individual soul; సనాతనః=eternal; మనఃషష్ఠాని ఇన్ద్రియాణి=the senses with the mind as the sixth; ప్రకృతిస్థాని=situated in nature; కర్షతి=draws"};
D["15.8"]={t:["శరీరం యదవాప్నోతి యచ్చాప్యుత్క్రామతీశ్వరః |","గృహీత్వైతాని సంయాతి వాయుర్గన్ధానివాశయాత్ ||"],mt:"ఈశ్వరుడు (జీవుడు) శరీరమును పొందునప్పుడును వదలునప్పుడును వీటిని గ్రహించి, గాలి పుష్పాదులనుండి సుగంధములను తీసికొనిపోవునట్లు పోవును.",m:"When the lord of the body acquires a body and when he departs from it, he takes these (senses and mind) along, as the wind carries fragrances from their source.",w:"శరీరమ్ యత్ అవాప్నోతి=when he acquires a body; యత్ చ అపి ఉత్క్రామతి=and when he departs; ఈశ్వరః=the lord of the body; గృహీత్వా ఏతాని=taking these; సంయాతి=goes; వాయుః=the wind; గన్ధాన్ ఇవ=like fragrances; ఆశయాత్=from their source"};
D["15.9"]={t:["శ్రోత్రం చక్షుః స్పర్శనం చ రసనం ఘ్రాణమేవ చ |","అధిష్ఠాయ మనశ్చాయం విషయానుపసేవతే ||"],mt:"శ్రోత్రము, చక్షువు, స్పర్శనము, రసనము, ఘ్రాణము, మనస్సును ఆశ్రయించి ఇతడు విషయములను అనుభవించును.",m:"Presiding over the ear, eye, skin, tongue, nose and the mind, he enjoys sense objects.",w:"శ్రోత్రమ్=ear; చక్షుః=eye; స్పర్శనమ్=skin; చ రసనమ్=and tongue; ఘ్రాణమ్ ఏవ చ=and nose; అధిష్ఠాయ=presiding over; మనః చ=and the mind; అయమ్=this one; విషయాన్ ఉపసేవతే=enjoys sense objects"};
D["15.10"]={t:["ఉత్క్రామన్తం స్థితం వాపి భుఞ్జానం వా గుణాన్వితమ్ |","విమూఢా నానుపశ్యన్తి పశ్యన్తి జ్ఞానచక్షుషః ||"],mt:"దేహమును విడుచుచున్నవానిని, ఉన్నవానిని, గుణములతో కూడి అనుభవించుచున్నవానిని విమూఢులు చూడరు; జ్ఞానచక్షువులు గలవారు చూతురు.",m:"The deluded do not see it departing, staying or experiencing, associated with the gunas; those with the eye of knowledge see it.",w:"ఉత్క్రామన్తమ్=departing; స్థితమ్ వా అపి=or staying; భుఞ్జానమ్ వా=or experiencing; గుణాన్వితమ్=associated with the gunas; విమూఢాః=the deluded; న అనుపశ్యన్తి=do not see; పశ్యన్తి జ్ఞానచక్షుషః=those with the eye of knowledge see"};

// Chapter 15 – shlokas 15.11 to 15.20 (completes chapter 15). Paste after your D object.
D["15.11"]={t:["యతన్తో యోగినశ్చైనం పశ్యన్త్యాత్మన్యవస్థితమ్ |","యతన్తోఽప్యకృతాత్మానో నైనం పశ్యన్త్యచేతసః ||"],mt:"ప్రయత్నించు యోగులు ఈ ఆత్మను తమయందు నెలకొనినదిగా చూతురు; ప్రయత్నించినను అకృతాత్ములు, వివేకహీనులు దీనిని చూడరు.",m:"Striving yogis see this self abiding in themselves; but the unintelligent, whose minds are unpurified, do not see it even though they strive.",w:"యతన్తః యోగినః=striving yogis; చ ఏనమ్=and this; పశ్యన్తి ఆత్మని అవస్థితమ్=see abiding in the self; యతన్తః అపి=though striving; అకృతాత్మానః=those of unpurified mind; న ఏనమ్ పశ్యన్తి=do not see this; అచేతసః=the unintelligent"};
D["15.12"]={t:["యదాదిత్యగతం తేజో జగద్భాసయతేఽఖిలమ్ |","యచ్చన్ద్రమసి యచ్చాగ్నౌ తత్తేజో విద్ధి మామకమ్ ||"],mt:"సూర్యునియందున్న ఏ తేజస్సు సమస్త జగత్తును ప్రకాశింపజేయునో, చంద్రునియందును అగ్నియందును ఏ తేజస్సు కలదో అది నాదిగా తెలిసికొనుము.",m:"The radiance in the sun that illumines the whole world, and that in the moon and in fire: know that radiance to be mine.",w:"యత్ ఆదిత్యగతమ్ తేజః=the radiance in the sun; జగత్ భాసయతే అఖిలమ్=that illumines the whole world; యత్ చన్ద్రమసి=that in the moon; యత్ చ అగ్నౌ=and that in fire; తత్ తేజః విద్ధి మామకమ్=know that radiance to be mine"};
D["15.13"]={t:["గామావిశ్య చ భూతాని ధారయామ్యహమోజసా |","పుష్ణామి చౌషధీః సర్వాః సోమో భూత్వా రసాత్మకః ||"],mt:"నేను భూమిలో ప్రవేశించి నా శక్తిచే భూతములను ధరించుచున్నాను; రసస్వరూపుడైన చంద్రుడనై సమస్త ఓషధులను పోషించుచున్నాను.",m:"Entering the earth, I sustain all beings by my energy; and becoming the moon, the essence of taste, I nourish all plants.",w:"గామ్ ఆవిశ్య=entering the earth; భూతాని ధారయామి అహమ్=I sustain beings; ఓజసా=by my energy; పుష్ణామి చ=and I nourish; ఓషధీః సర్వాః=all plants; సోమః భూత్వా=becoming the moon; రసాత్మకః=the essence of taste"};
D["15.14"]={t:["అహం వైశ్వానరో భూత్వా ప్రాణినాం దేహమాశ్రితః |","ప్రాణాపానసమాయుక్తః పచామ్యన్నం చతుర్విధమ్ ||"],mt:"నేను వైశ్వానరాగ్నినై ప్రాణుల దేహమును ఆశ్రయించి, ప్రాణాపానములతో కూడి నాలుగు విధములైన అన్నమును జీర్ణించుచున్నాను.",m:"Becoming the digestive fire in the bodies of living beings and united with the in-breath and out-breath, I digest the four kinds of food.",w:"అహమ్=I; వైశ్వానరః భూత్వా=becoming the digestive fire; ప్రాణినామ్ దేహమ్ ఆశ్రితః=residing in the bodies of living beings; ప్రాణాపానసమాయుక్తః=united with the in-breath and out-breath; పచామి=I digest; అన్నమ్ చతుర్విధమ్=the four kinds of food"};
D["15.15"]={t:["సర్వస్య చాహం హృది సన్నివిష్టో మత్తః స్మృతిర్జ్ఞానమపోహనం చ |","వేదైశ్చ సర్వైరహమేవ వేద్యో వేదాన్తకృద్వేదవిదేవ చాహమ్ ||"],mt:"నేను అందరి హృదయమున నెలకొనియున్నాను; నానుండియే స్మృతి, జ్ఞానము, వాటి అపోహనము కలుగును; సర్వవేదములచే తెలియదగినవాడను నేనే; వేదాంతకర్తను, వేదవేత్తను నేనే.",m:"I am seated in the hearts of all; from me come memory, knowledge and their loss. I alone am to be known by all the Vedas; I am the author of the Vedanta and the knower of the Vedas.",w:"సర్వస్య చ అహమ్ హృది సన్నివిష్టః=I am seated in the hearts of all; మత్తః=from me; స్మృతిః జ్ఞానమ్=memory and knowledge; అపోహనమ్ చ=and their loss; వేదైః చ సర్వైః=and by all the Vedas; అహమ్ ఏవ వేద్యః=I alone am to be known; వేదాన్తకృత్=the author of the Vedanta; వేదవిత్ ఏవ చ అహమ్=and I am the knower of the Vedas"};
D["15.16"]={t:["ద్వావిమౌ పురుషౌ లోకే క్షరశ్చాక్షర ఏవ చ |","క్షరః సర్వాణి భూతాని కూటస్థోఽక్షర ఉచ్యతే ||"],mt:"ఈ లోకమున క్షరుడు, అక్షరుడు అను ఇద్దరు పురుషులున్నారు; సర్వభూతములు క్షరుడు; కూటస్థుడు అక్షరుడనబడును.",m:"There are two persons in this world, the perishable and the imperishable; the perishable is all beings, and the unchanging is called the imperishable.",w:"ద్వౌ ఇమౌ పురుషౌ=these two persons; లోకే=in the world; క్షరః చ అక్షరః ఏవ చ=the perishable and the imperishable; క్షరః సర్వాణి భూతాని=the perishable is all beings; కూటస్థః=the unchanging; అక్షరః ఉచ్యతే=is called the imperishable"};
D["15.17"]={t:["ఉత్తమః పురుషస్త్వన్యః పరమాత్మేత్యుదాహృతః |","యో లోకత్రయమావిశ్య బిభర్త్యవ్యయ ఈశ్వరః ||"],mt:"మూడు లోకములలో ప్రవేశించి వాటిని భరించు అవ్యయుడైన ఈశ్వరుడు పరమాత్మ అని చెప్పబడు ఉత్తమపురుషుడు, వీరికంటె భిన్నుడు.",m:"But the highest Person is another, called the Supreme Self, the imperishable Lord who, entering the three worlds, sustains them.",w:"ఉత్తమః పురుషః=the highest Person; తు అన్యః=but another; పరమాత్మా ఇతి ఉదాహృతః=called the Supreme Self; యః=who; లోకత్రయమ్ ఆవిశ్య=entering the three worlds; బిభర్తి=sustains; అవ్యయః ఈశ్వరః=the imperishable Lord"};
D["15.18"]={t:["యస్మాత్క్షరమతీతోఽహమక్షరాదపి చోత్తమః |","అతోఽస్మి లోకే వేదే చ ప్రథితః పురుషోత్తమః ||"],mt:"నేను క్షరునికి అతీతుడను, అక్షరునికంటెను ఉత్తముడను; కావున లోకమునను వేదమునను పురుషోత్తముడనని ప్రసిద్ధుడను.",m:"Since I transcend the perishable and am higher even than the imperishable, I am celebrated in the world and in the Veda as the Supreme Person.",w:"యస్మాత్=since; క్షరమ్ అతీతః అహమ్=I transcend the perishable; అక్షరాత్ అపి చ ఉత్తమః=and am higher even than the imperishable; అతః అస్మి=therefore I am; లోకే వేదే చ ప్రథితః=celebrated in the world and in the Veda; పురుషోత్తమః=the Supreme Person"};
D["15.19"]={t:["యో మామేవమసమ్మూఢో జానాతి పురుషోత్తమమ్ |","స సర్వవిద్భజతి మాం సర్వభావేన భారత ||"],mt:"ఓ భారతా! ఇట్లు మోహరహితుడై నన్ను పురుషోత్తముడుగా ఎరిగినవాడు సర్వజ్ఞుడై సర్వభావముతో నన్ను భజించును.",m:"One who, undeluded, thus knows me as the Supreme Person is all-knowing and worships me with his whole being, O Bharata.",w:"యః=who; మామ్=me; ఏవమ్=thus; అసమ్మూఢః=undeluded; జానాతి=knows; పురుషోత్తమమ్=as the Supreme Person; సః సర్వవిత్=he is all-knowing; భజతి మామ్=worships me; సర్వభావేన=with his whole being; భారత=O Bharata"};
D["15.20"]={t:["ఇతి గుహ్యతమం శాస్త్రమిదముక్తం మయానఘ |","ఏతద్బుద్ధ్వా బుద్ధిమాన్స్యాత్కృతకృత్యశ్చ భారత ||"],mt:"ఓ అనఘా! ఇట్లు అతిగుహ్యమైన ఈ శాస్త్రము నాచే చెప్పబడినది; దీనిని తెలిసికొని ఓ భారతా! బుద్ధిమంతుడును కృతకృత్యుడును అగును.",m:"Thus this most secret teaching has been told by me, O sinless one; knowing this, one becomes wise and has accomplished all that is to be done, O Bharata.",w:"ఇతి=thus; గుహ్యతమమ్ శాస్త్రమ్ ఇదమ్=this most secret teaching; ఉక్తమ్ మయా=has been told by me; అనఘ=O sinless one; ఏతత్ బుద్ధ్వా=knowing this; బుద్ధిమాన్ స్యాత్=one becomes wise; కృతకృత్యః చ=and one who has accomplished all duties; భారత=O Bharata"};


// Chapter 16 – shlokas 16.1 to 16.12. Paste after your D object.
D["16.1"]={t:["శ్రీభగవానువాచ |","అభయం సత్త్వసంశుద్ధిర్జ్ఞానయోగవ్యవస్థితిః |","దానం దమశ్చ యజ్ఞశ్చ స్వాధ్యాయస్తప ఆర్జవమ్ ||"],mt:"శ్రీభగవానుడు పలికెను: అభయము, సత్త్వసంశుద్ధి, జ్ఞానయోగనిష్ఠ, దానము, దమము, యజ్ఞము, స్వాధ్యాయము, తపస్సు, ఆర్జవము... (16.3 వరకు కొనసాగును)",m:"The Blessed Lord said: Fearlessness, purity of heart, steadfastness in the yoga of knowledge, charity, self-control, sacrifice, study of the scriptures, austerity and uprightness... (continues to 16.3)",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; అభయమ్=fearlessness; సత్త్వసంశుద్ధిః=purity of heart; జ్ఞానయోగవ్యవస్థితిః=steadfastness in the yoga of knowledge; దానమ్=charity; దమః=self-control; చ యజ్ఞః చ=and sacrifice; స్వాధ్యాయః=study of the scriptures; తపః=austerity; ఆర్జవమ్=uprightness"};
D["16.2"]={t:["అహింసా సత్యమక్రోధస్త్యాగః శాన్తిరపైశునమ్ |","దయా భూతేష్వలోలుప్త్వం మార్దవం హ్రీరచాపలమ్ ||"],mt:"...అహింస, సత్యము, అక్రోధము, త్యాగము, శాంతి, పరనిందలేమి, ప్రాణులపై దయ, లోభరాహిత్యము, మృదుత్వము, లజ్జ, చాపల్యరాహిత్యము...",m:"...non-violence, truth, freedom from anger, renunciation, tranquillity, freedom from slander, compassion for beings, freedom from greed, gentleness, modesty and freedom from restlessness...",w:"అహింసా=non-violence; సత్యమ్=truth; అక్రోధః=freedom from anger; త్యాగః=renunciation; శాన్తిః=tranquillity; అపైశునమ్=freedom from slander; దయా భూతేషు=compassion for beings; అలోలుప్త్వమ్=freedom from greed; మార్దవమ్=gentleness; హ్రీః=modesty; అచాపలమ్=freedom from restlessness"};
D["16.3"]={t:["తేజః క్షమా ధృతిః శౌచమద్రోహో నాతిమానితా |","భవన్తి సమ్పదం దైవీమభిజాతస్య భారత ||"],mt:"...తేజస్సు, క్షమ, ధృతి, శౌచము, ద్రోహరాహిత్యము, అతిమానితా లేకపోవుట — ఓ భారతా! ఇవి దైవీసంపదతో జన్మించినవానికి కలుగును.",m:"...vigour, forgiveness, fortitude, purity, freedom from malice and absence of excessive pride: these belong to one born with a divine endowment, O Bharata.",w:"తేజః=vigour; క్షమా=forgiveness; ధృతిః=fortitude; శౌచమ్=purity; అద్రోహః=freedom from malice; న అతిమానితా=absence of excessive pride; భవన్తి=arise; సమ్పదమ్ దైవీమ్ అభిజాతస్య=for one born with divine endowment; భారత=O Bharata"};
D["16.4"]={t:["దమ్భో దర్పోఽభిమానశ్చ క్రోధః పారుష్యమేవ చ |","అజ్ఞానం చాభిజాతస్య పార్థ సమ్పదమాసురీమ్ ||"],mt:"ఓ పార్థా! దంభము, దర్పము, అభిమానము, క్రోధము, పరుషత్వము, అజ్ఞానము — ఇవి ఆసురీసంపదతో జన్మించినవానికి కలుగును.",m:"Hypocrisy, arrogance, conceit, anger, harshness and ignorance belong to one born with a demonic endowment, O Partha.",w:"దమ్భః=hypocrisy; దర్పః=arrogance; అభిమానః చ=and conceit; క్రోధః=anger; పారుష్యమ్=harshness; ఏవ చ=and; అజ్ఞానమ్ చ=and ignorance; అభిజాతస్య=for one born; పార్థ=O Partha; సమ్పదమ్ ఆసురీమ్=with demonic endowment"};
D["16.5"]={t:["దైవీ సమ్పద్విమోక్షాయ నిబన్ధాయాసురీ మతా |","మా శుచః సమ్పదం దైవీమభిజాతోఽసి పాణ్డవ ||"],mt:"దైవీసంపద మోక్షమునకును, ఆసురీసంపద బంధమునకును అని భావింపబడును; ఓ పాండవా! శోకింపకుము; నీవు దైవీసంపదతో జన్మించితివి.",m:"The divine endowment is considered to lead to liberation and the demonic to bondage. Do not grieve, O Pandava; you are born with a divine endowment.",w:"దైవీ సమ్పత్=divine endowment; విమోక్షాయ=for liberation; నిబన్ధాయ=for bondage; ఆసురీ=demonic; మతా=is considered; మా శుచః=do not grieve; సమ్పదమ్ దైవీమ్ అభిజాతః అసి=you are born with divine endowment; పాణ్డవ=O Pandava"};
D["16.6"]={t:["ద్వౌ భూతసర్గౌ లోకేఽస్మిన్దైవ ఆసుర ఏవ చ |","దైవో విస్తరశః ప్రోక్త ఆసురం పార్థ మే శృణు ||"],mt:"ఓ పార్థా! ఈ లోకమున దైవము, ఆసురము అను రెండు విధములైన భూతసృష్టులున్నవి; దైవమును విస్తారముగా చెప్పితిని; ఆసురమును నా వద్ద వినుము.",m:"There are two kinds of created beings in this world, the divine and the demonic. The divine has been described at length; now hear from me about the demonic, O Partha.",w:"ద్వౌ భూతసర్గౌ=two kinds of created beings; లోకే అస్మిన్=in this world; దైవః=divine; ఆసురః ఏవ చ=and demonic; దైవః విస్తరశః ప్రోక్తః=the divine has been told at length; ఆసురమ్=the demonic; పార్థ=O Partha; మే శృణు=hear from me"};
D["16.7"]={t:["ప్రవృత్తిం చ నివృత్తిం చ జనా న విదురాసురాః |","న శౌచం నాపి చాచారో న సత్యం తేషు విద్యతే ||"],mt:"ఆసురజనులు ప్రవృత్తిని, నివృత్తిని ఎరుగరు; వారియందు శౌచము లేదు, ఆచారము లేదు, సత్యము లేదు.",m:"Demonic people do not know what to do and what to refrain from; neither purity, nor good conduct, nor truth is found in them.",w:"ప్రవృత్తిమ్ చ నివృత్తిమ్ చ=what to engage in and what to refrain from; జనాః ఆసురాః=demonic people; న విదుః=do not know; న శౌచమ్=no purity; న అపి చ ఆచారః=nor good conduct; న సత్యమ్=nor truth; తేషు విద్యతే=is found in them"};
D["16.8"]={t:["అసత్యమప్రతిష్ఠం తే జగదాహురనీశ్వరమ్ |","అపరస్పరసమ్భూతం కిమన్యత్కామహైతుకమ్ ||"],mt:"వారు “జగత్తు సత్యరహితము, ఆధారరహితము, ఈశ్వరుడు లేనిది, పరస్పరసంయోగముచే పుట్టినది కాదు, కామహేతుకము తప్ప మరేమి?” అని చెప్పుదురు.",m:"They say, “The world is unreal, without foundation, without a Lord, not produced by any orderly sequence; what else is it but caused by desire?”",w:"అసత్యమ్=unreal; అప్రతిష్ఠమ్=without foundation; తే=they; జగత్ ఆహుః=say the world is; అనీశ్వరమ్=without a Lord; అపరస్పరసమ్భూతమ్=not produced by any orderly sequence; కిమ్ అన్యత్=what else; కామహైతుకమ్=caused by desire"};
D["16.9"]={t:["ఏతాం దృష్టిమవష్టభ్య నష్టాత్మానోఽల్పబుద్ధయః |","ప్రభవన్త్యుగ్రకర్మాణః క్షయాయ జగతోఽహితాః ||"],mt:"ఈ దృష్టిని ఆశ్రయించి నష్టాత్ములై అల్పబుద్ధులైన, ఉగ్రకర్ములు, జగత్తునకు శత్రువులు లోకనాశనము కొరకు ప్రభవింతురు.",m:"Holding this view, these lost souls of small intellect, of cruel deeds and enemies of the world, arise for the destruction of the world.",w:"ఏతామ్ దృష్టిమ్ అవష్టభ్య=holding this view; నష్టాత్మానః=lost souls; అల్పబుద్ధయః=of small intellect; ప్రభవన్తి=arise; ఉగ్రకర్మాణః=of cruel deeds; క్షయాయ జగతః=for the destruction of the world; అహితాః=enemies"};
D["16.10"]={t:["కామమాశ్రిత్య దుష్పూరం దమ్భమానమదాన్వితాః |","మోహాద్గృహీత్వాసద్గ్రాహాన్ప్రవర్తన్తేఽశుచివ్రతాః ||"],mt:"తీరని కామమును ఆశ్రయించి, దంభమానమదములతో కూడి, మోహముచే అసద్గ్రహములను గ్రహించి అశుచివ్రతులై ప్రవర్తింతురు.",m:"Taking refuge in insatiable desire, filled with hypocrisy, pride and arrogance, adopting wrong notions through delusion, they act with impure vows.",w:"కామమ్ ఆశ్రిత్య దుష్పూరమ్=taking refuge in insatiable desire; దమ్భమానమదాన్వితాః=filled with hypocrisy, pride and arrogance; మోహాత్=through delusion; గృహీత్వా అసద్గ్రాహాన్=adopting wrong notions; ప్రవర్తన్తే=act; అశుచివ్రతాః=with impure vows"};
D["16.11"]={t:["చిన్తామపరిమేయాం చ ప్రలయాన్తాముపాశ్రితాః |","కామోపభోగపరమా ఏతావదితి నిశ్చితాః ||"],mt:"ప్రళయాంతము (మరణము) వరకు కొలవలేని చింతను ఆశ్రయించి, కామోపభోగములే పరమమని, ఇంతే అని నిశ్చయించినవారు... (16.12 లో కొనసాగును)",m:"Resorting to immeasurable anxiety lasting until death, regarding the enjoyment of desires as supreme and convinced that “this is all”... (continues in 16.12)",w:"చిన్తామ్ అపరిమేయామ్ చ=and immeasurable anxiety; ప్రలయాన్తామ్=lasting until death; ఉపాశ్రితాః=resorting to; కామోపభోగపరమాః=regarding enjoyment of desires as supreme; ఏతావత్ ఇతి నిశ్చితాః=convinced that this is all"};
D["16.12"]={t:["ఆశాపాశశతైర్బద్ధాః కామక్రోధపరాయణాః |","ఈహన్తే కామభోగార్థమన్యాయేనార్థసఞ్చయాన్ ||"],mt:"...వందలాది ఆశాపాశములచే బంధింపబడి, కామక్రోధపరాయణులై, కామభోగముల కొరకు అన్యాయముగా ధనరాసులను కూడబెట్టగోరుదురు.",m:"...bound by hundreds of snares of hope, devoted to lust and anger, they strive to hoard wealth by unjust means for the enjoyment of desires.",w:"ఆశాపాశశతైః=by hundreds of snares of hope; బద్ధాః=bound; కామక్రోధపరాయణాః=devoted to lust and anger; ఈహన్తే=they strive; కామభోగార్థమ్=for the enjoyment of desires; అన్యాయేన=by unjust means; అర్థసఞ్చయాన్=hoards of wealth"};

// Chapter 16 – shlokas 16.13 to 16.24 (completes chapter 16). Paste after your D object.
D["16.13"]={t:["ఇదమద్య మయా లబ్ధమిమం ప్రాప్స్యే మనోరథమ్ |","ఇదమస్తీదమపి మే భవిష్యతి పునర్ధనమ్ ||"],mt:"“ఇది ఇప్పుడు నాచే పొందబడినది; ఈ కోరికను పొందెదను; ఇది నాకు ఉన్నది; ఈ ధనము కూడా మరల నాకు కలుగును”... (16.15 వరకు కొనసాగును)",m:"“This I have gained today; this desire I shall fulfil; this is mine, and this wealth too will be mine again”... (continues to 16.15)",w:"ఇదమ్ అద్య మయా లబ్ధమ్=this I have gained today; ఇమమ్ ప్రాప్స్యే మనోరథమ్=I shall obtain this desire; ఇదమ్ అస్తి=this is mine; ఇదమ్ అపి మే భవిష్యతి=this too will be mine; పునః ధనమ్=more wealth"};
D["16.14"]={t:["అసౌ మయా హతః శత్రుర్హనిష్యే చాపరానపి |","ఈశ్వరోఽహమహం భోగీ సిద్ధోఽహం బలవాన్సుఖీ ||"],mt:"“ఆ శత్రువు నాచే చంపబడెను; ఇతరులను కూడా చంపెదను; నేను ఈశ్వరుడను, భోగిని, సిద్ధుడను, బలవంతుడను, సుఖిని”...",m:"“That enemy has been slain by me, and I shall slay others too; I am the lord, I am the enjoyer, I am successful, powerful and happy”...",w:"అసౌ మయా హతః శత్రుః=that enemy has been slain by me; హనిష్యే చ అపరాన్ అపి=and I shall slay others too; ఈశ్వరః అహమ్=I am the lord; అహమ్ భోగీ=I am the enjoyer; సిద్ధః అహమ్=I am successful; బలవాన్=powerful; సుఖీ=happy"};
D["16.15"]={t:["ఆఢ్యోఽభిజనవానస్మి కోఽన్యోఽస్తి సదృశో మయా |","యక్ష్యే దాస్యామి మోదిష్య ఇత్యజ్ఞానవిమోహితాః ||"],mt:"“నేను ధనికుడను, కులీనుడను; నాతో సమానుడు ఎవడు? యజ్ఞము చేసెదను, దానము చేసెదను, ఆనందించెదను” అని అజ్ఞానముచే మోహితులై... (16.16 లో కొనసాగును)",m:"“I am wealthy and well-born; who else is equal to me? I shall perform sacrifices, I shall give, I shall rejoice”: thus deluded by ignorance... (continues in 16.16)",w:"ఆఢ్యః=wealthy; అభిజనవాన్ అస్మి=I am of noble birth; కః అన్యః అస్తి సదృశః మయా=who else is equal to me; యక్ష్యే=I shall sacrifice; దాస్యామి=I shall give charity; మోదిష్యే=I shall rejoice; ఇతి అజ్ఞానవిమోహితాః=thus deluded by ignorance"};
D["16.16"]={t:["అనేకచిత్తవిభ్రాన్తా మోహజాలసమావృతాః |","ప్రసక్తాః కామభోగేషు పతన్తి నరకేఽశుచౌ ||"],mt:"...అనేక చింతలచే కలతచెందినవారు, మోహజాలముచే కప్పబడినవారు, కామభోగములయందు ఆసక్తులై అశుచియైన నరకమున పడుదురు.",m:"...bewildered by many thoughts, entangled in a net of delusion and addicted to the enjoyment of desires, they fall into a foul hell.",w:"అనేకచిత్తవిభ్రాన్తాః=bewildered by many thoughts; మోహజాలసమావృతాః=entangled in a net of delusion; ప్రసక్తాః కామభోగేషు=addicted to the enjoyment of desires; పతన్తి=they fall; నరకే అశుచౌ=into a foul hell"};
D["16.17"]={t:["ఆత్మసమ్భావితాః స్తబ్ధా ధనమానమదాన్వితాః |","యజన్తే నామయజ్ఞైస్తే దమ్భేనావిధిపూర్వకమ్ ||"],mt:"ఆత్మాభిమానులు, మొండివారు, ధనమానమదములతో కూడినవారు, దంభముతో అవిధిపూర్వకముగా నామమాత్రయజ్ఞములచే యజింతురు.",m:"Self-conceited, obstinate, filled with the pride and intoxication of wealth, they perform sacrifices in name only, out of ostentation and contrary to scriptural injunction.",w:"ఆత్మసమ్భావితాః=self-conceited; స్తబ్ధాః=obstinate; ధనమానమదాన్వితాః=filled with the pride and intoxication of wealth; యజన్తే=they perform sacrifices; నామయజ్ఞైః=in name only; తే=they; దమ్భేన=out of ostentation; అవిధిపూర్వకమ్=contrary to scriptural injunction"};
D["16.18"]={t:["అహఙ్కారం బలం దర్పం కామం క్రోధం చ సంశ్రితాః |","మామాత్మపరదేహేషు ప్రద్విషన్తోఽభ్యసూయకాః ||"],mt:"అహంకారము, బలము, దర్పము, కామము, క్రోధము ఆశ్రయించినవారు, తమ దేహములలోను ఇతరుల దేహములలోను ఉన్న నన్ను ద్వేషించుచు, అసూయపడుదురు.",m:"Taking refuge in ego, power, arrogance, lust and anger, these envious people hate me dwelling in their own bodies and in those of others.",w:"అహఙ్కారమ్ బలమ్ దర్పమ్ కామమ్ క్రోధమ్ చ=ego, power, arrogance, lust and anger; సంశ్రితాః=taking refuge in; మామ్ ఆత్మపరదేహేషు=me in their own and others’ bodies; ప్రద్విషన్తః=hating; అభ్యసూయకాః=envious"};
D["16.19"]={t:["తానహం ద్విషతః క్రూరాన్సంసారేషు నరాధమాన్ |","క్షిపామ్యజస్రమశుభానాసురీష్వేవ యోనిషు ||"],mt:"ద్వేషించు క్రూరులైన, సంసారములలో నరాధములైన ఆ అశుభులను నేను ఆసురయోనులలోనే నిరంతరము పడవేయుదును.",m:"Those hateful, cruel and evil people, the lowest of men in the cycles of birth, I constantly hurl into demonic wombs alone.",w:"తాన్ అహమ్ ద్విషతః క్రూరాన్=those hateful, cruel ones; సంసారేషు నరాధమాన్=the lowest of men in the cycles of birth; క్షిపామి అజస్రమ్=I hurl constantly; అశుభాన్=the evil; ఆసురీషు ఏవ యోనిషు=into demonic wombs alone"};
D["16.20"]={t:["ఆసురీం యోనిమాపన్నా మూఢా జన్మని జన్మని |","మామప్రాప్యైవ కౌన్తేయ తతో యాన్త్యధమాం గతిమ్ ||"],mt:"ఓ కౌంతేయా! ఆసురయోనిని పొందిన మూఢులు జన్మజన్మలయందు నన్ను పొందక అంతకంటె అధమగతిని పొందుదురు.",m:"Having entered demonic wombs, the deluded, birth after birth, without ever reaching me, O son of Kunti, go to a still lower state.",w:"ఆసురీమ్ యోనిమ్ ఆపన్నాః=having entered demonic wombs; మూఢాః=the deluded; జన్మని జన్మని=birth after birth; మామ్ అప్రాప్య ఏవ=without reaching me; కౌన్తేయ=O son of Kunti; తతః యాన్తి=then go; అధమామ్ గతిమ్=to a lower state"};
D["16.21"]={t:["త్రివిధం నరకస్యేదం ద్వారం నాశనమాత్మనః |","కామః క్రోధస్తథా లోభస్తస్మాదేతత్త్రయం త్యజేత్ ||"],mt:"కామము, క్రోధము, లోభము అను ఈ మూడు నరకద్వారములు ఆత్మనాశకములు; కావున ఈ మూడింటిని విడువవలెను.",m:"This threefold gate of hell, destructive of the self, is lust, anger and greed; therefore one should abandon these three.",w:"త్రివిధమ్=threefold; ఇదమ్ ద్వారమ్ నరకస్య=this gate of hell; నాశనమ్ ఆత్మనః=destructive of the self; కామః=lust; క్రోధః=anger; తథా లోభః=and greed; తస్మాత్=therefore; ఏతత్ త్రయమ్ త్యజేత్=one should abandon these three"};
D["16.22"]={t:["ఏతైర్విముక్తః కౌన్తేయ తమోద్వారైస్త్రిభిర్నరః |","ఆచరత్యాత్మనః శ్రేయస్తతో యాతి పరాం గతిమ్ ||"],mt:"ఓ కౌంతేయా! ఈ మూడు తమోద్వారములనుండి విముక్తుడైన నరుడు తన శ్రేయస్సును ఆచరించి, అందువలన పరమగతిని పొందును.",m:"A person freed from these three gates to darkness, O son of Kunti, practises what is good for himself and thereby reaches the supreme goal.",w:"ఏతైః విముక్తః=freed from these; కౌన్తేయ=O son of Kunti; తమోద్వారైః త్రిభిః=three gates to darkness; నరః=a person; ఆచరతి ఆత్మనః శ్రేయః=practises what is good for himself; తతః=then; యాతి పరామ్ గతిమ్=reaches the supreme goal"};
D["16.23"]={t:["యః శాస్త్రవిధిముత్సృజ్య వర్తతే కామకారతః |","న స సిద్ధిమవాప్నోతి న సుఖం న పరాం గతిమ్ ||"],mt:"శాస్త్రవిధిని విడిచి కామప్రేరితుడై ప్రవర్తించువాడు సిద్ధిని, సుఖమును, పరమగతిని పొందడు.",m:"One who discards the injunctions of the scriptures and acts under the impulse of desire attains neither perfection, nor happiness, nor the supreme goal.",w:"యః=who; శాస్త్రవిధిమ్ ఉత్సృజ్య=discarding scriptural injunction; వర్తతే=acts; కామకారతః=under the impulse of desire; న సః సిద్ధిమ్ అవాప్నోతి=he does not attain perfection; న సుఖమ్=nor happiness; న పరామ్ గతిమ్=nor the supreme goal"};
D["16.24"]={t:["తస్మాచ్ఛాస్త్రం ప్రమాణం తే కార్యాకార్యవ్యవస్థితౌ |","జ్ఞాత్వా శాస్త్రవిధానోక్తం కర్మ కర్తుమిహార్హసి ||"],mt:"కావున ఏది చేయదగినది, ఏది చేయరానిది అని నిర్ణయించుటలో శాస్త్రమే నీకు ప్రమాణము; శాస్త్రవిధానముచే చెప్పబడిన కర్మను తెలిసికొని ఇచట చేయదగినవాడవు.",m:"Therefore let the scripture be your authority in determining what should and should not be done; knowing what is prescribed by scriptural injunction, you should act here accordingly.",w:"తస్మాత్=therefore; శాస్త్రమ్=scripture; ప్రమాణమ్ తే=is your authority; కార్యాకార్యవ్యవస్థితౌ=in determining what should and should not be done; జ్ఞాత్వా=knowing; శాస్త్రవిధానోక్తమ్=what is prescribed by scriptural injunction; కర్మ=action; కర్తుమ్=to perform; ఇహ అర్హసి=you should here"};


// Chapter 17 – shlokas 17.1 to 17.14. Paste after your D object.
D["17.1"]={t:["అర్జున ఉవాచ |","యే శాస్త్రవిధిముత్సృజ్య యజన్తే శ్రద్ధయాన్వితాః |","తేషాం నిష్ఠా తు కా కృష్ణ సత్త్వమాహో రజస్తమః ||"],mt:"అర్జునుడు పలికెను: ఓ కృష్ణా! శాస్త్రవిధిని విడిచి శ్రద్ధతో యజించువారి నిష్ఠ ఏది? సత్త్వమా, రజస్సా, తమస్సా?",m:"Arjuna said: O Krishna, what is the standing of those who, discarding scriptural injunction, worship with faith? Is it goodness, passion or ignorance?",w:"అర్జునః ఉవాచ=Arjuna said; యే=who; శాస్త్రవిధిమ్ ఉత్సృజ్య=discarding scriptural injunction; యజన్తే=worship; శ్రద్ధయా అన్వితాః=endowed with faith; తేషామ్=their; నిష్ఠా=standing; తు కా=what is it; కృష్ణ=O Krishna; సత్త్వమ్ ఆహో రజః తమః=goodness, or passion, or ignorance"};
D["17.2"]={t:["శ్రీభగవానువాచ |","త్రివిధా భవతి శ్రద్ధా దేహినాం సా స్వభావజా |","సాత్త్వికీ రాజసీ చైవ తామసీ చేతి తాం శృణు ||"],mt:"శ్రీభగవానుడు పలికెను: దేహధారులకు స్వభావజమైన శ్రద్ధ సాత్త్వికము, రాజసము, తామసము అని మూడు విధములు; దానిని వినుము.",m:"The Blessed Lord said: The faith of embodied beings, born of their nature, is of three kinds: sattvic, rajasic and tamasic. Hear about it.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; త్రివిధా భవతి=is threefold; శ్రద్ధా=faith; దేహినామ్=of the embodied; సా స్వభావజా=born of one’s nature; సాత్త్వికీ=of goodness; రాజసీ చ ఏవ=and of passion; తామసీ చ=and of ignorance; ఇతి=thus; తామ్ శృణు=hear it"};
D["17.3"]={t:["సత్త్వానురూపా సర్వస్య శ్రద్ధా భవతి భారత |","శ్రద్ధామయోఽయం పురుషో యో యచ్ఛ్రద్ధః స ఏవ సః ||"],mt:"ఓ భారతా! అందరి శ్రద్ధ వారి అంతఃకరణ స్వభావమునకు అనుగుణముగా ఉండును; ఈ పురుషుడు శ్రద్ధామయుడు; ఎవడు ఏ శ్రద్ధ గలవాడో అతడు అదే.",m:"The faith of everyone conforms to their mind, O Bharata. A person is made of faith; whatever one’s faith is, that very person one is.",w:"సత్త్వానురూపా=in accordance with one’s mind; సర్వస్య=of everyone; శ్రద్ధా భవతి=faith is; భారత=O Bharata; శ్రద్ధామయః అయమ్ పురుషః=this person is made of faith; యః యత్ శ్రద్ధః=whatever one’s faith; సః ఏవ సః=that very one he is"};
D["17.4"]={t:["యజన్తే సాత్త్వికా దేవాన్యక్షరక్షాంసి రాజసాః |","ప్రేతాన్భూతగణాంశ్చాన్యే యజన్తే తామసా జనాః ||"],mt:"సాత్త్వికులు దేవతలను పూజింతురు; రాజసులు యక్షరాక్షసులను; తామసజనులు ప్రేతములను భూతగణములను పూజింతురు.",m:"The sattvic worship the gods; the rajasic worship Yakshas and Rakshasas; and others, the tamasic people, worship ghosts and hosts of spirits.",w:"యజన్తే=worship; సాత్త్వికాః=the sattvic; దేవాన్=the gods; యక్షరక్షాంసి=Yakshas and Rakshasas; రాజసాః=the rajasic; ప్రేతాన్=ghosts; భూతగణాన్ చ=and hosts of spirits; అన్యే=others; తామసాః జనాః=tamasic people"};
D["17.5"]={t:["అశాస్త్రవిహితం ఘోరం తప్యన్తే యే తపో జనాః |","దమ్భాహఙ్కారసంయుక్తాః కామరాగబలాన్వితాః ||"],mt:"శాస్త్రవిహితము కాని ఘోరమైన తపస్సును దంభాహంకారములతో కూడి, కామరాగబలములతో కూడిన జనులు చేయుదురు... (17.6 లో కొనసాగును)",m:"Those people who perform terrible austerities not prescribed by scripture, filled with hypocrisy and egotism, driven by desire, attachment and force... (continues in 17.6)",w:"అశాస్త్రవిహితమ్=not prescribed by scripture; ఘోరమ్=terrible; తప్యన్తే=perform; యే తపః జనాః=people who austerity; దమ్భాహఙ్కారసంయుక్తాః=filled with hypocrisy and egotism; కామరాగబలాన్వితాః=driven by desire, attachment and force"};
D["17.6"]={t:["కర్శయన్తః శరీరస్థం భూతగ్రామమచేతసః |","మాం చైవాన్తఃశరీరస్థం తాన్విద్ధ్యాసురనిశ్చయాన్ ||"],mt:"...శరీరమందున్న భూతసమూహమును, శరీరాంతరమున ఉన్న నన్నును కూడా బాధించు ఆ అవివేకులను ఆసురనిశ్చయులుగా తెలిసికొనుము.",m:"...tormenting the elements residing in the body and me too, who dwell within the body, those senseless people: know them to be of demonic resolve.",w:"కర్శయన్తః=tormenting; శరీరస్థమ్ భూతగ్రామమ్=the elements residing in the body; అచేతసః=the senseless; మామ్ చ ఏవ అన్తఃశరీరస్థమ్=and me, who dwell within the body; తాన్ విద్ధి=know them; ఆసురనిశ్చయాన్=of demonic resolve"};
D["17.7"]={t:["ఆహారస్త్వపి సర్వస్య త్రివిధో భవతి ప్రియః |","యజ్ఞస్తపస్తథా దానం తేషాం భేదమిమం శృణు ||"],mt:"అందరికి ఇష్టమైన ఆహారమును మూడు విధములు; యజ్ఞము, తపస్సు, దానమును కూడా అట్లే; వాటి ఈ భేదమును వినుము.",m:"The food dear to everyone is also of three kinds, and so are sacrifice, austerity and charity. Hear the distinction among them.",w:"ఆహారః తు అపి సర్వస్య=food also of everyone; త్రివిధః భవతి ప్రియః=is dear in three kinds; యజ్ఞః=sacrifice; తపః=austerity; తథా దానమ్=and charity; తేషామ్ భేదమ్ ఇమమ్=this distinction among them; శృణు=hear"};
D["17.8"]={t:["ఆయుఃసత్త్వబలారోగ్యసుఖప్రీతివివర్ధనాః |","రస్యాః స్నిగ్ధాః స్థిరా హృద్యా ఆహారాః సాత్త్వికప్రియాః ||"],mt:"ఆయుస్సు, సత్త్వము, బలము, ఆరోగ్యము, సుఖము, ప్రీతిని పెంచునవి, రసయుక్తములు, స్నిగ్ధములు, స్థిరములు, మనోహరములైన ఆహారములు సాత్త్వికులకు ప్రియములు.",m:"Foods that increase life, vitality, strength, health, happiness and cheer, which are juicy, soft, substantial and agreeable, are dear to the sattvic.",w:"ఆయుఃసత్త్వబలారోగ్యసుఖప్రీతివివర్ధనాః=increasing life, vitality, strength, health, happiness and cheer; రస్యాః=juicy; స్నిగ్ధాః=soft; స్థిరాః=substantial; హృద్యాః=agreeable; ఆహారాః=foods; సాత్త్వికప్రియాః=dear to the sattvic"};
D["17.9"]={t:["కట్వమ్లలవణాత్యుష్ణతీక్ష్ణరూక్షవిదాహినః |","ఆహారా రాజసస్యేష్టా దుఃఖశోకామయప్రదాః ||"],mt:"చేదు, పులుపు, ఉప్పు, అతివేడి, ఘాటు, పొడి, మంట కలిగించు ఆహారములు రాజసులకు ఇష్టములు; అవి దుఃఖశోకరోగములను కలిగించును.",m:"Foods that are bitter, sour, salty, very hot, pungent, dry and burning are liked by the rajasic and cause pain, grief and disease.",w:"కటు=bitter; అమ్ల=sour; లవణ=salty; అత్యుష్ణ=very hot; తీక్ష్ణ=pungent; రూక్ష=dry; విదాహినః=burning; ఆహారాః=foods; రాజసస్య ఇష్టాః=liked by the rajasic; దుఃఖశోకామయప్రదాః=causing pain, grief and disease"};
D["17.10"]={t:["యాతయామం గతరసం పూతి పర్యుషితం చ యత్ |","ఉచ్ఛిష్టమపి చామేధ్యం భోజనం తామసప్రియమ్ ||"],mt:"పాతబడినది, రసహీనమైనది, దుర్గంధము గలది, చలిబడినది, ఎంగిలిది, అపవిత్రమైనది అయిన భోజనము తామసులకు ప్రియము.",m:"Food that is stale, tasteless, putrid, left overnight, leftover and impure is dear to the tamasic.",w:"యాతయామమ్=stale; గతరసమ్=tasteless; పూతి=putrid; పర్యుషితమ్ చ=and left overnight; యత్=which; ఉచ్ఛిష్టమ్ అపి చ=and leftover; అమేధ్యమ్=impure; భోజనమ్=food; తామసప్రియమ్=dear to the tamasic"};
D["17.11"]={t:["అఫలాకాఙ్క్షిభిర్యజ్ఞో విధిదృష్టో య ఇజ్యతే |","యష్టవ్యమేవేతి మనః సమాధాయ స సాత్త్వికః ||"],mt:"ఫలాపేక్ష లేనివారిచే, “చేయవలసినదే” అని మనస్సును నిలిపి, శాస్త్రవిధి ప్రకారము చేయబడు యజ్ఞము సాత్త్వికము.",m:"The sacrifice performed as enjoined by scripture, by those who desire no reward, with the mind fixed on the thought “it must be performed,” is sattvic.",w:"అఫలాకాఙ్క్షిభిః=by those who desire no reward; యజ్ఞః=sacrifice; విధిదృష్టః=enjoined by scripture; యః ఇజ్యతే=which is performed; యష్టవ్యమ్ ఏవ ఇతి=thinking “it must be performed”; మనః సమాధాయ=fixing the mind; సః సాత్త్వికః=that is sattvic"};
D["17.12"]={t:["అభిసన్ధాయ తు ఫలం దమ్భార్థమపి చైవ యత్ |","ఇజ్యతే భరతశ్రేష్ఠ తం యజ్ఞం విద్ధి రాజసమ్ ||"],mt:"ఓ భరతశ్రేష్ఠా! ఫలమును ఉద్దేశించి, దంభము కొరకు చేయబడు యజ్ఞమును రాజసమని తెలిసికొనుము.",m:"But the sacrifice performed with an eye to its reward and also for ostentation, O best of the Bharatas, know that to be rajasic.",w:"అభిసన్ధాయ తు ఫలమ్=aiming at a reward; దమ్భార్థమ్ అపి చ ఏవ యత్=and also for ostentation; ఇజ్యతే=is performed; భరతశ్రేష్ఠ=O best of the Bharatas; తమ్ యజ్ఞమ్ విద్ధి రాజసమ్=know that sacrifice to be rajasic"};
D["17.13"]={t:["విధిహీనమసృష్టాన్నం మన్త్రహీనమదక్షిణమ్ |","శ్రద్ధావిరహితం యజ్ఞం తామసం పరిచక్షతే ||"],mt:"విధిహీనమైనది, అన్నదానములేనిది, మంత్రహీనము, దక్షిణలేనిది, శ్రద్ధారహితమైన యజ్ఞమును తామసమని చెప్పుదురు.",m:"A sacrifice that is devoid of prescribed rules, in which no food is distributed, without mantras, without gifts and devoid of faith, is called tamasic.",w:"విధిహీనమ్=devoid of prescribed rules; అసృష్టాన్నమ్=without distributing food; మన్త్రహీనమ్=without mantras; అదక్షిణమ్=without gifts; శ్రద్ధావిరహితమ్=devoid of faith; యజ్ఞమ్=sacrifice; తామసమ్ పరిచక్షతే=they call tamasic"};
D["17.14"]={t:["దేవద్విజగురుప్రాజ్ఞపూజనం శౌచమార్జవమ్ |","బ్రహ్మచర్యమహింసా చ శారీరం తప ఉచ్యతే ||"],mt:"దేవతలను, ద్విజులను, గురువులను, ప్రాజ్ఞులను పూజించుట, శౌచము, ఆర్జవము, బ్రహ్మచర్యము, అహింస — ఇవి శారీరక తపస్సనబడును.",m:"Worship of the gods, the twice-born, teachers and the wise; purity, uprightness, celibacy and non-violence: these are called austerity of the body.",w:"దేవద్విజగురుప్రాజ్ఞపూజనమ్=worship of the gods, the twice-born, teachers and the wise; శౌచమ్=purity; ఆర్జవమ్=uprightness; బ్రహ్మచర్యమ్=celibacy; అహింసా చ=and non-violence; శారీరమ్ తపః=austerity of the body; ఉచ్యతే=is called"};


// Chapter 17 – shlokas 17.15 to 17.28 (completes chapter 17). Paste after your D object.
D["17.15"]={t:["అనుద్వేగకరం వాక్యం సత్యం ప్రియహితం చ యత్ |","స్వాధ్యాయాభ్యసనం చైవ వాఙ్మయం తప ఉచ్యతే ||"],mt:"ఉద్వేగము కలిగించని, సత్యమైన, ప్రియమైన, హితమైన వాక్యము, స్వాధ్యాయాభ్యాసము — ఇది వాచిక తపస్సనబడును.",m:"Speech that causes no distress, that is truthful, pleasant and beneficial, and regular study of the scriptures: this is called austerity of speech.",w:"అనుద్వేగకరమ్=causing no distress; వాక్యమ్=speech; సత్యమ్=truthful; ప్రియహితమ్ చ=pleasant and beneficial; యత్=which; స్వాధ్యాయాభ్యసనమ్ చ ఏవ=and regular study of scripture; వాఙ్మయమ్ తపః=austerity of speech; ఉచ్యతే=is called"};
D["17.16"]={t:["మనఃప్రసాదః సౌమ్యత్వం మౌనమాత్మవినిగ్రహః |","భావసంశుద్ధిరిత్యేతత్తపో మానసముచ్యతే ||"],mt:"మనఃప్రసాదము, సౌమ్యత, మౌనము, ఆత్మనిగ్రహము, భావసంశుద్ధి — ఇది మానసిక తపస్సనబడును.",m:"Serenity of mind, gentleness, silence, self-control and purity of motive: this is called austerity of the mind.",w:"మనఃప్రసాదః=serenity of mind; సౌమ్యత్వమ్=gentleness; మౌనమ్=silence; ఆత్మవినిగ్రహః=self-control; భావసంశుద్ధిః=purity of motive; ఇతి ఏతత్=this; తపః మానసమ్=austerity of the mind; ఉచ్యతే=is called"};
D["17.17"]={t:["శ్రద్ధయా పరయా తప్తం తపస్తత్త్రివిధం నరైః |","అఫలాకాఙ్క్షిభిర్యుక్తైః సాత్త్వికం పరిచక్షతే ||"],mt:"ఫలాపేక్ష లేని యుక్తులైన నరులచే పరమశ్రద్ధతో ఆచరింపబడిన ఈ త్రివిధ తపస్సును సాత్త్వికమని చెప్పుదురు.",m:"This threefold austerity, practised with supreme faith by steadfast people who desire no reward, is called sattvic.",w:"శ్రద్ధయా పరయా=with supreme faith; తప్తమ్=practised; తపః తత్ త్రివిధమ్=that threefold austerity; నరైః=by people; అఫలాకాఙ్క్షిభిః=who desire no reward; యుక్తైః=steadfast; సాత్త్వికమ్ పరిచక్షతే=they call sattvic"};
D["17.18"]={t:["సత్కారమానపూజార్థం తపో దమ్భేన చైవ యత్ |","క్రియతే తదిహ ప్రోక్తం రాజసం చలమధ్రువమ్ ||"],mt:"సత్కారమానపూజల కొరకు దంభముతో చేయబడు తపస్సు ఇచట రాజసమని చెప్పబడును; అది చంచలము, అస్థిరము.",m:"Austerity practised for gaining respect, honour and worship, and out of ostentation, is said here to be rajasic, unsteady and impermanent.",w:"సత్కారమానపూజార్థమ్=for gaining respect, honour and worship; తపః=austerity; దమ్భేన చ ఏవ యత్=and out of ostentation; క్రియతే=is performed; తత్ ఇహ ప్రోక్తమ్ రాజసమ్=that is said here to be rajasic; చలమ్=unsteady; అధ్రువమ్=impermanent"};
D["17.19"]={t:["మూఢగ్రాహేణాత్మనో యత్పీడయా క్రియతే తపః |","పరస్యోత్సాదనార్థం వా తత్తామసముదాహృతమ్ ||"],mt:"మూఢమైన పట్టుదలతో, తనను బాధించుకొనుచు, లేదా ఇతరులను నాశనము చేయుటకు చేయబడు తపస్సు తామసమని చెప్పబడినది.",m:"Austerity performed with foolish obstinacy, by torturing oneself or to destroy another, is declared to be tamasic.",w:"మూఢగ్రాహేణ=with foolish obstinacy; ఆత్మనః పీడయా=by torturing oneself; యత్ తపః క్రియతే=austerity which is performed; పరస్య ఉత్సాదనార్థమ్ వా=or to destroy another; తత్ తామసమ్ ఉదాహృతమ్=that is declared tamasic"};
D["17.20"]={t:["దాతవ్యమితి యద్దానం దీయతేఽనుపకారిణే |","దేశే కాలే చ పాత్రే చ తద్దానం సాత్త్వికం స్మృతమ్ ||"],mt:"“ఇవ్వవలసినదే” అని, ప్రత్యుపకారము చేయని వానికి, తగిన దేశకాలపాత్రములయందు ఇచ్చు దానము సాత్త్వికమని చెప్పబడినది.",m:"A gift given as a duty, to one who can do nothing in return, in the proper place and time and to a worthy person, is considered sattvic.",w:"దాతవ్యమ్ ఇతి=thinking “it should be given”; యత్ దానమ్ దీయతే=the gift which is given; అనుపకారిణే=to one who does nothing in return; దేశే కాలే చ పాత్రే చ=in the proper place, time and to a worthy person; తత్ దానమ్ సాత్త్వికమ్ స్మృతమ్=that gift is considered sattvic"};
D["17.21"]={t:["యత్తు ప్రత్యుపకారార్థం ఫలముద్దిశ్య వా పునః |","దీయతే చ పరిక్లిష్టం తద్దానం రాజసం స్మృతమ్ ||"],mt:"ప్రత్యుపకారము కొరకు, లేదా ఫలమును ఉద్దేశించి, మనఃక్లేశముతో ఇచ్చు దానము రాజసమని చెప్పబడినది.",m:"But a gift given for the sake of a return, or with an eye to reward, or reluctantly, is considered rajasic.",w:"యత్ తు=but that which; ప్రత్యుపకారార్థమ్=for a return of favour; ఫలమ్ ఉద్దిశ్య వా పునః=or aiming at a reward; దీయతే చ=and is given; పరిక్లిష్టమ్=reluctantly; తత్ దానమ్ రాజసమ్ స్మృతమ్=that gift is considered rajasic"};
D["17.22"]={t:["అదేశకాలే యద్దానమపాత్రేభ్యశ్చ దీయతే |","అసత్కృతమవజ్ఞాతం తత్తామసముదాహృతమ్ ||"],mt:"తగని దేశకాలములలో, అపాత్రులకు, సత్కారము లేకుండా, అవజ్ఞతో ఇచ్చు దానము తామసమని చెప్పబడినది.",m:"A gift given at an improper place and time, to unworthy persons, without respect or with contempt, is declared to be tamasic.",w:"అదేశకాలే=at an improper place and time; యత్ దానమ్=the gift which; అపాత్రేభ్యః చ దీయతే=is given to unworthy persons; అసత్కృతమ్=without respect; అవజ్ఞాతమ్=with contempt; తత్ తామసమ్ ఉదాహృతమ్=that is declared tamasic"};
D["17.23"]={t:["ఓం తత్సదితి నిర్దేశో బ్రహ్మణస్త్రివిధః స్మృతః |","బ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా ||"],mt:"“ఓం తత్ సత్” అని బ్రహ్మమునకు త్రివిధ నిర్దేశము చెప్పబడినది; దానిచే పూర్వము బ్రాహ్మణులు, వేదములు, యజ్ఞములు విధింపబడెను.",m:"“Om Tat Sat” is remembered as the threefold designation of Brahman; by it the brahmins, the Vedas and sacrifices were ordained in the beginning.",w:"ఓమ్ తత్ సత్ ఇతి నిర్దేశః=the designation “Om Tat Sat”; బ్రహ్మణః=of Brahman; త్రివిధః స్మృతః=is remembered as threefold; బ్రాహ్మణాః=the brahmins; తేన=by it; వేదాః చ యజ్ఞాః చ=the Vedas and sacrifices; విహితాః పురా=were ordained in the beginning"};
D["17.24"]={t:["తస్మాదోమిత్యుదాహృత్య యజ్ఞదానతపఃక్రియాః |","ప్రవర్తన్తే విధానోక్తాః సతతం బ్రహ్మవాదినామ్ ||"],mt:"కావున బ్రహ్మవాదులకు విధానోక్తములైన యజ్ఞదానతపఃక్రియలు ఎల్లప్పుడును “ఓం” అని ఉచ్చరించి ప్రారంభింపబడును.",m:"Therefore the acts of sacrifice, charity and austerity, as prescribed, are always begun by the expounders of Brahman with the utterance of “Om.”",w:"తస్మాత్=therefore; ఓమ్ ఇతి ఉదాహృత్య=uttering “Om”; యజ్ఞదానతపఃక్రియాః=acts of sacrifice, charity and austerity; ప్రవర్తన్తే=begin; విధానోక్తాః=as prescribed; సతతమ్=always; బ్రహ్మవాదినామ్=of the expounders of Brahman"};
D["17.25"]={t:["తదిత్యనభిసన్ధాయ ఫలం యజ్ఞతపఃక్రియాః |","దానక్రియాశ్చ వివిధాః క్రియన్తే మోక్షకాఙ్క్షిభిః ||"],mt:"“తత్” అని ఫలమును ఆశింపక, మోక్షమును కోరువారు వివిధములైన యజ్ఞతపఃక్రియలను, దానక్రియలను చేయుదురు.",m:"Uttering “Tat,” and without aiming at the fruit, seekers of liberation perform various acts of sacrifice, austerity and charity.",w:"తత్ ఇతి=uttering “Tat”; అనభిసన్ధాయ ఫలమ్=without aiming at the fruit; యజ్ఞతపఃక్రియాః=acts of sacrifice and austerity; దానక్రియాః చ వివిధాః=and various acts of charity; క్రియన్తే=are performed; మోక్షకాఙ్క్షిభిః=by seekers of liberation"};
D["17.26"]={t:["సద్భావే సాధుభావే చ సదిత్యేతత్ప్రయుజ్యతే |","ప్రశస్తే కర్మణి తథా సచ్ఛబ్దః పార్థ యుజ్యతే ||"],mt:"ఓ పార్థా! “సత్” అను శబ్దము సద్భావమునందును సాధుభావమునందును ప్రయోగింపబడును; ప్రశస్తకర్మయందును ప్రయోగింపబడును.",m:"The word “Sat” is used in the sense of reality and goodness; and it is also used, O Partha, for an auspicious action.",w:"సద్భావే=in the sense of reality; సాధుభావే చ=and of goodness; సత్ ఇతి ఏతత్=this “Sat”; ప్రయుజ్యతే=is used; ప్రశస్తే కర్మణి=in an auspicious action; తథా=also; సత్ శబ్దః=the word “Sat”; పార్థ=O Partha; యుజ్యతే=is employed"};
D["17.27"]={t:["యజ్ఞే తపసి దానే చ స్థితిః సదితి చోచ్యతే |","కర్మ చైవ తదర్థీయం సదిత్యేవాభిధీయతే ||"],mt:"యజ్ఞమునందును తపస్సునందును దానమునందును నిష్ఠయు “సత్” అని చెప్పబడును; దాని కొరకై చేయు కర్మయు “సత్” అనియే చెప్పబడును.",m:"Steadfastness in sacrifice, austerity and charity is also called “Sat,” and action done for that purpose is likewise called “Sat.”",w:"యజ్ఞే తపసి దానే చ=in sacrifice, austerity and charity; స్థితిః=steadfastness; సత్ ఇతి చ ఉచ్యతే=is also called “Sat”; కర్మ చ ఏవ=and action; తదర్థీయమ్=done for that purpose; సత్ ఇతి ఏవ అభిధీయతే=is called “Sat” indeed"};
D["17.28"]={t:["అశ్రద్ధయా హుతం దత్తం తపస్తప్తం కృతం చ యత్ |","అసదిత్యుచ్యతే పార్థ న చ తత్ప్రేత్య నో ఇహ ||"],mt:"ఓ పార్థా! శ్రద్ధ లేకుండా హోమము చేసినది, ఇచ్చినది, తపస్సు చేసినది, చేసినది ఏదైనను “అసత్” అనబడును; అది పరమునకును ఇహమునకును కూడ ఫలించదు.",m:"Whatever is offered, given, practised or done without faith is called “Asat,” O Partha; it is of no benefit after death, nor here.",w:"అశ్రద్ధయా=without faith; హుతమ్=offered; దత్తమ్=given; తపః తప్తమ్=austerity practised; కృతమ్ చ యత్=and whatever is done; అసత్ ఇతి ఉచ్యతే=is called “Asat”; పార్థ=O Partha; న చ తత్ ప్రేత్య=it is not beneficial after death; నో ఇహ=nor here"};

// Chapter 18 – shlokas 18.1 to 18.10. Paste after your D object.
D["18.1"]={t:["అర్జున ఉవాచ |","సన్న్యాసస్య మహాబాహో తత్త్వమిచ్ఛామి వేదితుమ్ |","త్యాగస్య చ హృషీకేశ పృథక్కేశినిషూదన ||"],mt:"అర్జునుడు పలికెను: ఓ మహాబాహో! హృషీకేశా! కేశినిషూదనా! సన్న్యాసము యొక్కయు త్యాగము యొక్కయు తత్త్వమును వేరువేరుగా తెలిసికొనగోరుచున్నాను.",m:"Arjuna said: O mighty-armed one, O Hrishikesha, O slayer of Keshi, I wish to know the truth of renunciation (sannyasa) and of abandonment (tyaga), each separately.",w:"అర్జునః ఉవాచ=Arjuna said; సన్న్యాసస్య=of renunciation; మహాబాహో=O mighty-armed; తత్త్వమ్=the truth; ఇచ్ఛామి వేదితుమ్=I wish to know; త్యాగస్య చ=and of abandonment; హృషీకేశ=O Hrishikesha; పృథక్=separately; కేశినిషూదన=O slayer of Keshi"};
D["18.2"]={t:["శ్రీభగవానువాచ |","కామ్యానాం కర్మణాం న్యాసం సన్న్యాసం కవయో విదుః |","సర్వకర్మఫలత్యాగం ప్రాహుస్త్యాగం విచక్షణాః ||"],mt:"శ్రీభగవానుడు పలికెను: కామ్యకర్మలను విడుచుటను జ్ఞానులు సన్న్యాసమని ఎరుగుదురు; సర్వకర్మఫలములను విడుచుటను వివేకులు త్యాగమందురు.",m:"The Blessed Lord said: The wise understand sannyasa as the giving up of actions motivated by desire; the discerning call the renunciation of the fruits of all actions tyaga.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; కామ్యానామ్ కర్మణామ్=of actions motivated by desire; న్యాసమ్=giving up; సన్న్యాసమ్=sannyasa; కవయః విదుః=the wise understand; సర్వకర్మఫలత్యాగమ్=renunciation of the fruits of all actions; ప్రాహుః=they call; త్యాగమ్=tyaga; విచక్షణాః=the discerning"};
D["18.3"]={t:["త్యాజ్యం దోషవదిత్యేకే కర్మ ప్రాహుర్మనీషిణః |","యజ్ఞదానతపఃకర్మ న త్యాజ్యమితి చాపరే ||"],mt:"కొందరు పండితులు కర్మ దోషయుక్తమైనది కావున విడువదగినదందురు; మరికొందరు యజ్ఞదానతపఃకర్మలను విడువరాదందురు.",m:"Some wise men say that action should be abandoned as being flawed; others say that acts of sacrifice, charity and austerity should not be abandoned.",w:"త్యాజ్యమ్=should be abandoned; దోషవత్=as flawed; ఇతి ఏకే=thus some; కర్మ ప్రాహుః=say action; మనీషిణః=the wise; యజ్ఞదానతపఃకర్మ=acts of sacrifice, charity and austerity; న త్యాజ్యమ్=should not be abandoned; ఇతి చ అపరే=and others say"};
D["18.4"]={t:["నిశ్చయం శృణు మే తత్ర త్యాగే భరతసత్తమ |","త్యాగో హి పురుషవ్యాఘ్ర త్రివిధః సమ్ప్రకీర్తితః ||"],mt:"ఓ భరతశ్రేష్ఠా! ఆ త్యాగవిషయమున నా నిశ్చయమును వినుము; ఓ పురుషవ్యాఘ్రా! త్యాగము మూడు విధములని చెప్పబడినది.",m:"Hear my conclusion on that subject of tyaga, O best of the Bharatas; tyaga, O tiger among men, has been declared to be of three kinds.",w:"నిశ్చయమ్=conclusion; శృణు=hear; మే=my; తత్ర త్యాగే=in that matter of tyaga; భరతసత్తమ=O best of the Bharatas; త్యాగః హి=tyaga indeed; పురుషవ్యాఘ్ర=O tiger among men; త్రివిధః=of three kinds; సమ్ప్రకీర్తితః=is declared"};
D["18.5"]={t:["యజ్ఞదానతపఃకర్మ న త్యాజ్యం కార్యమేవ తత్ |","యజ్ఞో దానం తపశ్చైవ పావనాని మనీషిణామ్ ||"],mt:"యజ్ఞదానతపఃకర్మలను విడువరాదు, అవి చేయదగినవే; యజ్ఞము, దానము, తపస్సు జ్ఞానులను పవిత్రము చేయును.",m:"Acts of sacrifice, charity and austerity should not be abandoned; they should be performed. Sacrifice, charity and austerity are purifiers of the wise.",w:"యజ్ఞదానతపఃకర్మ=acts of sacrifice, charity and austerity; న త్యాజ్యమ్=should not be abandoned; కార్యమ్ ఏవ తత్=that must indeed be done; యజ్ఞః దానమ్ తపః చ ఏవ=sacrifice, charity and austerity; పావనాని=purifiers; మనీషిణామ్=of the wise"};
D["18.6"]={t:["ఏతాన్యపి తు కర్మాణి సఙ్గం త్యక్త్వా ఫలాని చ |","కర్తవ్యానీతి మే పార్థ నిశ్చితం మతముత్తమమ్ ||"],mt:"ఓ పార్థా! ఈ కర్మలను కూడా ఆసక్తిని ఫలములను విడిచి చేయవలెనని నా నిశ్చితమైన ఉత్తమ అభిప్రాయము.",m:"But even these actions should be performed, giving up attachment and the fruits; this, O Partha, is my definite and supreme view.",w:"ఏతాని అపి తు కర్మాణి=but even these actions; సఙ్గమ్ త్యక్త్వా=giving up attachment; ఫలాని చ=and the fruits; కర్తవ్యాని=should be performed; ఇతి మే పార్థ=thus, my view, O Partha; నిశ్చితమ్ మతమ్ ఉత్తమమ్=is a definite and supreme view"};
D["18.7"]={t:["నియతస్య తు సన్న్యాసః కర్మణో నోపపద్యతే |","మోహాత్తస్య పరిత్యాగస్తామసః పరికీర్తితః ||"],mt:"నియతకర్మను విడుచుట ఉచితము కాదు; మోహముచే దానిని విడుచుట తామసత్యాగమని చెప్పబడినది.",m:"Renunciation of obligatory action is not proper; abandoning it through delusion is declared to be tamasic.",w:"నియతస్య కర్మణః=of obligatory action; తు సన్న్యాసః=but renunciation; న ఉపపద్యతే=is not proper; మోహాత్=through delusion; తస్య పరిత్యాగః=its abandonment; తామసః=tamasic; పరికీర్తితః=is declared"};
D["18.8"]={t:["దుఃఖమిత్యేవ యత్కర్మ కాయక్లేశభయాత్త్యజేత్ |","స కృత్వా రాజసం త్యాగం నైవ త్యాగఫలం లభేత్ ||"],mt:"“దుఃఖకరము” అని శారీరక క్లేశభయముచే కర్మను విడుచువాడు రాజసత్యాగమును చేసి త్యాగఫలమును పొందడు.",m:"One who abandons an action because it is painful, out of fear of bodily discomfort, performs a rajasic tyaga and does not obtain the fruit of renunciation.",w:"దుఃఖమ్ ఇతి ఏవ=thinking merely “it is painful”; యత్ కర్మ=an action; కాయక్లేశభయాత్=out of fear of bodily discomfort; త్యజేత్=abandons; సః కృత్వా=he, having made; రాజసమ్ త్యాగమ్=a rajasic tyaga; న ఏవ త్యాగఫలమ్ లభేత్=does not obtain the fruit of renunciation"};
D["18.9"]={t:["కార్యమిత్యేవ యత్కర్మ నియతం క్రియతేఽర్జున |","సఙ్గం త్యక్త్వా ఫలం చైవ స త్యాగః సాత్త్వికో మతః ||"],mt:"ఓ అర్జునా! “చేయవలసినదే” అని ఆసక్తిని ఫలమును విడిచి నియతకర్మ చేయబడినచో ఆ త్యాగము సాత్త్వికమని భావింపబడును.",m:"When an obligatory action is performed simply because it ought to be done, giving up attachment and the fruit, O Arjuna, that tyaga is considered sattvic.",w:"కార్యమ్ ఇతి ఏవ=thinking “it ought to be done”; యత్ కర్మ నియతమ్=an obligatory action; క్రియతే=is performed; అర్జున=O Arjuna; సఙ్గమ్ త్యక్త్వా=giving up attachment; ఫలమ్ చ ఏవ=and the fruit; సః త్యాగః సాత్త్వికః మతః=that tyaga is considered sattvic"};
D["18.10"]={t:["న ద్వేష్ట్యకుశలం కర్మ కుశలే నానుషజ్జతే |","త్యాగీ సత్త్వసమావిష్టో మేధావీ ఛిన్నసంశయః ||"],mt:"సత్త్వముతో నిండిన, మేధావియైన, సంశయములు ఛేదించిన త్యాగి అకుశలకర్మను ద్వేషింపడు, కుశలకర్మయందు ఆసక్తుడు కాడు.",m:"The renunciant, pervaded by sattva, wise and free from doubt, neither hates unpleasant action nor is attached to pleasant action.",w:"న ద్వేష్టి=does not hate; అకుశలమ్ కర్మ=unpleasant action; కుశలే=in pleasant action; న అనుషజ్జతే=is not attached; త్యాగీ=the renunciant; సత్త్వసమావిష్టః=pervaded by sattva; మేధావీ=wise; ఛిన్నసంశయః=with doubts cut away"};

// Chapter 18 – shlokas 18.11 to 18.20. Paste after your D object.
D["18.11"]={t:["న హి దేహభృతా శక్యం త్యక్తుం కర్మాణ్యశేషతః |","యస్తు కర్మఫలత్యాగీ స త్యాగీత్యభిధీయతే ||"],mt:"దేహధారి కర్మలను పూర్తిగా విడువజాలడు; కర్మఫలములను విడుచువాడే త్యాగి అనబడును.",m:"It is not possible for an embodied being to give up actions entirely; one who renounces the fruit of action is called a renunciant.",w:"న హి=not indeed; దేహభృతా=by an embodied being; శక్యమ్=possible; త్యక్తుమ్=to give up; కర్మాణి=actions; అశేషతః=entirely; యః తు=but one who; కర్మఫలత్యాగీ=renouncer of the fruit of action; సః త్యాగీ ఇతి అభిధీయతే=he is called a renunciant"};
D["18.12"]={t:["అనిష్టమిష్టం మిశ్రం చ త్రివిధం కర్మణః ఫలమ్ |","భవత్యత్యాగినాం ప్రేత్య న తు సన్న్యాసినాం క్వచిత్ ||"],mt:"అనిష్టము, ఇష్టము, మిశ్రము అను మూడు విధములైన కర్మఫలము మరణానంతరము త్యాగము చేయనివారికి కలుగును; సన్న్యాసులకు ఎన్నడును కలుగదు.",m:"The threefold fruit of action, undesirable, desirable and mixed, accrues after death to those who have not renounced, but never to renunciants.",w:"అనిష్టమ్=undesirable; ఇష్టమ్=desirable; మిశ్రమ్ చ=and mixed; త్రివిధమ్=threefold; కర్మణః ఫలమ్=fruit of action; భవతి=accrues; అత్యాగినామ్=to the non-renouncers; ప్రేత్య=after death; న తు సన్న్యాసినామ్ క్వచిత్=but never to renunciants"};
D["18.13"]={t:["పఞ్చైతాని మహాబాహో కారణాని నిబోధ మే |","సాఙ్ఖ్యే కృతాన్తే ప్రోక్తాని సిద్ధయే సర్వకర్మణామ్ ||"],mt:"ఓ మహాబాహో! సర్వకర్మల సిద్ధికి సాంఖ్యశాస్త్రమున చెప్పబడిన ఈ ఐదు కారణములను నా నుండి తెలిసికొనుము.",m:"O mighty-armed one, learn from me these five factors, declared in the Sankhya doctrine, for the accomplishment of all actions.",w:"పఞ్చ ఏతాని=these five; మహాబాహో=O mighty-armed; కారణాని=factors; నిబోధ మే=learn from me; సాఙ్ఖ్యే కృతాన్తే=in the Sankhya doctrine; ప్రోక్తాని=declared; సిద్ధయే=for the accomplishment; సర్వకర్మణామ్=of all actions"};
D["18.14"]={t:["అధిష్ఠానం తథా కర్తా కరణం చ పృథగ్విధమ్ |","వివిధాశ్చ పృథక్చేష్టా దైవం చైవాత్ర పఞ్చమమ్ ||"],mt:"అధిష్ఠానము (దేహము), కర్త, వివిధములైన కరణములు, వేర్వేరు చేష్టలు, ఐదవదిగా దైవము.",m:"The seat (body), the doer, the various instruments, the many kinds of efforts, and, fifth, destiny.",w:"అధిష్ఠానమ్=the seat (body); తథా=and; కర్తా=the doer; కరణమ్ చ పృథగ్విధమ్=and the instruments of various kinds; వివిధాః చ పృథక్ చేష్టాః=and the many separate efforts; దైవమ్ చ ఏవ అత్ర పఞ్చమమ్=and destiny as the fifth here"};
D["18.15"]={t:["శరీరవాఙ్మనోభిర్యత్కర్మ ప్రారభతే నరః |","న్యాయ్యం వా విపరీతం వా పఞ్చైతే తస్య హేతవః ||"],mt:"మనుష్యుడు శరీరముచేతను వాక్కుచేతను మనస్సుచేతను న్యాయ్యమైనదైనను విపరీతమైనదైనను ఏ కర్మను ఆరంభించునో దానికి ఈ ఐదు హేతువులు.",m:"Whatever action a person undertakes by body, speech or mind, whether right or wrong, these five are its causes.",w:"శరీరవాఙ్మనోభిః=by body, speech and mind; యత్ కర్మ=whatever action; ప్రారభతే=undertakes; నరః=a person; న్యాయ్యమ్ వా=whether right; విపరీతమ్ వా=or wrong; పఞ్చ ఏతే=these five; తస్య హేతవః=are its causes"};
D["18.16"]={t:["తత్రైవం సతి కర్తారమాత్మానం కేవలం తు యః |","పశ్యత్యకృతబుద్ధిత్వాన్న స పశ్యతి దుర్మతిః ||"],mt:"అట్లుండగా తనను మాత్రమే కర్తగా చూచువాడు అసంస్కృతబుద్ధిచే సరిగా చూడడు; అతడు దుర్మతి.",m:"That being so, one who, owing to an untrained intellect, sees the self alone as the doer does not truly see; such a person is of perverse mind.",w:"తత్ర ఏవమ్ సతి=that being so; కర్తారమ్=as the doer; ఆత్మానమ్ కేవలమ్ తు యః=who sees the self alone; పశ్యతి=sees; అకృతబుద్ధిత్వాత్=owing to an untrained intellect; న సః పశ్యతి=he does not see; దుర్మతిః=of perverse mind"};
D["18.17"]={t:["యస్య నాహఙ్కృతో భావో బుద్ధిర్యస్య న లిప్యతే |","హత్వాపి స ఇమాఁల్లోకాన్న హన్తి న నిబధ్యతే ||"],mt:"ఎవనికి అహంకృతభావము లేదో, ఎవని బుద్ధి అంటబడదో, అతడు ఈ లోకములను చంపినను చంపడు, బంధింపబడడు.",m:"One who is free from the sense of ego and whose intellect is not tainted, though he slays these people, does not slay and is not bound.",w:"యస్య=whose; న అహఙ్కృతః భావః=no sense of egoism; బుద్ధిః యస్య న లిప్యతే=whose intellect is not tainted; హత్వా అపి=even though slaying; సః ఇమాన్ లోకాన్=he these people; న హన్తి=does not slay; న నిబధ్యతే=is not bound"};
D["18.18"]={t:["జ్ఞానం జ్ఞేయం పరిజ్ఞాతా త్రివిధా కర్మచోదనా |","కరణం కర్మ కర్తేతి త్రివిధః కర్మసఙ్గ్రహః ||"],mt:"జ్ఞానము, జ్ఞేయము, పరిజ్ఞాత అని కర్మప్రేరణ మూడు విధములు; కరణము, కర్మ, కర్త అని కర్మసంగ్రహము మూడు విధములు.",m:"Knowledge, the object of knowledge and the knower are the threefold impulse to action; the instrument, the action and the doer are the threefold constituents of action.",w:"జ్ఞానమ్=knowledge; జ్ఞేయమ్=the object of knowledge; పరిజ్ఞాతా=the knower; త్రివిధా=threefold; కర్మచోదనా=impulse to action; కరణమ్=instrument; కర్మ=action; కర్తా ఇతి=and the doer; త్రివిధః కర్మసఙ్గ్రహః=the threefold constituents of action"};
