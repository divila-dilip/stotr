html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--div)}
header h1{font-size:18px;font-weight:600;margin:0;line-height:1.3;flex:1}
button,input{font:500 14px Inter,sans-serif}
button{background:var(--pri);color:var(--onpri);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}

button.sec{background:var(--neu);color:var(--tx)}

#jump:focus{border-color:var(--pri);outline:0}
#jump.bad{border-color:var(--err);color:var(--err)}
.layout{display:flex}
nav{width:280px;flex:none;height:calc(100vh - 57px);overflow-y:auto;position:sticky;top:57px;background:var(--paper);border-right:1px solid var(--div);padding:8px}
nav button{display:block;width:100%;text-align:left;background:none;color:var(--tx);border-radius:8px;box-shadow:none;padding:8px;font-weight:400}
nav button small{display:block;color:var(--tx2);font-size:12px}
nav button.on{background:var(--neu);border-left:3px solid var(--pri);font-weight:600}
main{flex:1;padding:24px 16px;max-width:900px;margin:0 auto;min-width:0}
.card{background:var(--paper);border:1px solid var(--div);border-radius:12px;padding:24px}
.meta{color:var(--tx2);font-size:12px;margin:0 0 8px}
h2{font-size:24px;line-height:1.3;margin:0 0 16px;font-weight:600}
h3{font-size:18px;margin:24px 0 8px;font-weight:600;line-height:1.3}
.sl{font:700 24px/1.9 "Noto Sans Telugu",sans-serif;margin:0;text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{border:1px solid var(--div);border-radius:8px;padding:8px}
.w b{font-family:"Noto Sans Telugu",sans-serif;display:block}
.w span{color:var(--tx2);font-size:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.ctl button{min-width:110px}
#jump{margin-left:auto}
#sp{display:none;position:fixed;top:calc(57px + env(safe-area-inset-top,0px));left:0;right:0;z-index:7;background:var(--paper);border-bottom:1px solid var(--div);padding:8px 16px;max-height:70vh;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.card{min-width:0;position:relative}
body.saf .sl{color:var(--saf)}

#saf[aria-pressed="true"]{outline:2px solid var(--saf)}
.ov{padding:0;min-width:0;width:22px;height:22px;border-radius:50%;margin-left:6px;font-size:13px;line-height:22px;vertical-align:middle}
.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--paper);color:var(--tx);border-radius:12px;padding:24px;max-width:560px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mbox h2{font-size:20px;margin:0 0 4px}
.mbox .te{color:var(--tx2);font-family:"Noto Sans Telugu",sans-serif;margin:0 0 12px}
.mbox p#ovb{line-height:1.6;margin:0 0 16px}
/* v2.2 realistic page turn */
#stage{position:relative;perspective:2400px;perspective-origin:50% 40%}
#slide{box-shadow:1px 1px 0 var(--paper),2px 2px 0 var(--div),3px 3px 0 var(--paper),4px 4px 0 var(--div),6px 8px 14px rgba(0,0,0,.12)}
.leaf{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none;z-index:3}
.strip{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{transform:rotateY(180deg);background:var(--paper) linear-gradient(90deg,rgba(0,0,0,.05),transparent 40%)}
.pg{position:absolute;top:0;margin:0}
.ghost{background:transparent;border-color:transparent;opacity:.08}
.sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.spine::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 16px);pointer-events:none}
.cast{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:2}
main{touch-action:pan-y}
@media(max-width:600px){header{gap:4px;padding:8px}header button{padding:8px 10px}#jump{width:64px}}
.mbox h3{font-size:15px;margin:14px 0 4px}.mbox p.mt{margin:0 0 4px}
#ovx{position:sticky;bottom:0;box-shadow:0 0 0 6px var(--paper)}

// Fields: t = Telugu shloka lines, mt = Telugu meaning, m = English meaning, w = "word=meaning; word=meaning"
D["1.1"]={t:["ధృతరాష్ట్ర ఉవాచ |","ధర్మక్షేత్రే కురుక్షేత్రే సమవేతా యుయుత్సవః |","మామకాః పాణ్డవాశ్చైవ కిమకుర్వత సఞ్జయ ||"],mt:"ధృతరాష్ట్రుడు పలికెను: ఓ సంజయా! ధర్మక్షేత్రమైన కురుక్షేత్రమున యుద్ధము చేయగోరి సమావేశమైన నా పుత్రులును పాండుపుత్రులును ఏమి చేసిరి?",m:"Dhritarashtra said: O Sanjaya, assembled on the holy field of Kurukshetra and eager to fight, what did my sons and the sons of Pandu do?",w:"ధర్మక్షేత్రే=on the holy field; కురుక్షేత్రే=at Kurukshetra; సమవేతాః=assembled; యుయుత్సవః=desiring to fight; మామకాః=my people (sons); పాణ్డవాః=the sons of Pandu; చ ఏవ=and also; కిమ్=what; అకుర్వత=did they do; సఞ్జయ=O Sanjaya"};
D["1.2"]={t:["సఞ్జయ ఉవాచ |","దృష్ట్వా తు పాణ్డవానీకం వ్యూఢం దుర్యోధనస్తదా |","ఆచార్యముపసఙ్గమ్య రాజా వచనమబ్రవీత్ ||"],mt:"సంజయుడు పలికెను: పాండవుల సైన్యము వ్యూహరచనతో నిలిచియుండుట చూచి, రాజైన దుర్యోధనుడు అప్పుడు ఆచార్యుడైన ద్రోణుని సమీపించి ఈ మాటలను పలికెను.",m:"Sanjaya said: Having seen the Pandava army arranged in battle formation, King Duryodhana then approached his teacher Drona and spoke these words.",w:"సఞ్జయః ఉవాచ=Sanjaya said; దృష్ట్వా=having seen; తు=indeed; పాణ్డవానీకమ్=the army of the Pandavas; వ్యూఢమ్=arranged in battle formation; దుర్యోధనః=Duryodhana; తదా=then; ఆచార్యమ్=the teacher (Drona); ఉపసఙ్గమ్య=approaching; రాజా=the king; వచనమ్=words; అబ్రవీత్=spoke"};
D["1.3"]={t:["పశ్యైతాం పాణ్డుపుత్రాణామాచార్య మహతీం చమూమ్ |","వ్యూఢాం ద్రుపదపుత్రేణ తవ శిష్యేణ ధీమతా ||"],mt:"ఓ ఆచార్యా! నీ బుద్ధిమంతుడైన శిష్యుడు, ద్రుపదుని కుమారుడు వ్యూహరచన చేసిన పాండుపుత్రుల ఈ గొప్ప సేనను చూడుము.",m:"Behold, O teacher, this mighty army of the sons of Pandu, arrayed by the son of Drupada, your intelligent disciple.",w:"పశ్య=behold; ఏతామ్=this; పాణ్డుపుత్రాణామ్=of the sons of Pandu; ఆచార్య=O teacher; మహతీమ్=mighty; చమూమ్=army; వ్యూఢామ్=arrayed; ద్రుపదపుత్రేణ=by the son of Drupada; తవ=your; శిష్యేణ=by the disciple; ధీమతా=intelligent"};
D["1.4"]={t:["అత్ర శూరా మహేష్వాసా భీమార్జునసమా యుధి |","యుయుధానో విరాటశ్చ ద్రుపదశ్చ మహారథః ||"],mt:"ఇక్కడ యుద్ధమున భీమార్జునులతో సమానులైన గొప్ప ధనుర్ధారులైన శూరులున్నారు — యుయుధానుడు, విరాటుడు, మహారథుడైన ద్రుపదుడు.",m:"Here are heroes, mighty archers equal in battle to Bhima and Arjuna: Yuyudhana, Virata, and Drupada, the great chariot-warrior.",w:"అత్ర=here; శూరాః=heroes; మహేష్వాసాః=mighty archers; భీమార్జునసమాః=equal to Bhima and Arjuna; యుధి=in battle; యుయుధానః=Yuyudhana (Satyaki); విరాటః చ=and Virata; ద్రుపదః చ=and Drupada; మహారథః=a great chariot-warrior"};
D["1.5"]={t:["ధృష్టకేతుశ్చేకితానః కాశిరాజశ్చ వీర్యవాన్ |","పురుజిత్కున్తిభోజశ్చ శైబ్యశ్చ నరపుఙ్గవః ||"],mt:"ధృష్టకేతువు, చేకితానుడు, పరాక్రమవంతుడైన కాశీరాజు, పురుజిత్తు, కుంతిభోజుడు, నరశ్రేష్ఠుడైన శైబ్యుడు (ఇక్కడ ఉన్నారు).",m:"Dhrishtaketu, Chekitana, the valiant king of Kashi, Purujit, Kuntibhoja, and Shaibya, the best among men.",w:"ధృష్టకేతుః=Dhrishtaketu; చేకితానః=Chekitana; కాశిరాజః చ=and the king of Kashi; వీర్యవాన్=valiant; పురుజిత్=Purujit; కున్తిభోజః చ=and Kuntibhoja; శైబ్యః చ=and Shaibya; నరపుఙ్గవః=the best among men"};
D["1.6"]={t:["యుధామన్యుశ్చ విక్రాన్త ఉత్తమౌజాశ్చ వీర్యవాన్ |","సౌభద్రో ద్రౌపదేయాశ్చ సర్వ ఏవ మహారథాః ||"],mt:"పరాక్రమశాలియైన యుధామన్యుడు, వీర్యవంతుడైన ఉత్తమౌజుడు, సుభద్రాపుత్రుడైన అభిమన్యుడు, ద్రౌపదీ పుత్రులు — వీరందరును మహారథులే.",m:"The mighty Yudhamanyu, the valiant Uttamauja, the son of Subhadra, and the sons of Draupadi: all of them are great chariot-warriors.",w:"యుధామన్యుః చ=and Yudhamanyu; విక్రాన్తః=mighty; ఉత్తమౌజాః చ=and Uttamauja; వీర్యవాన్=valiant; సౌభద్రః=the son of Subhadra (Abhimanyu); ద్రౌపదేయాః చ=and the sons of Draupadi; సర్వే ఏవ=all indeed; మహారథాః=great chariot-warriors"};

D["1.7"]={t:["అస్మాకం తు విశిష్టా యే తాన్నిబోధ ద్విజోత్తమ |","నాయకా మమ సైన్యస్య సంజ్ఞార్థం తాన్బ్రవీమి తే ||"],mt:"ఓ ద్విజశ్రేష్ఠా! మన పక్షమున ప్రముఖులైన వారిని కూడా తెలిసికొనుము. నా సైన్యనాయకులను నీ తెలివికొరకు చెప్పుచున్నాను.",m:"But know also the most distinguished on our side, O best of the twice-born. For your information, I name the leaders of my army.",w:"అస్మాకమ్=our; తు=but; విశిష్టాః=especially distinguished; యే=who; తాన్=them; నిబోధ=know; ద్విజోత్తమ=O best of the twice-born; నాయకాః=leaders; మమ=my; సైన్యస్య=of the army; సంజ్ఞార్థమ్=for your information; తాన్=them; బ్రవీమి=I speak; తే=to you"};
D["1.8"]={t:["భవాన్భీష్మశ్చ కర్ణశ్చ కృపశ్చ సమితింజయః |","అశ్వత్థామా వికర్ణశ్చ సౌమదత్తిస్తథైవ చ ||"],mt:"నీవు, భీష్ముడు, కర్ణుడు, యుద్ధమున సదా జయించు కృపుడు, అశ్వత్థామ, వికర్ణుడు, సోమదత్తుని కుమారుడు కూడా (ఉన్నారు).",m:"Yourself, Bhishma, Karna, and Kripa, ever victorious in battle; Ashwatthama, Vikarna, and the son of Somadatta as well.",w:"భవాన్=yourself; భీష్మః చ=and Bhishma; కర్ణః చ=and Karna; కృపః చ=and Kripa; సమితింజయః=victorious in battle; అశ్వత్థామా=Ashwatthama; వికర్ణః చ=and Vikarna; సౌమదత్తిః=the son of Somadatta; తథా ఏవ చ=and likewise"};
D["1.9"]={t:["అన్యే చ బహవః శూరా మదర్థే త్యక్తజీవితాః |","నానాశస్త్రప్రహరణాః సర్వే యుద్ధవిశారదాః ||"],mt:"ఇంకను నా కొరకు ప్రాణములను విడువ సిద్ధమైన అనేక శూరులు ఉన్నారు; వారు నానావిధ ఆయుధములు ధరించినవారు, అందరును యుద్ధనిపుణులు.",m:"And many other heroes, armed with various weapons and all skilled in war, are prepared to give up their lives for my sake.",w:"అన్యే=others; చ=and; బహవః=many; శూరాః=heroes; మదర్థే=for my sake; త్యక్తజీవితాః=ready to give up their lives; నానాశస్త్రప్రహరణాః=armed with various weapons; సర్వే=all; యుద్ధవిశారదాః=skilled in warfare"};
D["1.10"]={t:["అపర్యాప్తం తదస్మాకం బలం భీష్మాభిరక్షితమ్ |","పర్యాప్తం త్విదమేతేషాం బలం భీమాభిరక్షితమ్ ||"],mt:"భీష్మునిచే రక్షింపబడు మన సైన్యబలము అపరిమితము; భీమునిచే రక్షింపబడు వారి సైన్యబలము పరిమితము. (అపర్యాప్త/పర్యాప్త శబ్దములకు వ్యాఖ్యాతలు వేర్వేరు అర్థములు చెప్పిరి.)",m:"Our army, guarded by Bhishma, is immeasurable, while theirs, guarded by Bhima, is limited. (Commentators read the words aparyaptam and paryaptam in two opposite ways.)",w:"అపర్యాప్తమ్=immeasurable (some read: insufficient); తత్=that; అస్మాకమ్=our; బలమ్=strength; భీష్మాభిరక్షితమ్=guarded by Bhishma; పర్యాప్తమ్=limited (some read: sufficient); తు=but; ఇదమ్=this; ఏతేషామ్=their; బలమ్=strength; భీమాభిరక్షితమ్=guarded by Bhima"};
D["1.11"]={t:["అయనేషు చ సర్వేషు యథాభాగమవస్థితాః |","భీష్మమేవాభిరక్షన్తు భవన్తః సర్వ ఏవ హి ||"],mt:"అన్ని వ్యూహద్వారములయందు మీ మీ స్థానములలో నిలిచి, మీరందరును భీష్ముని మాత్రమే రక్షింపవలెను.",m:"Standing firm in your respective positions at all the entrances, all of you must protect Bhishma above all.",w:"అయనేషు=at the strategic points; చ=and; సర్వేషు=all; యథాభాగమ్=as assigned; అవస్థితాః=stationed; భీష్మమ్=Bhishma; ఏవ=alone; అభిరక్షన్తు=let them protect; భవన్తః=you; సర్వే=all; ఏవ హి=indeed"};
D["1.12"]={t:["తస్య సఞ్జనయన్హర్షం కురువృద్ధః పితామహః |","సింహనాదం వినద్యోచ్చైః శఙ్ఖం దధ్మౌ ప్రతాపవాన్ ||"],mt:"అప్పుడు కురువృద్ధుడైన ప్రతాపవంతుడైన పితామహుడు (భీష్ముడు) దుర్యోధనునికి ఆనందము కలిగించుచు సింహనాదము చేసి, ఉచ్చస్వరమున శంఖము పూరించెను.",m:"Then the glorious Kuru elder, the grandsire Bhishma, to cheer Duryodhana, roared like a lion and blew his conch loudly.",w:"తస్య=his (Duryodhana's); సఞ్జనయన్=causing; హర్షమ్=joy; కురువృద్ధః=the elder of the Kurus; పితామహః=the grandsire; సింహనాదమ్=a lion's roar; వినద్య=sounding; ఉచ్చైః=loudly; శఙ్ఖమ్=conch; దధ్మౌ=blew; ప్రతాపవాన్=the glorious"};
D["1.13"]={t:["తతః శఙ్ఖాశ్చ భేర్యశ్చ పణవానకగోముఖాః |","సహసైవాభ్యహన్యన్త స శబ్దస్తుములోఽభవత్ ||"],mt:"అంతట శంఖములు, భేరులు, పణవములు, ఆనకములు, గోముఖములు ఒక్కసారిగా మ్రోగింపబడెను; ఆ ధ్వని భయంకరమైనది.",m:"Then conches, kettledrums, tabors, drums and horns suddenly blared forth, and the sound was tumultuous.",w:"తతః=then; శఙ్ఖాః చ=conches; భేర్యః చ=kettledrums; పణవానకగోముఖాః=tabors, drums and horns; సహసా ఏవ=suddenly; అభ్యహన్యన్త=were sounded; సః శబ్దః=that sound; తుములః=tumultuous; అభవత్=was"};
D["1.14"]={t:["తతః శ్వేతైర్హయైర్యుక్తే మహతి స్యన్దనే స్థితౌ |","మాధవః పాణ్డవశ్చైవ దివ్యౌ శఙ్ఖౌ ప్రదధ్మతుః ||"],mt:"అంతట తెల్లని గుఱ్ఱములు పూన్చిన గొప్ప రథమున కూర్చున్న మాధవుడు (శ్రీకృష్ణుడు), పాండవుడు (అర్జునుడు) తమ దివ్య శంఖములను పూరించిరి.",m:"Then, seated in a magnificent chariot yoked with white horses, Madhava (Krishna) and the son of Pandu (Arjuna) blew their divine conches.",w:"తతః=then; శ్వేతైః హయైః=with white horses; యుక్తే=yoked; మహతి=grand; స్యన్దనే=in the chariot; స్థితౌ=seated; మాధవః=Krishna; పాణ్డవః=Arjuna; చ ఏవ=and also; దివ్యౌ=divine; శఙ్ఖౌ=two conches; ప్రదధ్మతుః=blew"};
D["1.15"]={t:["పాఞ్చజన్యం హృషీకేశో దేవదత్తం ధనఞ్జయః |","పౌణ్డ్రం దధ్మౌ మహాశఙ్ఖం భీమకర్మా వృకోదరః ||"],mt:"హృషీకేశుడు పాంచజన్యమును, ధనంజయుడు దేవదత్తమును, భయంకరకర్ముడైన భీముడు పౌండ్రమను మహాశంఖమును పూరించిరి.",m:"Hrishikesha blew the Panchajanya, Dhananjaya the Devadatta, and Bhima, of terrible deeds, blew the great conch Paundra.",w:"పాఞ్చజన్యమ్=the Panchajanya; హృషీకేశః=Krishna; దేవదత్తమ్=the Devadatta; ధనఞ్జయః=Arjuna; పౌణ్డ్రమ్=the Paundra; దధ్మౌ=blew; మహాశఙ్ఖమ్=the great conch; భీమకర్మా=of terrible deeds; వృకోదరః=Bhima"};
D["1.16"]={t:["అనన్తవిజయం రాజా కున్తీపుత్రో యుధిష్ఠిరః |","నకులః సహదేవశ్చ సుఘోషమణిపుష్పకౌ ||"],mt:"కుంతీపుత్రుడైన రాజు యుధిష్ఠిరుడు అనంతవిజయమును, నకులుడు సుఘోషమును, సహదేవుడు మణిపుష్పకమును పూరించిరి.",m:"King Yudhishthira, the son of Kunti, blew the Anantavijaya; Nakula and Sahadeva blew the Sughosha and the Manipushpaka.",w:"అనన్తవిజయమ్=the Anantavijaya; రాజా=king; కున్తీపుత్రః=son of Kunti; యుధిష్ఠిరః=Yudhishthira; నకులః=Nakula; సహదేవః చ=and Sahadeva; సుఘోషమణిపుష్పకౌ=the Sughosha and the Manipushpaka"};
D["1.17"]={t:["కాశ్యశ్చ పరమేష్వాసః శిఖణ్డీ చ మహారథః |","ధృష్టద్యుమ్నో విరాటశ్చ సాత్యకిశ్చాపరాజితః ||"],mt:"శ్రేష్ఠ ధనుర్ధారియైన కాశీరాజు, మహారథుడైన శిఖండి, ధృష్టద్యుమ్నుడు, విరాటుడు, అపరాజితుడైన సాత్యకి (శంఖములను పూరించిరి).",m:"The king of Kashi, a supreme archer, Shikhandi the great chariot-warrior, Dhrishtadyumna, Virata, and the unconquered Satyaki (all blew their conches).",w:"కాశ్యః చ=and the king of Kashi; పరమేష్వాసః=the supreme archer; శిఖణ్డీ చ=and Shikhandi; మహారథః=the great chariot-warrior; ధృష్టద్యుమ్నః=Dhrishtadyumna; విరాటః చ=and Virata; సాత్యకిః చ=and Satyaki; అపరాజితః=the unconquered"};
D["1.18"]={t:["ద్రుపదో ద్రౌపదేయాశ్చ సర్వశః పృథివీపతే |","సౌభద్రశ్చ మహాబాహుః శఙ్ఖాన్దధ్ముః పృథక్పృథక్ ||"],mt:"ఓ రాజా! ద్రుపదుడు, ద్రౌపదీ పుత్రులు, మహాబాహువైన సుభద్రాపుత్రుడు — అందరును వేర్వేరుగా తమ తమ శంఖములను పూరించిరి.",m:"Drupada, the sons of Draupadi, and the mighty-armed son of Subhadra, O King, all blew their respective conches.",w:"ద్రుపదః=Drupada; ద్రౌపదేయాః చ=and the sons of Draupadi; సర్వశః=all; పృథివీపతే=O lord of the earth; సౌభద్రః చ=and the son of Subhadra; మహాబాహుః=mighty-armed; శఙ్ఖాన్=conches; దధ్ముః=blew; పృథక్ పృథక్=each separately"};
D["1.19"]={t:["స ఘోషో ధార్తరాష్ట్రాణాం హృదయాని వ్యదారయత్ |","నభశ్చ పృథివీం చైవ తుములో వ్యనునాదయన్ ||"],mt:"ఆకాశమును భూమిని ప్రతిధ్వనింపజేయుచున్న ఆ భయంకర ధ్వని ధృతరాష్ట్రుని పుత్రుల హృదయములను భేదించెను.",m:"That tumultuous uproar, resounding through the sky and the earth, shattered the hearts of Dhritarashtra's sons.",w:"సః ఘోషః=that sound; ధార్తరాష్ట్రాణామ్=of Dhritarashtra's sons; హృదయాని=hearts; వ్యదారయత్=shattered; నభః చ=the sky; పృథివీమ్ చ ఏవ=and the earth also; తుములః=tumultuous; వ్యనునాదయన్=causing to resound"};
D["1.20"]={t:["అథ వ్యవస్థితాన్దృష్ట్వా ధార్తరాష్ట్రాన్కపిధ్వజః |","ప్రవృత్తే శస్త్రసమ్పాతే ధనురుద్యమ్య పాణ్డవః ||"],mt:"అంతట కపిధ్వజుడైన అర్జునుడు ధృతరాష్ట్రుని కుమారులు యుద్ధసన్నద్ధులై నిలిచియుండుట చూచి, శస్త్రప్రయోగము ప్రారంభమగుచుండగా తన ధనస్సును ఎత్తెను.",m:"Then Arjuna, whose banner bore the monkey (Hanuman), seeing Dhritarashtra's sons arrayed and the clash of weapons about to begin, raised his bow.",w:"అథ=then; వ్యవస్థితాన్=arrayed; దృష్ట్వా=seeing; ధార్తరాష్ట్రాన్=the sons of Dhritarashtra; కపిధ్వజః=he whose banner bears Hanuman; ప్రవృత్తే=about to begin; శస్త్రసమ్పాతే=the clash of weapons; ధనుః=bow; ఉద్యమ్య=raising; పాణ్డవః=son of Pandu"};


// Chapter 1 – shlokas 1.21 to 1.47, plus a corrected 1.20 (adds its third line). Paste after your D object; later lines override earlier ones.
D["1.20"]={t:["అథ వ్యవస్థితాన్దృష్ట్వా ధార్తరాష్ట్రాన్కపిధ్వజః |","ప్రవృత్తే శస్త్రసమ్పాతే ధనురుద్యమ్య పాణ్డవః |","హృషీకేశం తదా వాక్యమిదమాహ మహీపతే |"],mt:"అంతట కపిధ్వజుడైన అర్జునుడు ధృతరాష్ట్రుని కుమారులు యుద్ధసన్నద్ధులై నిలిచియుండుట చూచి, శస్త్రప్రయోగము ప్రారంభమగుచుండగా ధనస్సును ఎత్తి, ఓ రాజా! హృషీకేశునితో అప్పుడు ఈ మాటలను పలికెను.",m:"Then Arjuna, whose banner bore the monkey (Hanuman), seeing Dhritarashtra’s sons arrayed and the clash of weapons about to begin, raised his bow and spoke these words to Hrishikesha, O King.",w:"అథ=then; వ్యవస్థితాన్=arrayed; దృష్ట్వా=seeing; ధార్తరాష్ట్రాన్=the sons of Dhritarashtra; కపిధ్వజః=he whose banner bears Hanuman; ప్రవృత్తే=about to begin; శస్త్రసమ్పాతే=the clash of weapons; ధనుః=bow; ఉద్యమ్య=raising; పాణ్డవః=son of Pandu; హృషీకేశమ్=to Krishna; తదా=then; వాక్యమ్=words; ఇదమ్=these; ఆహ=said; మహీపతే=O lord of the earth"};
D["1.21"]={t:["అర్జున ఉవాచ |","సేనయోరుభయోర్మధ్యే రథం స్థాపయ మేఽచ్యుత ||"],mt:"అర్జునుడు పలికెను: ఓ అచ్యుతా! ఇరు సేనల మధ్య నా రథమును నిలుపుము.",m:"Arjuna said: O Achyuta (Krishna), place my chariot between the two armies.",w:"అర్జునః ఉవాచ=Arjuna said; సేనయోః=of the armies; ఉభయోః=both; మధ్యే=in the middle; రథమ్=chariot; స్థాపయ=place; మే=my; అచ్యుత=O infallible one"};
D["1.22"]={t:["యావదేతాన్నిరీక్షేఽహం యోద్ధుకామానవస్థితాన్ |","కైర్మయా సహ యోద్ధవ్యమస్మిన్రణసముద్యమే ||"],mt:"యుద్ధము కోరి నిలిచియున్న వీరిని నేను చూచుటకును, ఈ యుద్ధప్రయత్నమున నేను ఎవరితో పోరాడవలెనో తెలిసికొనుటకును (రథమును నిలుపుము).",m:"So that I may observe those who stand here eager to fight, and see with whom I must contend in this undertaking of war.",w:"యావత్=as long as; ఏతాన్=these; నిరీక్షే=I may observe; అహమ్=I; యోద్ధుకామాన్=desiring to fight; అవస్థితాన్=standing; కైః=with whom; మయా=by me; సహ=together with; యోద్ధవ్యమ్=must be fought; అస్మిన్=in this; రణసముద్యమే=in the undertaking of battle"};
D["1.23"]={t:["యోత్స్యమానానవేక్షేఽహం య ఏతేఽత్ర సమాగతాః |","ధార్తరాష్ట్రస్య దుర్బుద్ధేర్యుద్ధే ప్రియచికీర్షవః ||"],mt:"దుర్బుద్ధియైన ధృతరాష్ట్రపుత్రునికి (దుర్యోధనునికి) యుద్ధమున ప్రియము చేయగోరి ఇక్కడ సమావేశమైన యుద్ధోన్ముఖులను నేను చూడగోరుచున్నాను.",m:"I wish to see those who have assembled here to fight, eager to please the evil-minded son of Dhritarashtra in battle.",w:"యోత్స్యమానాన్=those about to fight; అవేక్షే=I wish to see; అహమ్=I; యే=who; ఏతే=these; అత్ర=here; సమాగతాః=assembled; ధార్తరాష్ట్రస్య=of Dhritarashtra’s son; దుర్బుద్ధేః=evil-minded; యుద్ధే=in battle; ప్రియచికీర్షవః=wishing to please"};
D["1.24"]={t:["సఞ్జయ ఉవాచ |","ఏవముక్తో హృషీకేశో గుడాకేశేన భారత |","సేనయోరుభయోర్మధ్యే స్థాపయిత్వా రథోత్తమమ్ ||"],mt:"సంజయుడు పలికెను: ఓ భారతా! గుడాకేశుడైన అర్జునునిచే ఇట్లు చెప్పబడిన హృషీకేశుడు ఉత్తమమైన రథమును ఇరు సేనల మధ్య నిలిపి...",m:"Sanjaya said: O descendant of Bharata (Dhritarashtra), thus addressed by Gudakesha (Arjuna), Hrishikesha drew up the finest chariot between the two armies...",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఏవమ్=thus; ఉక్తః=addressed; హృషీకేశః=Krishna; గుడాకేశేన=by Arjuna (conqueror of sleep); భారత=O descendant of Bharata; సేనయోః ఉభయోః మధ్యే=between the two armies; స్థాపయిత్వా=having stationed; రథోత్తమమ్=the finest chariot"};
D["1.25"]={t:["భీష్మద్రోణప్రముఖతః సర్వేషాం చ మహీక్షితామ్ |","ఉవాచ పార్థ పశ్యైతాన్సమవేతాన్కురూనితి ||"],mt:"భీష్మ ద్రోణులకును ఇతర రాజులందరికిని ఎదుట (రథమును నిలిపి) “ఓ పార్థా! సమావేశమైన ఈ కురువంశీయులను చూడుము” అని పలికెను.",m:"In front of Bhishma, Drona and all the rulers of the earth, he said: “O Partha, behold these Kurus assembled here.”",w:"భీష్మద్రోణప్రముఖతః=in front of Bhishma and Drona; సర్వేషామ్=of all; చ=and; మహీక్షితామ్=rulers of the earth; ఉవాచ=said; పార్థ=O son of Pritha; పశ్య=behold; ఏతాన్=these; సమవేతాన్=assembled; కురూన్=the Kurus; ఇతి=thus"};
D["1.26"]={t:["తత్రాపశ్యత్స్థితాన్పార్థః పితౄనథ పితామహాన్ |","ఆచార్యాన్మాతులాన్భ్రాతౄన్పుత్రాన్పౌత్రాన్సఖీంస్తథా ||"],mt:"అక్కడ పార్థుడు నిలిచియున్న పెద్దలను (తండ్రి వరుసవారిని), తాతలను, ఆచార్యులను, మేనమామలను, సోదరులను, కుమారులను, మనుమలను, మిత్రులను చూచెను.",m:"There Partha saw, standing in the armies, elders of his father’s generation, grandfathers, teachers, maternal uncles, brothers, sons, grandsons, and friends.",w:"తత్ర=there; అపశ్యత్=saw; స్థితాన్=standing; పార్థః=Arjuna; పితౄన్=fathers (elders); అథ=and; పితామహాన్=grandfathers; ఆచార్యాన్=teachers; మాతులాన్=maternal uncles; భ్రాతౄన్=brothers; పుత్రాన్=sons; పౌత్రాన్=grandsons; సఖీన్=friends; తథా=also"};
D["1.27"]={t:["శ్వశురాన్సుహృదశ్చైవ సేనయోరుభయోరపి |","తాన్సమీక్ష్య స కౌన్తేయః సర్వాన్బన్ధూనవస్థితాన్ ||"],mt:"మామగార్లను, హితులను కూడా ఇరు సేనలలో చూచెను. నిలిచియున్న ఆ బంధువులందరినీ కౌంతేయుడు చూచి...",m:"Also fathers-in-law and well-wishers, in both armies. Seeing all those kinsmen standing arrayed, the son of Kunti...",w:"శ్వశురాన్=fathers-in-law; సుహృదః=well-wishers; చ ఏవ=also; సేనయోః ఉభయోః అపి=in both armies; తాన్=them; సమీక్ష్య=seeing; సః=he; కౌన్తేయః=son of Kunti; సర్వాన్=all; బన్ధూన్=kinsmen; అవస్థితాన్=standing"};
D["1.28"]={t:["కృపయా పరయావిష్టో విషీదన్నిదమబ్రవీత్ |","అర్జున ఉవాచ |","దృష్ట్వేమం స్వజనం కృష్ణ యుయుత్సుం సముపస్థితమ్ ||"],mt:"...అత్యంత కరుణతో ఆవేశితుడై, విషాదముతో ఇట్లు పలికెను. అర్జునుడు పలికెను: ఓ కృష్ణా! యుద్ధము చేయగోరి ఎదుట నిలిచిన ఈ స్వజనమును చూచి...",m:"...was overcome with deep compassion and, grieving, spoke thus. Arjuna said: O Krishna, seeing these, my own people, standing here eager to fight...",w:"కృపయా=with compassion; పరయా=deep; ఆవిష్టః=overcome; విషీదన్=grieving; ఇదమ్=this; అబ్రవీత్=said; అర్జునః ఉవాచ=Arjuna said; దృష్ట్వా=seeing; ఇమమ్=these; స్వజనమ్=my kinsmen; కృష్ణ=O Krishna; యుయుత్సుమ్=eager to fight; సముపస్థితమ్=present"};
D["1.29"]={t:["సీదన్తి మమ గాత్రాణి ముఖం చ పరిశుష్యతి |","వేపథుశ్చ శరీరే మే రోమహర్షశ్చ జాయతే ||"],mt:"నా అవయవములు కృశించుచున్నవి, నోరు ఎండిపోవుచున్నది, నా శరీరము వణకుచున్నది, రోమములు నిక్కబొడుచుకొనుచున్నవి.",m:"My limbs are failing, my mouth is drying up, my body trembles, and my hair stands on end.",w:"సీదన్తి=are failing; మమ=my; గాత్రాణి=limbs; ముఖమ్=mouth; చ=and; పరిశుష్యతి=is drying up; వేపథుః=trembling; శరీరే=in the body; మే=my; రోమహర్షః=hair standing on end; జాయతే=arises"};
D["1.30"]={t:["గాణ్డీవం స్రంసతే హస్తాత్త్వక్చైవ పరిదహ్యతే |","న చ శక్నోమ్యవస్థాతుం భ్రమతీవ చ మే మనః ||"],mt:"గాండీవము చేతినుండి జారిపోవుచున్నది, చర్మము అంతటా మండుచున్నది; నేను నిలబడలేకున్నాను, నా మనస్సు తిరుగుచున్నట్లున్నది.",m:"The Gandiva bow slips from my hand, my skin burns all over, I am unable to stand, and my mind seems to whirl.",w:"గాణ్డీవమ్=the Gandiva bow; స్రంసతే=slips; హస్తాత్=from the hand; త్వక్=skin; చ ఏవ=and; పరిదహ్యతే=burns; న=not; చ=and; శక్నోమి=I am able; అవస్థాతుమ్=to stand; భ్రమతి=whirls; ఇవ=as if; మే=my; మనః=mind"};
D["1.31"]={t:["నిమిత్తాని చ పశ్యామి విపరీతాని కేశవ |","న చ శ్రేయోఽనుపశ్యామి హత్వా స్వజనమాహవే ||"],mt:"ఓ కేశవా! అపశకునములను చూచుచున్నాను; యుద్ధమున స్వజనమును చంపుటవలన శ్రేయస్సు కలుగునని నేను చూడను.",m:"O Keshava, I see adverse omens, and I foresee no good in killing my own people in battle.",w:"నిమిత్తాని=omens; చ=and; పశ్యామి=I see; విపరీతాని=adverse; కేశవ=O Keshava; న=not; శ్రేయః=good; అనుపశ్యామి=I foresee; హత్వా=by killing; స్వజనమ్=my own kin; ఆహవే=in battle"};
D["1.32"]={t:["న కాఙ్క్షే విజయం కృష్ణ న చ రాజ్యం సుఖాని చ |","కిం నో రాజ్యేన గోవిన్ద కిం భోగైర్జీవితేన వా ||"],mt:"ఓ కృష్ణా! నాకు విజయము వద్దు, రాజ్యము వద్దు, సుఖములు వద్దు. ఓ గోవిందా! రాజ్యముతోను, భోగములతోను, జీవితముతోను మనకేమి ప్రయోజనము?",m:"O Krishna, I desire neither victory, nor kingdom, nor pleasures. O Govinda, what use to us is a kingdom, or enjoyments, or even life?",w:"న కాఙ్క్షే=I do not desire; విజయమ్=victory; కృష్ణ=O Krishna; న చ=nor; రాజ్యమ్=kingdom; సుఖాని=pleasures; కిమ్=what use; నః=to us; రాజ్యేన=by a kingdom; గోవిన్ద=O Govinda; భోగైః=by enjoyments; జీవితేన=by life; వా=or"};
D["1.33"]={t:["యేషామర్థే కాఙ్క్షితం నో రాజ్యం భోగాః సుఖాని చ |","త ఇమేఽవస్థితా యుద్ధే ప్రాణాంస్త్యక్త్వా ధనాని చ ||"],mt:"ఎవరి కొరకు మనము రాజ్యమును, భోగములను, సుఖములను కోరితిమో, వారే ప్రాణములను ధనములను విడిచి యుద్ధమున నిలిచియున్నారు.",m:"Those for whose sake we desire kingdom, enjoyments and pleasures stand here in battle, ready to give up their lives and wealth.",w:"యేషామ్=for whose; అర్థే=sake; కాఙ్క్షితమ్=desired; నః=by us; రాజ్యమ్=kingdom; భోగాః=enjoyments; సుఖాని=pleasures; చ=and; తే=they; ఇమే=these; అవస్థితాః=stand; యుద్ధే=in battle; ప్రాణాన్=lives; త్యక్త్వా=giving up; ధనాని=wealth"};
D["1.34"]={t:["ఆచార్యాః పితరః పుత్రాస్తథైవ చ పితామహాః |","మాతులాః శ్వశురాః పౌత్రాః శ్యాలాః సమ్బన్ధినస్తథా ||"],mt:"ఆచార్యులు, తండ్రివరుసవారు, కుమారులు, అట్లే తాతలు, మేనమామలు, మామగార్లు, మనుమలు, బావమరుదులు, ఇతర బంధువులు (యుద్ధమున నిలిచియున్నారు).",m:"Teachers, fathers, sons, and likewise grandfathers, maternal uncles, fathers-in-law, grandsons, brothers-in-law, and other relatives (stand in battle).",w:"ఆచార్యాః=teachers; పితరః=fathers (elders); పుత్రాః=sons; తథా ఏవ చ=and likewise; పితామహాః=grandfathers; మాతులాః=maternal uncles; శ్వశురాః=fathers-in-law; పౌత్రాః=grandsons; శ్యాలాః=brothers-in-law; సమ్బన్ధినః=relatives; తథా=also"};
D["1.35"]={t:["ఏతాన్న హన్తుమిచ్ఛామి ఘ్నతోఽపి మధుసూదన |","అపి త్రైలోక్యరాజ్యస్య హేతోః కిం ను మహీకృతే ||"],mt:"ఓ మధుసూదనా! వీరు నన్ను చంపినను, మూడు లోకముల రాజ్యము కొరకైనను వీరిని చంపగోరను; ఇక భూమి కొరకు చెప్పనేల?",m:"O Madhusudana, even if they kill me, I do not wish to kill them, not even for sovereignty over the three worlds, let alone for the earth.",w:"ఏతాన్=these; న హన్తుమ్ ఇచ్ఛామి=I do not wish to kill; ఘ్నతః అపి=even though they kill; మధుసూదన=O Madhusudana; అపి=even; త్రైలోక్యరాజ్యస్య హేతోః=for the sovereignty of the three worlds; కిం ను=what then; మహీకృతే=for the sake of the earth"};
D["1.36"]={t:["నిహత్య ధార్తరాష్ట్రాన్నః కా ప్రీతిః స్యాజ్జనార్దన |","పాపమేవాశ్రయేదస్మాన్హత్వైతానాతతాయినః ||"],mt:"ఓ జనార్దనా! ధృతరాష్ట్ర పుత్రులను చంపి మనకేమి సంతోషము కలుగును? ఈ ఆతతాయులను చంపినచో పాపమే మనలను ఆశ్రయించును.",m:"O Janardana, what joy could we have in killing Dhritarashtra’s sons? Sin alone would cling to us if we slay these aggressors.",w:"నిహత్య=having killed; ధార్తరాష్ట్రాన్=Dhritarashtra’s sons; నః=our; కా=what; ప్రీతిః=joy; స్యాత్=would be; జనార్దన=O Janardana; పాపమ్=sin; ఏవ=only; ఆశ్రయేత్=would cling; అస్మాన్=to us; హత్వా=killing; ఏతాన్=these; ఆతతాయినః=aggressors"};
D["1.37"]={t:["తస్మాన్నార్హా వయం హన్తుం ధార్తరాష్ట్రాన్స్వబాన్ధవాన్ |","స్వజనం హి కథం హత్వా సుఖినః స్యామ మాధవ ||"],mt:"కావున ధృతరాష్ట్ర పుత్రులైన మన బంధువులను చంపుటకు మనము తగము. ఓ మాధవా! స్వజనమును చంపి మనము ఎట్లు సుఖపడగలము?",m:"Therefore we ought not to kill our own kinsmen, the sons of Dhritarashtra. O Madhava, how can we be happy by killing our own people?",w:"తస్మాత్=therefore; న అర్హాః=not fit; వయమ్=we; హన్తుమ్=to kill; ధార్తరాష్ట్రాన్=the sons of Dhritarashtra; స్వబాన్ధవాన్=our own kinsmen; స్వజనమ్=our own people; హి=indeed; కథమ్=how; హత్వా=having killed; సుఖినః=happy; స్యామ=shall we be; మాధవ=O Madhava"};
D["1.38"]={t:["యద్యప్యేతే న పశ్యన్తి లోభోపహతచేతసః |","కులక్షయకృతం దోషం మిత్రద్రోహే చ పాతకమ్ ||"],mt:"లోభముచే వివేకము నశించిన వీరు కులనాశనమువలన కలుగు దోషమును, మిత్రద్రోహమువలన కలుగు పాపమును చూడకున్నను...",m:"Even if these men, whose minds are overpowered by greed, do not see the fault in destroying a family and the sin in betraying friends...",w:"యది అపి=even if; ఏతే=these; న పశ్యన్తి=do not see; లోభోపహతచేతసః=with minds overcome by greed; కులక్షయకృతమ్=caused by the destruction of a family; దోషమ్=fault; మిత్రద్రోహే=in betraying friends; చ=and; పాతకమ్=sin"};
D["1.39"]={t:["కథం న జ్ఞేయమస్మాభిః పాపాదస్మాన్నివర్తితుమ్ |","కులక్షయకృతం దోషం ప్రపశ్యద్భిర్జనార్దన ||"],mt:"ఓ జనార్దనా! కులనాశనమువలన కలుగు దోషమును స్పష్టముగా చూచుచున్న మనము ఈ పాపమునుండి మరలుటను ఎందుకు తెలిసికొనకూడదు?",m:"O Janardana, why should we, who clearly see the evil in destroying a family, not know enough to turn away from this sin?",w:"కథమ్=why; న=not; జ్ఞేయమ్=should be known; అస్మాభిః=by us; పాపాత్=from sin; అస్మాత్=this; నివర్తితుమ్=to turn away; కులక్షయకృతమ్ దోషమ్=the evil of destroying a family; ప్రపశ్యద్భిః=by those who clearly see; జనార్దన=O Janardana"};
D["1.40"]={t:["కులక్షయే ప్రణశ్యన్తి కులధర్మాః సనాతనాః |","ధర్మే నష్టే కులం కృత్స్నమధర్మోఽభిభవత్యుత ||"],mt:"కులము నశించగా సనాతనములైన కులధర్మములు నశించును; ధర్మము నశించగా అధర్మము కులమంతటిని ఆక్రమించును.",m:"When a family is destroyed, its eternal family traditions perish; and when dharma is lost, lawlessness overwhelms the whole family.",w:"కులక్షయే=on the destruction of a family; ప్రణశ్యన్తి=perish; కులధర్మాః=family traditions; సనాతనాః=eternal; ధర్మే నష్టే=when dharma is lost; కులమ్=family; కృత్స్నమ్=entire; అధర్మః=lawlessness; అభిభవతి=overcomes; ఉత=indeed"};
D["1.41"]={t:["అధర్మాభిభవాత్కృష్ణ ప్రదుష్యన్తి కులస్త్రియః |","స్త్రీషు దుష్టాసు వార్ష్ణేయ జాయతే వర్ణసఙ్కరః ||"],mt:"ఓ కృష్ణా! అధర్మము ఆక్రమించుటవలన కులస్త్రీలు చెడుదురు; ఓ వార్ష్ణేయా! స్త్రీలు చెడగా వర్ణసంకరము కలుగును.",m:"O Krishna, when lawlessness prevails, the women of the family become corrupted; and when women are corrupted, O descendant of Vrishni, confusion of social classes arises.",w:"అధర్మాభిభవాత్=by the spread of lawlessness; కృష్ణ=O Krishna; ప్రదుష్యన్తి=become corrupted; కులస్త్రియః=women of the family; స్త్రీషు=among women; దుష్టాసు=corrupted; వార్ష్ణేయ=O descendant of Vrishni; జాయతే=arises; వర్ణసఙ్కరః=mixing of social classes"};
D["1.42"]={t:["సఙ్కరో నరకాయైవ కులఘ్నానాం కులస్య చ |","పతన్తి పితరో హ్యేషాం లుప్తపిణ్డోదకక్రియాః ||"],mt:"ఆ సంకరము కులనాశకులను, ఆ కులమును నరకమునకే చేర్చును. పిండోదక క్రియలు లోపించి వారి పితృదేవతలు పతనమగుదురు.",m:"Such confusion leads the destroyers of the family, and the family itself, to hell; their ancestors fall, deprived of the offerings of rice-balls and water.",w:"సఙ్కరః=confusion; నరకాయ=to hell; ఏవ=surely; కులఘ్నానామ్=of the destroyers of the family; కులస్య=of the family; చ=and; పతన్తి=fall; పితరః=ancestors; హి=indeed; ఏషామ్=their; లుప్తపిణ్డోదకక్రియాః=deprived of offerings of rice-balls and water"};
D["1.43"]={t:["దోషైరేతైః కులఘ్నానాం వర్ణసఙ్కరకారకైః |","ఉత్సాద్యన్తే జాతిధర్మాః కులధర్మాశ్చ శాశ్వతాః ||"],mt:"వర్ణసంకరమును కలిగించు ఈ దోషములచే కులనాశకులకు శాశ్వతమైన జాతిధర్మములును కులధర్మములును నశించును.",m:"By these faults of the family-destroyers, which cause confusion of classes, the eternal duties of communities and families are ruined.",w:"దోషైః=by faults; ఏతైః=these; కులఘ్నానామ్=of the family-destroyers; వర్ణసఙ్కరకారకైః=causing mixture of classes; ఉత్సాద్యన్తే=are destroyed; జాతిధర్మాః=duties of communities; కులధర్మాః=family duties; చ=and; శాశ్వతాః=eternal"};
D["1.44"]={t:["ఉత్సన్నకులధర్మాణాం మనుష్యాణాం జనార్దన |","నరకేఽనియతం వాసో భవతీత్యనుశుశ్రుమ ||"],mt:"ఓ జనార్దనా! కులధర్మములు నశించిన మనుష్యులకు నరకమున నిరంతర వాసము కలుగునని మేము పెద్దలనుండి విని యున్నాము.",m:"O Janardana, we have heard that people whose family traditions are destroyed dwell in hell for an indefinite time.",w:"ఉత్సన్నకులధర్మాణామ్=of those whose family traditions are destroyed; మనుష్యాణామ్=of men; జనార్దన=O Janardana; నరకే=in hell; అనియతమ్=indefinite; వాసః=dwelling; భవతి=occurs; ఇతి=thus; అనుశుశ్రుమ=we have heard (from tradition)"};
D["1.45"]={t:["అహో బత మహత్పాపం కర్తుం వ్యవసితా వయమ్ |","యద్రాజ్యసుఖలోభేన హన్తుం స్వజనముద్యతాః ||"],mt:"అయ్యో! రాజ్యసుఖముపై లోభముచే స్వజనమును చంపుటకు సిద్ధపడి మహాపాపము చేయ నిశ్చయించితిమి గదా!",m:"Alas, we have resolved to commit a great sin, prepared to kill our own people out of greed for the pleasures of a kingdom.",w:"అహో బత=alas; మహత్=great; పాపమ్=sin; కర్తుమ్=to commit; వ్యవసితాః=resolved; వయమ్=we; యత్=because; రాజ్యసుఖలోభేన=out of greed for the pleasures of a kingdom; హన్తుమ్=to kill; స్వజనమ్=our own people; ఉద్యతాః=prepared"};
D["1.46"]={t:["యది మామప్రతీకారమశస్త్రం శస్త్రపాణయః |","ధార్తరాష్ట్రా రణే హన్యుస్తన్మే క్షేమతరం భవేత్ ||"],mt:"ఆయుధములు ధరించిన ధృతరాష్ట్ర పుత్రులు, ప్రతీకారము చేయక నిరాయుధుడనై యున్న నన్ను యుద్ధమున చంపినచో అది నాకు మరింత క్షేమకరమగును.",m:"If the armed sons of Dhritarashtra were to kill me in battle, unresisting and unarmed, that would be better for me.",w:"యది=if; మామ్=me; అప్రతీకారమ్=unresisting; అశస్త్రమ్=unarmed; శస్త్రపాణయః=with weapons in hand; ధార్తరాష్ట్రాః=the sons of Dhritarashtra; రణే=in battle; హన్యుః=should kill; తత్=that; మే=for me; క్షేమతరమ్=more beneficial; భవేత్=would be"};
D["1.47"]={t:["సఞ్జయ ఉవాచ |","ఏవముక్త్వార్జునః సఙ్ఖ్యే రథోపస్థ ఉపావిశత్ |","విసృజ్య సశరం చాపం శోకసంవిగ్నమానసః ||"],mt:"సంజయుడు పలికెను: ఇట్లు పలికి అర్జునుడు యుద్ధభూమిలో శోకముచే కలత చెందిన మనస్సుతో, బాణముతో కూడిన ధనస్సును విడిచి రథముపై కూర్చుండెను.",m:"Sanjaya said: Having spoken thus on the battlefield, Arjuna cast aside his bow and arrows and sat down on the seat of his chariot, his mind overwhelmed with grief.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఏవమ్=thus; ఉక్త్వా=having spoken; అర్జునః=Arjuna; సఙ్ఖ్యే=on the battlefield; రథోపస్థే=on the seat of the chariot; ఉపావిశత్=sat down; విసృజ్య=casting aside; సశరమ్=with arrows; చాపమ్=bow; శోకసంవిగ్నమానసః=with a mind distressed by grief"};


//chapter 2

// Chapter 2 – shlokas 2.1 to 2.24. Paste after your D object.
D["2.1"]={t:["సఞ్జయ ఉవాచ |","తం తథా కృపయావిష్టమశ్రుపూర్ణాకులేక్షణమ్ |","విషీదన్తమిదం వాక్యమువాచ మధుసూదనః ||"],mt:"సంజయుడు పలికెను: ఆ విధముగా కరుణావిష్టుడై, కన్నీటితో నిండి కలతచెందిన కన్నులతో విషాదపడుచున్న అర్జునునితో మధుసూదనుడు ఈ మాటలను పలికెను.",m:"Sanjaya said: To Arjuna, overcome with compassion, his eyes filled with tears and troubled, and grieving thus, Madhusudana spoke these words.",w:"సఞ్జయః ఉవాచ=Sanjaya said; తమ్=to him; తథా=thus; కృపయా ఆవిష్టమ్=overcome with compassion; అశ్రుపూర్ణాకులేక్షణమ్=with eyes full of tears and troubled; విషీదన్తమ్=grieving; ఇదమ్=this; వాక్యమ్=speech; ఉవాచ=said; మధుసూదనః=Krishna"};
D["2.2"]={t:["శ్రీభగవానువాచ |","కుతస్త్వా కశ్మలమిదం విషమే సముపస్థితమ్ |","అనార్యజుష్టమస్వర్గ్యమకీర్తికరమర్జున ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ అర్జునా! శ్రేష్ఠులకు తగని, స్వర్గమునకు చేర్చని, అపకీర్తిని కలిగించు ఈ మోహము ఈ విషమ సమయమున నీకు ఎక్కడినుండి వచ్చినది?",m:"The Blessed Lord said: O Arjuna, from where has this dejection come upon you at this critical hour, unbecoming of the noble, not leading to heaven, and bringing disgrace?",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; కుతః=from where; త్వా=to you; కశ్మలమ్=dejection; ఇదమ్=this; విషమే=at this critical time; సముపస్థితమ్=has come; అనార్యజుష్టమ్=practised by the ignoble; అస్వర్గ్యమ్=not leading to heaven; అకీర్తికరమ్=causing disgrace; అర్జున=O Arjuna"};
D["2.3"]={t:["క్లైబ్యం మా స్మ గమః పార్థ నైతత్త్వయ్యుపపద్యతే |","క్షుద్రం హృదయదౌర్బల్యం త్యక్త్వోత్తిష్ఠ పరన్తప ||"],mt:"ఓ పార్థా! పిరికితనమునకు లొంగకుము; ఇది నీకు తగదు. ఓ పరంతపా! క్షుద్రమైన హృదయదౌర్బల్యమును విడిచి లెమ్ము.",m:"O Partha, do not yield to unmanliness; it does not befit you. Give up this petty weakness of heart and arise, O scorcher of foes.",w:"క్లైబ్యమ్=unmanliness; మా స్మ గమః=do not yield to; పార్థ=O Partha; న=not; ఏతత్=this; త్వయి=in you; ఉపపద్యతే=is befitting; క్షుద్రమ్=petty; హృదయదౌర్బల్యమ్=weakness of heart; త్యక్త్వా=giving up; ఉత్తిష్ఠ=arise; పరన్తప=O scorcher of foes"};
D["2.4"]={t:["అర్జున ఉవాచ |","కథం భీష్మమహం సఙ్ఖ్యే ద్రోణం చ మధుసూదన |","ఇషుభిః ప్రతియోత్స్యామి పూజార్హావరిసూదన ||"],mt:"అర్జునుడు పలికెను: ఓ మధుసూదనా! శత్రుసంహారా! పూజింపదగిన భీష్ముని, ద్రోణుని యుద్ధమున నేను బాణములతో ఎట్లు ఎదిరించగలను?",m:"Arjuna said: O Madhusudana, O slayer of enemies, how can I fight back with arrows in battle against Bhishma and Drona, who are worthy of worship?",w:"అర్జునః ఉవాచ=Arjuna said; కథమ్=how; భీష్మమ్=Bhishma; అహమ్=I; సఙ్ఖ్యే=in battle; ద్రోణమ్ చ=and Drona; మధుసూదన=O Madhusudana; ఇషుభిః=with arrows; ప్రతియోత్స్యామి=shall I fight back; పూజార్హౌ=worthy of worship; అరిసూదన=O slayer of enemies"};
D["2.5"]={t:["గురూనహత్వా హి మహానుభావాన్","శ్రేయో భోక్తుం భైక్ష్యమపీహ లోకే |","హత్వార్థకామాంస్తు గురూనిహైవ","భుఞ్జీయ భోగాన్ రుధిరప్రదిగ్ధాన్ ||"],mt:"మహానుభావులైన గురువులను చంపక ఈ లోకమున భిక్షాన్నమును తినుట కూడా శ్రేయస్కరము. అర్థకామముల కొరకు గురువులను చంపినచో ఇక్కడే రక్తముతో తడిసిన భోగములను అనుభవింపవలసి వచ్చును.",m:"It is better to live in this world even on alms than to slay these noble teachers. If I kill them, though they desire wealth, I would enjoy here only pleasures stained with blood.",w:"గురూన్=teachers; అహత్వా=without killing; హి=indeed; మహానుభావాన్=noble; శ్రేయః=better; భోక్తుమ్=to eat; భైక్ష్యమ్=alms; అపి=even; ఇహ లోకే=in this world; హత్వా=having killed; అర్థకామాన్=desiring wealth; తు=but; ఇహ ఏవ=right here; భుఞ్జీయ=I would enjoy; భోగాన్=pleasures; రుధిరప్రదిగ్ధాన్=stained with blood"};
D["2.6"]={t:["న చైతద్విద్మః కతరన్నో గరీయో","యద్వా జయేమ యది వా నో జయేయుః |","యానేవ హత్వా న జిజీవిషామస్","తేఽవస్థితాః ప్రముఖే ధార్తరాష్ట్రాః ||"],mt:"మనకు ఏది శ్రేష్ఠమో — మనము గెలుచుటయా, వారు మనలను గెలుచుటయా — అదియు మాకు తెలియదు. ఎవరిని చంపి మేము జీవింపగోరమో, ఆ ధృతరాష్ట్ర పుత్రులే మన ఎదుట నిలిచియున్నారు.",m:"Nor do we know which is better for us: that we should conquer them or that they should conquer us. The sons of Dhritarashtra, after killing whom we would not wish to live, stand before us.",w:"న=not; చ=and; ఏతత్=this; విద్మః=we know; కతరత్=which of the two; నః=for us; గరీయః=better; యత్ వా=whether; జయేమ=we may win; యది వా=or if; జయేయుః=they may conquer; యాన్=whom; హత్వా=having killed; న జిజీవిషామః=we would not wish to live; తే=they; అవస్థితాః=stand; ప్రముఖే=in front; ధార్తరాష్ట్రాః=Dhritarashtra’s sons"};
D["2.7"]={t:["కార్పణ్యదోషోపహతస్వభావః","పృచ్ఛామి త్వాం ధర్మసమ్మూఢచేతాః |","యచ్ఛ్రేయః స్యాన్నిశ్చితం బ్రూహి తన్మే","శిష్యస్తేఽహం శాధి మాం త్వాం ప్రపన్నమ్ ||"],mt:"దైన్యదోషముచే నా స్వభావము చెడినది; ధర్మవిషయమున మూఢచిత్తుడనై నిన్ను అడుగుచున్నాను: నాకు నిశ్చయముగా ఏది శ్రేయస్కరమో దానిని చెప్పుము. నేను నీ శిష్యుడను; శరణుజొచ్చిన నన్ను ఉపదేశింపుము.",m:"My nature is afflicted by the fault of weak pity, and my mind is confused about duty. I ask you: tell me decisively what is best for me. I am your disciple; instruct me, who have taken refuge in you.",w:"కార్పణ్యదోషోపహతస్వభావః=with a nature afflicted by the fault of weak pity; పృచ్ఛామి=I ask; త్వామ్=you; ధర్మసమ్మూఢచేతాః=with a mind confused about dharma; యత్=what; శ్రేయః=best; స్యాత్=may be; నిశ్చితమ్=definitely; బ్రూహి=tell; తత్=that; మే=me; శిష్యః=disciple; తే=your; అహమ్=I; శాధి=instruct; మామ్=me; త్వామ్ ప్రపన్నమ్=surrendered to you"};
D["2.8"]={t:["న హి ప్రపశ్యామి మమాపనుద్యాద్","యచ్ఛోకముచ్ఛోషణమిన్ద్రియాణామ్ |","అవాప్య భూమావసపత్నమృద్ధం","రాజ్యం సురాణామపి చాధిపత్యమ్ ||"],mt:"భూమిపై శత్రురహితమైన సమృద్ధ రాజ్యమును, దేవతల ఆధిపత్యమును పొందినను, ఇంద్రియములను ఎండగొట్టు నా శోకమును పోగొట్టునది ఏదియు నాకు కనబడదు.",m:"I do not see anything that could dispel the grief that dries up my senses, even if I were to win an unrivalled and prosperous kingdom on earth or sovereignty over the gods.",w:"న హి=not indeed; ప్రపశ్యామి=I see; మమ=my; అపనుద్యాత్=could remove; యత్=which; శోకమ్=grief; ఉచ్ఛోషణమ్=drying up; ఇన్ద్రియాణామ్=of the senses; అవాప్య=having obtained; భూమౌ=on earth; అసపత్నమ్=without rivals; ఋద్ధమ్=prosperous; రాజ్యమ్=kingdom; సురాణామ్ అపి=even of the gods; చ=and; ఆధిపత్యమ్=sovereignty"};
D["2.9"]={t:["సఞ్జయ ఉవాచ |","ఏవముక్త్వా హృషీకేశం గుడాకేశః పరన్తపః |","న యోత్స్య ఇతి గోవిన్దముక్త్వా తూష్ణీం బభూవ హ ||"],mt:"సంజయుడు పలికెను: శత్రుతాపకుడైన గుడాకేశుడు హృషీకేశునితో ఇట్లు చెప్పి, “నేను యుద్ధము చేయను” అని గోవిందునితో పలికి మౌనముగా ఉండెను.",m:"Sanjaya said: Having spoken thus to Hrishikesha, Gudakesha, the scorcher of foes, said to Govinda, “I shall not fight,” and fell silent.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఏవమ్ ఉక్త్వా=having spoken thus; హృషీకేశమ్=to Krishna; గుడాకేశః=Arjuna; పరన్తపః=scorcher of foes; న యోత్స్యే=I shall not fight; ఇతి=thus; గోవిన్దమ్=to Govinda; ఉక్త్వా=having said; తూష్ణీమ్=silent; బభూవ హ=became"};
D["2.10"]={t:["తమువాచ హృషీకేశః ప్రహసన్నివ భారత |","సేనయోరుభయోర్మధ్యే విషీదన్తమిదం వచః ||"],mt:"ఓ భారతా! ఇరు సేనల మధ్య విషాదపడుచున్న అర్జునునితో హృషీకేశుడు నవ్వుచున్నట్లుగా ఈ మాటలను పలికెను.",m:"O Bharata, as if smiling, Hrishikesha spoke these words to the grieving Arjuna in the midst of the two armies.",w:"తమ్=to him; ఉవాచ=said; హృషీకేశః=Krishna; ప్రహసన్ ఇవ=as if smiling; భారత=O Bharata; సేనయోః ఉభయోః మధ్యే=between the two armies; విషీదన్తమ్=to the grieving one; ఇదమ్=these; వచః=words"};
D["2.11"]={t:["శ్రీభగవానువాచ |","అశోచ్యానన్వశోచస్త్వం ప్రజ్ఞావాదాంశ్చ భాషసే |","గతాసూనగతాసూంశ్చ నానుశోచన్తి పణ్డితాః ||"],mt:"శ్రీభగవానుడు పలికెను: శోకింపదగని వారి కొరకు నీవు శోకించుచున్నావు, అయినను పండితుల వంటి మాటలు పలుకుచున్నావు. ప్రాణములు పోయినవారి కొరకును, పోనివారి కొరకును పండితులు శోకింపరు.",m:"The Blessed Lord said: You grieve for those who should not be grieved for, yet you speak words of wisdom. The wise grieve neither for the dead nor for the living.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; అశోచ్యాన్=those not to be grieved for; అన్వశోచః=you have grieved; త్వమ్=you; ప్రజ్ఞావాదాన్=words of wisdom; చ=and; భాషసే=you speak; గతాసూన్=the dead; అగతాసూన్=the living; చ=and; న అనుశోచన్తి=do not grieve; పణ్డితాః=the wise"};
D["2.12"]={t:["న త్వేవాహం జాతు నాసం న త్వం నేమే జనాధిపాః |","న చైవ న భవిష్యామః సర్వే వయమతః పరమ్ ||"],mt:"నేను ఎన్నడును లేనివాడను కాను; నీవును, ఈ రాజులును లేనివారు కారు; ఇకపై మనమందరమును ఉండకపోవుట కూడా ఉండదు.",m:"Never was there a time when I did not exist, nor you, nor these kings; nor will any of us cease to exist hereafter.",w:"న తు ఏవ=never indeed; అహమ్=I; జాతు=at any time; న ఆసమ్=did not exist; న త్వమ్=nor you; న ఇమే=nor these; జనాధిపాః=rulers of men; న చ ఏవ=nor indeed; న భవిష్యామః=shall we cease to be; సర్వే వయమ్=all of us; అతః పరమ్=hereafter"};
D["2.13"]={t:["దేహినోఽస్మిన్యథా దేహే కౌమారం యౌవనం జరా |","తథా దేహాన్తరప్రాప్తిర్ధీరస్తత్ర న ముహ్యతి ||"],mt:"ఈ దేహమున దేహధారికి బాల్యము, యౌవనము, వార్ధక్యము ఎట్లు కలుగునో, అట్లే మరొక దేహప్రాప్తియు కలుగును; ధీరుడు ఈ విషయమున మోహపడడు.",m:"Just as the embodied soul passes in this body through boyhood, youth and old age, so it attains another body; the wise are not deluded by this.",w:"దేహినః=of the embodied one; అస్మిన్=in this; యథా=as; దేహే=in the body; కౌమారమ్=boyhood; యౌవనమ్=youth; జరా=old age; తథా=so; దేహాన్తరప్రాప్తిః=attainment of another body; ధీరః=the wise; తత్ర=in that; న ముహ్యతి=is not deluded"};
D["2.14"]={t:["మాత్రాస్పర్శాస్తు కౌన్తేయ శీతోష్ణసుఖదుఃఖదాః |","ఆగమాపాయినోఽనిత్యాస్తాంస్తితిక్షస్వ భారత ||"],mt:"ఓ కౌంతేయా! శీతోష్ణ సుఖదుఃఖములనిచ్చు ఇంద్రియ విషయ స్పర్శలు వచ్చిపోవునవి, అనిత్యములు; ఓ భారతా! వాటిని సహింపుము.",m:"O son of Kunti, the contacts of the senses with their objects give cold and heat, pleasure and pain; they come and go and are impermanent. Endure them, O Bharata.",w:"మాత్రాస్పర్శాః=contacts of the senses with their objects; తు=but; కౌన్తేయ=O son of Kunti; శీతోష్ణసుఖదుఃఖదాః=giving cold, heat, pleasure and pain; ఆగమాపాయినః=coming and going; అనిత్యాః=impermanent; తాన్=them; తితిక్షస్వ=endure; భారత=O Bharata"};
D["2.15"]={t:["యం హి న వ్యథయన్త్యేతే పురుషం పురుషర్షభ |","సమదుఃఖసుఖం ధీరం సోఽమృతత్వాయ కల్పతే ||"],mt:"ఓ పురుషశ్రేష్ఠా! సుఖదుఃఖములయందు సమభావము గల ఏ ధీరుని ఇవి బాధింపవో, అతడు అమృతత్వమునకు అర్హుడగును.",m:"O best of men, the steadfast person who is not disturbed by these, and is the same in pain and pleasure, becomes fit for immortality.",w:"యమ్=whom; హి=indeed; న వ్యథయన్తి=do not distress; ఏతే=these; పురుషమ్=person; పురుషర్షభ=O best of men; సమదుఃఖసుఖమ్=equal in pain and pleasure; ధీరమ్=steadfast; సః=he; అమృతత్వాయ=for immortality; కల్పతే=becomes fit"};
D["2.16"]={t:["నాసతో విద్యతే భావో నాభావో విద్యతే సతః |","ఉభయోరపి దృష్టోఽన్తస్త్వనయోస్తత్త్వదర్శిభిః ||"],mt:"అసత్తునకు ఉనికి లేదు; సత్తునకు లేకపోవుట లేదు. ఈ రెంటి నిర్ణయమును తత్త్వదర్శులు చూచిరి.",m:"The unreal has no being, and the real has no non-being. The seers of truth have realised the conclusion about both.",w:"న=not; అసతః=of the unreal; విద్యతే=exists; భావః=being; న అభావః=nor non-being; సతః=of the real; ఉభయోః అపి=of both; దృష్టః=seen; అన్తః=conclusion; తు=indeed; అనయోః=of these two; తత్త్వదర్శిభిః=by the seers of truth"};
D["2.17"]={t:["అవినాశి తు తద్విద్ధి యేన సర్వమిదం తతమ్ |","వినాశమవ్యయస్యాస్య న కశ్చిత్కర్తుమర్హతి ||"],mt:"ఈ సమస్తము దేనిచే వ్యాపింపబడినదో అది నాశరహితమని తెలిసికొనుము. అవ్యయమైన దీనికి నాశము కలిగించుటకు ఎవరును సమర్థులు కారు.",m:"Know that to be indestructible by which all this is pervaded. No one can bring about the destruction of this imperishable one.",w:"అవినాశి=indestructible; తు=indeed; తత్=that; విద్ధి=know; యేన=by which; సర్వమ్ ఇదమ్=all this; తతమ్=is pervaded; వినాశమ్=destruction; అవ్యయస్య=of the imperishable; అస్య=of this; న కశ్చిత్=no one; కర్తుమ్=to cause; అర్హతి=is able"};
D["2.18"]={t:["అన్తవన్త ఇమే దేహా నిత్యస్యోక్తాః శరీరిణః |","అనాశినోఽప్రమేయస్య తస్మాద్యుధ్యస్వ భారత ||"],mt:"నిత్యుడును, నాశరహితుడును, ప్రమాణములకు అందనివాడునైన దేహధారి యొక్క ఈ శరీరములు అంతమగునవని చెప్పబడినవి; కావున ఓ భారతా! యుద్ధము చేయుము.",m:"These bodies of the eternal, indestructible and immeasurable embodied soul are said to have an end. Therefore fight, O Bharata.",w:"అన్తవన్తః=having an end; ఇమే=these; దేహాః=bodies; నిత్యస్య=of the eternal; ఉక్తాః=are said; శరీరిణః=of the embodied one; అనాశినః=indestructible; అప్రమేయస్య=immeasurable; తస్మాత్=therefore; యుధ్యస్వ=fight; భారత=O Bharata"};
D["2.19"]={t:["య ఏనం వేత్తి హన్తారం యశ్చైనం మన్యతే హతమ్ |","ఉభౌ తౌ న విజానీతో నాయం హన్తి న హన్యతే ||"],mt:"ఆత్మను చంపువాడని తలచువాడును, చంపబడెనని తలచువాడును ఇద్దరును ఎరుగరు; ఇది చంపదు, చంపబడదు.",m:"One who thinks the self is a slayer, and one who thinks it is slain, both fail to understand; it neither slays nor is slain.",w:"యః=who; ఏనమ్=this; వేత్తి=thinks; హన్తారమ్=the slayer; యః చ=and who; మన్యతే=thinks; హతమ్=slain; ఉభౌ తౌ=both of them; న విజానీతః=do not know; న అయమ్=this one neither; హన్తి=slays; న హన్యతే=nor is slain"};
D["2.20"]={t:["న జాయతే మ్రియతే వా కదాచిన్","నాయం భూత్వా భవితా వా న భూయః |","అజో నిత్యః శాశ్వతోఽయం పురాణో","న హన్యతే హన్యమానే శరీరే ||"],mt:"ఇది ఎన్నడును పుట్టదు, చావదు; ఒకసారి ఉండి మరల ఉండకపోవునది కాదు. ఇది జన్మరహితము, నిత్యము, శాశ్వతము, పురాతనము; శరీరము చంపబడినను ఇది చంపబడదు.",m:"It is never born and never dies; nor, having come to be, will it cease to be again. Unborn, eternal, everlasting and ancient, it is not slain when the body is slain.",w:"న జాయతే=is not born; మ్రియతే=dies; వా=or; కదాచిత్=ever; న అయమ్=this one not; భూత్వా=having come to be; భవితా=will be; వా=or; న భూయః=again not; అజః=unborn; నిత్యః=eternal; శాశ్వతః=everlasting; అయమ్=this; పురాణః=ancient; న హన్యతే=is not slain; హన్యమానే శరీరే=when the body is slain"};
D["2.21"]={t:["వేదావినాశినం నిత్యం య ఏనమజమవ్యయమ్ |","కథం స పురుషః పార్థ కం ఘాతయతి హన్తి కమ్ ||"],mt:"ఓ పార్థా! దీనిని నాశరహితమని, నిత్యమని, జన్మరహితమని, అవ్యయమని ఎరిగినవాడు ఎవరిని చంపించును? ఎవరిని చంపును?",m:"O Partha, how can one who knows this to be indestructible, eternal, unborn and immutable cause anyone to be killed, or kill anyone?",w:"వేద=knows; అవినాశినమ్=indestructible; నిత్యమ్=eternal; యః=who; ఏనమ్=this; అజమ్=unborn; అవ్యయమ్=immutable; కథమ్=how; సః పురుషః=that person; పార్థ=O Partha; కమ్=whom; ఘాతయతి=causes to be killed; హన్తి=kills; కమ్=whom"};
D["2.22"]={t:["వాసాంసి జీర్ణాని యథా విహాయ నవాని గృహ్ణాతి నరోఽపరాణి |","తథా శరీరాణి విహాయ జీర్ణాన్యన్యాని సంయాతి నవాని దేహీ ||"],mt:"మనుష్యుడు చినిగిన వస్త్రములను విడిచి కొత్తవాటిని ధరించునట్లు, దేహధారి జీర్ణ శరీరములను విడిచి కొత్త శరీరములను పొందును.",m:"As a person casts off worn-out garments and puts on new ones, so the embodied soul casts off worn-out bodies and enters new ones.",w:"వాసాంసి=garments; జీర్ణాని=worn-out; యథా=as; విహాయ=discarding; నవాని=new; గృహ్ణాతి=takes; నరః=a man; అపరాణి=others; తథా=so; శరీరాణి=bodies; విహాయ=casting off; అన్యాని=other; సంయాతి=enters; దేహీ=the embodied soul"};
D["2.23"]={t:["నైనం ఛిన్దన్తి శస్త్రాణి నైనం దహతి పావకః |","న చైనం క్లేదయన్త్యాపో న శోషయతి మారుతః ||"],mt:"శస్త్రములు దీనిని ఛేదింపవు, అగ్ని దీనిని దహింపదు, నీరు దీనిని తడుపదు, గాలి దీనిని ఆరబెట్టదు.",m:"Weapons do not cut it, fire does not burn it, water does not wet it, and wind does not dry it.",w:"న=not; ఏనమ్=this; ఛిన్దన్తి=cut; శస్త్రాణి=weapons; దహతి=burns; పావకః=fire; న చ=nor; క్లేదయన్తి=wet; ఆపః=waters; శోషయతి=dries; మారుతః=wind"};
D["2.24"]={t:["అచ్ఛేద్యోఽయమదాహ్యోఽయమక్లేద్యోఽశోష్య ఏవ చ |","నిత్యః సర్వగతః స్థాణురచలోఽయం సనాతనః ||"],mt:"ఇది ఛేదింపబడదు, దహింపబడదు, తడుపబడదు, ఎండింపబడదు; ఇది నిత్యము, సర్వవ్యాపి, స్థిరము, అచలము, సనాతనము.",m:"This self cannot be cut, burnt, wetted or dried. It is eternal, all-pervading, stable, immovable and ancient.",w:"అచ్ఛేద్యః=uncuttable; అయమ్=this; అదాహ్యః=unburnable; అక్లేద్యః=cannot be wetted; అశోష్యః=cannot be dried; ఏవ చ=and indeed; నిత్యః=eternal; సర్వగతః=all-pervading; స్థాణుః=stable; అచలః=immovable; సనాతనః=ancient"};
// Chapter 2 – shlokas 2.25 to 2.48. Paste after your D object (D["2.47"] here replaces the earlier English-only 2.47).
D["2.25"]={t:["అవ్యక్తోఽయమచిన్త్యోఽయమవికార్యోఽయముచ్యతే |","తస్మాదేవం విదిత్వైనం నానుశోచితుమర్హసి ||"],mt:"ఇది అవ్యక్తము, అచింత్యము, వికారరహితము అని చెప్పబడును. కావున దీనిని ఇట్లు తెలిసికొని నీవు శోకింపతగవు.",m:"This self is said to be unmanifest, inconceivable and unchangeable. Knowing it thus, you should not grieve.",w:"అవ్యక్తః=unmanifest; అయమ్=this; అచిన్త్యః=inconceivable; అవికార్యః=unchangeable; ఉచ్యతే=is said; తస్మాత్=therefore; ఏవమ్=thus; విదిత్వా=knowing; ఏనమ్=this; న అనుశోచితుమ్ అర్హసి=you should not grieve"};
D["2.26"]={t:["అథ చైనం నిత్యజాతం నిత్యం వా మన్యసే మృతమ్ |","తథాపి త్వం మహాబాహో నైనం శోచితుమర్హసి ||"],mt:"ఒకవేళ నీవు దీనిని ఎల్లప్పుడును పుట్టుచున్నదనియు, ఎల్లప్పుడును చచ్చుచున్నదనియు తలచినను, ఓ మహాబాహో! అప్పటికిని నీవు దీని కొరకు శోకింపతగవు.",m:"And even if you think this self is constantly born and constantly dies, O mighty-armed one, you still should not grieve for it.",w:"అథ చ=and if; ఏనమ్=this; నిత్యజాతమ్=constantly born; నిత్యమ్=constantly; వా=or; మన్యసే=you think; మృతమ్=dead; తథా అపి=even so; త్వమ్=you; మహాబాహో=O mighty-armed; న శోచితుమ్ అర్హసి=you should not grieve"};
D["2.27"]={t:["జాతస్య హి ధ్రువో మృత్యుర్ధ్రువం జన్మ మృతస్య చ |","తస్మాదపరిహార్యేఽర్థే న త్వం శోచితుమర్హసి ||"],mt:"పుట్టినవానికి మరణము తప్పనిది; చచ్చినవానికి జన్మమును తప్పనిది. కావున తప్పించుకొనలేని ఈ విషయమున నీవు శోకింపతగవు.",m:"For one who is born, death is certain, and for one who dies, birth is certain. Therefore you should not grieve over what is unavoidable.",w:"జాతస్య=of one who is born; హి=indeed; ధ్రువః=certain; మృత్యుః=death; ధ్రువమ్=certain; జన్మ=birth; మృతస్య=of one who has died; చ=and; తస్మాత్=therefore; అపరిహార్యే అర్థే=in an unavoidable matter; న త్వమ్ శోచితుమ్ అర్హసి=you should not grieve"};
D["2.28"]={t:["అవ్యక్తాదీని భూతాని వ్యక్తమధ్యాని భారత |","అవ్యక్తనిధనాన్యేవ తత్ర కా పరిదేవనా ||"],mt:"ఓ భారతా! జీవులు ఆదియందు అవ్యక్తములు, మధ్యమున వ్యక్తములు, అంతమున మరల అవ్యక్తములే; అట్టప్పుడు విలాపమెందుకు?",m:"O Bharata, beings are unmanifest in their beginning, manifest in the middle, and unmanifest again in the end. What is there to lament in this?",w:"అవ్యక్తాదీని=unmanifest in the beginning; భూతాని=beings; వ్యక్తమధ్యాని=manifest in the middle; భారత=O Bharata; అవ్యక్తనిధనాని=unmanifest in the end; ఏవ=indeed; తత్ర=in that; కా=what; పరిదేవనా=lamentation"};
D["2.29"]={t:["ఆశ్చర్యవత్పశ్యతి కశ్చిదేనమ్","ఆశ్చర్యవద్వదతి తథైవ చాన్యః |","ఆశ్చర్యవచ్చైనమన్యః శృణోతి","శ్రుత్వాప్యేనం వేద న చైవ కశ్చిత్ ||"],mt:"ఒకడు దీనిని ఆశ్చర్యమువలె చూచును; మరొకడు ఆశ్చర్యమువలె చెప్పును; ఇంకొకడు ఆశ్చర్యమువలె వినును; విని కూడా ఎవడును దీనిని నిజముగా ఎరుగడు.",m:"One looks upon this self as a wonder, another speaks of it as a wonder, another hears of it as a wonder; and even after hearing, no one truly knows it.",w:"ఆశ్చర్యవత్=as a wonder; పశ్యతి=sees; కశ్చిత్=someone; ఏనమ్=this; వదతి=speaks of; తథా ఏవ చ=and likewise; అన్యః=another; శృణోతి=hears; శ్రుత్వా అపి=even after hearing; వేద=knows; న చ ఏవ కశ్చిత్=not anyone at all"};
D["2.30"]={t:["దేహీ నిత్యమవధ్యోఽయం దేహే సర్వస్య భారత |","తస్మాత్సర్వాణి భూతాని న త్వం శోచితుమర్హసి ||"],mt:"ఓ భారతా! అందరి దేహములలో ఉన్న ఈ దేహి ఎల్లప్పుడును వధింపరానివాడు; కావున ఏ ప్రాణి కొరకును నీవు శోకింపతగవు.",m:"O Bharata, the self that dwells in everyone’s body is eternally invulnerable. Therefore you should not grieve for any being.",w:"దేహీ=the embodied self; నిత్యమ్=always; అవధ్యః=invulnerable; అయమ్=this; దేహే=in the body; సర్వస్య=of everyone; భారత=O Bharata; తస్మాత్=therefore; సర్వాణి భూతాని=all beings; న త్వమ్ శోచితుమ్ అర్హసి=you should not grieve"};
D["2.31"]={t:["స్వధర్మమపి చావేక్ష్య న వికమ్పితుమర్హసి |","ధర్మ్యాద్ధి యుద్ధాచ్ఛ్రేయోఽన్యత్క్షత్రియస్య న విద్యతే ||"],mt:"స్వధర్మమును దృష్టిలో ఉంచుకొనియు నీవు చలింపతగవు; క్షత్రియునికి ధర్మయుద్ధముకంటె శ్రేయస్కరమైనది మరొకటి లేదు.",m:"Considering your own duty as well, you should not waver; for a warrior there is nothing better than a righteous war.",w:"స్వధర్మమ్=your own duty; అపి చ=also; అవేక్ష్య=considering; న వికమ్పితుమ్ అర్హసి=you should not waver; ధర్మ్యాత్=righteous; హి=indeed; యుద్ధాత్=than war; శ్రేయః=better; అన్యత్=other; క్షత్రియస్య=for a warrior; న విద్యతే=does not exist"};
D["2.32"]={t:["యదృచ్ఛయా చోపపన్నం స్వర్గద్వారమపావృతమ్ |","సుఖినః క్షత్రియాః పార్థ లభన్తే యుద్ధమీదృశమ్ ||"],mt:"ఓ పార్థా! అనుకోకుండా లభించిన, తెరవబడిన స్వర్గద్వారమువంటి ఇట్టి యుద్ధమును భాగ్యవంతులైన క్షత్రియులే పొందుదురు.",m:"O Partha, only fortunate warriors get such a war, coming unsought, like an open gateway to heaven.",w:"యదృచ్ఛయా=unsought; చ=and; ఉపపన్నమ్=come; స్వర్గద్వారమ్=gateway to heaven; అపావృతమ్=wide open; సుఖినః=fortunate; క్షత్రియాః=warriors; పార్థ=O Partha; లభన్తే=obtain; యుద్ధమ్=battle; ఈదృశమ్=such"};
D["2.33"]={t:["అథ చేత్త్వమిమం ధర్మ్యం సఙ్గ్రామం న కరిష్యసి |","తతః స్వధర్మం కీర్తిం చ హిత్వా పాపమవాప్స్యసి ||"],mt:"ఒకవేళ నీవు ఈ ధర్మయుద్ధమును చేయకుందువేని, స్వధర్మమును కీర్తిని కోల్పోయి పాపమును పొందెదవు.",m:"But if you do not fight this righteous war, then, abandoning your duty and your reputation, you will incur sin.",w:"అథ చేత్=but if; త్వమ్=you; ఇమమ్=this; ధర్మ్యమ్=righteous; సఙ్గ్రామమ్=battle; న కరిష్యసి=you will not undertake; తతః=then; స్వధర్మమ్=your duty; కీర్తిమ్=fame; చ=and; హిత్వా=abandoning; పాపమ్=sin; అవాప్స్యసి=you will incur"};
D["2.34"]={t:["అకీర్తిం చాపి భూతాని కథయిష్యన్తి తేఽవ్యయామ్ |","సమ్భావితస్య చాకీర్తిర్మరణాదతిరిచ్యతే ||"],mt:"మరియు ప్రాణులు నీ అపకీర్తిని ఎల్లకాలము చెప్పుకొందురు; గౌరవనీయునకు అపకీర్తి మరణముకంటెను హీనమైనది.",m:"People will also speak of your everlasting disgrace; and for a respected person, dishonour is worse than death.",w:"అకీర్తిమ్=disgrace; చ అపి=and also; భూతాని=people; కథయిష్యన్తి=will speak of; తే=your; అవ్యయామ్=everlasting; సమ్భావితస్య=for a respected person; చ=and; అకీర్తిః=dishonour; మరణాత్=than death; అతిరిచ్యతే=is worse"};
D["2.35"]={t:["భయాద్రణాదుపరతం మంస్యన్తే త్వాం మహారథాః |","యేషాం చ త్వం బహుమతో భూత్వా యాస్యసి లాఘవమ్ ||"],mt:"మహారథులు నీవు భయముచే యుద్ధమునుండి తొలగితివని తలతురు; నిన్ను ఎంతో గౌరవించినవారి దృష్టిలో నీవు తేలికవాడవగుదువు.",m:"The great warriors will think that you withdrew from battle out of fear; and those who held you in high esteem will think little of you.",w:"భయాత్=out of fear; రణాత్=from battle; ఉపరతమ్=withdrawn; మంస్యన్తే=will think; త్వామ్=you; మహారథాః=great warriors; యేషామ్=by whom; చ=and; త్వమ్=you; బహుమతః=highly esteemed; భూత్వా=having been; యాస్యసి=you will fall; లాఘవమ్=into littleness"};
D["2.36"]={t:["అవాచ్యవాదాంశ్చ బహూన్వదిష్యన్తి తవాహితాః |","నిన్దన్తస్తవ సామర్థ్యం తతో దుఃఖతరం ను కిమ్ ||"],mt:"నీ శత్రువులు నీ సామర్థ్యమును నిందించుచు చెప్పరాని మాటలెన్నో పలుకుదురు; అంతకంటె దుఃఖకరమేమున్నది?",m:"Your enemies will speak many unspeakable words, slandering your strength. What could be more painful than that?",w:"అవాచ్యవాదాన్=unspeakable words; చ=and; బహూన్=many; వదిష్యన్తి=will say; తవ=your; అహితాః=enemies; నిన్దన్తః=slandering; తవ సామర్థ్యమ్=your strength; తతః=than that; దుఃఖతరమ్=more painful; ను కిమ్=what indeed"};
D["2.37"]={t:["హతో వా ప్రాప్స్యసి స్వర్గం జిత్వా వా భోక్ష్యసే మహీమ్ |","తస్మాదుత్తిష్ఠ కౌన్తేయ యుద్ధాయ కృతనిశ్చయః ||"],mt:"చంపబడినచో స్వర్గమును పొందెదవు, గెలిచినచో భూమిని అనుభవించెదవు; కావున ఓ కౌంతేయా! యుద్ధము చేయ నిశ్చయించి లెమ్ము.",m:"If slain, you will attain heaven; if victorious, you will enjoy the earth. Therefore arise, O son of Kunti, resolved to fight.",w:"హతః=slain; వా=either; ప్రాప్స్యసి=you will attain; స్వర్గమ్=heaven; జిత్వా=having won; భోక్ష్యసే=you will enjoy; మహీమ్=the earth; తస్మాత్=therefore; ఉత్తిష్ఠ=arise; కౌన్తేయ=O son of Kunti; యుద్ధాయ=for battle; కృతనిశ్చయః=with firm resolve"};
D["2.38"]={t:["సుఖదుఃఖే సమే కృత్వా లాభాలాభౌ జయాజయౌ |","తతో యుద్ధాయ యుజ్యస్వ నైవం పాపమవాప్స్యసి ||"],mt:"సుఖదుఃఖములను, లాభనష్టములను, జయాపజయములను సమముగా చూచి యుద్ధమునకు సిద్ధపడుము; ఇట్లు చేసినచో నీకు పాపము అంటదు.",m:"Treating pleasure and pain, gain and loss, victory and defeat alike, engage in battle. In this way you will not incur sin.",w:"సుఖదుఃఖే=pleasure and pain; సమే కృత్వా=regarding alike; లాభాలాభౌ=gain and loss; జయాజయౌ=victory and defeat; తతః=then; యుద్ధాయ=for battle; యుజ్యస్వ=engage; న ఏవమ్=not thus; పాపమ్=sin; అవాప్స్యసి=you will incur"};
D["2.39"]={t:["ఏషా తేఽభిహితా సాఙ్ఖ్యే బుద్ధిర్యోగే త్విమాం శృణు |","బుద్ధ్యా యుక్తో యయా పార్థ కర్మబన్ధం ప్రహాస్యసి ||"],mt:"సాంఖ్యమునందు ఈ జ్ఞానము నీకు చెప్పబడినది; ఇక యోగమునకు సంబంధించిన దీనిని వినుము. ఓ పార్థా! ఈ బుద్ధితో యుక్తుడవై కర్మబంధమును విడిచెదవు.",m:"This understanding has been declared to you in terms of Sankhya (knowledge); now hear it in terms of yoga (action). Endowed with this understanding, O Partha, you will cast off the bondage of action.",w:"ఏషా=this; తే=to you; అభిహితా=has been declared; సాఙ్ఖ్యే=in Sankhya (knowledge of the self); బుద్ధిః=understanding; యోగే=in yoga (action); తు=but; ఇమామ్=this; శృణు=hear; బుద్ధ్యా=with understanding; యుక్తః=endowed; యయా=by which; పార్థ=O Partha; కర్మబన్ధమ్=bondage of action; ప్రహాస్యసి=you will cast off"};
D["2.40"]={t:["నేహాభిక్రమనాశోఽస్తి ప్రత్యవాయో న విద్యతే |","స్వల్పమప్యస్య ధర్మస్య త్రాయతే మహతో భయాత్ ||"],mt:"ఈ మార్గమున ప్రయత్నము వ్యర్థము కాదు, దోషము కూడా లేదు; ఈ ధర్మము కొంచెమైనను గొప్ప భయమునుండి రక్షించును.",m:"In this path no effort is lost and there is no adverse result; even a little of this dharma protects one from great fear.",w:"న=not; ఇహ=here; అభిక్రమనాశః=loss of effort; అస్తి=there is; ప్రత్యవాయః=adverse result; న విద్యతే=does not exist; స్వల్పమ్ అపి=even a little; అస్య ధర్మస్య=of this dharma; త్రాయతే=protects; మహతః భయాత్=from great fear"};
D["2.41"]={t:["వ్యవసాయాత్మికా బుద్ధిరేకేహ కురునన్దన |","బహుశాఖా హ్యనన్తాశ్చ బుద్ధయోఽవ్యవసాయినామ్ ||"],mt:"ఓ కురునందనా! ఈ మార్గమున నిశ్చయాత్మకమైన బుద్ధి ఒక్కటే; నిశ్చయములేనివారి బుద్ధులు అనేక శాఖలుగా, అనంతములుగా ఉండును.",m:"O joy of the Kurus, on this path the resolute understanding is single; the thoughts of the irresolute are many-branched and endless.",w:"వ్యవసాయాత్మికా=resolute; బుద్ధిః=understanding; ఏకా=one; ఇహ=here; కురునన్దన=O joy of the Kurus; బహుశాఖాః=many-branched; హి=indeed; అనన్తాః=endless; చ=and; బుద్ధయః=understandings; అవ్యవసాయినామ్=of the irresolute"};
D["2.42"]={t:["యామిమాం పుష్పితాం వాచం ప్రవదన్త్యవిపశ్చితః |","వేదవాదరతాః పార్థ నాన్యదస్తీతి వాదినః ||"],mt:"ఓ పార్థా! వేదవాదములయందు ఆసక్తులై “ఇంతకు మించినది లేదు” అని వాదించు అవివేకులు ఈ పుష్పితమైన (ఆకర్షకమైన) వాక్కును పలుకుదురు... (2.44 వరకు కొనసాగును)",m:"O Partha, the unwise, delighting in the words of the Vedas and claiming “there is nothing else,” speak this flowery speech... (continues to 2.44)",w:"యామ్ ఇమామ్=this which; పుష్పితామ్=flowery; వాచమ్=speech; ప్రవదన్తి=proclaim; అవిపశ్చితః=the unwise; వేదవాదరతాః=delighting in the words of the Vedas; పార్థ=O Partha; న అన్యత్ అస్తి=there is nothing else; ఇతి=thus; వాదినః=arguing"};
D["2.43"]={t:["కామాత్మానః స్వర్గపరా జన్మకర్మఫలప్రదామ్ |","క్రియావిశేషబహులాం భోగైశ్వర్యగతిం ప్రతి ||"],mt:"...కామాత్ములై, స్వర్గమే పరమలక్ష్యముగా కలవారై, జన్మకర్మఫలములనిచ్చు, భోగైశ్వర్యములను పొందుటకై బహు క్రియావిశేషములతో నిండిన (వాక్కును పలుకుదురు).",m:"...full of desires, regarding heaven as the goal, (they speak words) that yield rebirth as the fruit of action and abound in special rituals aimed at enjoyment and power.",w:"కామాత్మానః=full of desires; స్వర్గపరాః=aiming at heaven; జన్మకర్మఫలప్రదామ్=yielding rebirth as the fruit of action; క్రియావిశేషబహులామ్=full of many special rituals; భోగైశ్వర్యగతిమ్ ప్రతి=aimed at enjoyment and power"};
D["2.44"]={t:["భోగైశ్వర్యప్రసక్తానాం తయాపహృతచేతసామ్ |","వ్యవసాయాత్మికా బుద్ధిః సమాధౌ న విధీయతే ||"],mt:"భోగైశ్వర్యములపై ఆసక్తి గలవారికి, ఆ వాక్కుచే మనస్సు అపహరింపబడినవారికి నిశ్చయాత్మకమైన బుద్ధి సమాధియందు కలుగదు.",m:"For those attached to enjoyment and power, whose minds are carried away by such words, the resolute understanding is not formed in meditative absorption.",w:"భోగైశ్వర్యప్రసక్తానామ్=of those attached to enjoyment and power; తయా=by that; అపహృతచేతసామ్=whose minds are carried away; వ్యవసాయాత్మికా బుద్ధిః=resolute understanding; సమాధౌ=in concentration; న విధీయతే=is not formed"};
D["2.45"]={t:["త్రైగుణ్యవిషయా వేదా నిస్త్రైగుణ్యో భవార్జున |","నిర్ద్వన్ద్వో నిత్యసత్త్వస్థో నిర్యోగక్షేమ ఆత్మవాన్ ||"],mt:"వేదములు త్రిగుణములకు సంబంధించినవి; ఓ అర్జునా! నీవు త్రిగుణాతీతుడవు, ద్వంద్వరహితుడవు, నిత్యము సత్త్వమునందు స్థిరుడవు, యోగక్షేమ చింతలేనివాడవు, ఆత్మవంతుడవు అగుము.",m:"The Vedas deal with the three gunas; be free from the three gunas, O Arjuna: free from the pairs of opposites, ever established in purity, free from concern for gain and security, and self-possessed.",w:"త్రైగుణ్యవిషయాః=dealing with the three gunas; వేదాః=the Vedas; నిస్త్రైగుణ్యః=free from the three gunas; భవ=be; అర్జున=O Arjuna; నిర్ద్వన్ద్వః=free from opposites; నిత్యసత్త్వస్థః=ever established in goodness; నిర్యోగక్షేమః=free from concern for gain and security; ఆత్మవాన్=self-possessed"};
D["2.46"]={t:["యావానర్థ ఉదపానే సర్వతః సమ్ప్లుతోదకే |","తావాన్సర్వేషు వేదేషు బ్రాహ్మణస్య విజానతః ||"],mt:"అన్ని వైపుల నీరు నిండిన మహాజలాశయము లభించినప్పుడు చిన్న బావిలో ఎంత ప్రయోజనమో, తత్త్వమెరిగిన బ్రాహ్మణునికి సకల వేదములలో అంత ప్రయోజనమే.",m:"As much use as a small well has when there is a flood of water everywhere, so much is there in all the Vedas for a knower of Brahman who has realisation.",w:"యావాన్=as much; అర్థః=use; ఉదపానే=in a small well; సర్వతః=on all sides; సమ్ప్లుతోదకే=when there is a flood of water; తావాన్=so much; సర్వేషు వేదేషు=in all the Vedas; బ్రాహ్మణస్య=for a knower of Brahman; విజానతః=who has realisation"};
D["2.47"]={t:["కర్మణ్యేవాధికారస్తే మా ఫలేషు కదాచన |","మా కర్మఫలహేతుర్భూర్మా తే సఙ్గోఽస్త్వకర్మణి ||"],mt:"నీకు కర్మచేయుటయందే అధికారము, దాని ఫలములయందు ఎన్నడును లేదు. కర్మఫలమునకు కారణము నీవు కాకుము; అకర్మయందును నీకు ఆసక్తి కలుగకుండుగాక.",m:"You have a right to perform your duty, but never to its fruits. Do not let the fruit of action be your motive, and do not be attached to inaction.",w:"కర్మణి=in action; ఏవ=only; అధికారః=right; తే=your; మా=never; ఫలేషు=in the fruits; కదాచన=at any time; మా=not; కర్మఫలహేతుః=cause of the results of action; భూః=be; మా=not; తే=your; సఙ్గః=attachment; అస్తు=let there be; అకర్మణి=in inaction"};
D["2.48"]={t:["యోగస్థః కురు కర్మాణి సఙ్గం త్యక్త్వా ధనఞ్జయ |","సిద్ధ్యసిద్ధ్యోః సమో భూత్వా సమత్వం యోగ ఉచ్యతే ||"],mt:"ఓ ధనంజయా! ఆసక్తిని విడిచి, సిద్ధి అసిద్ధులయందు సమభావము కలవాడవై యోగమునందు స్థిరుడవై కర్మలు చేయుము; ఈ సమత్వమే యోగమనబడును.",m:"Established in yoga, perform your actions, O Dhananjaya, abandoning attachment and remaining equal in success and failure. This evenness of mind is called yoga.",w:"యోగస్థః=established in yoga; కురు=perform; కర్మాణి=actions; సఙ్గమ్=attachment; త్యక్త్వా=abandoning; ధనఞ్జయ=O Dhananjaya; సిద్ధ్యసిద్ధ్యోః=in success and failure; సమః=equal; భూత్వా=being; సమత్వమ్=evenness of mind; యోగః=yoga; ఉచ్యతే=is called"};
// Chapter 2 – shlokas 2.49 to 2.72 (completes chapter 2). Paste after your D object.
D["2.49"]={t:["దూరేణ హ్యవరం కర్మ బుద్ధియోగాద్ధనఞ్జయ |","బుద్ధౌ శరణమన్విచ్ఛ కృపణాః ఫలహేతవః ||"],mt:"ఓ ధనంజయా! బుద్ధియోగముకంటె సకామకర్మ ఎంతో తక్కువైనది; బుద్ధియందు శరణు వెదకుము. ఫలమును కోరువారు దీనులు.",m:"O Dhananjaya, action done with desire for results is far inferior to the yoga of wisdom. Seek refuge in wisdom; those motivated by results are wretched.",w:"దూరేణ=far; హి=indeed; అవరమ్=inferior; కర్మ=action; బుద్ధియోగాత్=than the yoga of wisdom; ధనఞ్జయ=O Dhananjaya; బుద్ధౌ=in wisdom; శరణమ్=refuge; అన్విచ్ఛ=seek; కృపణాః=wretched; ఫలహేతవః=those motivated by results"};
D["2.50"]={t:["బుద్ధియుక్తో జహాతీహ ఉభే సుకృతదుష్కృతే |","తస్మాద్యోగాయ యుజ్యస్వ యోగః కర్మసు కౌశలమ్ ||"],mt:"బుద్ధియుక్తుడు ఈ లోకముననే పుణ్యపాపములను రెంటినీ విడుచును; కావున యోగమునకై ప్రయత్నింపుము; కర్మలయందు నైపుణ్యమే యోగము.",m:"One endowed with wisdom casts off both good and bad deeds even here. Therefore strive for yoga; yoga is skill in action.",w:"బుద్ధియుక్తః=one endowed with wisdom; జహాతి=casts off; ఇహ=here; ఉభే=both; సుకృతదుష్కృతే=good and bad deeds; తస్మాత్=therefore; యోగాయ=for yoga; యుజ్యస్వ=strive; యోగః=yoga; కర్మసు=in actions; కౌశలమ్=skill"};
D["2.51"]={t:["కర్మజం బుద్ధియుక్తా హి ఫలం త్యక్త్వా మనీషిణః |","జన్మబన్ధవినిర్ముక్తాః పదం గచ్ఛన్త్యనామయమ్ ||"],mt:"బుద్ధియుక్తులైన జ్ఞానులు కర్మజమైన ఫలమును విడిచి, జన్మబంధమునుండి విముక్తులై దుఃఖరహితమైన పదమును పొందుదురు.",m:"The wise, endowed with wisdom, renounce the fruit born of action; freed from the bondage of birth, they attain the state beyond suffering.",w:"కర్మజమ్=born of action; బుద్ధియుక్తాః=endowed with wisdom; హి=indeed; ఫలమ్=fruit; త్యక్త్వా=abandoning; మనీషిణః=the wise; జన్మబన్ధవినిర్ముక్తాః=freed from the bondage of birth; పదమ్=state; గచ్ఛన్తి=attain; అనామయమ్=free from suffering"};
D["2.52"]={t:["యదా తే మోహకలిలం బుద్ధిర్వ్యతితరిష్యతి |","తదా గన్తాసి నిర్వేదం శ్రోతవ్యస్య శ్రుతస్య చ ||"],mt:"నీ బుద్ధి మోహమను గహనమును దాటినప్పుడు, వినదగినదాని యందును వినబడినదాని యందును నీకు వైరాగ్యము కలుగును.",m:"When your intellect crosses beyond the thicket of delusion, you will become indifferent to what is yet to be heard and to what has been heard.",w:"యదా=when; తే=your; మోహకలిలమ్=the thicket of delusion; బుద్ధిః=intellect; వ్యతితరిష్యతి=will cross beyond; తదా=then; గన్తాసి=you will attain; నిర్వేదమ్=indifference; శ్రోతవ్యస్య=to what is to be heard; శ్రుతస్య=to what has been heard; చ=and"};
D["2.53"]={t:["శ్రుతివిప్రతిపన్నా తే యదా స్థాస్యతి నిశ్చలా |","సమాధావచలా బుద్ధిస్తదా యోగమవాప్స్యసి ||"],mt:"వేదవచనములచే కలత చెందిన నీ బుద్ధి సమాధియందు నిశ్చలముగా, అచలముగా నిలిచినప్పుడు నీవు యోగమును పొందెదవు.",m:"When your intellect, bewildered by the scriptural texts, stands unmoved and steady in contemplation, then you will attain yoga.",w:"శ్రుతివిప్రతిపన్నా=perplexed by the Vedic texts; తే=your; యదా=when; స్థాస్యతి=will stand; నిశ్చలా=unmoved; సమాధౌ=in contemplation; అచలా=steady; బుద్ధిః=intellect; తదా=then; యోగమ్=yoga; అవాప్స్యసి=you will attain"};
D["2.54"]={t:["అర్జున ఉవాచ |","స్థితప్రజ్ఞస్య కా భాషా సమాధిస్థస్య కేశవ |","స్థితధీః కిం ప్రభాషేత కిమాసీత వ్రజేత కిమ్ ||"],mt:"అర్జునుడు పలికెను: ఓ కేశవా! స్థితప్రజ్ఞుని, సమాధియందున్నవాని లక్షణమేమి? స్థిరబుద్ధి గలవాడు ఎట్లు మాట్లాడును, ఎట్లు కూర్చుండును, ఎట్లు నడచును?",m:"Arjuna said: O Keshava, what is the description of one of steady wisdom, established in contemplation? How does such a person speak, sit, and walk?",w:"అర్జునః ఉవాచ=Arjuna said; స్థితప్రజ్ఞస్య=of one of steady wisdom; కా=what; భాషా=description; సమాధిస్థస్య=of one established in samadhi; కేశవ=O Keshava; స్థితధీః=one of steady mind; కిమ్=how; ప్రభాషేత=would speak; ఆసీత=would sit; వ్రజేత=would walk"};
D["2.55"]={t:["శ్రీభగవానువాచ |","ప్రజహాతి యదా కామాన్సర్వాన్పార్థ మనోగతాన్ |","ఆత్మన్యేవాత్మనా తుష్టః స్థితప్రజ్ఞస్తదోచ్యతే ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ పార్థా! మనస్సులోని కోరికలన్నిటినీ విడిచి, ఆత్మయందే ఆత్మచే సంతుష్టుడైనప్పుడు అతడు స్థితప్రజ్ఞుడనబడును.",m:"The Blessed Lord said: O Partha, when one gives up all desires of the mind and is content in the self by the self, that person is called one of steady wisdom.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ప్రజహాతి=gives up; యదా=when; కామాన్=desires; సర్వాన్=all; పార్థ=O Partha; మనోగతాన్=of the mind; ఆత్మని=in the self; ఏవ=alone; ఆత్మనా=by the self; తుష్టః=content; స్థితప్రజ్ఞః=one of steady wisdom; తదా=then; ఉచ్యతే=is called"};
D["2.56"]={t:["దుఃఖేష్వనుద్విగ్నమనాః సుఖేషు విగతస్పృహః |","వీతరాగభయక్రోధః స్థితధీర్మునిరుచ్యతే ||"],mt:"దుఃఖములయందు కలతచెందని మనస్సు గలవాడు, సుఖములయందు కోరికలేనివాడు, రాగభయక్రోధములు విడిచినవాడు స్థిరబుద్ధియైన ముని అనబడును.",m:"One whose mind is undisturbed in sorrows, free from craving in pleasures, and free from attachment, fear and anger is called a sage of steady mind.",w:"దుఃఖేషు=in sorrows; అనుద్విగ్నమనాః=with an undisturbed mind; సుఖేషు=in pleasures; విగతస్పృహః=free from craving; వీతరాగభయక్రోధః=free from attachment, fear and anger; స్థితధీః=of steady mind; మునిః=sage; ఉచ్యతే=is called"};
D["2.57"]={t:["యః సర్వత్రానభిస్నేహస్తత్తత్ప్రాప్య శుభాశుభమ్ |","నాభినన్దతి న ద్వేష్టి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ||"],mt:"అన్నిటియందు ఆసక్తి లేనివాడై, శుభమునుగాని అశుభమునుగాని పొందినను సంతోషింపక, ద్వేషింపకయుండువాని ప్రజ్ఞ స్థిరమైనది.",m:"One who is unattached everywhere, and neither rejoices nor hates on obtaining good or bad, has wisdom firmly established.",w:"యః=who; సర్వత్ర=everywhere; అనభిస్నేహః=unattached; తత్ తత్=this and that; ప్రాప్య=obtaining; శుభాశుభమ్=good and bad; న అభినన్దతి=neither rejoices; న ద్వేష్టి=nor hates; తస్య=his; ప్రజ్ఞా=wisdom; ప్రతిష్ఠితా=is established"};
D["2.58"]={t:["యదా సంహరతే చాయం కూర్మోఽఙ్గానీవ సర్వశః |","ఇన్ద్రియాణీన్ద్రియార్థేభ్యస్తస్య ప్రజ్ఞా ప్రతిష్ఠితా ||"],mt:"తాబేలు తన అవయవములను అన్ని వైపులనుండి లోపలికి ముడుచుకొనునట్లు, ఇంద్రియములను ఇంద్రియ విషయములనుండి మరల్చుకొనువాని ప్రజ్ఞ స్థిరమైనది.",m:"When one withdraws the senses from their objects completely, as a tortoise draws in its limbs, that person’s wisdom is firmly established.",w:"యదా=when; సంహరతే=withdraws; చ=and; అయమ్=this one; కూర్మః=tortoise; అఙ్గాని=limbs; ఇవ=like; సర్వశః=completely; ఇన్ద్రియాణి=senses; ఇన్ద్రియార్థేభ్యః=from sense objects; తస్య=his; ప్రజ్ఞా=wisdom; ప్రతిష్ఠితా=is established"};
D["2.59"]={t:["విషయా వినివర్తన్తే నిరాహారస్య దేహినః |","రసవర్జం రసోఽప్యస్య పరం దృష్ట్వా నివర్తతే ||"],mt:"ఆహారము విడుచు దేహికి విషయములు తొలగును, కాని రుచి (కోరిక) మాత్రము మిగులును; పరమాత్మను దర్శించినవానికి ఆ రుచియు తొలగిపోవును.",m:"Sense objects fall away for one who abstains from them, but the taste for them remains; even that taste ceases when one sees the Supreme.",w:"విషయాః=sense objects; వినివర్తన్తే=turn away; నిరాహారస్య=of one who abstains; దేహినః=of the embodied; రసవర్జమ్=except the taste (craving); రసః=taste; అపి=even; అస్య=his; పరమ్=the Supreme; దృష్ట్వా=having seen; నివర్తతే=ceases"};
D["2.60"]={t:["యతతో హ్యపి కౌన్తేయ పురుషస్య విపశ్చితః |","ఇన్ద్రియాణి ప్రమాథీని హరన్తి ప్రసభం మనః ||"],mt:"ఓ కౌంతేయా! ప్రయత్నించుచున్న వివేకియైన పురుషుని మనస్సును సైతము ప్రమథనము చేయు ఇంద్రియములు బలవంతముగా హరించును.",m:"O son of Kunti, the turbulent senses forcibly carry away the mind even of a discerning person who is striving.",w:"యతతః=of one striving; హి అపి=even; కౌన్తేయ=O son of Kunti; పురుషస్య=of a person; విపశ్చితః=of the discerning; ఇన్ద్రియాణి=senses; ప్రమాథీని=turbulent; హరన్తి=carry away; ప్రసభమ్=forcibly; మనః=mind"};
D["2.61"]={t:["తాని సర్వాణి సంయమ్య యుక్త ఆసీత మత్పరః |","వశే హి యస్యేన్ద్రియాణి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ||"],mt:"ఆ ఇంద్రియములనన్నిటినీ అదుపులో ఉంచి, యుక్తుడై నన్నే పరమగతిగా భావించి ఉండవలెను. ఎవని ఇంద్రియములు వశములో ఉండునో అతని ప్రజ్ఞ స్థిరము.",m:"Restraining all of them, one should sit disciplined, devoted to me. One whose senses are under control has wisdom firmly established.",w:"తాని=them; సర్వాణి=all; సంయమ్య=restraining; యుక్తః=disciplined; ఆసీత=should sit; మత్పరః=devoted to me; వశే=under control; హి=indeed; యస్య=whose; ఇన్ద్రియాణి=senses; తస్య=his; ప్రజ్ఞా=wisdom; ప్రతిష్ఠితా=is established"};
D["2.62"]={t:["ధ్యాయతో విషయాన్పుంసః సఙ్గస్తేషూపజాయతే |","సఙ్గాత్సఞ్జాయతే కామః కామాత్క్రోధోఽభిజాయతే ||"],mt:"విషయములను ధ్యానించు పురుషునికి వాటియందు ఆసక్తి కలుగును; ఆసక్తినుండి కోరిక, కోరికనుండి క్రోధము పుట్టును.",m:"Dwelling on sense objects, a person develops attachment to them; from attachment desire is born, and from desire anger arises.",w:"ధ్యాయతః=of one contemplating; విషయాన్=sense objects; పుంసః=of a person; సఙ్గః=attachment; తేషు=in them; ఉపజాయతే=arises; సఙ్గాత్=from attachment; సఞ్జాయతే=is born; కామః=desire; కామాత్=from desire; క్రోధః=anger; అభిజాయతే=arises"};
D["2.63"]={t:["క్రోధాద్భవతి సమ్మోహః సమ్మోహాత్స్మృతివిభ్రమః |","స్మృతిభ్రంశాద్బుద్ధినాశో బుద్ధినాశాత్ప్రణశ్యతి ||"],mt:"క్రోధమువలన సమ్మోహము, సమ్మోహమువలన స్మృతిభ్రంశము, స్మృతిభ్రంశమువలన బుద్ధినాశము కలుగును; బుద్ధి నశించగా మనిషి నశించును.",m:"From anger comes delusion; from delusion, loss of memory; from loss of memory, destruction of intellect; and from the destruction of intellect, one perishes.",w:"క్రోధాత్=from anger; భవతి=arises; సమ్మోహః=delusion; సమ్మోహాత్=from delusion; స్మృతివిభ్రమః=loss of memory; స్మృతిభ్రంశాత్=from loss of memory; బుద్ధినాశః=destruction of intellect; బుద్ధినాశాత్=from destruction of intellect; ప్రణశ్యతి=one perishes"};
D["2.64"]={t:["రాగద్వేషవియుక్తైస్తు విషయానిన్ద్రియైశ్చరన్ |","ఆత్మవశ్యైర్విధేయాత్మా ప్రసాదమధిగచ్ఛతి ||"],mt:"రాగద్వేషములు లేక, తన వశములోని ఇంద్రియములతో విషయములయందు సంచరించు ఆత్మనిగ్రహి ప్రసన్నతను పొందును.",m:"But one who moves among sense objects with senses free from attraction and aversion, and under the control of the self, attains serenity.",w:"రాగద్వేషవియుక్తైః=free from attraction and aversion; తు=but; విషయాన్=objects; ఇన్ద్రియైః=with the senses; చరన్=moving among; ఆత్మవశ్యైః=controlled by the self; విధేయాత్మా=one of disciplined mind; ప్రసాదమ్=serenity; అధిగచ్ఛతి=attains"};
D["2.65"]={t:["ప్రసాదే సర్వదుఃఖానాం హానిరస్యోపజాయతే |","ప్రసన్నచేతసో హ్యాశు బుద్ధిః పర్యవతిష్ఠతే ||"],mt:"ప్రసన్నత కలిగినప్పుడు అతని సర్వదుఃఖములు నశించును; ప్రసన్నచిత్తునికి బుద్ధి శీఘ్రముగా స్థిరపడును.",m:"In serenity, all his sorrows come to an end; for the intellect of the serene-minded soon becomes firmly established.",w:"ప్రసాదే=in serenity; సర్వదుఃఖానామ్=of all sorrows; హానిః=destruction; అస్య=his; ఉపజాయతే=arises; ప్రసన్నచేతసః=of the serene-minded; హి=indeed; ఆశు=quickly; బుద్ధిః=intellect; పర్యవతిష్ఠతే=becomes firmly established"};
D["2.66"]={t:["నాస్తి బుద్ధిరయుక్తస్య న చాయుక్తస్య భావనా |","న చాభావయతః శాన్తిరశాన్తస్య కుతః సుఖమ్ ||"],mt:"అయుక్తునికి బుద్ధి ఉండదు, భావన ఉండదు; భావనలేనివానికి శాంతి లేదు; అశాంతునికి సుఖమెక్కడ?",m:"The undisciplined have no steady wisdom, nor meditative focus; without focus there is no peace, and without peace, how can there be happiness?",w:"న అస్తి=there is not; బుద్ధిః=steady wisdom; అయుక్తస్య=of the undisciplined; న చ=nor; భావనా=contemplation; న చ అభావయతః=nor for one without contemplation; శాన్తిః=peace; అశాన్తస్య=for the restless; కుతః=where; సుఖమ్=happiness"};
D["2.67"]={t:["ఇన్ద్రియాణాం హి చరతాం యన్మనోఽనువిధీయతే |","తదస్య హరతి ప్రజ్ఞాం వాయుర్నావమివామ్భసి ||"],mt:"విషయములయందు తిరుగు ఇంద్రియములను మనస్సు అనుసరించినచో, గాలి నీటిపై నావను తోసికొనిపోవునట్లు అది ప్రజ్ఞను హరించును.",m:"When the mind follows the roaming senses, it carries away one’s wisdom, as the wind carries away a boat on water.",w:"ఇన్ద్రియాణామ్=of the senses; హి=indeed; చరతామ్=roaming; యత్=which; మనః=mind; అనువిధీయతే=follows; తత్=that; అస్య=his; హరతి=carries away; ప్రజ్ఞామ్=wisdom; వాయుః=wind; నావమ్=a boat; ఇవ=like; అమ్భసి=on water"};
D["2.68"]={t:["తస్మాద్యస్య మహాబాహో నిగృహీతాని సర్వశః |","ఇన్ద్రియాణీన్ద్రియార్థేభ్యస్తస్య ప్రజ్ఞా ప్రతిష్ఠితా ||"],mt:"కావున ఓ మహాబాహో! ఎవని ఇంద్రియములు విషయములనుండి అన్ని విధముల నిగ్రహింపబడినవో అతని ప్రజ్ఞ స్థిరమైనది.",m:"Therefore, O mighty-armed one, one whose senses are completely restrained from their objects has wisdom firmly established.",w:"తస్మాత్=therefore; యస్య=whose; మహాబాహో=O mighty-armed; నిగృహీతాని=restrained; సర్వశః=completely; ఇన్ద్రియాణి=senses; ఇన్ద్రియార్థేభ్యః=from sense objects; తస్య=his; ప్రజ్ఞా=wisdom; ప్రతిష్ఠితా=is established"};
D["2.69"]={t:["యా నిశా సర్వభూతానాం తస్యాం జాగర్తి సంయమీ |","యస్యాం జాగ్రతి భూతాని సా నిశా పశ్యతో మునేః ||"],mt:"సర్వప్రాణులకు రాత్రియైనదానియందు సంయమి మేలుకొనియుండును; ప్రాణులు మేలుకొనియుండు దానిని ఆత్మదర్శియైన మునికి రాత్రి.",m:"What is night for all beings, the self-controlled sage is awake in; and what is waking for all beings is night for the sage who sees.",w:"యా=which; నిశా=night; సర్వభూతానామ్=of all beings; తస్యామ్=in that; జాగర్తి=is awake; సంయమీ=the self-controlled; యస్యామ్=in which; జాగ్రతి=are awake; భూతాని=beings; సా=that; నిశా=night; పశ్యతః మునేః=of the seeing sage"};
D["2.70"]={t:["ఆపూర్యమాణమచలప్రతిష్ఠం","సముద్రమాపః ప్రవిశన్తి యద్వత్ |","తద్వత్కామా యం ప్రవిశన్తి సర్వే","స శాన్తిమాప్నోతి న కామకామీ ||"],mt:"అన్ని వైపులనుండి నిండుచున్నను స్థిరముగా నిలిచిన సముద్రములో నదీజలములు ప్రవేశించునట్లు, కోరికలన్నియు ఎవనిలో ప్రవేశించునో అతడు శాంతిని పొందును; కోరికలను కోరువాడు కాదు.",m:"As waters enter the ocean, which is ever being filled yet remains unmoved, so the one into whom all desires enter attains peace, not the one who craves desires.",w:"ఆపూర్యమాణమ్=ever being filled; అచలప్రతిష్ఠమ్=unmoving in its position; సముద్రమ్=the ocean; ఆపః=waters; ప్రవిశన్తి=enter; యద్వత్=as; తద్వత్=so; కామాః=desires; యమ్=whom; ప్రవిశన్తి=enter; సర్వే=all; సః=he; శాన్తిమ్=peace; ఆప్నోతి=attains; న కామకామీ=not one who craves desires"};
D["2.71"]={t:["విహాయ కామాన్యః సర్వాన్పుమాంశ్చరతి నిఃస్పృహః |","నిర్మమో నిరహఙ్కారః స శాన్తిమధిగచ్ఛతి ||"],mt:"అన్ని కోరికలను విడిచి, నిస్పృహుడై, మమకారము అహంకారము లేనివాడై సంచరించు పురుషుడు శాంతిని పొందును.",m:"The person who gives up all desires and moves about free from longing, without possessiveness and ego, attains peace.",w:"విహాయ=giving up; కామాన్=desires; యః=who; సర్వాన్=all; పుమాన్=a person; చరతి=moves; నిఃస్పృహః=free from longing; నిర్మమః=without possessiveness; నిరహఙ్కారః=without ego; సః=he; శాన్తిమ్=peace; అధిగచ్ఛతి=attains"};
D["2.72"]={t:["ఏషా బ్రాహ్మీ స్థితిః పార్థ నైనాం ప్రాప్య విముహ్యతి |","స్థిత్వాస్యామన్తకాలేఽపి బ్రహ్మనిర్వాణమృచ్ఛతి ||"],mt:"ఓ పార్థా! ఇదియే బ్రాహ్మీస్థితి; దీనిని పొందినవాడు మోహము చెందడు; అంతకాలమునందైనను ఇందు నిలిచినవాడు బ్రహ్మనిర్వాణమును పొందును.",m:"O Partha, this is the divine state; having attained it, one is no longer deluded. Established in it even at the time of death, one attains oneness with Brahman.",w:"ఏషా=this; బ్రాహ్మీ=divine; స్థితిః=state; పార్థ=O Partha; న ఏనామ్=not this; ప్రాప్య=attaining; విముహ్యతి=is deluded; స్థిత్వా=remaining established; అస్యామ్=in this; అన్తకాలే అపి=even at the time of death; బ్రహ్మనిర్వాణమ్=oneness with Brahman; ఋచ్ఛతి=attains"};



// chapter 3

// Chapter 3 – shlokas 3.1 to 3.8. Paste after your D object.
D["3.1"]={t:["అర్జున ఉవాచ |","జ్యాయసీ చేత్కర్మణస్తే మతా బుద్ధిర్జనార్దన |","తత్కిం కర్మణి ఘోరే మాం నియోజయసి కేశవ ||"],mt:"అర్జునుడు పలికెను: ఓ జనార్దనా! కర్మకంటె బుద్ధియే శ్రేష్ఠమని నీ అభిప్రాయమైనచో, ఓ కేశవా! నన్ను ఈ ఘోరమైన కర్మయందు ఎందుకు నియోగించుచున్నావు?",m:"Arjuna said: O Janardana, if you consider wisdom to be superior to action, then why do you urge me to engage in this terrible action, O Keshava?",w:"అర్జునః ఉవాచ=Arjuna said; జ్యాయసీ=superior; చేత్=if; కర్మణః=than action; తే=your; మతా=considered; బుద్ధిః=wisdom; జనార్దన=O Janardana; తత్=then; కిమ్=why; కర్మణి ఘోరే=in a terrible action; మామ్=me; నియోజయసి=do you engage; కేశవ=O Keshava"};
D["3.2"]={t:["వ్యామిశ్రేణేవ వాక్యేన బుద్ధిం మోహయసీవ మే |","తదేకం వద నిశ్చిత్య యేన శ్రేయోఽహమాప్నుయామ్ ||"],mt:"కలగలిపిన మాటలచే నా బుద్ధిని మోహపరచుచున్నట్లున్నావు; కావున నాకు శ్రేయస్సు కలుగునదానిని నిశ్చయించి ఒక్కదానినే చెప్పుము.",m:"With seemingly ambiguous words you seem to confuse my understanding. Tell me decisively the one path by which I may attain the highest good.",w:"వ్యామిశ్రేణ ఇవ=as if mixed; వాక్యేన=with words; బుద్ధిమ్=understanding; మోహయసి ఇవ=you seem to bewilder; మే=my; తత్=that; ఏకమ్=one; వద=tell; నిశ్చిత్య=decisively; యేన=by which; శ్రేయః=the highest good; అహమ్=I; ఆప్నుయామ్=may attain"};
D["3.3"]={t:["శ్రీభగవానువాచ |","లోకేఽస్మిన్ద్వివిధా నిష్ఠా పురా ప్రోక్తా మయానఘ |","జ్ఞానయోగేన సాఙ్ఖ్యానాం కర్మయోగేన యోగినామ్ ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ అనఘా! ఈ లోకమున రెండు విధములైన నిష్ఠలు పూర్వము నాచే చెప్పబడినవి — సాంఖ్యులకు జ్ఞానయోగము, యోగులకు కర్మయోగము.",m:"The Blessed Lord said: O sinless one, in this world a twofold path was declared by me in the past: the path of knowledge for the contemplatives, and the path of action for the men of action.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; లోకే అస్మిన్=in this world; ద్వివిధా=twofold; నిష్ఠా=path; పురా=formerly; ప్రోక్తా=declared; మయా=by me; అనఘ=O sinless one; జ్ఞానయోగేన=by the path of knowledge; సాఙ్ఖ్యానామ్=of the contemplatives; కర్మయోగేన=by the path of action; యోగినామ్=of the men of action"};
D["3.4"]={t:["న కర్మణామనారమ్భాన్నైష్కర్మ్యం పురుషోఽశ్నుతే |","న చ సన్న్యసనాదేవ సిద్ధిం సమధిగచ్ఛతి ||"],mt:"కర్మలను ఆరంభింపకుండుటచే మనుష్యుడు నైష్కర్మ్యమును పొందడు; కేవలము సన్న్యసించుటచే సిద్ధిని పొందడు.",m:"One does not attain freedom from action by merely not undertaking actions, nor does one attain perfection by renunciation alone.",w:"న=not; కర్మణామ్=of actions; అనారమ్భాత్=by non-performance; నైష్కర్మ్యమ్=freedom from action; పురుషః=a person; అశ్నుతే=attains; న చ=nor; సన్న్యసనాత్=by renunciation; ఏవ=alone; సిద్ధిమ్=perfection; సమధిగచ్ఛతి=attains"};
