D["6.23"]={t:["తం విద్యాద్దుఃఖసంయోగవియోగం యోగసంజ్ఞితమ్ |","స నిశ్చయేన యోక్తవ్యో యోగోఽనిర్విణ్ణచేతసా ||"],mt:"...దుఃఖసంయోగమునుండి వియోగమే యోగమని పేరుగలదానిని తెలిసికొనుము; ఆ యోగమును నిశ్చయముతో, నిర్వేదము లేని చిత్తముతో అభ్యసింపవలెను.",m:"...know that, the dissolution of contact with pain, by the name of yoga. This yoga should be practised with determination and an undespairing mind.",w:"తమ్=that; విద్యాత్=know; దుఃఖసంయోగవియోగమ్=dissolution of contact with pain; యోగసంజ్ఞితమ్=known as yoga; సః=that; నిశ్చయేన=with determination; యోక్తవ్యః=to be practised; యోగః=yoga; అనిర్విణ్ణచేతసా=with an undespairing mind"};
D["6.24"]={t:["సఙ్కల్పప్రభవాన్కామాంస్త్యక్త్వా సర్వానశేషతః |","మనసైవేన్ద్రియగ్రామం వినియమ్య సమన్తతః ||"],mt:"సంకల్పములవలన పుట్టిన కామములనన్నిటినీ నిశ్శేషముగా విడిచి, మనస్సుచేతనే ఇంద్రియసమూహమును అన్ని వైపులనుండి నియమించి... (6.25 లో కొనసాగును)",m:"Giving up entirely all desires born of selfish intention, and restraining the group of senses on all sides by the mind alone... (continues in 6.25)",w:"సఙ్కల్పప్రభవాన్=born of intention; కామాన్=desires; త్యక్త్వా=giving up; సర్వాన్=all; అశేషతః=entirely; మనసా ఏవ=by the mind alone; ఇన్ద్రియగ్రామమ్=the group of senses; వినియమ్య=restraining; సమన్తతః=from all sides"};
D["6.25"]={t:["శనైః శనైరుపరమేద్బుద్ధ్యా ధృతిగృహీతయా |","ఆత్మసంస్థం మనః కృత్వా న కిఞ్చిదపి చిన్తయేత్ ||"],mt:"...ధైర్యముచే గ్రహింపబడిన బుద్ధిచే క్రమక్రమముగా ఉపరమింపవలెను; మనస్సును ఆత్మయందు నిలిపి దేనినీ చింతింపకుండవలెను.",m:"...one should gradually become quiet, with an intellect held by resolve; fixing the mind on the self, one should think of nothing else.",w:"శనైః శనైః=gradually; ఉపరమేత్=should become quiet; బుద్ధ్యా=by the intellect; ధృతిగృహీతయా=held by resolve; ఆత్మసంస్థమ్=fixed in the self; మనః=mind; కృత్వా=making; న కిఞ్చిత్ అపి చిన్తయేత్=should not think of anything"};
D["6.26"]={t:["యతో యతో నిశ్చరతి మనశ్చఞ్చలమస్థిరమ్ |","తతస్తతో నియమ్యైతదాత్మన్యేవ వశం నయేత్ ||"],mt:"చంచలమైన అస్థిరమైన మనస్సు ఎక్కడెక్కడికి పోవునో అక్కడక్కడినుండి దానిని నిగ్రహించి ఆత్మయందే వశము చేయవలెను.",m:"Wherever the restless, unsteady mind wanders, one should restrain it from there and bring it back under the control of the self alone.",w:"యతః యతః=wherever; నిశ్చరతి=wanders; మనః=mind; చఞ్చలమ్=restless; అస్థిరమ్=unsteady; తతః తతః=from there; నియమ్య=restraining; ఏతత్=this; ఆత్మని ఏవ=in the self alone; వశమ్=control; నయేత్=should bring"};
D["6.27"]={t:["ప్రశాన్తమనసం హ్యేనం యోగినం సుఖముత్తమమ్ |","ఉపైతి శాన్తరజసం బ్రహ్మభూతమకల్మషమ్ ||"],mt:"ప్రశాంతమనస్కుడును, శాంతరజస్కుడును, బ్రహ్మభూతుడును, పాపరహితుడునగు ఈ యోగిని ఉత్తమసుఖము చేరును.",m:"Supreme happiness comes to this yogi whose mind is tranquil, whose passion is stilled, who has become one with Brahman and is free from sin.",w:"ప్రశాన్తమనసమ్=with tranquil mind; హి=indeed; ఏనమ్=this; యోగినమ్=yogi; సుఖమ్ ఉత్తమమ్=supreme happiness; ఉపైతి=comes to; శాన్తరజసమ్=whose passion is stilled; బ్రహ్మభూతమ్=one with Brahman; అకల్మషమ్=free from sin"};
D["6.28"]={t:["యుఞ్జన్నేవం సదాత్మానం యోగీ విగతకల్మషః |","సుఖేన బ్రహ్మసంస్పర్శమత్యన్తం సుఖమశ్నుతే ||"],mt:"ఇట్లు ఎల్లప్పుడును ఆత్మను యోజించు పాపరహితుడైన యోగి బ్రహ్మసంస్పర్శమను అత్యంత సుఖమును సులభముగా అనుభవించును.",m:"Thus constantly practising, the yogi free from sin easily enjoys the infinite happiness of contact with Brahman.",w:"యుఞ్జన్=practising; ఏవమ్=thus; సదా=always; ఆత్మానమ్=the self; యోగీ=the yogi; విగతకల్మషః=free from sin; సుఖేన=easily; బ్రహ్మసంస్పర్శమ్=contact with Brahman; అత్యన్తమ్ సుఖమ్=infinite happiness; అశ్నుతే=enjoys"};
D["6.29"]={t:["సర్వభూతస్థమాత్మానం సర్వభూతాని చాత్మని |","ఈక్షతే యోగయుక్తాత్మా సర్వత్ర సమదర్శనః ||"],mt:"యోగయుక్తాత్ముడు సర్వత్ర సమదృష్టి గలవాడై ఆత్మను సర్వభూతములయందును, సర్వభూతములను ఆత్మయందును చూచును.",m:"One whose mind is united by yoga and who sees everything with equal vision sees the self abiding in all beings and all beings in the self.",w:"సర్వభూతస్థమ్=abiding in all beings; ఆత్మానమ్=the self; సర్వభూతాని=all beings; చ=and; ఆత్మని=in the self; ఈక్షతే=sees; యోగయుక్తాత్మా=one whose mind is united by yoga; సర్వత్ర=everywhere; సమదర్శనః=of equal vision"};
D["6.30"]={t:["యో మాం పశ్యతి సర్వత్ర సర్వం చ మయి పశ్యతి |","తస్యాహం న ప్రణశ్యామి స చ మే న ప్రణశ్యతి ||"],mt:"నన్ను సర్వత్ర చూచువానికి, సర్వమును నాయందు చూచువానికి నేను నశింపను, అతడును నాకు నశింపడు.",m:"For one who sees me everywhere and sees everything in me, I am never lost, and that person is never lost to me.",w:"యః=who; మామ్=me; పశ్యతి=sees; సర్వత్ర=everywhere; సర్వమ్ చ=and everything; మయి=in me; తస్య=for him; అహమ్=I; న ప్రణశ్యామి=am not lost; సః చ=and he; మే=to me; న ప్రణశ్యతి=is not lost"};
D["6.31"]={t:["సర్వభూతస్థితం యో మాం భజత్యేకత్వమాస్థితః |","సర్వథా వర్తమానోఽపి స యోగీ మయి వర్తతే ||"],mt:"ఏకత్వమున నిలిచి సర్వభూతములయందున్న నన్ను భజించు యోగి ఎట్లు వర్తించుచున్నను నాయందే వర్తించును.",m:"The yogi who, established in oneness, worships me as dwelling in all beings lives in me, however he may live.",w:"సర్వభూతస్థితమ్=dwelling in all beings; యః=who; మామ్=me; భజతి=worships; ఏకత్వమ్ ఆస్థితః=established in oneness; సర్వథా=in every way; వర్తమానః అపి=though living; సః యోగీ=that yogi; మయి వర్తతే=lives in me"};
D["6.32"]={t:["ఆత్మౌపమ్యేన సర్వత్ర సమం పశ్యతి యోఽర్జున |","సుఖం వా యది వా దుఃఖం స యోగీ పరమో మతః ||"],mt:"ఓ అర్జునా! సుఖమైనను దుఃఖమైనను తనతో పోల్చి సర్వత్ర సమముగా చూచు యోగి పరమయోగిగా భావింపబడును.",m:"O Arjuna, the yogi who, by comparison with oneself, sees the same everywhere, whether in pleasure or in pain, is considered supreme.",w:"ఆత్మౌపమ్యేన=by comparison with oneself; సర్వత్ర=everywhere; సమమ్=the same; పశ్యతి=sees; యః=who; అర్జున=O Arjuna; సుఖమ్ వా యది వా దుఃఖమ్=whether pleasure or pain; సః యోగీ=that yogi; పరమః=supreme; మతః=is considered"};

// Chapter 6 – shlokas 6.33 to 6.47 (completes chapter 6). Paste after your D object.
D["6.33"]={t:["అర్జున ఉవాచ |","యోఽయం యోగస్త్వయా ప్రోక్తః సామ్యేన మధుసూదన |","ఏతస్యాహం న పశ్యామి చఞ్చలత్వాత్స్థితిం స్థిరామ్ ||"],mt:"అర్జునుడు పలికెను: ఓ మధుసూదనా! సమత్వముతో నీవు చెప్పిన ఈ యోగమునకు చంచలత్వముచే స్థిరమైన స్థితిని నేను చూడలేకున్నాను.",m:"Arjuna said: O Madhusudana, this yoga of equanimity that you have described, I do not see how it can remain steady, because of the restlessness of the mind.",w:"అర్జునః ఉవాచ=Arjuna said; యః అయమ్ యోగః=this yoga; త్వయా=by you; ప్రోక్తః=described; సామ్యేన=by evenness of mind; మధుసూదన=O Madhusudana; ఏతస్య=of this; అహమ్=I; న పశ్యామి=do not see; చఞ్చలత్వాత్=due to restlessness; స్థితిమ్ స్థిరామ్=steady continuance"};
D["6.34"]={t:["చఞ్చలం హి మనః కృష్ణ ప్రమాథి బలవద్దృఢమ్ |","తస్యాహం నిగ్రహం మన్యే వాయోరివ సుదుష్కరమ్ ||"],mt:"ఓ కృష్ణా! మనస్సు చంచలము, ప్రమథనశీలము, బలవంతము, దృఢము; దానిని నిగ్రహించుట గాలిని నిగ్రహించుటవలె అతికష్టమని నేను తలచుచున్నాను.",m:"O Krishna, the mind is restless, turbulent, strong and obstinate. I think controlling it is as difficult as controlling the wind.",w:"చఞ్చలమ్=restless; హి=indeed; మనః=mind; కృష్ణ=O Krishna; ప్రమాథి=turbulent; బలవత్=strong; దృఢమ్=obstinate; తస్య=its; అహమ్=I; నిగ్రహమ్=control; మన్యే=think; వాయోః ఇవ=like the wind; సుదుష్కరమ్=very difficult"};
D["6.35"]={t:["శ్రీభగవానువాచ |","అసంశయం మహాబాహో మనో దుర్నిగ్రహం చలమ్ |","అభ్యాసేన తు కౌన్తేయ వైరాగ్యేణ చ గృహ్యతే ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ మహాబాహో! మనస్సు చంచలము, నిగ్రహించుటకు కష్టమైనది అనుటలో సందేహము లేదు; కాని ఓ కౌంతేయా! అభ్యాసముచేతను వైరాగ్యముచేతను అది అదుపులోనికి వచ్చును.",m:"The Blessed Lord said: Without doubt, O mighty-armed one, the mind is restless and hard to restrain; but by practice and detachment, O son of Kunti, it can be held.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; అసంశయమ్=without doubt; మహాబాహో=O mighty-armed; మనః=mind; దుర్నిగ్రహమ్=hard to restrain; చలమ్=restless; అభ్యాసేన=by practice; తు=but; కౌన్తేయ=O son of Kunti; వైరాగ్యేణ=by detachment; చ=and; గృహ్యతే=is held"};
D["6.36"]={t:["అసంయతాత్మనా యోగో దుష్ప్రాప ఇతి మే మతిః |","వశ్యాత్మనా తు యతతా శక్యోఽవాప్తుముపాయతః ||"],mt:"అసంయతాత్మునికి యోగము పొందుట కష్టమని నా అభిప్రాయము; కాని వశ్యాత్ముడై ప్రయత్నించువాడు తగిన ఉపాయములతో దానిని పొందగలడు.",m:"Yoga is hard to attain for one of uncontrolled mind, that is my view; but one of controlled mind who strives can attain it by proper means.",w:"అసంయతాత్మనా=by one of uncontrolled mind; యోగః=yoga; దుష్ప్రాపః=hard to attain; ఇతి=thus; మే మతిః=my opinion; వశ్యాత్మనా=by one of controlled mind; తు=but; యతతా=striving; శక్యః=possible; అవాప్తుమ్=to attain; ఉపాయతః=by proper means"};
D["6.37"]={t:["అర్జున ఉవాచ |","అయతిః శ్రద్ధయోపేతో యోగాచ్చలితమానసః |","అప్రాప్య యోగసంసిద్ధిం కాం గతిం కృష్ణ గచ్ఛతి ||"],mt:"అర్జునుడు పలికెను: ఓ కృష్ణా! శ్రద్ధ కలిగియుండియు ప్రయత్నము తగ్గినవాడు, యోగమునుండి చలించిన మనస్సు గలవాడు యోగసిద్ధిని పొందక ఏ గతిని పొందును?",m:"Arjuna said: O Krishna, what is the destination of one who has faith but fails to strive, whose mind wanders from yoga, and who does not attain perfection in yoga?",w:"అర్జునః ఉవాచ=Arjuna said; అయతిః=one who fails to strive; శ్రద్ధయా ఉపేతః=endowed with faith; యోగాత్ చలితమానసః=whose mind wanders from yoga; అప్రాప్య=not attaining; యోగసంసిద్ధిమ్=perfection in yoga; కామ్ గతిమ్=what destination; కృష్ణ=O Krishna; గచ్ఛతి=goes"};
D["6.38"]={t:["కచ్చిన్నోభయవిభ్రష్టశ్ఛిన్నాభ్రమివ నశ్యతి |","అప్రతిష్ఠో మహాబాహో విమూఢో బ్రహ్మణః పథి ||"],mt:"ఓ మహాబాహో! రెండింటినుండి భ్రష్టుడై, ఆధారములేనివాడై, బ్రహ్మమార్గమున విమూఢుడై, చెదిరిన మేఘమువలె నశించిపోవునా?",m:"Does such a person, fallen from both, perish like a broken cloud, without support and bewildered on the path to Brahman, O mighty-armed one?",w:"కచ్చిత్=whether; న=not; ఉభయవిభ్రష్టః=fallen from both; ఛిన్నాభ్రమ్=a broken cloud; ఇవ=like; నశ్యతి=perishes; అప్రతిష్ఠః=without support; మహాబాహో=O mighty-armed; విమూఢః=bewildered; బ్రహ్మణః పథి=on the path to Brahman"};
D["6.39"]={t:["ఏతన్మే సంశయం కృష్ణ ఛేత్తుమర్హస్యశేషతః |","త్వదన్యః సంశయస్యాస్య ఛేత్తా న హ్యుపపద్యతే ||"],mt:"ఓ కృష్ణా! ఈ నా సంశయమును నిశ్శేషముగా ఛేదింప నీవే తగినవాడవు; నీకంటె వేరొకడు ఈ సంశయమును ఛేదింపగలవాడు లేడు.",m:"O Krishna, you alone are able to dispel this doubt of mine completely; there is no one other than you who can dispel this doubt.",w:"ఏతత్=this; మే=my; సంశయమ్=doubt; కృష్ణ=O Krishna; ఛేత్తుమ్=to dispel; అర్హసి=you are able; అశేషతః=completely; త్వత్ అన్యః=other than you; సంశయస్య అస్య=of this doubt; ఛేత్తా=dispeller; న హి ఉపపద్యతే=is not to be found"};
D["6.40"]={t:["శ్రీభగవానువాచ |","పార్థ నైవేహ నాముత్ర వినాశస్తస్య విద్యతే |","న హి కల్యాణకృత్కశ్చిద్దుర్గతిం తాత గచ్ఛతి ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ పార్థా! అతనికి ఇహమునగాని పరమునగాని వినాశము లేదు; ఓ నాయనా! కల్యాణకార్యములు చేయువాడెవడును దుర్గతిని పొందడు.",m:"The Blessed Lord said: O Partha, there is no destruction for such a person either here or hereafter; for no one who does good, my dear friend, ever comes to a bad end.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; పార్థ=O Partha; న ఏవ ఇహ=neither here; న అముత్ర=nor hereafter; వినాశః=destruction; తస్య=his; విద్యతే=exists; న హి=not indeed; కల్యాణకృత్=one who does good; కశ్చిత్=anyone; దుర్గతిమ్=a bad end; తాత=dear one; గచ్ఛతి=goes"};
D["6.41"]={t:["ప్రాప్య పుణ్యకృతాం లోకానుషిత్వా శాశ్వతీః సమాః |","శుచీనాం శ్రీమతాం గేహే యోగభ్రష్టోఽభిజాయతే ||"],mt:"యోగభ్రష్టుడు పుణ్యాత్ముల లోకములను పొంది, అనేక సంవత్సరములు అక్కడ నివసించి, పవిత్రులైన శ్రీమంతుల ఇంట జన్మించును.",m:"One fallen from yoga attains the worlds of the virtuous, dwells there for many years, and is then born in the house of the pure and prosperous.",w:"ప్రాప్య=attaining; పుణ్యకృతామ్ లోకాన్=the worlds of the virtuous; ఉషిత్వా=having dwelt; శాశ్వతీః సమాః=for countless years; శుచీనామ్=of the pure; శ్రీమతామ్=of the prosperous; గేహే=in the house; యోగభ్రష్టః=one fallen from yoga; అభిజాయతే=is born"};
D["6.42"]={t:["అథవా యోగినామేవ కులే భవతి ధీమతామ్ |","ఏతద్ధి దుర్లభతరం లోకే జన్మ యదీదృశమ్ ||"],mt:"లేదా ధీమంతులైన యోగుల కులముననే జన్మించును; ఇట్టి జన్మము ఈ లోకమున మిక్కిలి దుర్లభము.",m:"Or such a person is born into a family of wise yogis; such a birth is very difficult to obtain in this world.",w:"అథవా=or; యోగినామ్ ఏవ=of yogis alone; కులే=in the family; భవతి=is born; ధీమతామ్=of the wise; ఏతత్ హి=this indeed; దుర్లభతరమ్=more difficult to obtain; లోకే=in the world; జన్మ=birth; యత్ ఈదృశమ్=such as this"};
D["6.43"]={t:["తత్ర తం బుద్ధిసంయోగం లభతే పౌర్వదేహికమ్ |","యతతే చ తతో భూయః సంసిద్ధౌ కురునన్దన ||"],mt:"ఓ కురునందనా! అక్కడ అతడు పూర్వజన్మలోని బుద్ధిసంయోగమును పొంది, మరల సంసిద్ధికై అధికముగా ప్రయత్నించును.",m:"There, O joy of the Kurus, such a person regains the wisdom acquired in the previous life and strives even more for perfection.",w:"తత్ర=there; తమ్=that; బుద్ధిసంయోగమ్=union with wisdom; లభతే=obtains; పౌర్వదేహికమ్=from the previous body; యతతే=strives; చ=and; తతః భూయః=more than before; సంసిద్ధౌ=for perfection; కురునన్దన=O joy of the Kurus"};
D["6.44"]={t:["పూర్వాభ్యాసేన తేనైవ హ్రియతే హ్యవశోఽపి సః |","జిజ్ఞాసురపి యోగస్య శబ్దబ్రహ్మాతివర్తతే ||"],mt:"ఆ పూర్వాభ్యాసముచే అవశుడైనను అతడు ఆకర్షింపబడును; యోగమును తెలిసికొనగోరువాడు కూడా వేదకర్మకాండను దాటిపోవును.",m:"By that very past practice, such a person is carried onward even without wishing it; even one who merely inquires about yoga goes beyond the ritual portion of the Vedas.",w:"పూర్వాభ్యాసేన=by past practice; తేన ఏవ=by that very; హ్రియతే=is carried; హి=indeed; అవశః అపి=even helplessly; సః=he; జిజ్ఞాసుః అపి యోగస్య=even one who inquires about yoga; శబ్దబ్రహ్మ=the ritual portion of the Vedas; అతివర్తతే=goes beyond"};
D["6.45"]={t:["ప్రయత్నాద్యతమానస్తు యోగీ సంశుద్ధకిల్బిషః |","అనేకజన్మసంసిద్ధస్తతో యాతి పరాం గతిమ్ ||"],mt:"ప్రయత్నముతో యత్నించు యోగి పాపములు పూర్తిగా తొలగి, అనేక జన్మలలో సంసిద్ధి పొంది, అంతట పరమగతిని పొందును.",m:"The yogi who strives with diligent effort, cleansed of all sins and perfected through many births, then attains the supreme goal.",w:"ప్రయత్నాత్=with effort; యతమానః=striving; తు=but; యోగీ=the yogi; సంశుద్ధకిల్బిషః=whose sins are fully cleansed; అనేకజన్మసంసిద్ధః=perfected through many births; తతః=then; యాతి=attains; పరామ్ గతిమ్=the supreme goal"};
D["6.46"]={t:["తపస్విభ్యోఽధికో యోగీ జ్ఞానిభ్యోఽపి మతోఽధికః |","కర్మిభ్యశ్చాధికో యోగీ తస్మాద్యోగీ భవార్జున ||"],mt:"యోగి తపస్వులకంటె అధికుడు, జ్ఞానులకంటెను అధికుడని భావింపబడును; కర్మిష్ఠులకంటెను యోగి అధికుడు; కావున ఓ అర్జునా! నీవు యోగివి అగుము.",m:"The yogi is considered superior to ascetics, superior even to the learned, and superior to those who perform rituals. Therefore, O Arjuna, become a yogi.",w:"తపస్విభ్యః=than ascetics; అధికః=superior; యోగీ=the yogi; జ్ఞానిభ్యః అపి=even than the learned; మతః=is considered; కర్మిభ్యః=than ritualists; చ=and; తస్మాత్=therefore; యోగీ భవ=become a yogi; అర్జున=O Arjuna"};
D["6.47"]={t:["యోగినామపి సర్వేషాం మద్గతేనాన్తరాత్మనా |","శ్రద్ధావాన్భజతే యో మాం స మే యుక్తతమో మతః ||"],mt:"యోగులందరిలోనూ శ్రద్ధగలవాడై, నాయందే అంతరాత్మను నిలిపి నన్ను భజించువాడు నాకు యుక్తతముడని నా అభిప్రాయము.",m:"Of all yogis, the one who, with faith and with the inner self absorbed in me, worships me is considered by me to be the most devoted.",w:"యోగినామ్ అపి సర్వేషామ్=among all yogis; మద్గతేన=absorbed in me; అన్తరాత్మనా=with the inner self; శ్రద్ధావాన్=full of faith; భజతే=worships; యః=who; మామ్=me; సః=he; మే=by me; యుక్తతమః=the most devoted; మతః=is considered"};


// Chapter 7 – shlokas 7.1 to 7.15. Paste after your D object.
D["7.1"]={t:["శ్రీభగవానువాచ |","మయ్యాసక్తమనాః పార్థ యోగం యుఞ్జన్మదాశ్రయః |","అసంశయం సమగ్రం మాం యథా జ్ఞాస్యసి తచ్ఛృణు ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ పార్థా! నాయందే ఆసక్తమైన మనస్సుతో, నన్ను ఆశ్రయించి యోగమును అభ్యసించుచు, నన్ను సంశయరహితముగా సంపూర్ణముగా ఎట్లు తెలిసికొనగలవో దానిని వినుము.",m:"The Blessed Lord said: O Partha, hear how, with your mind attached to me and practising yoga while taking refuge in me, you will know me fully and without doubt.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; మయి=in me; ఆసక్తమనాః=with the mind attached; పార్థ=O Partha; యోగమ్=yoga; యుఞ్జన్=practising; మదాశ్రయః=taking refuge in me; అసంశయమ్=without doubt; సమగ్రమ్=fully; మామ్=me; యథా=how; జ్ఞాస్యసి=you will know; తత్=that; శృణు=hear"};
D["7.2"]={t:["జ్ఞానం తేఽహం సవిజ్ఞానమిదం వక్ష్యామ్యశేషతః |","యజ్జ్ఞాత్వా నేహ భూయోఽన్యజ్జ్ఞాతవ్యమవశిష్యతే ||"],mt:"నేను నీకు ఈ జ్ఞానమును విజ్ఞానముతో కూడ నిశ్శేషముగా చెప్పెదను; దీనిని తెలిసికొనినచో ఈ లోకమున ఇంకేమియు తెలిసికొనవలసినది మిగులదు.",m:"I shall explain to you completely this knowledge together with realisation, knowing which nothing further remains to be known in this world.",w:"జ్ఞానమ్=knowledge; తే=to you; అహమ్=I; సవిజ్ఞానమ్=together with realisation; ఇదమ్=this; వక్ష్యామి=I shall explain; అశేషతః=completely; యత్ జ్ఞాత్వా=knowing which; న ఇహ=not here; భూయః=further; అన్యత్=anything else; జ్ఞాతవ్యమ్=to be known; అవశిష్యతే=remains"};
D["7.3"]={t:["మనుష్యాణాం సహస్రేషు కశ్చిద్యతతి సిద్ధయే |","యతతామపి సిద్ధానాం కశ్చిన్మాం వేత్తి తత్త్వతః ||"],mt:"వేలాది మనుష్యులలో ఎవడో ఒకడు సిద్ధికై యత్నించును; యత్నించు సిద్ధులలో కూడా ఎవడో ఒకడు నన్ను తత్త్వముగా తెలిసికొనును.",m:"Among thousands of people, hardly one strives for perfection; and among those who strive and succeed, hardly one knows me in truth.",w:"మనుష్యాణామ్ సహస్రేషు=among thousands of people; కశ్చిత్=someone; యతతి=strives; సిద్ధయే=for perfection; యతతామ్ అపి సిద్ధానామ్=even among those striving and perfected; కశ్చిత్=someone; మామ్=me; వేత్తి=knows; తత్త్వతః=in truth"};
D["7.4"]={t:["భూమిరాపోఽనలో వాయుః ఖం మనో బుద్ధిరేవ చ |","అహఙ్కార ఇతీయం మే భిన్నా ప్రకృతిరష్టధా ||"],mt:"భూమి, నీరు, అగ్ని, వాయువు, ఆకాశము, మనస్సు, బుద్ధి, అహంకారము అని ఈ నా ప్రకృతి ఎనిమిది విధములుగా విభజింపబడియున్నది.",m:"Earth, water, fire, air, space, mind, intellect and ego: thus my nature is divided eightfold.",w:"భూమిః=earth; ఆపః=water; అనలః=fire; వాయుః=air; ఖమ్=space; మనః=mind; బుద్ధిః=intellect; ఏవ చ=and also; అహఙ్కారః=ego; ఇతి=thus; ఇయమ్=this; మే=my; భిన్నా=divided; ప్రకృతిః=nature; అష్టధా=eightfold"};
D["7.5"]={t:["అపరేయమితస్త్వన్యాం ప్రకృతిం విద్ధి మే పరామ్ |","జీవభూతాం మహాబాహో యయేదం ధార్యతే జగత్ ||"],mt:"ఇది అపరప్రకృతి; దీనికంటె భిన్నమైన, జీవరూపమైన నా పరప్రకృతిని తెలిసికొనుము, ఓ మహాబాహో! దీనిచే ఈ జగత్తు ధరింపబడుచున్నది.",m:"This is my lower nature. Know my other, higher nature, the life-principle, O mighty-armed one, by which this world is sustained.",w:"అపరా=lower; ఇయమ్=this; ఇతః=than this; తు=but; అన్యామ్=another; ప్రకృతిమ్=nature; విద్ధి=know; మే=my; పరామ్=higher; జీవభూతామ్=the life-principle; మహాబాహో=O mighty-armed; యయా=by which; ఇదమ్ జగత్=this world; ధార్యతే=is sustained"};
D["7.6"]={t:["ఏతద్యోనీని భూతాని సర్వాణీత్యుపధారయ |","అహం కృత్స్నస్య జగతః ప్రభవః ప్రలయస్తథా ||"],mt:"సమస్త భూతములు ఈ రెంటినుండి పుట్టినవని తెలిసికొనుము; నేను సమస్త జగత్తునకు ఉత్పత్తియు, లయమును.",m:"Understand that all beings have these two as their source; I am the origin and also the dissolution of the entire world.",w:"ఏతద్యోనీని=having these as their source; భూతాని=beings; సర్వాణి=all; ఇతి ఉపధారయ=understand thus; అహమ్=I; కృత్స్నస్య జగతః=of the entire world; ప్రభవః=origin; ప్రలయః=dissolution; తథా=and so"};
D["7.7"]={t:["మత్తః పరతరం నాన్యత్కిఞ్చిదస్తి ధనఞ్జయ |","మయి సర్వమిదం ప్రోతం సూత్రే మణిగణా ఇవ ||"],mt:"ఓ ధనంజయా! నాకంటె పరమైనది మరొకటి లేదు; దారమునందు మణులగుంపువలె ఇదంతయు నాయందు గ్రుచ్చబడియున్నది.",m:"There is nothing higher than me, O Dhananjaya. All this is strung on me, like clusters of gems on a thread.",w:"మత్తః=than me; పరతరమ్=higher; న అన్యత్ కిఞ్చిత్ అస్తి=nothing else exists; ధనఞ్జయ=O Dhananjaya; మయి=in me; సర్వమ్ ఇదమ్=all this; ప్రోతమ్=strung; సూత్రే=on a thread; మణిగణాః=clusters of gems; ఇవ=like"};
D["7.8"]={t:["రసోఽహమప్సు కౌన్తేయ ప్రభాస్మి శశిసూర్యయోః |","ప్రణవః సర్వవేదేషు శబ్దః ఖే పౌరుషం నృషు ||"],mt:"ఓ కౌంతేయా! నేను నీళ్ళలో రసమును, చంద్రసూర్యులలో ప్రభను, సర్వవేదములలో ప్రణవమును, ఆకాశమున శబ్దమును, మనుష్యులలో పౌరుషమును.",m:"O son of Kunti, I am the taste in water, the radiance in the moon and the sun, the syllable Om in all the Vedas, the sound in space, and manliness in people.",w:"రసః=taste; అహమ్=I; అప్సు=in waters; కౌన్తేయ=O son of Kunti; ప్రభా=radiance; అస్మి=I am; శశిసూర్యయోః=in the moon and sun; ప్రణవః=the sacred syllable Om; సర్వవేదేషు=in all the Vedas; శబ్దః=sound; ఖే=in space; పౌరుషమ్=manliness; నృషు=in people"};
D["7.9"]={t:["పుణ్యో గన్ధః పృథివ్యాం చ తేజశ్చాస్మి విభావసౌ |","జీవనం సర్వభూతేషు తపశ్చాస్మి తపస్విషు ||"],mt:"పృథివిలో పుణ్యగంధమును, అగ్నిలో తేజస్సును, సర్వభూతములలో జీవనమును, తపస్వులలో తపస్సును నేనే.",m:"I am the pure fragrance in the earth, the brilliance in fire, the life in all beings, and the austerity in ascetics.",w:"పుణ్యః=pure; గన్ధః=fragrance; పృథివ్యామ్=in the earth; చ=and; తేజః=brilliance; చ అస్మి=and I am; విభావసౌ=in fire; జీవనమ్=life; సర్వభూతేషు=in all beings; తపః=austerity; తపస్విషు=in ascetics"};
D["7.10"]={t:["బీజం మాం సర్వభూతానాం విద్ధి పార్థ సనాతనమ్ |","బుద్ధిర్బుద్ధిమతామస్మి తేజస్తేజస్వినామహమ్ ||"],mt:"ఓ పార్థా! నన్ను సర్వభూతములకు సనాతనమైన బీజముగా తెలిసికొనుము; బుద్ధిమంతులలో బుద్ధిని, తేజస్వులలో తేజస్సును నేనే.",m:"Know me, O Partha, to be the eternal seed of all beings. I am the intelligence of the intelligent and the splendour of the splendid.",w:"బీజమ్=seed; మామ్=me; సర్వభూతానామ్=of all beings; విద్ధి=know; పార్థ=O Partha; సనాతనమ్=eternal; బుద్ధిః=intelligence; బుద్ధిమతామ్=of the intelligent; అస్మి=I am; తేజః=splendour; తేజస్వినామ్=of the splendid; అహమ్=I"};
D["7.11"]={t:["బలం బలవతాం చాహం కామరాగవివర్జితమ్ |","ధర్మావిరుద్ధో భూతేషు కామోఽస్మి భరతర్షభ ||"],mt:"ఓ భరతశ్రేష్ఠా! బలవంతులలో కామరాగములు లేని బలమును, ప్రాణులలో ధర్మవిరుద్ధము కాని కామమును నేనే.",m:"I am the strength of the strong, free from desire and attachment; and in beings I am the desire that is not contrary to dharma, O best of the Bharatas.",w:"బలమ్=strength; బలవతామ్=of the strong; చ=and; అహమ్=I; కామరాగవివర్జితమ్=free from desire and attachment; ధర్మావిరుద్ధః=not contrary to dharma; భూతేషు=in beings; కామః=desire; అస్మి=I am; భరతర్షభ=O best of the Bharatas"};
D["7.12"]={t:["యే చైవ సాత్త్వికా భావా రాజసాస్తామసాశ్చ యే |","మత్త ఏవేతి తాన్విద్ధి న త్వహం తేషు తే మయి ||"],mt:"సాత్త్విక, రాజస, తామస భావములు ఏవి ఉన్నవో అవి నానుండియే కలిగినవని తెలిసికొనుము; కాని నేను వాటియందు లేను, అవి నాయందున్నవి.",m:"Whatever states of goodness, passion and ignorance exist, know that they come from me alone; yet I am not in them, they are in me.",w:"యే చ ఏవ=whatever; సాత్త్వికాః భావాః=states of goodness; రాజసాః=of passion; తామసాః=of ignorance; చ యే=and which; మత్తః ఏవ=from me alone; ఇతి=thus; తాన్=them; విద్ధి=know; న తు అహమ్ తేషు=but I am not in them; తే మయి=they are in me"};
D["7.13"]={t:["త్రిభిర్గుణమయైర్భావైరేభిః సర్వమిదం జగత్ |","మోహితం నాభిజానాతి మామేభ్యః పరమవ్యయమ్ ||"],mt:"ఈ మూడు గుణమయ భావములచే ఈ సమస్త జగత్తు మోహితమై, వీటికంటె పరమైన అవ్యయుడనైన నన్ను ఎరుగదు.",m:"Deluded by these three states made of the gunas, this entire world does not know me, who am beyond them and imperishable.",w:"త్రిభిః=by three; గుణమయైః భావైః=by states made of the gunas; ఏభిః=by these; సర్వమ్ ఇదమ్ జగత్=this entire world; మోహితమ్=deluded; న అభిజానాతి=does not know; మామ్=me; ఏభ్యః పరమ్=beyond these; అవ్యయమ్=imperishable"};
D["7.14"]={t:["దైవీ హ్యేషా గుణమయీ మమ మాయా దురత్యయా |","మామేవ యే ప్రపద్యన్తే మాయామేతాం తరన్తి తే ||"],mt:"గుణమయమైన, దైవికమైన నా ఈ మాయ దాటుటకు కష్టమైనది; నన్నే శరణుజొచ్చువారు ఈ మాయను దాటుదురు.",m:"This divine maya of mine, made of the gunas, is hard to cross; but those who take refuge in me alone cross over this maya.",w:"దైవీ=divine; హి=indeed; ఏషా=this; గుణమయీ=made of the gunas; మమ=my; మాయా=maya; దురత్యయా=hard to cross; మామ్ ఏవ=me alone; యే ప్రపద్యన్తే=who take refuge; మాయామ్ ఏతామ్=this maya; తరన్తి=cross over; తే=they"};
D["7.15"]={t:["న మాం దుష్కృతినో మూఢాః ప్రపద్యన్తే నరాధమాః |","మాయయాపహృతజ్ఞానా ఆసురం భావమాశ్రితాః ||"],mt:"దుష్కృతులు, మూఢులు, నరాధములు, మాయచే జ్ఞానము అపహరింపబడినవారు, ఆసురభావమును ఆశ్రయించినవారు నన్ను ఆశ్రయింపరు.",m:"Evildoers, the deluded, the lowest of people, whose knowledge is stolen by maya and who resort to a demonic nature, do not take refuge in me.",w:"న మామ్ ప్రపద్యన్తే=do not take refuge in me; దుష్కృతినః=evildoers; మూఢాః=the deluded; నరాధమాః=the lowest of people; మాయయా అపహృతజ్ఞానాః=whose knowledge is stolen by maya; ఆసురమ్ భావమ్=demonic nature; ఆశ్రితాః=resorting to"};


// Chapter 7 – shlokas 7.16 to 7.30 (completes chapter 7). Paste after your D object.
D["7.16"]={t:["చతుర్విధా భజన్తే మాం జనాః సుకృతినోఽర్జున |","ఆర్తో జిజ్ఞాసురర్థార్థీ జ్ఞానీ చ భరతర్షభ ||"],mt:"ఓ అర్జునా! భరతశ్రేష్ఠా! ఆర్తుడు, జిజ్ఞాసువు, అర్థార్థి, జ్ఞాని అను నాలుగు విధములైన సుకృతులు నన్ను భజింతురు.",m:"Four kinds of virtuous people worship me, O Arjuna: the distressed, the seeker of knowledge, the seeker of wealth, and the wise, O best of the Bharatas.",w:"చతుర్విధాః=four kinds; భజన్తే=worship; మామ్=me; జనాః=people; సుకృతినః=the virtuous; అర్జున=O Arjuna; ఆర్తః=the distressed; జిజ్ఞాసుః=the seeker of knowledge; అర్థార్థీ=the seeker of wealth; జ్ఞానీ=the wise; చ=and; భరతర్షభ=O best of the Bharatas"};
D["7.17"]={t:["తేషాం జ్ఞానీ నిత్యయుక్త ఏకభక్తిర్విశిష్యతే |","ప్రియో హి జ్ఞానినోఽత్యర్థమహం స చ మమ ప్రియః ||"],mt:"వారిలో నిత్యయుక్తుడైన, ఏకభక్తి గల జ్ఞాని శ్రేష్ఠుడు; జ్ఞానికి నేను మిక్కిలి ప్రియుడను, అతడును నాకు ప్రియుడు.",m:"Of these, the wise one, ever steadfast and of single-minded devotion, excels; for I am exceedingly dear to the wise, and the wise one is dear to me.",w:"తేషామ్=among them; జ్ఞానీ=the wise; నిత్యయుక్తః=ever steadfast; ఏకభక్తిః=of single-minded devotion; విశిష్యతే=excels; ప్రియః=dear; హి=indeed; జ్ఞానినః=to the wise; అత్యర్థమ్=exceedingly; అహమ్=I; సః చ=and he; మమ=to me; ప్రియః=dear"};
D["7.18"]={t:["ఉదారాః సర్వ ఏవైతే జ్ఞానీ త్వాత్మైవ మే మతమ్ |","ఆస్థితః స హి యుక్తాత్మా మామేవానుత్తమాం గతిమ్ ||"],mt:"వీరందరును ఉదారులే; కాని జ్ఞాని నా ఆత్మయే అని నా అభిప్రాయము; ఎందుకనగా యుక్తాత్ముడైన అతడు అత్యుత్తమ గతియైన నన్నే ఆశ్రయించియున్నాడు.",m:"All of these are noble, but I consider the wise one to be my very self; for, steadfast in mind, such a person has resorted to me alone as the supreme goal.",w:"ఉదారాః=noble; సర్వే ఏవ ఏతే=all of these; జ్ఞానీ తు=but the wise one; ఆత్మా ఏవ మే మతమ్=is my very self, I consider; ఆస్థితః=has resorted; సః హి=he indeed; యుక్తాత్మా=steadfast in mind; మామ్ ఏవ=to me alone; అనుత్తమామ్ గతిమ్=the supreme goal"};
D["7.19"]={t:["బహూనాం జన్మనామన్తే జ్ఞానవాన్మాం ప్రపద్యతే |","వాసుదేవః సర్వమితి స మహాత్మా సుదుర్లభః ||"],mt:"అనేక జన్మల అంతమున జ్ఞానవంతుడు “వాసుదేవుడే సర్వము” అని తెలిసి నన్ను ఆశ్రయించును; అట్టి మహాత్ముడు మిక్కిలి దుర్లభుడు.",m:"At the end of many births, the wise one takes refuge in me, knowing that Vasudeva is everything; such a great soul is very rare.",w:"బహూనామ్ జన్మనామ్ అన్తే=at the end of many births; జ్ఞానవాన్=the wise; మామ్=me; ప్రపద్యతే=takes refuge in; వాసుదేవః=Vasudeva; సర్వమ్ ఇతి=is everything; సః మహాత్మా=that great soul; సుదుర్లభః=very rare"};
D["7.20"]={t:["కామైస్తైస్తైర్హృతజ్ఞానాః ప్రపద్యన్తేఽన్యదేవతాః |","తం తం నియమమాస్థాయ ప్రకృత్యా నియతాః స్వయా ||"],mt:"ఆయా కోరికలచే జ్ఞానము అపహరింపబడినవారు, తమ తమ స్వభావములచే నియమింపబడి, ఆయా నియమములను అవలంబించి ఇతర దేవతలను ఆశ్రయింతురు.",m:"Those whose knowledge is carried away by various desires resort to other deities, following various rules and bound by their own nature.",w:"కామైః తైః తైః=by various desires; హృతజ్ఞానాః=whose knowledge is carried away; ప్రపద్యన్తే=resort to; అన్యదేవతాః=other deities; తమ్ తమ్ నియమమ్=this or that rule; ఆస్థాయ=following; ప్రకృత్యా=by nature; నియతాః=bound; స్వయా=their own"};
D["7.21"]={t:["యో యో యాం యాం తనుం భక్తః శ్రద్ధయార్చితుమిచ్ఛతి |","తస్య తస్యాచలాం శ్రద్ధాం తామేవ విదధామ్యహమ్ ||"],mt:"ఏ భక్తుడు ఏ ఏ రూపమును శ్రద్ధతో అర్చింపగోరునో, ఆ ఆ భక్తునికి ఆ శ్రద్ధనే నేను స్థిరము చేయుదును.",m:"Whichever form a devotee wishes to worship with faith, I make that very faith steady in that person.",w:"యః యః భక్తః=whichever devotee; యామ్ యామ్ తనుమ్=whichever form; శ్రద్ధయా=with faith; అర్చితుమ్ ఇచ్ఛతి=wishes to worship; తస్య తస్య=of that one; అచలామ్=steady; శ్రద్ధామ్=faith; తామ్ ఏవ=that very; విదధామి=I bestow; అహమ్=I"};
D["7.22"]={t:["స తయా శ్రద్ధయా యుక్తస్తస్యారాధనమీహతే |","లభతే చ తతః కామాన్మయైవ విహితాన్హి తాన్ ||"],mt:"అతడు ఆ శ్రద్ధతో కూడి ఆ దేవతను ఆరాధింపగోరును; అందుండి నాచేతనే విధింపబడిన కోరికలను పొందును.",m:"Endowed with that faith, such a person seeks to worship that deity and obtains from it the desired objects, which are in fact ordained by me alone.",w:"సః=he; తయా శ్రద్ధయా యుక్తః=endowed with that faith; తస్య ఆరాధనమ్=worship of that; ఈహతే=engages in; లభతే చ=and obtains; తతః=from that; కామాన్=desires; మయా ఏవ=by me alone; విహితాన్=ordained; హి తాన్=indeed those"};
D["7.23"]={t:["అన్తవత్తు ఫలం తేషాం తద్భవత్యల్పమేధసామ్ |","దేవాన్దేవయజో యాన్తి మద్భక్తా యాన్తి మామపి ||"],mt:"అల్పబుద్ధులైన వారికి లభించు ఆ ఫలము అంతమగునది; దేవతాయజులు దేవతలను పొందుదురు, నా భక్తులు నన్నే పొందుదురు.",m:"But the fruit gained by those of small intelligence is perishable. Worshippers of the gods go to the gods, but my devotees come to me.",w:"అన్తవత్=perishable; తు=but; ఫలమ్=fruit; తేషామ్=of them; తత్=that; భవతి=is; అల్పమేధసామ్=of those of small intelligence; దేవాన్=the gods; దేవయజః=worshippers of the gods; యాన్తి=go; మద్భక్తాః=my devotees; యాన్తి=go; మామ్ అపి=to me also"};
D["7.24"]={t:["అవ్యక్తం వ్యక్తిమాపన్నం మన్యన్తే మామబుద్ధయః |","పరం భావమజానన్తో మమావ్యయమనుత్తమమ్ ||"],mt:"నా పరమమైన, అవ్యయమైన, అనుత్తమమైన స్వరూపమును ఎరుగని అబుద్ధులు అవ్యక్తుడనైన నన్ను వ్యక్తిత్వము పొందినవానిగా తలచుదురు.",m:"The unintelligent, not knowing my supreme, imperishable and unsurpassed nature, think of me, the unmanifest, as having come into manifest form.",w:"అవ్యక్తమ్=unmanifest; వ్యక్తిమ్ ఆపన్నమ్=having assumed a form; మన్యన్తే=think; మామ్=me; అబుద్ధయః=the unintelligent; పరమ్ భావమ్=supreme nature; అజానన్తః=not knowing; మమ=my; అవ్యయమ్=imperishable; అనుత్తమమ్=unsurpassed"};
D["7.25"]={t:["నాహం ప్రకాశః సర్వస్య యోగమాయాసమావృతః |","మూఢోఽయం నాభిజానాతి లోకో మామజమవ్యయమ్ ||"],mt:"యోగమాయచే కప్పబడిన నేను అందరికి ప్రకాశింపను; మూఢులైన ఈ లోకము జన్మరహితుడను, అవ్యయుడనైన నన్ను ఎరుగదు.",m:"Veiled by my yoga-maya, I am not manifest to everyone; this deluded world does not know me, the unborn and imperishable.",w:"న అహమ్ ప్రకాశః సర్వస్య=I am not manifest to everyone; యోగమాయాసమావృతః=veiled by my yoga-maya; మూఢః అయమ్ లోకః=this deluded world; న అభిజానాతి=does not know; మామ్=me; అజమ్=unborn; అవ్యయమ్=imperishable"};
D["7.26"]={t:["వేదాహం సమతీతాని వర్తమానాని చార్జున |","భవిష్యాణి చ భూతాని మాం తు వేద న కశ్చన ||"],mt:"ఓ అర్జునా! గడచిన, జరుగుచున్న, రాబోవు భూతములను నేను ఎరుగుదును; కాని నన్ను ఎవడును ఎరుగడు.",m:"O Arjuna, I know the beings of the past, the present and the future, but no one knows me.",w:"వేద=know; అహమ్=I; సమతీతాని=past; వర్తమానాని=present; చ=and; అర్జున=O Arjuna; భవిష్యాణి=future; చ భూతాని=and beings; మామ్ తు వేద న కశ్చన=but no one knows me"};
D["7.27"]={t:["ఇచ్ఛాద్వేషసముత్థేన ద్వన్ద్వమోహేన భారత |","సర్వభూతాని సమ్మోహం సర్గే యాన్తి పరన్తప ||"],mt:"ఓ భారతా! ఓ పరంతపా! ఇచ్ఛాద్వేషములనుండి పుట్టిన ద్వంద్వమోహముచే సర్వభూతములు సృష్టియందు సమ్మోహమును పొందును.",m:"O Bharata, O scorcher of foes, all beings are born into delusion, through the delusion of dualities that arises from desire and aversion.",w:"ఇచ్ఛాద్వేషసముత్థేన=arising from desire and aversion; ద్వన్ద్వమోహేన=by the delusion of dualities; భారత=O Bharata; సర్వభూతాని=all beings; సమ్మోహమ్=delusion; సర్గే=at birth; యాన్తి=fall into; పరన్తప=O scorcher of foes"};
D["7.28"]={t:["యేషాం త్వన్తగతం పాపం జనానాం పుణ్యకర్మణామ్ |","తే ద్వన్ద్వమోహనిర్ముక్తా భజన్తే మాం దృఢవ్రతాః ||"],mt:"పుణ్యకర్మలు చేయు ఏ జనుల పాపము అంతమైనదో, వారు ద్వంద్వమోహమునుండి విముక్తులై దృఢవ్రతులై నన్ను భజింతురు.",m:"But those virtuous people whose sin has come to an end are freed from the delusion of dualities and worship me with firm resolve.",w:"యేషామ్=whose; తు=but; అన్తగతమ్=has come to an end; పాపమ్=sin; జనానామ్=of people; పుణ్యకర్మణామ్=of virtuous deeds; తే=they; ద్వన్ద్వమోహనిర్ముక్తాః=freed from the delusion of dualities; భజన్తే=worship; మామ్=me; దృఢవ్రతాః=firm in vows"};
D["7.29"]={t:["జరామరణమోక్షాయ మామాశ్రిత్య యతన్తి యే |","తే బ్రహ్మ తద్విదుః కృత్స్నమధ్యాత్మం కర్మ చాఖిలమ్ ||"],mt:"జరామరణములనుండి మోక్షము కొరకు నన్ను ఆశ్రయించి ప్రయత్నించువారు ఆ బ్రహ్మమును, సమస్త అధ్యాత్మమును, సంపూర్ణ కర్మను ఎరుగుదురు.",m:"Those who strive for liberation from old age and death, taking refuge in me, know that Brahman, the entire nature of the self, and all action.",w:"జరామరణమోక్షాయ=for liberation from old age and death; మామ్ ఆశ్రిత్య=taking refuge in me; యతన్తి=strive; యే=who; తే=they; బ్రహ్మ తత్=that Brahman; విదుః=know; కృత్స్నమ్=entire; అధ్యాత్మమ్=the nature of the self; కర్మ చ అఖిలమ్=and all action"};
D["7.30"]={t:["సాధిభూతాధిదైవం మాం సాధియజ్ఞం చ యే విదుః |","ప్రయాణకాలేఽపి చ మాం తే విదుర్యుక్తచేతసః ||"],mt:"అధిభూతము, అధిదైవము, అధియజ్ఞములతో కూడిన నన్ను ఎరిగినవారు యుక్తచిత్తులై మరణకాలమునందును నన్ను ఎరుగుదురు.",m:"Those who know me together with the adhibhuta, the adhidaiva and the adhiyajna know me even at the time of death, with steadfast minds.",w:"సాధిభూతాధిదైవమ్=with the adhibhuta and the adhidaiva; మామ్=me; సాధియజ్ఞమ్=with the adhiyajna; చ=and; యే విదుః=who know; ప్రయాణకాలే అపి చ=even at the time of death; మామ్=me; తే విదుః=they know; యుక్తచేతసః=with steadfast minds"};

// Chapter 8 – shlokas 8.1 to 8.14. Paste after your D object.
D["8.1"]={t:["అర్జున ఉవాచ |","కిం తద్బ్రహ్మ కిమధ్యాత్మం కిం కర్మ పురుషోత్తమ |","అధిభూతం చ కిం ప్రోక్తమధిదైవం కిముచ్యతే ||"],mt:"అర్జునుడు పలికెను: ఓ పురుషోత్తమా! ఆ బ్రహ్మము ఏది? అధ్యాత్మమేది? కర్మ ఏది? అధిభూతమని దేనిని చెప్పుదురు? అధిదైవమని దేనిని అందురు?",m:"Arjuna said: O Supreme Person, what is that Brahman? What is the self? What is action? What is called the adhibhuta, and what is called the adhidaiva?",w:"అర్జునః ఉవాచ=Arjuna said; కిమ్=what; తత్ బ్రహ్మ=that Brahman; అధ్యాత్మమ్=the nature of the self; కర్మ=action; పురుషోత్తమ=O Supreme Person; అధిభూతమ్=the adhibhuta; చ=and; ప్రోక్తమ్=is said; అధిదైవమ్=the adhidaiva; ఉచ్యతే=is called"};
D["8.2"]={t:["అధియజ్ఞః కథం కోఽత్ర దేహేఽస్మిన్మధుసూదన |","ప్రయాణకాలే చ కథం జ్ఞేయోఽసి నియతాత్మభిః ||"],mt:"ఓ మధుసూదనా! ఈ దేహమున అధియజ్ఞుడు ఎవడు, ఎట్లు? మరణకాలమున నియతాత్ములచే నీవు ఎట్లు తెలియబడుదువు?",m:"O Madhusudana, who is the adhiyajna here in this body, and how? And how are you to be known at the time of death by the self-controlled?",w:"అధియజ్ఞః=the adhiyajna; కథమ్=how; కః=who; అత్ర=here; దేహే అస్మిన్=in this body; మధుసూదన=O Madhusudana; ప్రయాణకాలే=at the time of death; చ=and; కథమ్=how; జ్ఞేయః అసి=are you to be known; నియతాత్మభిః=by the self-controlled"};
D["8.3"]={t:["శ్రీభగవానువాచ |","అక్షరం బ్రహ్మ పరమం స్వభావోఽధ్యాత్మముచ్యతే |","భూతభావోద్భవకరో విసర్గః కర్మసంజ్ఞితః ||"],mt:"శ్రీభగవానుడు పలికెను: పరమమైన అక్షరము బ్రహ్మము; స్వభావము అధ్యాత్మమనబడును; భూతముల ఉత్పత్తిని కలిగించు విసర్గము కర్మ అని చెప్పబడును.",m:"The Blessed Lord said: The supreme imperishable is Brahman; one’s own nature is called the self (adhyatma); the creative offering that brings beings into existence is called karma.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; అక్షరమ్=the imperishable; బ్రహ్మ=Brahman; పరమమ్=supreme; స్వభావః=one’s own nature; అధ్యాత్మమ్=the self; ఉచ్యతే=is called; భూతభావోద్భవకరః=causing the origin of beings; విసర్గః=creative offering; కర్మసంజ్ఞితః=called karma"};
D["8.4"]={t:["అధిభూతం క్షరో భావః పురుషశ్చాధిదైవతమ్ |","అధియజ్ఞోఽహమేవాత్ర దేహే దేహభృతాం వర ||"],mt:"ఓ దేహధారులలో శ్రేష్ఠుడా! నశించు స్వభావము అధిభూతము, పురుషుడు అధిదైవతము; ఈ దేహమున అధియజ్ఞుడను నేనే.",m:"The perishable nature is the adhibhuta, and the cosmic person is the adhidaiva; and I alone am the adhiyajna here in this body, O best of the embodied.",w:"అధిభూతమ్=the adhibhuta; క్షరః భావః=perishable nature; పురుషః=the cosmic person; చ=and; అధిదైవతమ్=the adhidaiva; అధియజ్ఞః=the adhiyajna; అహమ్ ఏవ=I alone; అత్ర దేహే=here in this body; దేహభృతామ్ వర=O best of the embodied"};
D["8.5"]={t:["అన్తకాలే చ మామేవ స్మరన్ముక్త్వా కలేబరమ్ |","యః ప్రయాతి స మద్భావం యాతి నాస్త్యత్ర సంశయః ||"],mt:"అంతకాలమున నన్నే స్మరించుచు శరీరమును విడిచి ప్రయాణించువాడు నా భావమును పొందును; ఇందు సంశయము లేదు.",m:"One who, at the time of death, leaves the body remembering me alone attains my state; there is no doubt about this.",w:"అన్తకాలే=at the time of death; చ=and; మామ్ ఏవ=me alone; స్మరన్=remembering; ముక్త్వా=leaving; కలేబరమ్=the body; యః ప్రయాతి=who departs; సః=he; మద్భావమ్=my state; యాతి=attains; న అస్తి అత్ర సంశయః=there is no doubt in this"};
D["8.6"]={t:["యం యం వాపి స్మరన్భావం త్యజత్యన్తే కలేబరమ్ |","తం తమేవైతి కౌన్తేయ సదా తద్భావభావితః ||"],mt:"ఓ కౌంతేయా! ఎవడు అంతమున ఏ ఏ భావమును స్మరించుచు శరీరమును విడుచునో, సదా ఆ భావముతో భావితుడై అతడు ఆ భావమునే పొందును.",m:"Whatever state of being one remembers when giving up the body at the end, O son of Kunti, that very state one reaches, being always absorbed in the thought of it.",w:"యమ్ యమ్ వా అపి భావమ్=whatever state; స్మరన్=remembering; త్యజతి=gives up; అన్తే=at the end; కలేబరమ్=the body; తమ్ తమ్ ఏవ ఏతి=that very one he reaches; కౌన్తేయ=O son of Kunti; సదా=always; తద్భావభావితః=absorbed in the thought of that"};
D["8.7"]={t:["తస్మాత్సర్వేషు కాలేషు మామనుస్మర యుధ్య చ |","మయ్యర్పితమనోబుద్ధిర్మామేవైష్యస్యసంశయమ్ ||"],mt:"కావున సర్వకాలములలో నన్ను స్మరింపుము, యుద్ధము చేయుము; నాయందు మనోబుద్ధులను అర్పించినవాడవై నిస్సందేహముగా నన్నే పొందెదవు.",m:"Therefore, remember me at all times and fight. With your mind and intellect surrendered to me, you will come to me alone, without doubt.",w:"తస్మాత్=therefore; సర్వేషు కాలేషు=at all times; మామ్ అనుస్మర=remember me; యుధ్య=fight; చ=and; మయి అర్పితమనోబుద్ధిః=with mind and intellect surrendered to me; మామ్ ఏవ ఏష్యసి=you will come to me alone; అసంశయమ్=without doubt"};
D["8.8"]={t:["అభ్యాసయోగయుక్తేన చేతసా నాన్యగామినా |","పరమం పురుషం దివ్యం యాతి పార్థానుచిన్తయన్ ||"],mt:"ఓ పార్థా! అభ్యాసయోగముచే యుక్తమైన, ఇతర విషయములకు పోని చిత్తముతో దివ్యమైన పరమపురుషుని ధ్యానించువాడు ఆయననే పొందును.",m:"One who meditates on the divine Supreme Person with a mind engaged in the practice of yoga and not wandering elsewhere attains that Person, O Partha.",w:"అభ్యాసయోగయుక్తేన=engaged in the practice of yoga; చేతసా=with the mind; న అన్యగామినా=not wandering elsewhere; పరమమ్ పురుషమ్=the Supreme Person; దివ్యమ్=divine; యాతి=attains; పార్థ=O Partha; అనుచిన్తయన్=meditating"};
D["8.9"]={t:["కవిం పురాణమనుశాసితారమణోరణీయాంసమనుస్మరేద్యః |","సర్వస్య ధాతారమచిన్త్యరూపమాదిత్యవర్ణం తమసః పరస్తాత్ ||"],mt:"సర్వజ్ఞుడు, పురాతనుడు, శాసకుడు, అణువుకంటె సూక్ష్ముడు, సర్వమునకు ధాత, అచింత్యరూపుడు, సూర్యునివలె ప్రకాశించువాడు, తమస్సునకు అతీతుడైనవానిని ఎవడు స్మరించునో... (8.10 లో కొనసాగును)",m:"One who remembers the omniscient, the ancient, the ruler, subtler than the atom, the supporter of all, of inconceivable form, radiant like the sun and beyond darkness... (continues in 8.10)",w:"కవిమ్=the omniscient; పురాణమ్=ancient; అనుశాసితారమ్=the ruler; అణోః అణీయాంసమ్=subtler than the atom; అనుస్మరేత్=remembers; యః=who; సర్వస్య ధాతారమ్=the supporter of all; అచిన్త్యరూపమ్=of inconceivable form; ఆదిత్యవర్ణమ్=sun-coloured; తమసః పరస్తాత్=beyond darkness"};
D["8.10"]={t:["ప్రయాణకాలే మనసాచలేన భక్త్యా యుక్తో యోగబలేన చైవ |","భ్రువోర్మధ్యే ప్రాణమావేశ్య సమ్యక్ స తం పరం పురుషముపైతి దివ్యమ్ ||"],mt:"...అతడు మరణకాలమున నిశ్చలమనస్సుతో, భక్తితో యుక్తుడై, యోగబలముచే ప్రాణమును భ్రూమధ్యమున చక్కగా నిలిపి, ఆ దివ్యమైన పరమపురుషుని పొందును.",m:"...at the time of death, with an unmoving mind, endowed with devotion and by the power of yoga, fixing the life-breath fully between the eyebrows, that person reaches that divine Supreme Person.",w:"ప్రయాణకాలే=at the time of death; మనసా అచలేన=with an unmoving mind; భక్త్యా యుక్తః=endowed with devotion; యోగబలేన చ ఏవ=and by the power of yoga; భ్రువోః మధ్యే=between the eyebrows; ప్రాణమ్=the life-breath; ఆవేశ్య=fixing; సమ్యక్=fully; సః=he; తమ్ పరమ్ పురుషమ్ ఉపైతి=reaches that Supreme Person; దివ్యమ్=divine"};
D["8.11"]={t:["యదక్షరం వేదవిదో వదన్తి విశన్తి యద్యతయో వీతరాగాః |","యదిచ్ఛన్తో బ్రహ్మచర్యం చరన్తి తత్తే పదం సఙ్గ్రహేణ ప్రవక్ష్యే ||"],mt:"వేదవేత్తలు అక్షరమని చెప్పునదానిని, వీతరాగులైన యతులు ప్రవేశించునదానిని, దేనిని కోరి బ్రహ్మచర్యమును ఆచరింతురో ఆ పదమును నీకు సంగ్రహముగా చెప్పెదను.",m:"That which the knowers of the Veda call imperishable, which ascetics free from attachment enter, and desiring which people practise celibacy: that state I shall explain to you in brief.",w:"యత్ అక్షరమ్=that which is imperishable; వేదవిదః=knowers of the Veda; వదన్తి=speak of; విశన్తి=enter; యత్=which; యతయః=ascetics; వీతరాగాః=free from attachment; యత్ ఇచ్ఛన్తః=desiring which; బ్రహ్మచర్యమ్ చరన్తి=practise celibacy; తత్ తే పదమ్=that state to you; సఙ్గ్రహేణ=in brief; ప్రవక్ష్యే=I shall explain"};
D["8.12"]={t:["సర్వద్వారాణి సంయమ్య మనో హృది నిరుధ్య చ |","మూర్ధ్న్యాధాయాత్మనః ప్రాణమాస్థితో యోగధారణామ్ ||"],mt:"సర్వ ద్వారములను నిగ్రహించి, మనస్సును హృదయమున నిరోధించి, ప్రాణమును శిరస్సున నిలిపి, యోగధారణయందు స్థితుడై... (8.13 లో కొనసాగును)",m:"Restraining all the gates of the body, confining the mind in the heart, placing the life-breath in the head, and established in yogic concentration... (continues in 8.13)",w:"సర్వద్వారాణి=all the gates (senses); సంయమ్య=restraining; మనః=mind; హృది=in the heart; నిరుధ్య చ=and confining; మూర్ధ్ని=in the head; ఆధాయ=placing; ఆత్మనః ప్రాణమ్=one’s life-breath; ఆస్థితః=established; యోగధారణామ్=in yogic concentration"};
D["8.13"]={t:["ఓమిత్యేకాక్షరం బ్రహ్మ వ్యాహరన్మామనుస్మరన్ |","యః ప్రయాతి త్యజన్దేహం స యాతి పరమాం గతిమ్ ||"],mt:"...“ఓం” అను ఏకాక్షర బ్రహ్మమును ఉచ్చరించుచు నన్ను స్మరించుచు దేహమును విడిచి ప్రయాణించువాడు పరమగతిని పొందును.",m:"...uttering the single-syllable Brahman, Om, and remembering me, one who departs, leaving the body, attains the supreme goal.",w:"ఓమ్ ఇతి ఏకాక్షరమ్ బ్రహ్మ=the single-syllable Brahman, Om; వ్యాహరన్=uttering; మామ్ అనుస్మరన్=remembering me; యః ప్రయాతి=who departs; త్యజన్ దేహమ్=leaving the body; సః=he; యాతి=attains; పరమామ్ గతిమ్=the supreme goal"};
D["8.14"]={t:["అనన్యచేతాః సతతం యో మాం స్మరతి నిత్యశః |","తస్యాహం సులభః పార్థ నిత్యయుక్తస్య యోగినః ||"],mt:"ఓ పార్థా! అనన్యచిత్తుడై ఎల్లప్పుడును నిత్యము నన్ను స్మరించువాడు, నిత్యయుక్తుడైన ఆ యోగికి నేను సులభుడను.",m:"I am easily attained, O Partha, by the ever-steadfast yogi who constantly remembers me daily with a mind turned to no other.",w:"అనన్యచేతాః=with a mind not turned elsewhere; సతతమ్=constantly; యః మామ్ స్మరతి=who remembers me; నిత్యశః=daily; తస్య=to him; అహమ్=I; సులభః=easily attained; పార్థ=O Partha; నిత్యయుక్తస్య యోగినః=of the ever-steadfast yogi"};

// Chapter 8 – shlokas 8.15 to 8.28 (completes chapter 8). Paste after your D object.
D["8.15"]={t:["మాముపేత్య పునర్జన్మ దుఃఖాలయమశాశ్వతమ్ |","నాప్నువన్తి మహాత్మానః సంసిద్ధిం పరమాం గతాః ||"],mt:"పరమసిద్ధిని పొందిన మహాత్ములు నన్ను చేరి, దుఃఖాలయమైన అశాశ్వతమైన పునర్జన్మను పొందరు.",m:"Having come to me, the great souls who have reached supreme perfection do not take rebirth, which is the abode of sorrow and is impermanent.",w:"మామ్ ఉపేత్య=having come to me; పునర్జన్మ=rebirth; దుఃఖాలయమ్=abode of sorrow; అశాశ్వతమ్=impermanent; న ఆప్నువన్తి=do not attain; మహాత్మానః=great souls; సంసిద్ధిమ్ పరమామ్ గతాః=who have reached supreme perfection"};
D["8.16"]={t:["ఆబ్రహ్మభువనాల్లోకాః పునరావర్తినోఽర్జున |","మాముపేత్య తు కౌన్తేయ పునర్జన్మ న విద్యతే ||"],mt:"ఓ అర్జునా! బ్రహ్మలోకము వరకు గల లోకములన్నియు పునరావృత్తి గలవి; ఓ కౌంతేయా! నన్ను చేరినవానికి పునర్జన్మ లేదు.",m:"All worlds up to the world of Brahma are subject to return, O Arjuna; but for one who has come to me, O son of Kunti, there is no rebirth.",w:"ఆబ్రహ్మభువనాత్=up to the world of Brahma; లోకాః=worlds; పునరావర్తినః=subject to return; అర్జున=O Arjuna; మామ్ ఉపేత్య తు=but having reached me; కౌన్తేయ=O son of Kunti; పునర్జన్మ న విద్యతే=there is no rebirth"};
D["8.17"]={t:["సహస్రయుగపర్యన్తమహర్యద్బ్రహ్మణో విదుః |","రాత్రిం యుగసహస్రాన్తాం తేఽహోరాత్రవిదో జనాః ||"],mt:"బ్రహ్మకు వేయి యుగముల పర్యంతము పగలనియు, వేయి యుగముల అంతమైన రాత్రి అనియు తెలిసినవారే అహోరాత్రవేత్తలైన జనులు.",m:"Those people who know that Brahma’s day lasts a thousand yugas and his night ends after a thousand yugas are the knowers of day and night.",w:"సహస్రయుగపర్యన్తమ్=lasting a thousand yugas; అహః=day; యత్ బ్రహ్మణః=of Brahma; విదుః=they know; రాత్రిమ్=night; యుగసహస్రాన్తామ్=ending after a thousand yugas; తే అహోరాత్రవిదః జనాః=those people are knowers of day and night"};
D["8.18"]={t:["అవ్యక్తాద్వ్యక్తయః సర్వాః ప్రభవన్త్యహరాగమే |","రాత్ర్యాగమే ప్రలీయన్తే తత్రైవావ్యక్తసంజ్ఞకే ||"],mt:"పగలు ఆరంభమగునప్పుడు అవ్యక్తమునుండి సమస్త వ్యక్తులు ఉద్భవించును; రాత్రి ఆరంభమగునప్పుడు అదే అవ్యక్తమునందు లయించును.",m:"At the coming of day, all manifested beings emerge from the unmanifest; at the coming of night, they merge into that same unmanifest.",w:"అవ్యక్తాత్=from the unmanifest; వ్యక్తయః సర్వాః=all manifested beings; ప్రభవన్తి=emerge; అహరాగమే=at the coming of day; రాత్ర్యాగమే=at the coming of night; ప్రలీయన్తే=merge; తత్ర ఏవ=into that very; అవ్యక్తసంజ్ఞకే=called the unmanifest"};
D["8.19"]={t:["భూతగ్రామః స ఏవాయం భూత్వా భూత్వా ప్రలీయతే |","రాత్ర్యాగమేఽవశః పార్థ ప్రభవత్యహరాగమే ||"],mt:"ఓ పార్థా! ఈ భూతసమూహము మరల మరల పుట్టి, రాత్రి వచ్చినప్పుడు అవశముగా లయించి, పగలు వచ్చినప్పుడు మరల ఉద్భవించును.",m:"This same multitude of beings, coming into existence again and again, dissolves helplessly at the coming of night, O Partha, and emerges again at the coming of day.",w:"భూతగ్రామః=multitude of beings; సః ఏవ అయమ్=this very same; భూత్వా భూత్వా=being born again and again; ప్రలీయతే=dissolves; రాత్ర్యాగమే=at the coming of night; అవశః=helplessly; పార్థ=O Partha; ప్రభవతి=emerges; అహరాగమే=at the coming of day"};
D["8.20"]={t:["పరస్తస్మాత్తు భావోఽన్యోఽవ్యక్తోఽవ్యక్తాత్సనాతనః |","యః స సర్వేషు భూతేషు నశ్యత్సు న వినశ్యతి ||"],mt:"ఆ అవ్యక్తముకంటె పరమైన, సనాతనమైన మరొక అవ్యక్త భావము కలదు; సర్వభూతములు నశించినను అది నశింపదు.",m:"Beyond that unmanifest there is another, eternal unmanifest state of being, which is not destroyed even when all beings perish.",w:"పరః=beyond; తస్మాత్ తు=than that; భావః=state of being; అన్యః=another; అవ్యక్తః=unmanifest; అవ్యక్తాత్=than the unmanifest; సనాతనః=eternal; యః సః=that which; సర్వేషు భూతేషు నశ్యత్సు=when all beings perish; న వినశ్యతి=is not destroyed"};
D["8.21"]={t:["అవ్యక్తోఽక్షర ఇత్యుక్తస్తమాహుః పరమాం గతిమ్ |","యం ప్రాప్య న నివర్తన్తే తద్ధామ పరమం మమ ||"],mt:"అవ్యక్తమనియు అక్షరమనియు చెప్పబడు దానిని పరమగతి అందురు; దానిని పొందినవారు తిరిగి రారు; అదే నా పరమధామము.",m:"That which is called the unmanifest and imperishable, they say, is the supreme goal; having attained it, none return. That is my supreme abode.",w:"అవ్యక్తః=unmanifest; అక్షరః=imperishable; ఇతి ఉక్తః=thus called; తమ్=that; ఆహుః=they call; పరమామ్ గతిమ్=the supreme goal; యమ్ ప్రాప్య=attaining which; న నివర్తన్తే=do not return; తత్ ధామ పరమమ్ మమ=that is my supreme abode"};
D["8.22"]={t:["పురుషః స పరః పార్థ భక్త్యా లభ్యస్త్వనన్యయా |","యస్యాన్తఃస్థాని భూతాని యేన సర్వమిదం తతమ్ ||"],mt:"ఓ పార్థా! ఆ పరమపురుషుడు అనన్యభక్తిచే లభ్యుడు; ఆయనయందే సర్వభూతములున్నవి; ఆయనచే ఈ సమస్తము వ్యాపింపబడినది.",m:"That Supreme Person, O Partha, can be attained by unwavering devotion; within him all beings abide, and by him all this is pervaded.",w:"పురుషః సః పరః=that Supreme Person; పార్థ=O Partha; భక్త్యా=by devotion; లభ్యః=attainable; తు=indeed; అనన్యయా=unwavering; యస్య అన్తఃస్థాని భూతాని=in whom all beings abide; యేన సర్వమ్ ఇదమ్ తతమ్=by whom all this is pervaded"};
D["8.23"]={t:["యత్ర కాలే త్వనావృత్తిమావృత్తిం చైవ యోగినః |","ప్రయాతా యాన్తి తం కాలం వక్ష్యామి భరతర్షభ ||"],mt:"ఓ భరతశ్రేష్ఠా! ఏ కాలమున ప్రయాణించిన యోగులు తిరిగి రాకుందురో, తిరిగి వత్తురో ఆ కాలమును నీకు చెప్పెదను.",m:"O best of the Bharatas, I shall tell you the time at which yogis who depart do not return, and the time at which they do return.",w:"యత్ర కాలే=at which time; తు=indeed; అనావృత్తిమ్=non-return; ఆవృత్తిమ్ చ=and return; ఏవ=also; యోగినః=yogis; ప్రయాతాః=having departed; యాన్తి=go; తమ్ కాలమ్=that time; వక్ష్యామి=I shall tell; భరతర్షభ=O best of the Bharatas"};
D["8.24"]={t:["అగ్నిర్జ్యోతిరహః శుక్లః షణ్మాసా ఉత్తరాయణమ్ |","తత్ర ప్రయాతా గచ్ఛన్తి బ్రహ్మ బ్రహ్మవిదో జనాః ||"],mt:"అగ్ని, జ్యోతి, పగలు, శుక్లపక్షము, ఉత్తరాయణ ఆరు మాసములు — అందు ప్రయాణించిన బ్రహ్మవిదులు బ్రహ్మమును పొందుదురు.",m:"Fire, light, day, the bright fortnight and the six months of the sun’s northern course: departing then, the knowers of Brahman go to Brahman.",w:"అగ్నిః=fire; జ్యోతిః=light; అహః=day; శుక్లః=bright fortnight; షణ్మాసాః=six months; ఉత్తరాయణమ్=the sun’s northern course; తత్ర ప్రయాతాః=departing then; గచ్ఛన్తి=go; బ్రహ్మ=to Brahman; బ్రహ్మవిదః జనాః=knowers of Brahman"};
D["8.25"]={t:["ధూమో రాత్రిస్తథా కృష్ణః షణ్మాసా దక్షిణాయనమ్ |","తత్ర చాన్ద్రమసం జ్యోతిర్యోగీ ప్రాప్య నివర్తతే ||"],mt:"పొగ, రాత్రి, కృష్ణపక్షము, దక్షిణాయన ఆరు మాసములు — అందు ప్రయాణించిన యోగి చంద్రజ్యోతిని పొంది తిరిగి వచ్చును.",m:"Smoke, night, the dark fortnight and the six months of the sun’s southern course: departing then, the yogi reaches the lunar light and returns.",w:"ధూమః=smoke; రాత్రిః=night; తథా=also; కృష్ణః=dark fortnight; షణ్మాసాః=six months; దక్షిణాయనమ్=the sun’s southern course; తత్ర=then; చాన్ద్రమసమ్ జ్యోతిః=the lunar light; యోగీ=the yogi; ప్రాప్య=reaching; నివర్తతే=returns"};
D["8.26"]={t:["శుక్లకృష్ణే గతీ హ్యేతే జగతః శాశ్వతే మతే |","ఏకయా యాత్యనావృత్తిమన్యయావర్తతే పునః ||"],mt:"శుక్లము, కృష్ణము అను ఈ రెండు గతులు జగత్తునకు శాశ్వతములని భావింపబడినవి; ఒకదానిచే తిరిగి రాని స్థితిని పొందును, మరొకదానిచే మరల వచ్చును.",m:"These two paths, bright and dark, are considered eternal for the world; by one a person goes to non-return, and by the other returns again.",w:"శుక్లకృష్ణే=bright and dark; గతీ=paths; హి ఏతే=these indeed; జగతః=of the world; శాశ్వతే=eternal; మతే=are considered; ఏకయా=by one; యాతి అనావృత్తిమ్=goes to non-return; అన్యయా=by the other; ఆవర్తతే పునః=returns again"};
D["8.27"]={t:["నైతే సృతీ పార్థ జానన్యోగీ ముహ్యతి కశ్చన |","తస్మాత్సర్వేషు కాలేషు యోగయుక్తో భవార్జున ||"],mt:"ఓ పార్థా! ఈ రెండు మార్గములను ఎరిగిన యోగి ఎవడును మోహము చెందడు; కావున ఓ అర్జునా! సర్వకాలములలో యోగయుక్తుడవు కమ్ము.",m:"O Partha, no yogi who knows these two paths is ever deluded. Therefore, O Arjuna, be steadfast in yoga at all times.",w:"న ఏతే సృతీ=these two paths; పార్థ=O Partha; జానన్=knowing; యోగీ=a yogi; ముహ్యతి=is deluded; కశ్చన=any; తస్మాత్=therefore; సర్వేషు కాలేషు=at all times; యోగయుక్తః భవ=be steadfast in yoga; అర్జున=O Arjuna"};
D["8.28"]={t:["వేదేషు యజ్ఞేషు తపఃసు చైవ దానేషు యత్పుణ్యఫలం ప్రదిష్టమ్ |","అత్యేతి తత్సర్వమిదం విదిత్వా యోగీ పరం స్థానముపైతి చాద్యమ్ ||"],mt:"వేదములలో, యజ్ఞములలో, తపస్సులలో, దానములలో ఏ పుణ్యఫలము చెప్పబడినదో దానినంతయు ఇది తెలిసిన యోగి అతిక్రమించి, ఆద్యమైన పరమస్థానమును పొందును.",m:"Knowing this, the yogi goes beyond whatever fruit of merit is prescribed for the Vedas, sacrifices, austerities and charity, and attains the supreme, primal abode.",w:"వేదేషు=in the Vedas; యజ్ఞేషు=in sacrifices; తపఃసు=in austerities; చ ఏవ=and also; దానేషు=in charity; యత్ పుణ్యఫలమ్ ప్రదిష్టమ్=whatever fruit of merit is prescribed; అత్యేతి=transcends; తత్ సర్వమ్ ఇదమ్ విదిత్వా=knowing all this; యోగీ=the yogi; పరమ్ స్థానమ్=the supreme abode; ఉపైతి=attains; చ ఆద్యమ్=and the primal"};


// Chapter 9 – shlokas 9.1 to 9.17. Paste after your D object.
D["9.1"]={t:["శ్రీభగవానువాచ |","ఇదం తు తే గుహ్యతమం ప్రవక్ష్యామ్యనసూయవే |","జ్ఞానం విజ్ఞానసహితం యజ్జ్ఞాత్వా మోక్ష్యసేఽశుభాత్ ||"],mt:"శ్రీభగవానుడు పలికెను: అసూయలేని నీకు విజ్ఞానసహితమైన అతి గుహ్యమైన ఈ జ్ఞానమును చెప్పెదను; దీనిని తెలిసికొని అశుభమునుండి విముక్తుడవగుదువు.",m:"The Blessed Lord said: To you, who are not envious, I shall explain this most secret knowledge together with realisation, knowing which you will be freed from evil.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ఇదమ్=this; తు=indeed; తే=to you; గుహ్యతమమ్=most secret; ప్రవక్ష్యామి=I shall explain; అనసూయవే=to one who is not envious; జ్ఞానమ్=knowledge; విజ్ఞానసహితమ్=with realisation; యత్ జ్ఞాత్వా=knowing which; మోక్ష్యసే=you will be freed; అశుభాత్=from evil"};
D["9.2"]={t:["రాజవిద్యా రాజగుహ్యం పవిత్రమిదముత్తమమ్ |","ప్రత్యక్షావగమం ధర్మ్యం సుసుఖం కర్తుమవ్యయమ్ ||"],mt:"ఇది రాజవిద్య, రాజగుహ్యము, పవిత్రము, ఉత్తమము; ప్రత్యక్షముగా అనుభవింపదగినది, ధర్మయుక్తము, ఆచరించుటకు మిక్కిలి సులభము, అవ్యయము.",m:"This is the king of sciences and the king of secrets, supremely pure; directly perceivable, in accordance with dharma, very easy to practise, and imperishable.",w:"రాజవిద్యా=king of sciences; రాజగుహ్యమ్=king of secrets; పవిత్రమ్=pure; ఇదమ్=this; ఉత్తమమ్=supreme; ప్రత్యక్షావగమమ్=directly perceivable; ధర్మ్యమ్=righteous; సుసుఖమ్=very easy; కర్తుమ్=to perform; అవ్యయమ్=imperishable"};
D["9.3"]={t:["అశ్రద్దధానాః పురుషా ధర్మస్యాస్య పరన్తప |","అప్రాప్య మాం నివర్తన్తే మృత్యుసంసారవర్త్మని ||"],mt:"ఓ పరంతపా! ఈ ధర్మమునందు శ్రద్ధలేని పురుషులు నన్ను పొందక మృత్యుసంసారమార్గమునకు తిరిగి వత్తురు.",m:"Persons without faith in this dharma, O scorcher of foes, fail to reach me and return to the path of death and rebirth.",w:"అశ్రద్దధానాః=without faith; పురుషాః=people; ధర్మస్య అస్య=in this dharma; పరన్తప=O scorcher of foes; అప్రాప్య మామ్=not attaining me; నివర్తన్తే=return; మృత్యుసంసారవర్త్మని=to the path of death and rebirth"};
D["9.4"]={t:["మయా తతమిదం సర్వం జగదవ్యక్తమూర్తినా |","మత్స్థాని సర్వభూతాని న చాహం తేష్వవస్థితః ||"],mt:"అవ్యక్తరూపుడనైన నాచే ఈ సమస్త జగత్తు వ్యాపింపబడినది; సర్వభూతములు నాయందున్నవి, కాని నేను వాటియందు నిలిచియుండను.",m:"This entire world is pervaded by me in my unmanifest form. All beings abide in me, but I am not situated in them.",w:"మయా=by me; తతమ్=pervaded; ఇదమ్ సర్వమ్ జగత్=this entire world; అవ్యక్తమూర్తినా=by my unmanifest form; మత్స్థాని=abiding in me; సర్వభూతాని=all beings; న చ అహమ్ తేషు అవస్థితః=but I am not situated in them"};
D["9.5"]={t:["న చ మత్స్థాని భూతాని పశ్య మే యోగమైశ్వరమ్ |","భూతభృన్న చ భూతస్థో మమాత్మా భూతభావనః ||"],mt:"అయినను భూతములు నాయందు లేవు; నా ఐశ్వర్యయోగమును చూడుము; నా ఆత్మ భూతములను భరించి భూతములను ఉద్భవింపజేయును, కాని భూతములయందు నిలిచియుండదు.",m:"And yet beings do not abide in me; behold my divine mystic power. My self sustains beings and brings them forth, yet does not abide in them.",w:"న చ మత్స్థాని భూతాని=and yet beings do not abide in me; పశ్య=behold; మే=my; యోగమ్ ఐశ్వరమ్=divine mystic power; భూతభృత్=sustainer of beings; న చ భూతస్థః=yet not abiding in them; మమ ఆత్మా=my self; భూతభావనః=source of beings"};
D["9.6"]={t:["యథాకాశస్థితో నిత్యం వాయుః సర్వత్రగో మహాన్ |","తథా సర్వాణి భూతాని మత్స్థానీత్యుపధారయ ||"],mt:"సర్వత్ర సంచరించు గొప్ప వాయువు ఎల్లప్పుడును ఆకాశమున ఉండునట్లు, సర్వభూతములు నాయందున్నవని తెలిసికొనుము.",m:"As the mighty wind, moving everywhere, always rests in space, so understand that all beings rest in me.",w:"యథా=as; ఆకాశస్థితః=resting in space; నిత్యమ్=always; వాయుః=wind; సర్వత్రగః=moving everywhere; మహాన్=mighty; తథా=so; సర్వాణి భూతాని=all beings; మత్స్థాని=abiding in me; ఇతి ఉపధారయ=understand thus"};
D["9.7"]={t:["సర్వభూతాని కౌన్తేయ ప్రకృతిం యాన్తి మామికామ్ |","కల్పక్షయే పునస్తాని కల్పాదౌ విసృజామ్యహమ్ ||"],mt:"ఓ కౌంతేయా! కల్పక్షయమున సర్వభూతములు నా ప్రకృతిని పొందును; కల్పాదిని నేను వాటిని మరల సృజింతును.",m:"O son of Kunti, at the end of an aeon all beings enter my nature; at the beginning of the next aeon I send them forth again.",w:"సర్వభూతాని=all beings; కౌన్తేయ=O son of Kunti; ప్రకృతిమ్ యాన్తి మామికామ్=enter my nature; కల్పక్షయే=at the end of an aeon; పునః తాని=again them; కల్పాదౌ=at the beginning of an aeon; విసృజామి=I send forth; అహమ్=I"};
D["9.8"]={t:["ప్రకృతిం స్వామవష్టభ్య విసృజామి పునః పునః |","భూతగ్రామమిమం కృత్స్నమవశం ప్రకృతేర్వశాత్ ||"],mt:"నా స్వప్రకృతిని ఆశ్రయించి, ప్రకృతి వశముచే అవశములైన ఈ భూతసమూహమునంతటిని మరల మరల సృజింతును.",m:"Taking hold of my own nature, I send forth again and again this entire multitude of beings, helpless under the sway of nature.",w:"ప్రకృతిమ్ స్వామ్=my own nature; అవష్టభ్య=taking hold of; విసృజామి=I send forth; పునః పునః=again and again; భూతగ్రామమ్ ఇమమ్ కృత్స్నమ్=this entire multitude of beings; అవశమ్=helpless; ప్రకృతేః వశాత్=under the sway of nature"};
D["9.9"]={t:["న చ మాం తాని కర్మాణి నిబధ్నన్తి ధనఞ్జయ |","ఉదాసీనవదాసీనమసక్తం తేషు కర్మసు ||"],mt:"ఓ ధనంజయా! ఆ కర్మలు నన్ను బంధింపవు; నేను ఆ కర్మలయందు ఆసక్తిలేనివాడనై ఉదాసీనునివలె ఉందును.",m:"Those actions do not bind me, O Dhananjaya, for I remain seated like one indifferent, unattached to those actions.",w:"న చ=and not; మామ్=me; తాని కర్మాణి=those actions; నిబధ్నన్తి=bind; ధనఞ్జయ=O Dhananjaya; ఉదాసీనవత్=like one indifferent; ఆసీనమ్=seated; అసక్తమ్=unattached; తేషు కర్మసు=in those actions"};
D["9.10"]={t:["మయాధ్యక్షేణ ప్రకృతిః సూయతే సచరాచరమ్ |","హేతునానేన కౌన్తేయ జగద్విపరివర్తతే ||"],mt:"ఓ కౌంతేయా! నా అధ్యక్షతచే ప్రకృతి చరాచరములను సృజించును; ఈ కారణముచే జగత్తు తిరుగుచున్నది.",m:"Under my supervision, O son of Kunti, nature brings forth the moving and the unmoving; for this reason the world revolves.",w:"మయా అధ్యక్షేణ=under my supervision; ప్రకృతిః=nature; సూయతే=brings forth; సచరాచరమ్=the moving and unmoving; హేతునా అనేన=for this reason; కౌన్తేయ=O son of Kunti; జగత్=the world; విపరివర్తతే=revolves"};
D["9.11"]={t:["అవజానన్తి మాం మూఢా మానుషీం తనుమాశ్రితమ్ |","పరం భావమజానన్తో మమ భూతమహేశ్వరమ్ ||"],mt:"నా పరమైన, భూతమహేశ్వరస్వరూపమును ఎరుగని మూఢులు మానుషరూపమును ఆశ్రయించిన నన్ను అవమానింతురు.",m:"The deluded disregard me when I assume a human form, not knowing my supreme nature as the great Lord of all beings.",w:"అవజానన్తి=disregard; మామ్=me; మూఢాః=the deluded; మానుషీమ్ తనుమ్=human form; ఆశ్రితమ్=having assumed; పరమ్ భావమ్=supreme nature; అజానన్తః=not knowing; మమ=my; భూతమహేశ్వరమ్=great Lord of beings"};
D["9.12"]={t:["మోఘాశా మోఘకర్మాణో మోఘజ్ఞానా విచేతసః |","రాక్షసీమాసురీం చైవ ప్రకృతిం మోహినీం శ్రితాః ||"],mt:"వ్యర్థమైన ఆశలు, వ్యర్థమైన కర్మలు, వ్యర్థమైన జ్ఞానము గలవారు, వివేకహీనులు, మోహపరచు రాక్షసీ ఆసురీ ప్రకృతిని ఆశ్రయించినవారు (ఇట్లు చేయుదురు).",m:"Of vain hopes, vain actions and vain knowledge, and devoid of discernment, they have resorted to the deluding nature of demons and asuras.",w:"మోఘాశాః=of vain hopes; మోఘకర్మాణః=of vain actions; మోఘజ్ఞానాః=of vain knowledge; విచేతసః=senseless; రాక్షసీమ్=demonic; ఆసురీమ్=asuric; చ ఏవ=and also; ప్రకృతిమ్=nature; మోహినీమ్=deluding; శ్రితాః=having resorted to"};
D["9.13"]={t:["మహాత్మానస్తు మాం పార్థ దైవీం ప్రకృతిమాశ్రితాః |","భజన్త్యనన్యమనసో జ్ఞాత్వా భూతాదిమవ్యయమ్ ||"],mt:"ఓ పార్థా! మహాత్ములు దైవీప్రకృతిని ఆశ్రయించి, నన్ను భూతములకు ఆదిగా, అవ్యయునిగా తెలిసి అనన్యమనస్కులై భజింతురు.",m:"But the great souls, O Partha, who rely on the divine nature, worship me with undivided minds, knowing me as the origin of beings and imperishable.",w:"మహాత్మానః=great souls; తు=but; మామ్=me; పార్థ=O Partha; దైవీమ్ ప్రకృతిమ్ ఆశ్రితాః=resorting to the divine nature; భజన్తి=worship; అనన్యమనసః=with undivided minds; జ్ఞాత్వా=knowing; భూతాదిమ్=the origin of beings; అవ్యయమ్=imperishable"};
D["9.14"]={t:["సతతం కీర్తయన్తో మాం యతన్తశ్చ దృఢవ్రతాః |","నమస్యన్తశ్చ మాం భక్త్యా నిత్యయుక్తా ఉపాసతే ||"],mt:"ఎల్లప్పుడును నన్ను కీర్తించుచు, దృఢవ్రతులై ప్రయత్నించుచు, భక్తితో నమస్కరించుచు, నిత్యయుక్తులై నన్ను ఉపాసింతురు.",m:"Always glorifying me, striving with firm vows, and bowing to me with devotion, ever steadfast, they worship me.",w:"సతతమ్=always; కీర్తయన్తః=glorifying; మామ్=me; యతన్తః చ=and striving; దృఢవ్రతాః=with firm vows; నమస్యన్తః చ=and bowing; మామ్ భక్త్యా=to me with devotion; నిత్యయుక్తాః=ever steadfast; ఉపాసతే=worship"};
D["9.15"]={t:["జ్ఞానయజ్ఞేన చాప్యన్యే యజన్తో మాముపాసతే |","ఏకత్వేన పృథక్త్వేన బహుధా విశ్వతోముఖమ్ ||"],mt:"మరికొందరు జ్ఞానయజ్ఞముచే యజించుచు, ఏకత్వభావముతోను, పృథక్త్వభావముతోను, అనేక విధములుగాను విశ్వతోముఖుడనైన నన్ను ఉపాసింతురు.",m:"Others, offering the sacrifice of knowledge, worship me as one, as distinct, and in many forms, facing every direction.",w:"జ్ఞానయజ్ఞేన చ అపి అన్యే=others also by the sacrifice of knowledge; యజన్తః=sacrificing; మామ్ ఉపాసతే=worship me; ఏకత్వేన=as one; పృథక్త్వేన=as distinct; బహుధా=in many ways; విశ్వతోముఖమ్=facing every direction"};
D["9.16"]={t:["అహం క్రతురహం యజ్ఞః స్వధాహమహమౌషధమ్ |","మన్త్రోఽహమహమేవాజ్యమహమగ్నిరహం హుతమ్ ||"],mt:"క్రతువు నేనే, యజ్ఞము నేనే, స్వధ నేనే, ఔషధము నేనే, మంత్రము నేనే, ఆజ్యము నేనే, అగ్ని నేనే, హోమము నేనే.",m:"I am the Vedic ritual, I am the sacrifice, I am the offering to the ancestors, I am the herb; I am the sacred chant, I am the ghee, I am the fire, and I am the offering.",w:"అహమ్ క్రతుః=I am the Vedic ritual; అహమ్ యజ్ఞః=I am the sacrifice; స్వధా అహమ్=I am the offering to ancestors; అహమ్ ఔషధమ్=I am the medicinal herb; మన్త్రః అహమ్=I am the sacred chant; అహమ్ ఏవ ఆజ్యమ్=I am the ghee; అహమ్ అగ్నిః=I am the fire; అహమ్ హుతమ్=I am the offering"};
D["9.17"]={t:["పితాహమస్య జగతో మాతా ధాతా పితామహః |","వేద్యం పవిత్రమోఙ్కార ఋక్సామ యజురేవ చ ||"],mt:"ఈ జగత్తునకు తండ్రిని, తల్లిని, ధాతను, పితామహుని నేనే; తెలియదగినదానిని, పవిత్రమైనదానిని, ఓంకారమును, ఋక్కు సామము యజుస్సు కూడా నేనే.",m:"I am the father of this world, the mother, the sustainer and the grandfather; the knowable, the purifier, the syllable Om, and the Rig, Sama and Yajur Vedas as well.",w:"పితా అహమ్ అస్య జగతః=I am the father of this world; మాతా=mother; ధాతా=sustainer; పితామహః=grandfather; వేద్యమ్=the knowable; పవిత్రమ్=the purifier; ఓఙ్కారః=the syllable Om; ఋక్ సామ యజుః=the Rig, Sama and Yajur Vedas; ఏవ చ=also"};


// Chapter 9 – shlokas 9.18 to 9.34 (completes chapter 9). Paste after your D object.
D["9.18"]={t:["గతిర్భర్తా ప్రభుః సాక్షీ నివాసః శరణం సుహృత్ |","ప్రభవః ప్రలయః స్థానం నిధానం బీజమవ్యయమ్ ||"],mt:"గతియు, భర్తయు, ప్రభువును, సాక్షియు, నివాసమును, శరణమును, సుహృత్తును, ఉత్పత్తియు, ప్రళయమును, ఆధారమును, నిధానమును, అవ్యయ బీజమును నేనే.",m:"I am the goal, the supporter, the lord, the witness, the abode, the refuge and the friend; the origin, the dissolution, the foundation, the storehouse and the imperishable seed.",w:"గతిః=goal; భర్తా=supporter; ప్రభుః=lord; సాక్షీ=witness; నివాసః=abode; శరణమ్=refuge; సుహృత్=friend; ప్రభవః=origin; ప్రలయః=dissolution; స్థానమ్=foundation; నిధానమ్=storehouse; బీజమ్ అవ్యయమ్=imperishable seed"};
D["9.19"]={t:["తపామ్యహమహం వర్షం నిగృహ్ణామ్యుత్సృజామి చ |","అమృతం చైవ మృత్యుశ్చ సదసచ్చాహమర్జున ||"],mt:"ఓ అర్జునా! నేను తపింపజేయుదును, వర్షమును ఆపుదును, కురిపించుదును; అమృతమును, మృత్యువును, సత్తును, అసత్తును నేనే.",m:"I give heat, I withhold and send forth the rain; I am immortality and also death, and I am both being and non-being, O Arjuna.",w:"తపామి=I give heat; అహమ్=I; వర్షమ్=rain; నిగృహ్ణామి=I withhold; ఉత్సృజామి చ=and send forth; అమృతమ్ చ ఏవ=immortality also; మృత్యుః చ=and death; సత్=being; అసత్ చ=and non-being; అహమ్=I; అర్జున=O Arjuna"};
D["9.20"]={t:["త్రైవిద్యా మాం సోమపాః పూతపాపా యజ్ఞైరిష్ట్వా స్వర్గతిం ప్రార్థయన్తే |","తే పుణ్యమాసాద్య సురేన్ద్రలోకమశ్నన్తి దివ్యాన్దివి దేవభోగాన్ ||"],mt:"త్రివేదవిదులు, సోమపానము చేసినవారు, పాపములు తొలగినవారు యజ్ఞములచే నన్ను పూజించి స్వర్గగతిని ప్రార్థింతురు; వారు పుణ్యమైన ఇంద్రలోకమును పొంది స్వర్గమున దివ్యభోగములను అనుభవింతురు.",m:"Knowers of the three Vedas, drinkers of soma, purified of sin, worship me with sacrifices and pray for passage to heaven; reaching the holy world of Indra, they enjoy the divine pleasures of the gods in heaven.",w:"త్రైవిద్యాః=knowers of the three Vedas; మామ్=me; సోమపాః=drinkers of soma; పూతపాపాః=purified of sin; యజ్ఞైః ఇష్ట్వా=worshipping with sacrifices; స్వర్గతిమ్=passage to heaven; ప్రార్థయన్తే=pray for; తే=they; పుణ్యమ్ ఆసాద్య=attaining the meritorious; సురేన్ద్రలోకమ్=the world of Indra; అశ్నన్తి=enjoy; దివ్యాన్ దేవభోగాన్ దివి=divine pleasures of the gods in heaven"};
D["9.21"]={t:["తే తం భుక్త్వా స్వర్గలోకం విశాలం క్షీణే పుణ్యే మర్త్యలోకం విశన్తి |","ఏవం త్రయీధర్మమనుప్రపన్నా గతాగతం కామకామా లభన్తే ||"],mt:"వారు ఆ విశాలమైన స్వర్గలోకమును అనుభవించి, పుణ్యము క్షీణింపగా మర్త్యలోకమును ప్రవేశింతురు; ఇట్లు త్రయీధర్మమును అనుసరించి కామములను కోరువారు గమనాగమనములను పొందుదురు.",m:"Having enjoyed the vast heavenly world, they enter the mortal world when their merit is exhausted. Thus, following the Vedic duties and desiring pleasures, they go and come.",w:"తే=they; తమ్ భుక్త్వా=having enjoyed that; స్వర్గలోకమ్ విశాలమ్=the vast heavenly world; క్షీణే పుణ్యే=when merit is exhausted; మర్త్యలోకమ్=the mortal world; విశన్తి=enter; ఏవమ్=thus; త్రయీధర్మమ్=the Vedic duties; అనుప్రపన్నాః=following; గతాగతమ్=going and coming; కామకామాః=desirers of desires; లభన్తే=obtain"};
D["9.22"]={t:["అనన్యాశ్చిన్తయన్తో మాం యే జనాః పర్యుపాసతే |","తేషాం నిత్యాభియుక్తానాం యోగక్షేమం వహామ్యహమ్ ||"],mt:"అనన్యులై నన్ను చింతించుచు ఉపాసించు జనులకు, నిత్యయుక్తులైన వారికి యోగక్షేమమును నేను వహింతును.",m:"For those people who worship me, meditating on me with undivided mind, and who are ever steadfast, I carry what they lack and preserve what they have.",w:"అనన్యాః=undistracted; చిన్తయన్తః=meditating; మామ్=on me; యే జనాః=those people who; పర్యుపాసతే=worship; తేషామ్=of them; నిత్యాభియుక్తానామ్=of the ever-steadfast; యోగక్షేమమ్=their gain and security; వహామి అహమ్=I carry"};
D["9.23"]={t:["యేఽప్యన్యదేవతా భక్తా యజన్తే శ్రద్ధయాన్వితాః |","తేఽపి మామేవ కౌన్తేయ యజన్త్యవిధిపూర్వకమ్ ||"],mt:"ఓ కౌంతేయా! శ్రద్ధతో కూడి ఇతర దేవతలను భక్తితో పూజించువారు కూడా నన్నే పూజింతురు, కాని అవిధిపూర్వకముగా.",m:"Even those devotees who worship other deities with faith worship me alone, O son of Kunti, though in an improper way.",w:"యే అపి=even those who; అన్యదేవతాః భక్తాః=devotees of other deities; యజన్తే=worship; శ్రద్ధయా అన్వితాః=endowed with faith; తే అపి=they also; మామ్ ఏవ=me alone; కౌన్తేయ=O son of Kunti; యజన్తి=worship; అవిధిపూర్వకమ్=in an improper way"};
D["9.24"]={t:["అహం హి సర్వయజ్ఞానాం భోక్తా చ ప్రభురేవ చ |","న తు మామభిజానన్తి తత్త్వేనాతశ్చ్యవన్తి తే ||"],mt:"సర్వయజ్ఞములకు భోక్తను ప్రభువును నేనే; కాని వారు నన్ను తత్త్వముగా ఎరుగరు, అందువలన పతనమగుదురు.",m:"I am the enjoyer and also the lord of all sacrifices; but they do not know me in truth, and therefore they fall.",w:"అహమ్ హి=I indeed; సర్వయజ్ఞానామ్=of all sacrifices; భోక్తా=enjoyer; చ=and; ప్రభుః ఏవ చ=also the lord; న తు మామ్ అభిజానన్తి తత్త్వేన=but they do not know me in truth; అతః=therefore; చ్యవన్తి=fall; తే=they"};
D["9.25"]={t:["యాన్తి దేవవ్రతా దేవాన్పితౄన్యాన్తి పితృవ్రతాః |","భూతాని యాన్తి భూతేజ్యా యాన్తి మద్యాజినోఽపి మామ్ ||"],mt:"దేవవ్రతులు దేవతలను పొందుదురు, పితృవ్రతులు పితరులను పొందుదురు, భూతారాధకులు భూతములను పొందుదురు, నన్ను పూజించువారు నన్నే పొందుదురు.",m:"Devotees of the gods go to the gods, devotees of the ancestors go to the ancestors, worshippers of spirits go to the spirits, and my worshippers come to me.",w:"యాన్తి=go; దేవవ్రతాః=devotees of the gods; దేవాన్=to the gods; పితౄన్=to the ancestors; పితృవ్రతాః=devotees of the ancestors; భూతాని=to spirits; భూతేజ్యాః=worshippers of spirits; మద్యాజినః అపి మామ్=my worshippers come to me"};
D["9.26"]={t:["పత్రం పుష్పం ఫలం తోయం యో మే భక్త్యా ప్రయచ్ఛతి |","తదహం భక్త్యుపహృతమశ్నామి ప్రయతాత్మనః ||"],mt:"ఎవడు నాకు భక్తితో పత్రమును, పుష్పమును, ఫలమును, జలమును సమర్పించునో, శుద్ధాత్ముడైన అతడు భక్తితో అర్పించిన దానిని నేను స్వీకరింతును.",m:"Whoever offers me with devotion a leaf, a flower, a fruit or water, I accept that offering made with devotion by the pure-hearted.",w:"పత్రమ్=leaf; పుష్పమ్=flower; ఫలమ్=fruit; తోయమ్=water; యః=who; మే=to me; భక్త్యా=with devotion; ప్రయచ్ఛతి=offers; తత్=that; అహమ్=I; భక్త్యుపహృతమ్=offered with devotion; అశ్నామి=accept; ప్రయతాత్మనః=of the pure-hearted"};
D["9.27"]={t:["యత్కరోషి యదశ్నాసి యజ్జుహోషి దదాసి యత్ |","యత్తపస్యసి కౌన్తేయ తత్కురుష్వ మదర్పణమ్ ||"],mt:"ఓ కౌంతేయా! నీవు ఏది చేయుదువో, ఏది తిందువో, ఏది హోమము చేయుదువో, ఏది దానము చేయుదువో, ఏ తపస్సు చేయుదువో దానిని నాకు అర్పణముగా చేయుము.",m:"Whatever you do, whatever you eat, whatever you offer in sacrifice, whatever you give, whatever austerity you perform, O son of Kunti, do that as an offering to me.",w:"యత్ కరోషి=whatever you do; యత్ అశ్నాసి=whatever you eat; యత్ జుహోషి=whatever you offer; దదాసి యత్=whatever you give; యత్ తపస్యసి=whatever austerity you perform; కౌన్తేయ=O son of Kunti; తత్ కురుష్వ మదర్పణమ్=make that an offering to me"};
D["9.28"]={t:["శుభాశుభఫలైరేవం మోక్ష్యసే కర్మబన్ధనైః |","సన్న్యాసయోగయుక్తాత్మా విముక్తో మాముపైష్యసి ||"],mt:"ఇట్లు శుభాశుభఫలములతో కూడిన కర్మబంధనములనుండి విముక్తుడవగుదువు; సన్న్యాసయోగయుక్తాత్ముడవై విముక్తుడవై నన్ను పొందెదవు.",m:"Thus you will be freed from the bonds of action that bear good and bad fruits; with your mind steadfast in the yoga of renunciation, liberated, you will come to me.",w:"శుభాశుభఫలైః=bearing good and bad fruits; ఏవమ్=thus; మోక్ష్యసే=you will be freed; కర్మబన్ధనైః=from the bonds of action; సన్న్యాసయోగయుక్తాత్మా=with a mind steadfast in the yoga of renunciation; విముక్తః=liberated; మామ్ ఉపైష్యసి=you will come to me"};
D["9.29"]={t:["సమోఽహం సర్వభూతేషు న మే ద్వేష్యోఽస్తి న ప్రియః |","యే భజన్తి తు మాం భక్త్యా మయి తే తేషు చాప్యహమ్ ||"],mt:"నేను సర్వభూతములయందు సమముగా ఉందును; నాకు ద్వేషింపదగినవాడు లేడు, ప్రియుడు లేడు; భక్తితో నన్ను భజించువారు నాయందును, నేను వారియందును ఉందుము.",m:"I am equal toward all beings; none is hateful or dear to me. But those who worship me with devotion are in me, and I am also in them.",w:"సమః అహమ్=I am equal; సర్వభూతేషు=toward all beings; న మే ద్వేష్యః అస్తి=none is hateful to me; న ప్రియః=nor dear; యే భజన్తి తు మామ్ భక్త్యా=but those who worship me with devotion; మయి తే=they are in me; తేషు చ అపి అహమ్=and I too am in them"};
D["9.30"]={t:["అపి చేత్సుదురాచారో భజతే మామనన్యభాక్ |","సాధురేవ స మన్తవ్యః సమ్యగ్వ్యవసితో హి సః ||"],mt:"మిక్కిలి దురాచారుడైనను అనన్యభక్తితో నన్ను భజించినచో అతడు సాధువుగానే భావింపదగినవాడు; ఎందుకనగా అతడు చక్కగా నిశ్చయించినవాడు.",m:"Even if one of very bad conduct worships me with undivided devotion, that person should be regarded as righteous, for he has rightly resolved.",w:"అపి చేత్=even if; సుదురాచారః=one of very bad conduct; భజతే మామ్ అనన్యభాక్=worships me with undivided devotion; సాధుః ఏవ సః మన్తవ్యః=he should be regarded as righteous; సమ్యక్ వ్యవసితః హి సః=for he has rightly resolved"};
D["9.31"]={t:["క్షిప్రం భవతి ధర్మాత్మా శశ్వచ్ఛాన్తిం నిగచ్ఛతి |","కౌన్తేయ ప్రతిజానీహి న మే భక్తః ప్రణశ్యతి ||"],mt:"అతడు శీఘ్రముగా ధర్మాత్ముడగును, శాశ్వతశాంతిని పొందును; ఓ కౌంతేయా! నా భక్తుడు నశింపడని ప్రతిజ్ఞ చేయుము.",m:"Quickly he becomes righteous and attains lasting peace. O son of Kunti, declare firmly that my devotee never perishes.",w:"క్షిప్రమ్=quickly; భవతి ధర్మాత్మా=becomes righteous; శశ్వత్ శాన్తిమ్=lasting peace; నిగచ్ఛతి=attains; కౌన్తేయ=O son of Kunti; ప్రతిజానీహి=declare firmly; న మే భక్తః ప్రణశ్యతి=my devotee never perishes"};
D["9.32"]={t:["మాం హి పార్థ వ్యపాశ్రిత్య యేఽపి స్యుః పాపయోనయః |","స్త్రియో వైశ్యాస్తథా శూద్రాస్తేఽపి యాన్తి పరాం గతిమ్ ||"],mt:"ఓ పార్థా! స్త్రీలు, వైశ్యులు, శూద్రులు వంటి తక్కువ జన్మ గలవారు కూడా నన్ను ఆశ్రయించి పరమగతిని పొందుదురు.",m:"O Partha, even those of humble birth, such as women, merchants and labourers, attain the supreme goal by taking refuge in me.",w:"మామ్ హి=me indeed; పార్థ=O Partha; వ్యపాశ్రిత్య=taking refuge; యే అపి స్యుః పాపయోనయః=even those who may be of humble birth; స్త్రియః=women; వైశ్యాః=merchants; తథా శూద్రాః=and labourers; తే అపి యాన్తి పరామ్ గతిమ్=they also attain the supreme goal"};
D["9.33"]={t:["కిం పునర్బ్రాహ్మణాః పుణ్యా భక్తా రాజర్షయస్తథా |","అనిత్యమసుఖం లోకమిమం ప్రాప్య భజస్వ మామ్ ||"],mt:"ఇక పుణ్యాత్ములైన బ్రాహ్మణులు, భక్తులైన రాజర్షుల విషయమై చెప్పనేల? అనిత్యమైన, సుఖరహితమైన ఈ లోకమును పొందిన నీవు నన్ను భజింపుము.",m:"How much more, then, the virtuous brahmins and devoted royal sages! Having come into this impermanent and joyless world, worship me.",w:"కిమ్ పునః=how much more; బ్రాహ్మణాః పుణ్యాః=virtuous brahmins; భక్తాః=devotees; రాజర్షయః తథా=and royal sages; అనిత్యమ్=impermanent; అసుఖమ్=joyless; లోకమ్ ఇమమ్ ప్రాప్య=having come to this world; భజస్వ మామ్=worship me"};
D["9.34"]={t:["మన్మనా భవ మద్భక్తో మద్యాజీ మాం నమస్కురు |","మామేవైష్యసి యుక్త్వైవమాత్మానం మత్పరాయణః ||"],mt:"నాయందే మనస్సు నిలుపుము, నా భక్తుడవు కమ్ము, నన్ను పూజింపుము, నాకు నమస్కరింపుము; ఇట్లు ఆత్మను నాయందు యోజించి, నన్నే పరమగతిగా భావించి నన్నే పొందెదవు.",m:"Fix your mind on me, be my devotee, worship me, and bow to me. Thus uniting yourself with me and holding me as your supreme goal, you will come to me alone.",w:"మన్మనాః భవ=fix your mind on me; మద్భక్తః=my devotee; మద్యాజీ=my worshipper; మామ్ నమస్కురు=bow to me; మామ్ ఏవ ఏష్యసి=you will come to me alone; యుక్త్వా ఏవమ్ ఆత్మానమ్=thus uniting the self; మత్పరాయణః=with me as the supreme goal"};


// Chapter 10 – shlokas 10.1 to 10.14. Paste after your D object.
D["10.1"]={t:["శ్రీభగవానువాచ |","భూయ ఏవ మహాబాహో శృణు మే పరమం వచః |","యత్తేఽహం ప్రీయమాణాయ వక్ష్యామి హితకామ్యయా ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ మహాబాహో! నేను నీ హితమును కోరి, ప్రీతిపొందుచున్న నీకు చెప్పబోవు నా పరమవచనమును మరల వినుము.",m:"The Blessed Lord said: Again, O mighty-armed one, hear my supreme word, which I shall speak to you, who are delighted, out of desire for your welfare.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; భూయః ఏవ=again; మహాబాహో=O mighty-armed; శృణు=hear; మే=my; పరమమ్ వచః=supreme word; యత్=which; తే=to you; అహమ్=I; ప్రీయమాణాయ=to you who are delighted; వక్ష్యామి=I shall speak; హితకామ్యయా=out of desire for your welfare"};
D["10.2"]={t:["న మే విదుః సురగణాః ప్రభవం న మహర్షయః |","అహమాదిర్హి దేవానాం మహర్షీణాం చ సర్వశః ||"],mt:"దేవగణములు గాని మహర్షులు గాని నా ఉత్పత్తిని ఎరుగరు; నేను అన్ని విధముల దేవతలకును మహర్షులకును ఆదిని.",m:"Neither the hosts of gods nor the great sages know my origin; for I am the source of the gods and the great sages in every way.",w:"న మే విదుః=do not know my; సురగణాః=hosts of gods; ప్రభవమ్=origin; న మహర్షయః=nor the great sages; అహమ్ ఆదిః హి=I am indeed the source; దేవానామ్=of the gods; మహర్షీణామ్ చ=and of the great sages; సర్వశః=in every way"};
D["10.3"]={t:["యో మామజమనాదిం చ వేత్తి లోకమహేశ్వరమ్ |","అసమ్మూఢః స మర్త్యేషు సర్వపాపైః ప్రముచ్యతే ||"],mt:"నన్ను జన్మరహితునిగా, అనాదిగా, లోకమహేశ్వరునిగా ఎరిగినవాడు మనుష్యులలో మోహరహితుడై సర్వపాపములనుండి విముక్తుడగును.",m:"One who knows me as unborn, beginningless and the great Lord of the worlds is undeluded among mortals and is freed from all sins.",w:"యః మామ్ అజమ్=who knows me as unborn; అనాదిమ్ చ=and beginningless; వేత్తి=knows; లోకమహేశ్వరమ్=great Lord of the worlds; అసమ్మూఢః=undeluded; సః=he; మర్త్యేషు=among mortals; సర్వపాపైః ప్రముచ్యతే=is freed from all sins"};
D["10.4"]={t:["బుద్ధిర్జ్ఞానమసమ్మోహః క్షమా సత్యం దమః శమః |","సుఖం దుఃఖం భవోఽభావో భయం చాభయమేవ చ ||"],mt:"బుద్ధి, జ్ఞానము, అసమ్మోహము, క్షమ, సత్యము, దమము, శమము, సుఖము, దుఃఖము, ఉత్పత్తి, లయము, భయము, అభయము... (10.5 లో కొనసాగును)",m:"Intellect, knowledge, freedom from delusion, forgiveness, truth, self-control, tranquillity, pleasure, pain, birth, death, fear and fearlessness... (continues in 10.5)",w:"బుద్ధిః=intellect; జ్ఞానమ్=knowledge; అసమ్మోహః=freedom from delusion; క్షమా=forgiveness; సత్యమ్=truth; దమః=self-control; శమః=tranquillity; సుఖమ్=pleasure; దుఃఖమ్=pain; భవః=birth; అభావః=death; భయమ్=fear; చ అభయమ్ ఏవ చ=and fearlessness"};
D["10.5"]={t:["అహింసా సమతా తుష్టిస్తపో దానం యశోఽయశః |","భవన్తి భావా భూతానాం మత్త ఏవ పృథగ్విధాః ||"],mt:"...అహింస, సమత, సంతుష్టి, తపస్సు, దానము, కీర్తి, అపకీర్తి — ప్రాణులకు ఈ వివిధ భావములు నానుండియే కలుగును.",m:"...non-violence, equanimity, contentment, austerity, charity, fame and infamy: these various states of beings arise from me alone.",w:"అహింసా=non-violence; సమతా=equanimity; తుష్టిః=contentment; తపః=austerity; దానమ్=charity; యశః=fame; అయశః=infamy; భవన్తి భావాః=states arise; భూతానామ్=of beings; మత్తః ఏవ=from me alone; పృథగ్విధాః=of various kinds"};
D["10.6"]={t:["మహర్షయః సప్త పూర్వే చత్వారో మనవస్తథా |","మద్భావా మానసా జాతా యేషాం లోక ఇమాః ప్రజాః ||"],mt:"పూర్వపు సప్తమహర్షులు, నలుగురు మనువులు నా భావముతో కూడి నా సంకల్పమునుండి పుట్టినవారు; వారినుండియే లోకమున ఈ ప్రజలు కలిగిరి.",m:"The seven great sages of old and the four Manus, partaking of my nature, were born of my mind; from them came all these people in the world.",w:"మహర్షయః సప్త=the seven great sages; పూర్వే=ancient; చత్వారః మనవః=the four Manus; తథా=and; మద్భావాః=of my nature; మానసాః జాతాః=born of my mind; యేషామ్=from whom; లోకే=in the world; ఇమాః ప్రజాః=these people"};
D["10.7"]={t:["ఏతాం విభూతిం యోగం చ మమ యో వేత్తి తత్త్వతః |","సోఽవికమ్పేన యోగేన యుజ్యతే నాత్ర సంశయః ||"],mt:"నా ఈ విభూతిని, యోగశక్తిని తత్త్వముగా ఎరిగినవాడు నిశ్చలమైన యోగముతో యుక్తుడగును; ఇందు సంశయము లేదు.",m:"One who knows in truth this glory and yogic power of mine is united with me through unwavering yoga; there is no doubt about this.",w:"ఏతామ్ విభూతిమ్=this glory; యోగమ్ చ=and power; మమ=my; యః వేత్తి తత్త్వతః=who knows in truth; సః=he; అవికమ్పేన యోగేన యుజ్యతే=is united by unwavering yoga; న అత్ర సంశయః=no doubt in this"};
D["10.8"]={t:["అహం సర్వస్య ప్రభవో మత్తః సర్వం ప్రవర్తతే |","ఇతి మత్వా భజన్తే మాం బుధా భావసమన్వితాః ||"],mt:"నేను సర్వమునకు ఉత్పత్తిని, నానుండియే సర్వము ప్రవర్తించుచున్నది — ఇట్లు తలచి జ్ఞానులు భావసమన్వితులై నన్ను భజింతురు.",m:"I am the origin of everything, and everything proceeds from me. Thinking thus, the wise, endowed with devotion, worship me.",w:"అహమ్=I; సర్వస్య ప్రభవః=origin of everything; మత్తః సర్వమ్ ప్రవర్తతే=everything proceeds from me; ఇతి మత్వా=thinking thus; భజన్తే=worship; మామ్=me; బుధాః=the wise; భావసమన్వితాః=endowed with devotion"};
D["10.9"]={t:["మచ్చిత్తా మద్గతప్రాణా బోధయన్తః పరస్పరమ్ |","కథయన్తశ్చ మాం నిత్యం తుష్యన్తి చ రమన్తి చ ||"],mt:"నాయందే చిత్తము, నాయందే ప్రాణము గలవారై, పరస్పరము బోధించుకొనుచు, నన్ను ఎల్లప్పుడును కీర్తించుచు సంతుష్టులై రమింతురు.",m:"With minds fixed on me and lives devoted to me, enlightening one another and always speaking of me, they are content and delighted.",w:"మచ్చిత్తాః=with minds on me; మద్గతప్రాణాః=with lives devoted to me; బోధయన్తః పరస్పరమ్=enlightening one another; కథయన్తః చ=and speaking; మామ్=of me; నిత్యమ్=always; తుష్యన్తి=are content; రమన్తి చ=and delight"};
D["10.10"]={t:["తేషాం సతతయుక్తానాం భజతాం ప్రీతిపూర్వకమ్ |","దదామి బుద్ధియోగం తం యేన మాముపయాన్తి తే ||"],mt:"ఎల్లప్పుడును యుక్తులై ప్రీతితో భజించు వారికి నేను ఆ బుద్ధియోగమును ఇచ్చెదను, దానిచే వారు నన్ను పొందుదురు.",m:"To those who are constantly devoted and worship me with love, I give that yoga of wisdom by which they come to me.",w:"తేషామ్=to them; సతతయుక్తానామ్=who are constantly steadfast; భజతామ్=who worship; ప్రీతిపూర్వకమ్=with love; దదామి=I give; బుద్ధియోగమ్ తమ్=that yoga of wisdom; యేన=by which; మామ్ ఉపయాన్తి తే=they come to me"};
D["10.11"]={t:["తేషామేవానుకమ్పార్థమహమజ్ఞానజం తమః |","నాశయామ్యాత్మభావస్థో జ్ఞానదీపేన భాస్వతా ||"],mt:"వారిపై కరుణతో నేను వారి హృదయమున నిలిచి, ప్రకాశించు జ్ఞానదీపముచే అజ్ఞానజనితమైన చీకటిని నశింపజేయుదును.",m:"Out of compassion for them alone, abiding in their hearts, I destroy the darkness born of ignorance with the shining lamp of knowledge.",w:"తేషామ్ ఏవ=for them alone; అనుకమ్పార్థమ్=out of compassion; అహమ్=I; అజ్ఞానజమ్=born of ignorance; తమః=darkness; నాశయామి=I destroy; ఆత్మభావస్థః=abiding in their hearts; జ్ఞానదీపేన భాస్వతా=with the shining lamp of knowledge"};
D["10.12"]={t:["అర్జున ఉవాచ |","పరం బ్రహ్మ పరం ధామ పవిత్రం పరమం భవాన్ |","పురుషం శాశ్వతం దివ్యమాదిదేవమజం విభుమ్ ||"],mt:"అర్జునుడు పలికెను: నీవు పరబ్రహ్మవు, పరమధామమువు, పరమపవిత్రుడవు; శాశ్వతుడవు, దివ్యుడవు, ఆదిదేవుడవు, జన్మరహితుడవు, విభుడవైన పురుషుడవు... (10.13 లో కొనసాగును)",m:"Arjuna said: You are the supreme Brahman, the supreme abode, the supreme purifier; the eternal, divine Person, the primal God, unborn and all-pervading... (continues in 10.13)",w:"అర్జునః ఉవాచ=Arjuna said; పరమ్ బ్రహ్మ=supreme Brahman; పరమ్ ధామ=supreme abode; పవిత్రమ్ పరమమ్=supreme purifier; భవాన్=you; పురుషమ్=Person; శాశ్వతమ్=eternal; దివ్యమ్=divine; ఆదిదేవమ్=primal God; అజమ్=unborn; విభుమ్=all-pervading"};
D["10.13"]={t:["ఆహుస్త్వామృషయః సర్వే దేవర్షిర్నారదస్తథా |","అసితో దేవలో వ్యాసః స్వయం చైవ బ్రవీషి మే ||"],mt:"...ఋషులందరును, దేవర్షి నారదుడు, అసితుడు, దేవలుడు, వ్యాసుడు నిన్ను ఇట్లు చెప్పిరి; నీవు స్వయముగా కూడా నాకు చెప్పుచున్నావు.",m:"...so all the sages declare you, as do the divine sage Narada, Asita, Devala and Vyasa; and you yourself also tell me so.",w:"ఆహుః=declare; త్వామ్=you; ఋషయః సర్వే=all the sages; దేవర్షిః నారదః=the divine sage Narada; తథా=also; అసితః=Asita; దేవలః=Devala; వ్యాసః=Vyasa; స్వయమ్ చ ఏవ=and you yourself; బ్రవీషి మే=you tell me"};
D["10.14"]={t:["సర్వమేతదృతం మన్యే యన్మాం వదసి కేశవ |","న హి తే భగవన్వ్యక్తిం విదుర్దేవా న దానవాః ||"],mt:"ఓ కేశవా! నీవు నాకు చెప్పుచున్న ఇదంతయు సత్యమని నేను తలచుచున్నాను; ఓ భగవానుడా! దేవతలును దానవులును నీ స్వరూపమును ఎరుగరు.",m:"O Keshava, I consider all that you tell me to be true. O Lord, neither the gods nor the demons know your manifestation.",w:"సర్వమ్ ఏతత్ ఋతమ్=all this as true; మన్యే=I consider; యత్ మామ్ వదసి=what you tell me; కేశవ=O Keshava; న హి తే భగవన్ వ్యక్తిమ్=indeed not your manifestation, O Lord; విదుః దేవాః=the gods know; న దానవాః=nor the demons"};

// Chapter 10 – shlokas 10.15 to 10.28. Paste after your D object.
D["10.15"]={t:["స్వయమేవాత్మనాత్మానం వేత్థ త్వం పురుషోత్తమ |","భూతభావన భూతేశ దేవదేవ జగత్పతే ||"],mt:"ఓ పురుషోత్తమా! భూతభావనా! భూతేశా! దేవదేవా! జగత్పతీ! నీవు నిన్ను నీవే నీ ద్వారా ఎరుగుదువు.",m:"You alone know yourself by yourself, O Supreme Person, source of beings, Lord of beings, God of gods, Lord of the universe.",w:"స్వయమ్ ఏవ=by yourself alone; ఆత్మనా=through yourself; ఆత్మానమ్=yourself; వేత్థ=know; త్వమ్=you; పురుషోత్తమ=O Supreme Person; భూతభావన=source of beings; భూతేశ=Lord of beings; దేవదేవ=God of gods; జగత్పతే=Lord of the universe"};
D["10.16"]={t:["వక్తుమర్హస్యశేషేణ దివ్యా హ్యాత్మవిభూతయః |","యాభిర్విభూతిభిర్లోకానిమాంస్త్వం వ్యాప్య తిష్ఠసి ||"],mt:"నీవు ఏ విభూతులచే ఈ లోకములను వ్యాపించి ఉన్నావో, నీ ఆ దివ్యమైన ఆత్మవిభూతులను నిశ్శేషముగా చెప్పుటకు నీవే తగినవాడవు.",m:"You alone are fit to tell fully of your divine glories, by which you remain pervading all these worlds.",w:"వక్తుమ్ అర్హసి=you are fit to tell; అశేషేణ=fully; దివ్యాః=divine; హి=indeed; ఆత్మవిభూతయః=your own glories; యాభిః విభూతిభిః=by which glories; లోకాన్ ఇమాన్=these worlds; త్వమ్ వ్యాప్య తిష్ఠసి=you remain pervading"};
