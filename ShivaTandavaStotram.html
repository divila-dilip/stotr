<style>
:root{--pri:#0B57D0;--bg:#F1F3F4;--paper:#FFFFFF;--tx:#1E1E1E;--tx2:#5E5E5E;--neu:#E8EAED;--err:#D32F2F;--div:#E0E0E0;--onpri:#fff;--hov:#0A47A6;--bd:#BDBDBD;--saf:#E65100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,sans-serif}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);box-shadow:0 1px 0 var(--div)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--div)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:6}
header h1{font-size:18px;font-weight:600;margin:0;line-height:1.3;flex:1;font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif}
button,input{font:500 14px Inter,sans-serif}
button{background:var(--pri);color:var(--onpri);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:hover{background:var(--hov)}
button:disabled{background:var(--neu);color:#BDBDBD;box-shadow:none;cursor:default}
button.sec{background:var(--neu);color:var(--tx)}
button.sec:hover{background:var(--div)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg{display:flex;background:var(--neu);border-radius:20px;padding:2px}
.seg button{background:none;color:var(--tx);box-shadow:none;padding:6px 14px;font-family:"Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
#jump{width:130px;padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--paper);color:var(--tx)}
#jump:focus{border-color:var(--pri);outline:0}
#jump.bad{border-color:var(--err);color:var(--err)}
main{padding:16px 16px 24px;max-width:900px;margin:0 auto}

.card{background:var(--paper);border:1px solid var(--div);border-radius:12px;padding:8px 24px}

.ctl button{min-width:110px}
#pos{text-align:center}

html{overflow-x:hidden}.sl,.mn{word-break:break-word;max-width:100%}
@media(prefers-reduced-motion:reduce){.st.flash{animation:none}}
/* v2.2 realistic page turn */
#stage{position:relative;perspective:2400px;perspective-origin:50% 40%}
#slide{box-shadow:1px 1px 0 var(--paper),2px 2px 0 var(--div),3px 3px 0 var(--paper),4px 4px 0 var(--div),6px 8px 14px rgba(0,0,0,.12)}
.leaf{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none;z-index:3}
.strip{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{transform:rotateY(180deg);background:var(--paper) linear-gradient(90deg,rgba(0,0,0,.05),transparent 40%)}
.pg{position:absolute;top:0;margin:0}
.ghost{background:transparent;border-color:transparent;opacity:.08}
.sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.spine::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 16px);pointer-events:none}
.cast{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:2}
main{touch-action:pan-y}
#ft{margin:32px 0 8px;text-align:center;color:var(--tx2);font-size:12px}#ft b{color:var(--tx)}#ft button{margin-top:8px}
.inf{background:none;color:var(--pri);box-shadow:none;padding:0 4px;margin-left:4px;font-size:17px;line-height:1;border-radius:50%;vertical-align:middle}.inf:hover{background:var(--neu)}
.mn{display:none;margin:6px auto 0;max-width:62ch;font-size:15px;line-height:1.85;color:var(--tx2)}.st.open .mn{display:block}
.chips .mb{margin-left:8px}
@media (max-width:640px){.bar{flex-wrap:nowrap;padding:4px 10px}#info{display:none}.chips{flex-wrap:nowrap;overflow-x:auto;width:100%;gap:5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}.chips span{display:none}.chips button{flex:none;white-space:nowrap;padding:3px 10px;font-size:12px}.chips .mb{order:-1;margin-left:0}}
</style>

var MH={"0": "जिनकी जटाओं के वन से बहती गंगा की धारा से कंठ-स्थल पवित्र है, गले में विशाल सर्पमाला लटक रही है, और जिन्होंने डमरू के डम-डम नाद के साथ प्रचंड तांडव किया — वे शिव हमारा कल्याण करें।", "1": "जटारूपी कड़ाह में घूमती गंगा की चंचल लहरों से शोभित मस्तक वाले, ललाट पर धधकती अग्नि वाले, बालचंद्र को शिखा में धारण करने वाले शिव में मेरी प्रीति हर क्षण बनी रहे।", "2": "पर्वतराज की पुत्री पार्वती के विलास के सखा, जिनके मन में दिशाओं के समस्त जीवों का आनंद समाया है, जिनकी कृपादृष्टि से भारी विपत्तियाँ दूर होती हैं — उन दिगम्बर शिव में मेरा मन आनंद पाए।", "3": "जटाओं के सर्पों के फनों की मणियों की पीली आभा से दिशारूपी वधुओं के मुखों पर कुंकुम-सा लेप करने वाले, मदमस्त हाथी की खाल का उत्तरीय ओढ़े भूतनाथ में मेरा मन अद्भुत आनंद धारण करे।", "4": "इन्द्र आदि समस्त देवताओं के शीश-पुष्पों की धूल से धूसर चरणपीठ वाले, नागराज की माला से जटाजूट बाँधे चंद्रशेखर शिव चिरकाल तक मुझे समृद्धि दें।", "5": "जिन्होंने ललाट की अग्नि की चिंगारियों से कामदेव को भस्म किया, जिन्हें इन्द्र आदि देवता नमन करते हैं, चंद्रकला से शोभित मस्तक वाले, जटाधारी महाकपाली शिव हमें सिद्धि प्रदान करें।", "6": "जिन्होंने विकराल ललाट की धधकती अग्नि में कामदेव की आहुति दी, और जो पार्वती के वक्ष पर चित्र-रचना करने वाले अद्वितीय शिल्पी हैं, उन त्रिलोचन शिव में मेरी प्रीति हो।", "7": "नवीन मेघों से घिरी अमावस्या की अँधेरी रात जैसे कंठ वाले, गंगा और चंद्रकला के धारक, गजचर्म ओढ़े, जगत् का भार वहन करने वाले शिव हमें लक्ष्मी (समृद्धि) दें।", "8": "खिले नीलकमलों की श्यामल आभा जैसी कंठ-कांति वाले, कामदेव, त्रिपुर, संसार-बंधन, दक्षयज्ञ, गजासुर, अंधकासुर और यमराज का संहार करने वाले शिव का मैं भजन करता हूँ।", "9": "समस्त मंगल कलाओं की मंजरी के रस-प्रवाह की मधुरता के भ्रमर, कामदेव, त्रिपुर, भव, दक्षयज्ञ, गजासुर, अंधकासुर और यम का अंत करने वाले शिव का मैं भजन करता हूँ।", "10": "जिनके विकराल ललाट में सर्पों की फुफकार से अग्नि धधक रही है, और मृदंग की धिमि-धिमि गूँज के साथ जो प्रचंड तांडव करते हैं — उन शिव की जय हो।", "11": "पत्थर और कोमल शय्या, सर्प और मोतियों की माला, रत्न और मिट्टी के ढेले, मित्र और शत्रु, तिनके और कमल-नेत्र, प्रजा और राजा — सबमें समभाव रखकर मैं कब सदाशिव का भजन करूँगा?", "12": "गंगा तट की कुंजों की गुफा में रहकर, दुर्बुद्धि त्यागकर, सिर पर अंजलि जोड़े, चंचल नेत्रों से 'शिव' मंत्र का उच्चारण करता हुआ मैं कब सुखी होऊँगा?", "13": "जो इस उत्तमोत्तम स्तोत्र को नित्य पढ़ता, स्मरण करता या कहता है, वह सदा शुद्ध होता है; शिव और गुरु में उसकी भक्ति शीघ्र दृढ़ होती है; शंकर का चिंतन देहधारियों का मोह हरता है।", "14": "पूजा के अंत में, प्रदोष काल में, रावण-रचित इस शिव-स्तोत्र का जो पाठ करता है, उसे शिव रथ, हाथी और घोड़ों से युक्त स्थिर लक्ष्मी सदा प्रदान करते हैं।", "15": "रावण-रचित शिवताण्डव स्तोत्र यहाँ पूर्ण हुआ; ॐ नमः शिवाय।"},MT={"0": "ఎవరి జటాఖండారణ్యం నుండి ప్రవహించే గంగాజలంతో కంఠప్రదేశం పావనమైందో, గళంలో వేలాడే మహాసర్పమాల ధరించి, డమరుకం \"డమడ్డమ\" నాదంతో చండ తాండవం చేసిన శివుడు మాకు శుభం కలిగించుగాక.", "1": "జటాకటాహంలో తిరిగే గంగా చంచల తరంగాల తీగలతో శోభించే శిరస్సు గలవాడు, ధగధగ మండే ఫాలాగ్నితో వెలిగేవాడు, బాలచంద్రుని శిఖలో ధరించిన శివునిపై నా ప్రీతి ప్రతిక్షణం ఉండుగాక.", "2": "పార్వతీదేవి విలాసానికి ఆప్తుడు, దిక్కుల సకల జీవుల ఆనందం తన మనస్సులో నింపుకున్నవాడు, కృపాకటాక్షంతో గొప్ప ఆపదలను తొలగించేవాడైన దిగంబర శివునిలో నా మనస్సు ఆనందం పొందుగాక.", "3": "జటాసర్పాల పడగ మణుల పింగళ కాంతి దిక్కులనే వధువుల ముఖాలపై కుంకుమ లేపనంలా పూసేవాడు, మదించిన ఏనుగు చర్మాన్ని ఉత్తరీయంగా ధరించిన భూతనాథునిలో నా మనస్సు అద్భుతమైన ఆనందాన్ని పొందుగాక.", "4": "ఇంద్రాది సకల దేవతల శిరః పుష్పాల ధూళితో ధూసరమైన పాదపీఠం గలవాడు, సర్పరాజ మాలతో జటాజూటం కట్టుకున్న చంద్రశేఖరుడు మాకు చిరకాలం సంపదనిచ్చుగాక.", "5": "ఫాలాగ్ని స్ఫులింగాలతో మన్మథుని భస్మం చేసినవాడు, ఇంద్రాది దేవతలు నమస్కరించేవాడు, చంద్రకళతో శోభించే శిరస్సు గలవాడు, జటాధారి అయిన మహాకపాలి మాకు సిద్ధి ప్రసాదించుగాక.", "6": "భయంకర ఫాలభాగంలో ధగధగ మండే అగ్నిలో మన్మథుని ఆహుతి చేసినవాడు, పార్వతీదేవి వక్షస్థలంపై చిత్రరచన చేయగల అద్వితీయ శిల్పి అయిన త్రినేత్రునిపై నా ప్రీతి ఉండుగాక.", "7": "నవీన మేఘమండలంతో కప్పబడిన అమావాస్య చీకటి రాత్రి వంటి కంఠం గలవాడు, గంగ, చంద్రకళ ధరించినవాడు, గజచర్మధారి, జగద్భారాన్ని మోసేవాడైన శివుడు మాకు సంపదనిచ్చుగాక.", "8": "వికసించిన నీలకమలాల శ్యామల కాంతి వంటి కంఠకాంతి గలవాడు, మన్మథుని, త్రిపురాలను, భవబంధాన్ని, దక్షయజ్ఞాన్ని, గజాసురుని, అంధకాసురుని, యముని సంహరించినవాడైన శివుని నేను భజిస్తాను.", "9": "సకల మంగళ కళల మంజరి రసప్రవాహ మాధుర్యానికి తుమ్మెద వంటివాడు, మన్మథ త్రిపుర భవ దక్షయజ్ఞ గజాసుర అంధకాసుర యమాంతకుడైన శివుని నేను భజిస్తాను.", "10": "భయంకర ఫాలంలో సర్పాల బుసలతో అగ్ని మండుతుండగా, మృదంగ \"ధిమిద్ధిమి\" ధ్వనులతో ప్రచండ తాండవం చేసే శివునికి జయం.", "11": "రాయి, మెత్తని పరుపు; పాము, ముత్యాల హారం; రత్నం, మట్టిపెళ్ల; మిత్రుడు, శత్రువు; గడ్డిపోచ, కమలనేత్రం; ప్రజ, రాజు — అన్నింటిలో సమభావంతో నేను ఎప్పుడు సదాశివుని భజిస్తాను?", "12": "గంగాతీరపు నికుంజ గుహలో ఉంటూ, దుర్బుద్ధిని విడిచి, శిరస్సుపై అంజలి ఘటించి, చంచల నేత్రాలతో \"శివ\" మంత్రం ఉచ్చరిస్తూ నేను ఎప్పుడు సుఖపడతాను?", "13": "ఈ ఉత్తమోత్తమ స్తోత్రాన్ని నిత్యం పఠించే, స్మరించే, పలికే మనిషి సదా శుద్ధి పొందుతాడు; శివునిపై, గురువుపై భక్తి త్వరగా కలుగుతుంది; శంకర చింతన దేహధారుల మోహాన్ని తొలగిస్తుంది.", "14": "పూజ ముగిసే సమయంలో, ప్రదోష వేళలో, రావణుడు రచించిన ఈ శంభు స్తోత్రాన్ని పఠించేవారికి శివుడు రథ గజ అశ్వాలతో కూడిన స్థిరమైన సంపదను సదా అనుగ్రహిస్తాడు.", "15": "రావణ కృత శివతాండవ స్తోత్రం ఇక్కడ పూర్తయింది; ఓం నమః శివాయ."};
