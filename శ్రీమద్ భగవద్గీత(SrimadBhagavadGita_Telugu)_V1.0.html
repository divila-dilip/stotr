D["10.17"]={t:["కథం విద్యామహం యోగింస్త్వాం సదా పరిచిన్తయన్ |","కేషు కేషు చ భావేషు చిన్త్యోఽసి భగవన్మయా ||"],mt:"ఓ యోగీ! నేను ఎల్లప్పుడును చింతించుచు నిన్ను ఎట్లు తెలిసికొనగలను? ఓ భగవానుడా! ఏ ఏ భావములయందు నేను నిన్ను చింతింపవలెను?",m:"O master of yoga, how may I know you by constantly contemplating you? In what various aspects are you to be contemplated by me, O Lord?",w:"కథమ్ విద్యామ్ అహమ్=how may I know; యోగిన్=O master of yoga; త్వామ్=you; సదా పరిచిన్తయన్=constantly contemplating; కేషు కేషు చ భావేషు=in what various aspects; చిన్త్యః అసి=are you to be contemplated; భగవన్=O Lord; మయా=by me"};
D["10.18"]={t:["విస్తరేణాత్మనో యోగం విభూతిం చ జనార్దన |","భూయః కథయ తృప్తిర్హి శృణ్వతో నాస్తి మేఽమృతమ్ ||"],mt:"ఓ జనార్దనా! నీ యోగమును, విభూతిని విస్తారముగా మరల చెప్పుము; అమృతమువంటి నీ మాటలు వినుచున్న నాకు తృప్తి కలుగుట లేదు.",m:"O Janardana, tell me again in detail of your yogic power and glory; for I am never satiated hearing your nectar-like words.",w:"విస్తరేణ=in detail; ఆత్మనః=your own; యోగమ్=yogic power; విభూతిమ్ చ=and glory; జనార్దన=O Janardana; భూయః కథయ=tell again; తృప్తిః న అస్తి=there is no satiety; శృణ్వతః=for one hearing; మే=my; అమృతమ్=nectar"};
D["10.19"]={t:["శ్రీభగవానువాచ |","హన్త తే కథయిష్యామి దివ్యా హ్యాత్మవిభూతయః |","ప్రాధాన్యతః కురుశ్రేష్ఠ నాస్త్యన్తో విస్తరస్య మే ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ కురుశ్రేష్ఠా! సరే, నా దివ్యమైన ఆత్మవిభూతులను ప్రధానమైనవాటిని నీకు చెప్పెదను; నా విస్తారమునకు అంతము లేదు.",m:"The Blessed Lord said: Very well, O best of the Kurus, I shall tell you of my divine glories, only the chief ones, for there is no end to my expanse.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; హన్త=well then; తే కథయిష్యామి=I shall tell you; దివ్యాః హి ఆత్మవిభూతయః=my divine glories; ప్రాధాన్యతః=the chief ones; కురుశ్రేష్ఠ=O best of the Kurus; న అస్తి అన్తః విస్తరస్య మే=there is no end to my expanse"};
D["10.20"]={t:["అహమాత్మా గుడాకేశ సర్వభూతాశయస్థితః |","అహమాదిశ్చ మధ్యం చ భూతానామన్త ఏవ చ ||"],mt:"ఓ గుడాకేశా! సర్వభూతముల హృదయములలో నిలిచిన ఆత్మను నేనే; భూతములకు ఆదియు, మధ్యమును, అంతమును నేనే.",m:"I am the self, O Gudakesha, seated in the hearts of all beings; I am the beginning, the middle and also the end of beings.",w:"అహమ్ ఆత్మా=I am the self; గుడాకేశ=O Gudakesha; సర్వభూతాశయస్థితః=seated in the hearts of all beings; అహమ్ ఆదిః చ=I am the beginning; మధ్యమ్ చ=and the middle; భూతానామ్=of beings; అన్తః ఏవ చ=and also the end"};
D["10.21"]={t:["ఆదిత్యానామహం విష్ణుర్జ్యోతిషాం రవిరంశుమాన్ |","మరీచిర్మరుతామస్మి నక్షత్రాణామహం శశీ ||"],mt:"ఆదిత్యులలో విష్ణువును, జ్యోతులలో కిరణములుగల సూర్యుడను, మరుత్తులలో మరీచిని, నక్షత్రములలో చంద్రుడను నేను.",m:"Among the Adityas I am Vishnu; among luminaries I am the radiant sun; among the Maruts I am Marichi; among the stars I am the moon.",w:"ఆదిత్యానామ్=among the Adityas; అహమ్ విష్ణుః=I am Vishnu; జ్యోతిషామ్=among luminaries; రవిః అంశుమాన్=the radiant sun; మరీచిః=Marichi; మరుతామ్=among the Maruts; అస్మి=I am; నక్షత్రాణామ్=among the stars; అహమ్ శశీ=I am the moon"};
D["10.22"]={t:["వేదానాం సామవేదోఽస్మి దేవానామస్మి వాసవః |","ఇన్ద్రియాణాం మనశ్చాస్మి భూతానామస్మి చేతనా ||"],mt:"వేదములలో సామవేదమును, దేవతలలో ఇంద్రుడను, ఇంద్రియములలో మనస్సును, భూతములలో చేతనను నేను.",m:"Among the Vedas I am the Sama Veda; among the gods I am Indra; among the senses I am the mind; and among beings I am consciousness.",w:"వేదానామ్=among the Vedas; సామవేదః అస్మి=I am the Sama Veda; దేవానామ్ అస్మి వాసవః=among the gods I am Indra; ఇన్ద్రియాణామ్=among the senses; మనః చ అస్మి=I am the mind; భూతానామ్ అస్మి చేతనా=among beings I am consciousness"};
D["10.23"]={t:["రుద్రాణాం శఙ్కరశ్చాస్మి విత్తేశో యక్షరక్షసామ్ |","వసూనాం పావకశ్చాస్మి మేరుః శిఖరిణామహమ్ ||"],mt:"రుద్రులలో శంకరుడను, యక్షరాక్షసులలో కుబేరుడను, వసువులలో అగ్నిని, పర్వతములలో మేరువును నేను.",m:"Among the Rudras I am Shankara; among the Yakshas and Rakshasas I am Kubera; among the Vasus I am Agni; and among mountains I am Meru.",w:"రుద్రాణామ్=among the Rudras; శఙ్కరః చ అస్మి=I am Shankara; విత్తేశః=Kubera, lord of wealth; యక్షరక్షసామ్=among Yakshas and Rakshasas; వసూనామ్=among the Vasus; పావకః చ అస్మి=I am Agni; మేరుః శిఖరిణామ్ అహమ్=I am Meru among mountains"};
D["10.24"]={t:["పురోధసాం చ ముఖ్యం మాం విద్ధి పార్థ బృహస్పతిమ్ |","సేనానీనామహం స్కన్దః సరసామస్మి సాగరః ||"],mt:"ఓ పార్థా! పురోహితులలో ముఖ్యుడైన బృహస్పతిగా నన్ను తెలిసికొనుము; సేనానులలో స్కందుడను, జలాశయములలో సాగరమును నేను.",m:"Know me, O Partha, as Brihaspati, chief of priests; among generals I am Skanda, and among bodies of water I am the ocean.",w:"పురోధసామ్ చ ముఖ్యమ్=and the chief of priests; మామ్ విద్ధి=know me; పార్థ=O Partha; బృహస్పతిమ్=as Brihaspati; సేనానీనామ్=among generals; అహమ్ స్కన్దః=I am Skanda; సరసామ్=among bodies of water; అస్మి సాగరః=I am the ocean"};
D["10.25"]={t:["మహర్షీణాం భృగురహం గిరామస్మ్యేకమక్షరమ్ |","యజ్ఞానాం జపయజ్ఞోఽస్మి స్థావరాణాం హిమాలయః ||"],mt:"మహర్షులలో భృగువును, వాక్కులలో ఏకాక్షరమైన ఓంకారమును, యజ్ఞములలో జపయజ్ఞమును, స్థావరములలో హిమాలయమును నేను.",m:"Among the great sages I am Bhrigu; among utterances I am the single syllable Om; among sacrifices I am the sacrifice of chanting; and among immovable things I am the Himalaya.",w:"మహర్షీణామ్=among the great sages; భృగుః అహమ్=I am Bhrigu; గిరామ్=among utterances; అస్మి ఏకమ్ అక్షరమ్=I am the single syllable Om; యజ్ఞానామ్=among sacrifices; జపయజ్ఞః అస్మి=I am the sacrifice of chanting; స్థావరాణామ్=among immovable things; హిమాలయః=the Himalaya"};
D["10.26"]={t:["అశ్వత్థః సర్వవృక్షాణాం దేవర్షీణాం చ నారదః |","గన్ధర్వాణాం చిత్రరథః సిద్ధానాం కపిలో మునిః ||"],mt:"సర్వవృక్షములలో అశ్వత్థమును, దేవర్షులలో నారదుడను, గంధర్వులలో చిత్రరథుడను, సిద్ధులలో కపిలమునిని నేను.",m:"Among all trees I am the peepal; among divine sages, Narada; among Gandharvas, Chitraratha; and among perfected beings, the sage Kapila.",w:"అశ్వత్థః=the peepal tree; సర్వవృక్షాణామ్=among all trees; దేవర్షీణామ్ చ=and among divine sages; నారదః=Narada; గన్ధర్వాణామ్=among Gandharvas; చిత్రరథః=Chitraratha; సిద్ధానామ్=among perfected beings; కపిలః మునిః=the sage Kapila"};
D["10.27"]={t:["ఉచ్చైఃశ్రవసమశ్వానాం విద్ధి మామమృతోద్భవమ్ |","ఐరావతం గజేన్ద్రాణాం నరాణాం చ నరాధిపమ్ ||"],mt:"గుఱ్ఱములలో అమృతమునుండి పుట్టిన ఉచ్చైఃశ్రవమును, గజేంద్రులలో ఐరావతమును, మనుష్యులలో రాజును నేనుగా తెలిసికొనుము.",m:"Know me among horses as Uchchaihshravas, born of the nectar; among lordly elephants as Airavata; and among men as the king.",w:"ఉచ్చైఃశ్రవసమ్=Uchchaihshravas; అశ్వానామ్=among horses; విద్ధి మామ్=know me; అమృతోద్భవమ్=born of the nectar; ఐరావతమ్=Airavata; గజేన్ద్రాణామ్=among lordly elephants; నరాణామ్ చ=and among men; నరాధిపమ్=the king"};
D["10.28"]={t:["ఆయుధానామహం వజ్రం ధేనూనామస్మి కామధుక్ |","ప్రజనశ్చాస్మి కన్దర్పః సర్పాణామస్మి వాసుకిః ||"],mt:"ఆయుధములలో వజ్రమును, ధేనువులలో కామధేనువును, సంతానోత్పత్తికి కారణమైన కందర్పుడను, సర్పములలో వాసుకిని నేను.",m:"Among weapons I am the thunderbolt; among cows I am the wish-fulfilling cow; I am Kandarpa, the god of love who causes procreation; and among serpents I am Vasuki.",w:"ఆయుధానామ్=among weapons; అహమ్ వజ్రమ్=I am the thunderbolt; ధేనూనామ్=among cows; అస్మి కామధుక్=I am the wish-fulfilling cow; ప్రజనః చ అస్మి=I am the cause of procreation; కన్దర్పః=Kandarpa, the god of love; సర్పాణామ్=among serpents; అస్మి వాసుకిః=I am Vasuki"};

// Chapter 10 – shlokas 10.29 to 10.42 (completes chapter 10). Paste after your D object.
D["10.29"]={t:["అనన్తశ్చాస్మి నాగానాం వరుణో యాదసామహమ్ |","పితౄణామర్యమా చాస్మి యమః సంయమతామహమ్ ||"],mt:"నాగములలో అనంతుడను, జలదేవతలలో వరుణుడను, పితరులలో అర్యముడను, నియమించువారిలో యముడను నేను.",m:"Among the Nagas I am Ananta; among water beings I am Varuna; among the ancestors I am Aryama; and among those who restrain, I am Yama.",w:"అనన్తః చ అస్మి=I am Ananta; నాగానామ్=among the Nagas; వరుణః=Varuna; యాదసామ్=among water beings; అహమ్=I; పితౄణామ్=among the ancestors; అర్యమా చ అస్మి=I am Aryama; యమః=Yama; సంయమతామ్=among those who restrain; అహమ్=I"};
D["10.30"]={t:["ప్రహ్లాదశ్చాస్మి దైత్యానాం కాలః కలయతామహమ్ |","మృగాణాం చ మృగేన్ద్రోఽహం వైనతేయశ్చ పక్షిణామ్ ||"],mt:"దైత్యులలో ప్రహ్లాదుడను, లెక్కించువారిలో కాలమును, మృగములలో మృగేంద్రుడైన సింహమును, పక్షులలో గరుత్మంతుడను నేను.",m:"Among the Daityas I am Prahlada; among reckoners I am time; among beasts I am the lion, king of beasts; and among birds I am Garuda.",w:"ప్రహ్లాదః చ అస్మి=I am Prahlada; దైత్యానామ్=among the Daityas; కాలః=time; కలయతామ్=among reckoners; అహమ్=I; మృగాణామ్ చ=and among beasts; మృగేన్ద్రః అహమ్=I am the lion; వైనతేయః చ=and Garuda; పక్షిణామ్=among birds"};
D["10.31"]={t:["పవనః పవతామస్మి రామః శస్త్రభృతామహమ్ |","ఝషాణాం మకరశ్చాస్మి స్రోతసామస్మి జాహ్నవీ ||"],mt:"పవిత్రము చేయువానిలో వాయువును, శస్త్రధారులలో రాముడను, చేపలలో మకరమును, నదులలో గంగను నేను.",m:"Among purifiers I am the wind; among wielders of weapons I am Rama; among fishes I am the makara; and among rivers I am the Ganga.",w:"పవనః=the wind; పవతామ్=among purifiers; అస్మి=I am; రామః=Rama; శస్త్రభృతామ్=among wielders of weapons; అహమ్=I; ఝషాణామ్=among fishes; మకరః చ అస్మి=I am the makara; స్రోతసామ్=among flowing rivers; అస్మి జాహ్నవీ=I am the Ganga"};
D["10.32"]={t:["సర్గాణామాదిరన్తశ్చ మధ్యం చైవాహమర్జున |","అధ్యాత్మవిద్యా విద్యానాం వాదః ప్రవదతామహమ్ ||"],mt:"ఓ అర్జునా! సృష్టులకు ఆదియు, అంతమును, మధ్యమును నేనే; విద్యలలో అధ్యాత్మవిద్యను, వాదించువారిలో తత్త్వవాదమును నేను.",m:"I am the beginning, the end and the middle of creations, O Arjuna; among sciences I am the science of the self, and among disputants I am the logical debate.",w:"సర్గాణామ్=of creations; ఆదిః=beginning; అన్తః చ=and end; మధ్యమ్ చ ఏవ=and middle also; అహమ్=I; అర్జున=O Arjuna; అధ్యాత్మవిద్యా=the science of the self; విద్యానామ్=among sciences; వాదః=logical debate; ప్రవదతామ్=among disputants; అహమ్=I"};
D["10.33"]={t:["అక్షరాణామకారోఽస్మి ద్వన్ద్వః సామాసికస్య చ |","అహమేవాక్షయః కాలో ధాతాహం విశ్వతోముఖః ||"],mt:"అక్షరములలో అకారమును, సమాసములలో ద్వంద్వసమాసమును నేను; అక్షయమైన కాలమును, విశ్వతోముఖుడైన ధాతయు నేనే.",m:"Among letters I am the letter A; among compounds I am the dvandva; I alone am imperishable time, and I am the dispenser facing every direction.",w:"అక్షరాణామ్=among letters; అకారః అస్మి=I am the letter A; ద్వన్ద్వః=the dvandva compound; సామాసికస్య చ=among compounds; అహమ్ ఏవ=I alone; అక్షయః కాలః=imperishable time; ధాతా అహమ్=I am the dispenser; విశ్వతోముఖః=facing every direction"};
D["10.34"]={t:["మృత్యుః సర్వహరశ్చాహముద్భవశ్చ భవిష్యతామ్ |","కీర్తిః శ్రీర్వాక్చ నారీణాం స్మృతిర్మేధా ధృతిః క్షమా ||"],mt:"సర్వమును హరించు మృత్యువును, రాబోవువారికి ఉద్భవమును నేను; స్త్రీ గుణములలో కీర్తి, శ్రీ, వాక్కు, స్మృతి, మేధ, ధృతి, క్షమ నేనే.",m:"I am all-devouring death and the origin of things yet to be; among feminine qualities I am fame, prosperity, speech, memory, intelligence, steadfastness and forgiveness.",w:"మృత్యుః సర్వహరః చ అహమ్=I am all-devouring death; ఉద్భవః చ=and the origin; భవిష్యతామ్=of things yet to be; కీర్తిః శ్రీః వాక్ చ నారీణామ్=fame, prosperity and speech among feminine qualities; స్మృతిః=memory; మేధా=intelligence; ధృతిః=steadfastness; క్షమా=forgiveness"};
D["10.35"]={t:["బృహత్సామ తథా సామ్నాం గాయత్రీ ఛన్దసామహమ్ |","మాసానాం మార్గశీర్షోఽహమృతూనాం కుసుమాకరః ||"],mt:"సామములలో బృహత్సామమును, ఛందస్సులలో గాయత్రిని, మాసములలో మార్గశీర్షమును, ఋతువులలో వసంతమును నేను.",m:"Among Sama hymns I am the Brihat-sama; among metres I am the Gayatri; among months I am Margashirsha; and among seasons I am spring.",w:"బృహత్సామ=the Brihat-sama; తథా=and; సామ్నామ్=among Sama hymns; గాయత్రీ=the Gayatri; ఛన్దసామ్=among metres; అహమ్=I; మాసానామ్=among months; మార్గశీర్షః అహమ్=I am Margashirsha; ఋతూనామ్=among seasons; కుసుమాకరః=spring"};
D["10.36"]={t:["ద్యూతం ఛలయతామస్మి తేజస్తేజస్వినామహమ్ |","జయోఽస్మి వ్యవసాయోఽస్మి సత్త్వం సత్త్వవతామహమ్ ||"],mt:"మోసగాండ్రలో జూదమును, తేజస్వులలో తేజస్సును నేను; జయమును, నిశ్చయమును, సత్త్వవంతులలో సత్త్వమును నేనే.",m:"Among deceivers I am gambling; among the splendid I am splendour; I am victory, I am determination, and I am the goodness of the good.",w:"ద్యూతమ్=gambling; ఛలయతామ్ అస్మి=I am among deceivers; తేజః=splendour; తేజస్వినామ్=of the splendid; అహమ్=I; జయః అస్మి=I am victory; వ్యవసాయః అస్మి=I am determination; సత్త్వమ్=goodness; సత్త్వవతామ్=of the good; అహమ్=I"};
D["10.37"]={t:["వృష్ణీనాం వాసుదేవోఽస్మి పాణ్డవానాం ధనఞ్జయః |","మునీనామప్యహం వ్యాసః కవీనాముశనా కవిః ||"],mt:"వృష్ణివంశీయులలో వాసుదేవుడను, పాండవులలో ధనంజయుడను, మునులలో వ్యాసుడను, కవులలో కవియైన ఉశనుడను నేను.",m:"Among the Vrishnis I am Vasudeva; among the Pandavas I am Dhananjaya; among sages I am Vyasa; and among poets I am the poet Ushana.",w:"వృష్ణీనామ్=among the Vrishnis; వాసుదేవః అస్మి=I am Vasudeva; పాణ్డవానామ్=among the Pandavas; ధనఞ్జయః=Dhananjaya (Arjuna); మునీనామ్ అపి=among sages also; అహమ్ వ్యాసః=I am Vyasa; కవీనామ్=among poets; ఉశనా కవిః=the poet Ushana (Shukracharya)"};
D["10.38"]={t:["దణ్డో దమయతామస్మి నీతిరస్మి జిగీషతామ్ |","మౌనం చైవాస్మి గుహ్యానాం జ్ఞానం జ్ఞానవతామహమ్ ||"],mt:"శిక్షించువారిలో దండమును, జయింపగోరువారిలో నీతిని, రహస్యములలో మౌనమును, జ్ఞానవంతులలో జ్ఞానమును నేను.",m:"Among those who punish I am the rod of punishment; among those who seek victory I am statecraft; among secrets I am silence; and among the wise I am wisdom.",w:"దణ్డః=the rod of punishment; దమయతామ్ అస్మి=among those who discipline I am; నీతిః అస్మి=I am statecraft; జిగీషతామ్=among those who seek victory; మౌనమ్ చ ఏవ అస్మి=I am silence also; గుహ్యానామ్=among secrets; జ్ఞానమ్=wisdom; జ్ఞానవతామ్=of the wise; అహమ్=I"};
D["10.39"]={t:["యచ్చాపి సర్వభూతానాం బీజం తదహమర్జున |","న తదస్తి వినా యత్స్యాన్మయా భూతం చరాచరమ్ ||"],mt:"ఓ అర్జునా! సర్వభూతములకు బీజమేదో అది నేనే; నేను లేకుండా ఉండగల చరాచర భూతమేదియు లేదు.",m:"And whatever is the seed of all beings, that I am, O Arjuna. There is no being, moving or unmoving, that could exist without me.",w:"యత్ చ అపి=and whatever; సర్వభూతానామ్=of all beings; బీజమ్=seed; తత్ అహమ్=that I am; అర్జున=O Arjuna; న తత్ అస్తి=there is nothing; వినా యత్ స్యాత్=that could exist without; మయా=me; భూతమ్=being; చరాచరమ్=moving or unmoving"};
D["10.40"]={t:["నాన్తోఽస్తి మమ దివ్యానాం విభూతీనాం పరన్తప |","ఏష తూద్దేశతః ప్రోక్తో విభూతేర్విస్తరో మయా ||"],mt:"ఓ పరంతపా! నా దివ్యవిభూతులకు అంతము లేదు; విభూతి యొక్క ఈ విస్తారము కేవలము సూచనగా నాచే చెప్పబడినది.",m:"There is no end to my divine glories, O scorcher of foes; this expanse of my glory has been told by me only as an indication.",w:"న అన్తః అస్తి=there is no end; మమ=my; దివ్యానామ్ విభూతీనామ్=of divine glories; పరన్తప=O scorcher of foes; ఏషః తు=this indeed; ఉద్దేశతః=as an indication; ప్రోక్తః=has been told; విభూతేః విస్తరః=expanse of glory; మయా=by me"};
D["10.41"]={t:["యద్యద్విభూతిమత్సత్త్వం శ్రీమదూర్జితమేవ వా |","తత్తదేవావగచ్ఛ త్వం మమ తేజోంఽశసమ్భవమ్ ||"],mt:"ఏ ఏ విభూతిమంతమైనది, శ్రీమంతమైనది, శక్తిమంతమైనది ఉన్నదో అది నా తేజస్సులోని అంశమునుండి పుట్టినదని తెలిసికొనుము.",m:"Whatever being is glorious, prosperous or powerful, know that to be born of a fraction of my splendour.",w:"యత్ యత్=whatever; విభూతిమత్ సత్త్వమ్=glorious being; శ్రీమత్=prosperous; ఊర్జితమ్=powerful; ఏవ వా=or; తత్ తత్ ఏవ అవగచ్ఛ=know that alone; త్వమ్=you; మమ తేజోంశసమ్భవమ్=born of a fraction of my splendour"};
D["10.42"]={t:["అథవా బహునైతేన కిం జ్ఞాతేన తవార్జున |","విష్టభ్యాహమిదం కృత్స్నమేకాంశేన స్థితో జగత్ ||"],mt:"లేదా ఓ అర్జునా! ఇన్ని విషయములు తెలిసికొనుటచే నీకు ప్రయోజనమేమి? నేను ఈ సమస్త జగత్తును ఒక్క అంశముచే ధరించి నిలిచియున్నాను.",m:"Or what need is there for you to know all this variety, O Arjuna? I stand supporting this entire universe with a single fraction of myself.",w:"అథవా=or; బహునా ఏతేన జ్ఞాతేన=by knowing all this variety; కిమ్ తవ=what use to you; అర్జున=O Arjuna; విష్టభ్య=pervading and supporting; అహమ్=I; ఇదమ్ కృత్స్నమ్ జగత్=this entire universe; ఏకాంశేన=by a single fraction; స్థితః=stand"};

// Chapter 11 – shlokas 11.1 to 11.14. Paste after your D object.
D["11.1"]={t:["అర్జున ఉవాచ |","మదనుగ్రహాయ పరమం గుహ్యమధ్యాత్మసంజ్ఞితమ్ |","యత్త్వయోక్తం వచస్తేన మోహోఽయం విగతో మమ ||"],mt:"అర్జునుడు పలికెను: నా అనుగ్రహము కొరకు నీవు చెప్పిన అధ్యాత్మసంజ్ఞితమైన పరమగుహ్యమైన వచనముచే నా ఈ మోహము తొలగినది.",m:"Arjuna said: By the supreme secret teaching about the self that you have spoken out of compassion for me, this delusion of mine has gone.",w:"అర్జునః ఉవాచ=Arjuna said; మదనుగ్రహాయ=out of compassion for me; పరమమ్=supreme; గుహ్యమ్=secret; అధ్యాత్మసంజ్ఞితమ్=concerning the self; యత్=which; త్వయా ఉక్తమ్=spoken by you; వచః=word; తేన=by that; మోహః అయమ్=this delusion; విగతః=has gone; మమ=my"};
D["11.2"]={t:["భవాప్యయౌ హి భూతానాం శ్రుతౌ విస్తరశో మయా |","త్వత్తః కమలపత్రాక్ష మాహాత్మ్యమపి చావ్యయమ్ ||"],mt:"ఓ కమలపత్రాక్షా! భూతముల ఉత్పత్తిలయములను విస్తారముగా నీవలన వింటిని; నీ అవ్యయమైన మాహాత్మ్యమును కూడా వింటిని.",m:"O lotus-eyed one, I have heard from you in detail of the origin and dissolution of beings, and also of your imperishable greatness.",w:"భవాప్యయౌ=origin and dissolution; హి=indeed; భూతానామ్=of beings; శ్రుతౌ=have been heard; విస్తరశః=in detail; మయా=by me; త్వత్తః=from you; కమలపత్రాక్ష=O lotus-eyed one; మాహాత్మ్యమ్=greatness; అపి చ=also; అవ్యయమ్=imperishable"};
D["11.3"]={t:["ఏవమేతద్యథాత్థ త్వమాత్మానం పరమేశ్వర |","ద్రష్టుమిచ్ఛామి తే రూపమైశ్వరం పురుషోత్తమ ||"],mt:"ఓ పరమేశ్వరా! నిన్ను గూర్చి నీవు చెప్పినది అట్లే; ఓ పురుషోత్తమా! నీ ఐశ్వర రూపమును చూడగోరుచున్నాను.",m:"O Supreme Lord, it is just as you have described yourself; yet I wish to see your divine form, O Supreme Person.",w:"ఏవమ్ ఏతత్=it is so; యథా=as; ఆత్థ=you have said; త్వమ్=you; ఆత్మానమ్=of yourself; పరమేశ్వర=O Supreme Lord; ద్రష్టుమ్ ఇచ్ఛామి=I wish to see; తే=your; రూపమ్ ఐశ్వరమ్=divine form; పురుషోత్తమ=O Supreme Person"};
D["11.4"]={t:["మన్యసే యది తచ్ఛక్యం మయా ద్రష్టుమితి ప్రభో |","యోగేశ్వర తతో మే త్వం దర్శయాత్మానమవ్యయమ్ ||"],mt:"ప్రభూ! నేను దానిని చూడగలనని నీవు తలచినచో, ఓ యోగేశ్వరా! అప్పుడు నీ అవ్యయమైన స్వరూపమును నాకు చూపుము.",m:"O Lord, if you think it is possible for me to see it, then, O Lord of yoga, show me your imperishable self.",w:"మన్యసే=you think; యది=if; తత్=that; శక్యమ్=possible; మయా=by me; ద్రష్టుమ్=to be seen; ఇతి=thus; ప్రభో=O Lord; యోగేశ్వర=O Lord of yoga; తతః=then; మే=to me; త్వమ్=you; దర్శయ=show; ఆత్మానమ్=yourself; అవ్యయమ్=imperishable"};
D["11.5"]={t:["శ్రీభగవానువాచ |","పశ్య మే పార్థ రూపాణి శతశోఽథ సహస్రశః |","నానావిధాని దివ్యాని నానావర్ణాకృతీని చ ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ పార్థా! వందలుగా వేలుగా నానావిధములైన, నానా వర్ణాకృతులు గల నా దివ్యరూపములను చూడుము.",m:"The Blessed Lord said: Behold, O Partha, my forms by the hundreds and thousands, of many kinds, divine, and of many colours and shapes.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; పశ్య=behold; మే=my; పార్థ=O Partha; రూపాణి=forms; శతశః=by hundreds; అథ=and; సహస్రశః=by thousands; నానావిధాని=of many kinds; దివ్యాని=divine; నానావర్ణాకృతీని=of many colours and shapes; చ=and"};
D["11.6"]={t:["పశ్యాదిత్యాన్వసూన్రుద్రానశ్వినౌ మరుతస్తథా |","బహూన్యదృష్టపూర్వాణి పశ్యాశ్చర్యాణి భారత ||"],mt:"ఓ భారతా! ఆదిత్యులను, వసువులను, రుద్రులను, అశ్వినులను, మరుత్తులను చూడుము; ముందెన్నడును చూడని అనేక ఆశ్చర్యములను చూడుము.",m:"Behold the Adityas, the Vasus, the Rudras, the two Ashvins and the Maruts; behold many wonders never seen before, O Bharata.",w:"పశ్య=behold; ఆదిత్యాన్=the Adityas; వసూన్=the Vasus; రుద్రాన్=the Rudras; అశ్వినౌ=the two Ashvins; మరుతః=the Maruts; తథా=and; బహూని=many; అదృష్టపూర్వాణి=never seen before; పశ్య ఆశ్చర్యాణి=behold wonders; భారత=O Bharata"};
D["11.7"]={t:["ఇహైకస్థం జగత్కృత్స్నం పశ్యాద్య సచరాచరమ్ |","మమ దేహే గుడాకేశ యచ్చాన్యద్ద్రష్టుమిచ్ఛసి ||"],mt:"ఓ గుడాకేశా! ఇప్పుడు నా దేహమున ఒకేచోట చరాచరసహితమైన సమస్త జగత్తును, నీవు ఇంకను ఏది చూడగోరుదువో దానిని కూడా చూడుము.",m:"Behold now, O Gudakesha, in my body the entire universe with the moving and the unmoving, all in one place, and whatever else you wish to see.",w:"ఇహ=here; ఏకస్థమ్=in one place; జగత్ కృత్స్నమ్=the entire universe; పశ్య=behold; అద్య=now; సచరాచరమ్=with the moving and unmoving; మమ దేహే=in my body; గుడాకేశ=O Gudakesha; యత్ చ అన్యత్=and whatever else; ద్రష్టుమ్ ఇచ్ఛసి=you wish to see"};
D["11.8"]={t:["న తు మాం శక్యసే ద్రష్టుమనేనైవ స్వచక్షుషా |","దివ్యం దదామి తే చక్షుః పశ్య మే యోగమైశ్వరమ్ ||"],mt:"కాని నీ ఈ చర్మచక్షువులచే నన్ను చూడజాలవు; నీకు దివ్యచక్షువు ఇచ్చుచున్నాను; నా ఐశ్వరయోగమును చూడుము.",m:"But you cannot see me with this eye of yours alone; I give you a divine eye. Behold my divine mystic power.",w:"న తు=but not; మామ్=me; శక్యసే=you are able; ద్రష్టుమ్=to see; అనేన ఏవ=with this alone; స్వచక్షుషా=with your own eye; దివ్యమ్=divine; దదామి=I give; తే=to you; చక్షుః=eye; పశ్య=behold; మే=my; యోగమ్ ఐశ్వరమ్=divine mystic power"};
D["11.9"]={t:["సఞ్జయ ఉవాచ |","ఏవముక్త్వా తతో రాజన్మహాయోగేశ్వరో హరిః |","దర్శయామాస పార్థాయ పరమం రూపమైశ్వరమ్ ||"],mt:"సంజయుడు పలికెను: ఓ రాజా! ఇట్లు చెప్పి మహాయోగేశ్వరుడైన హరి పార్థునికి తన పరమైన ఐశ్వరరూపమును చూపెను.",m:"Sanjaya said: Having spoken thus, O King, Hari, the great Lord of yoga, showed Partha his supreme divine form.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఏవమ్ ఉక్త్వా=having spoken thus; తతః=then; రాజన్=O King; మహాయోగేశ్వరః=the great Lord of yoga; హరిః=Hari; దర్శయామాస=showed; పార్థాయ=to Partha; పరమమ్=supreme; రూపమ్ ఐశ్వరమ్=divine form"};
D["11.10"]={t:["అనేకవక్త్రనయనమనేకాద్భుతదర్శనమ్ |","అనేకదివ్యాభరణం దివ్యానేకోద్యతాయుధమ్ ||"],mt:"అనేక ముఖములు నేత్రములు గలది, అనేక అద్భుత దర్శనములు గలది, అనేక దివ్యాభరణములు గలది, ఎత్తిన అనేక దివ్యాయుధములు గలది... (11.11 లో కొనసాగును)",m:"With many mouths and eyes, many wondrous sights, many divine ornaments, and many divine weapons raised... (continues in 11.11)",w:"అనేకవక్త్రనయనమ్=with many mouths and eyes; అనేకాద్భుతదర్శనమ్=with many wondrous sights; అనేకదివ్యాభరణమ్=with many divine ornaments; దివ్యానేకోద్యతాయుధమ్=with many divine weapons upraised"};
D["11.11"]={t:["దివ్యమాల్యామ్బరధరం దివ్యగన్ధానులేపనమ్ |","సర్వాశ్చర్యమయం దేవమనన్తం విశ్వతోముఖమ్ ||"],mt:"...దివ్యమాలలు వస్త్రములు ధరించినది, దివ్యగంధానులేపనములు గలది, సర్వాశ్చర్యమయమైన, అనంతమైన, విశ్వతోముఖుడైన దేవుని (చూపెను).",m:"...wearing divine garlands and garments, anointed with divine fragrances, full of every wonder, the infinite God facing every direction (he showed).",w:"దివ్యమాల్యామ్బరధరమ్=wearing divine garlands and garments; దివ్యగన్ధానులేపనమ్=anointed with divine fragrances; సర్వాశ్చర్యమయమ్=full of every wonder; దేవమ్=God; అనన్తమ్=infinite; విశ్వతోముఖమ్=facing every direction"};
D["11.12"]={t:["దివి సూర్యసహస్రస్య భవేద్యుగపదుత్థితా |","యది భాః సదృశీ సా స్యాద్భాసస్తస్య మహాత్మనః ||"],mt:"ఆకాశమున వేలసూర్యుల కాంతి ఒకేసారి ఉదయించినచో, అది ఆ మహాత్ముని కాంతికి సమానమగునేమో.",m:"If the radiance of a thousand suns were to blaze forth all at once in the sky, that might resemble the radiance of that great soul.",w:"దివి=in the sky; సూర్యసహస్రస్య=of a thousand suns; భవేత్=would be; యుగపత్ ఉత్థితా=risen at once; యది=if; భాః=radiance; సదృశీ=similar; సా=that; స్యాత్=might be; భాసః=to the radiance; తస్య మహాత్మనః=of that great soul"};
D["11.13"]={t:["తత్రైకస్థం జగత్కృత్స్నం ప్రవిభక్తమనేకధా |","అపశ్యద్దేవదేవస్య శరీరే పాణ్డవస్తదా ||"],mt:"అప్పుడు పాండవుడు ఆ దేవదేవుని శరీరమున ఒకేచోట అనేక విధములుగా విభజింపబడిన సమస్త జగత్తును చూచెను.",m:"Then Arjuna, the Pandava, saw the entire universe, divided in many ways, standing together in one place in the body of the God of gods.",w:"తత్ర=there; ఏకస్థమ్=in one place; జగత్ కృత్స్నమ్=the entire universe; ప్రవిభక్తమ్=divided; అనేకధా=in many ways; అపశ్యత్=saw; దేవదేవస్య=of the God of gods; శరీరే=in the body; పాణ్డవః=the Pandava; తదా=then"};
D["11.14"]={t:["తతః స విస్మయావిష్టో హృష్టరోమా ధనఞ్జయః |","ప్రణమ్య శిరసా దేవం కృతాఞ్జలిరభాషత ||"],mt:"అంతట ధనంజయుడు విస్మయముతో నిండి, రోమాంచితుడై, శిరసు వంచి దేవునకు నమస్కరించి, చేతులు జోడించి పలికెను.",m:"Then Dhananjaya, filled with amazement and with his hair standing on end, bowed his head to the God and spoke with folded hands.",w:"తతః=then; సః ధనఞ్జయః=that Dhananjaya; విస్మయావిష్టః=filled with amazement; హృష్టరోమా=with hair standing on end; ప్రణమ్య=bowing; శిరసా=with his head; దేవమ్=to the God; కృతాఞ్జలిః=with folded hands; అభాషత=spoke"};

// Chapter 11 – shlokas 11.15 to 11.28. Paste after your D object.
D["11.15"]={t:["అర్జున ఉవాచ |","పశ్యామి దేవాంస్తవ దేవ దేహే సర్వాంస్తథా భూతవిశేషసఙ్ఘాన్ |","బ్రహ్మాణమీశం కమలాసనస్థమృషీంశ్చ సర్వానురగాంశ్చ దివ్యాన్ ||"],mt:"అర్జునుడు పలికెను: ఓ దేవా! నీ దేహమున సమస్త దేవతలను, భూతవిశేష సమూహములను, కమలాసనస్థుడైన బ్రహ్మను, ఈశుని, సమస్త ఋషులను, దివ్యసర్పములను చూచుచున్నాను.",m:"Arjuna said: O God, I see in your body all the gods and the various hosts of beings, Brahma seated on the lotus, Ishvara, all the sages and the divine serpents.",w:"అర్జునః ఉవాచ=Arjuna said; పశ్యామి=I see; దేవాన్=the gods; తవ=your; దేవ=O God; దేహే=in the body; సర్వాన్=all; తథా=and; భూతవిశేషసఙ్ఘాన్=various hosts of beings; బ్రహ్మాణమ్=Brahma; ఈశమ్=Ishvara; కమలాసనస్థమ్=seated on the lotus; ఋషీన్ చ సర్వాన్=and all the sages; ఉరగాన్ చ దివ్యాన్=and the divine serpents"};
D["11.16"]={t:["అనేకబాహూదరవక్త్రనేత్రం పశ్యామి త్వాం సర్వతోఽనన్తరూపమ్ |","నాన్తం న మధ్యం న పునస్తవాదిం పశ్యామి విశ్వేశ్వర విశ్వరూప ||"],mt:"అనేక బాహువులు, ఉదరములు, ముఖములు, నేత్రములు గల అనంతరూపుడవైన నిన్ను అన్ని వైపులా చూచుచున్నాను; ఓ విశ్వేశ్వరా! విశ్వరూపా! నీకు అంతమును, మధ్యమును, ఆదియు కనబడుట లేదు.",m:"I see you of infinite form on every side, with many arms, bellies, mouths and eyes; I see neither your end, nor your middle, nor your beginning, O Lord of the universe, O universal form.",w:"అనేకబాహూదరవక్త్రనేత్రమ్=with many arms, bellies, mouths and eyes; పశ్యామి=I see; త్వామ్=you; సర్వతః=on every side; అనన్తరూపమ్=of infinite form; న అన్తమ్=not the end; న మధ్యమ్=nor the middle; న పునః తవ ఆదిమ్=nor again your beginning; విశ్వేశ్వర=O Lord of the universe; విశ్వరూప=O universal form"};
D["11.17"]={t:["కిరీటినం గదినం చక్రిణం చ తేజోరాశిం సర్వతో దీప్తిమన్తమ్ |","పశ్యామి త్వాం దుర్నిరీక్ష్యం సమన్తాద్దీప్తానలార్కద్యుతిమప్రమేయమ్ ||"],mt:"కిరీటము, గద, చక్రము ధరించిన, తేజోరాశియైన, అన్ని వైపులా ప్రకాశించు, చూచుటకు కష్టమైన, మండుచున్న అగ్నిసూర్యుల కాంతి గల, అప్రమేయుడవైన నిన్ను అంతటను చూచుచున్నాను.",m:"I see you with crown, mace and discus, a mass of radiance shining everywhere, hard to look at, with the blazing brilliance of fire and sun on all sides, immeasurable.",w:"కిరీటినమ్=with a crown; గదినమ్=with a mace; చక్రిణమ్ చ=and with a discus; తేజోరాశిమ్=a mass of radiance; సర్వతః దీప్తిమన్తమ్=shining everywhere; పశ్యామి త్వామ్=I see you; దుర్నిరీక్ష్యమ్=hard to look at; సమన్తాత్=all around; దీప్తానలార్కద్యుతిమ్=with the brilliance of blazing fire and sun; అప్రమేయమ్=immeasurable"};
D["11.18"]={t:["త్వమక్షరం పరమం వేదితవ్యం త్వమస్య విశ్వస్య పరం నిధానమ్ |","త్వమవ్యయః శాశ్వతధర్మగోప్తా సనాతనస్త్వం పురుషో మతో మే ||"],mt:"నీవే తెలియదగిన పరమాక్షరుడవు; నీవే ఈ విశ్వమునకు పరమాశ్రయము; నీవు అవ్యయుడవు, శాశ్వతధర్మరక్షకుడవు; నీవు సనాతన పురుషుడవని నా అభిప్రాయము.",m:"You are the supreme imperishable to be known; you are the ultimate refuge of this universe; you are imperishable, the guardian of eternal dharma; you are the eternal Person, I believe.",w:"త్వమ్=you; అక్షరమ్ పరమమ్=the supreme imperishable; వేదితవ్యమ్=to be known; అస్య విశ్వస్య=of this universe; పరమ్ నిధానమ్=the supreme resting place; అవ్యయః=imperishable; శాశ్వతధర్మగోప్తా=guardian of eternal dharma; సనాతనః=eternal; పురుషః=Person; మతః మే=is my conviction"};
D["11.19"]={t:["అనాదిమధ్యాన్తమనన్తవీర్యమనన్తబాహుం శశిసూర్యనేత్రమ్ |","పశ్యామి త్వాం దీప్తహుతాశవక్త్రం స్వతేజసా విశ్వమిదం తపన్తమ్ ||"],mt:"ఆదిమధ్యాంతములు లేని, అనంతవీర్యుడైన, అనంతబాహువులు గల, చంద్రసూర్యులు నేత్రములుగా గల, మండుచున్న అగ్నివంటి ముఖము గల, తన తేజస్సుచే ఈ విశ్వమును తపింపజేయు నిన్ను చూచుచున్నాను.",m:"I see you without beginning, middle or end, of infinite power and infinite arms, with the moon and sun as your eyes, with a mouth like blazing fire, heating this universe with your radiance.",w:"అనాదిమధ్యాన్తమ్=without beginning, middle or end; అనన్తవీర్యమ్=of infinite power; అనన్తబాహుమ్=of infinite arms; శశిసూర్యనేత్రమ్=with the moon and sun as eyes; పశ్యామి త్వామ్=I see you; దీప్తహుతాశవక్త్రమ్=with a mouth like blazing fire; స్వతేజసా=by your own radiance; విశ్వమ్ ఇదమ్=this universe; తపన్తమ్=heating"};
D["11.20"]={t:["ద్యావాపృథివ్యోరిదమన్తరం హి వ్యాప్తం త్వయైకేన దిశశ్చ సర్వాః |","దృష్ట్వాద్భుతం రూపమిదం తవోగ్రం లోకత్రయం ప్రవ్యథితం మహాత్మన్ ||"],mt:"ఓ మహాత్మా! భూమ్యాకాశముల మధ్యనున్న ఈ అంతరమును, అన్ని దిక్కులను నీవొక్కడవే వ్యాపించియున్నావు; నీ ఈ అద్భుతమైన ఉగ్రరూపమును చూచి ముల్లోకములు వణకుచున్నవి.",m:"This space between heaven and earth and all the directions are pervaded by you alone. Seeing this wondrous, terrible form of yours, the three worlds tremble, O great soul.",w:"ద్యావాపృథివ్యోః=of heaven and earth; ఇదమ్ అన్తరమ్=this space between; హి=indeed; వ్యాప్తమ్=pervaded; త్వయా ఏకేన=by you alone; దిశః చ సర్వాః=and all directions; దృష్ట్వా=seeing; అద్భుతమ్ రూపమ్ ఇదమ్=this wondrous form; తవ ఉగ్రమ్=your terrible; లోకత్రయమ్=the three worlds; ప్రవ్యథితమ్=tremble; మహాత్మన్=O great soul"};
D["11.21"]={t:["అమీ హి త్వాం సురసఙ్ఘా విశన్తి కేచిద్భీతాః ప్రాఞ్జలయో గృణన్తి |","స్వస్తీత్యుక్త్వా మహర్షిసిద్ధసఙ్ఘాః స్తువన్తి త్వాం స్తుతిభిః పుష్కలాభిః ||"],mt:"ఈ దేవతాసమూహములు నీలో ప్రవేశించుచున్నవి; కొందరు భయపడి చేతులు జోడించి స్తుతించుచున్నారు; మహర్షిసిద్ధసంఘములు “స్వస్తి” అని పలికి సమృద్ధమైన స్తోత్రములతో నిన్ను స్తుతించుచున్నారు.",m:"These hosts of gods are entering you; some, afraid, praise you with folded hands; hosts of great sages and perfected beings, saying “May it be well,” extol you with abundant hymns.",w:"అమీ=these; హి=indeed; త్వామ్=you; సురసఙ్ఘాః=hosts of gods; విశన్తి=enter; కేచిత్=some; భీతాః=afraid; ప్రాఞ్జలయః=with folded hands; గృణన్తి=praise; స్వస్తి ఇతి ఉక్త్వా=saying “May it be well”; మహర్షిసిద్ధసఙ్ఘాః=hosts of great sages and perfected beings; స్తువన్తి=extol; స్తుతిభిః పుష్కలాభిః=with abundant hymns"};
D["11.22"]={t:["రుద్రాదిత్యా వసవో యే చ సాధ్యా విశ్వేఽశ్వినౌ మరుతశ్చోష్మపాశ్చ |","గన్ధర్వయక్షాసురసిద్ధసఙ్ఘా వీక్షన్తే త్వాం విస్మితాశ్చైవ సర్వే ||"],mt:"రుద్రులు, ఆదిత్యులు, వసువులు, సాధ్యులు, విశ్వేదేవులు, అశ్వినులు, మరుత్తులు, పితరులు, గంధర్వ యక్ష అసుర సిద్ధసంఘములు అందరును విస్మయముతో నిన్ను చూచుచున్నారు.",m:"The Rudras, Adityas, Vasus, Sadhyas, Vishvedevas, the two Ashvins, the Maruts and the ancestors, and hosts of Gandharvas, Yakshas, Asuras and perfected beings all gaze at you in amazement.",w:"రుద్రాదిత్యాః=Rudras and Adityas; వసవః=Vasus; యే చ సాధ్యాః=and the Sadhyas; విశ్వే=the Vishvedevas; అశ్వినౌ=the two Ashvins; మరుతః చ=and the Maruts; ఊష్మపాః చ=and the ancestors; గన్ధర్వయక్షాసురసిద్ధసఙ్ఘాః=hosts of Gandharvas, Yakshas, Asuras and perfected beings; వీక్షన్తే=gaze; త్వామ్=at you; విస్మితాః=amazed; చ ఏవ సర్వే=and all"};
D["11.23"]={t:["రూపం మహత్తే బహువక్త్రనేత్రం మహాబాహో బహుబాహూరుపాదమ్ |","బహూదరం బహుదంష్ట్రాకరాలం దృష్ట్వా లోకాః ప్రవ్యథితాస్తథాహమ్ ||"],mt:"ఓ మహాబాహో! అనేక ముఖములు నేత్రములు, అనేక బాహువులు తొడలు పాదములు, అనేక ఉదరములు, అనేక కోరలతో భయంకరమైన నీ మహారూపమును చూచి లోకములు వణకుచున్నవి, నేనును అట్లే.",m:"Seeing your immense form with many mouths and eyes, many arms, thighs and feet, many bellies, and terrible with many fangs, O mighty-armed one, the worlds tremble, and so do I.",w:"రూపమ్ మహత్=immense form; తే=your; బహువక్త్రనేత్రమ్=with many mouths and eyes; మహాబాహో=O mighty-armed; బహుబాహూరుపాదమ్=with many arms, thighs and feet; బహూదరమ్=with many bellies; బహుదంష్ట్రాకరాలమ్=terrible with many fangs; దృష్ట్వా=seeing; లోకాః=the worlds; ప్రవ్యథితాః=tremble; తథా అహమ్=and so do I"};
D["11.24"]={t:["నభఃస్పృశం దీప్తమనేకవర్ణం వ్యాత్తాననం దీప్తవిశాలనేత్రమ్ |","దృష్ట్వా హి త్వాం ప్రవ్యథితాన్తరాత్మా ధృతిం న విన్దామి శమం చ విష్ణో ||"],mt:"ఓ విష్ణో! ఆకాశమును తాకు, ప్రకాశించు, అనేక వర్ణములు గల, తెరచిన నోరు, ప్రకాశించు విశాలనేత్రములు గల నిన్ను చూచి నా అంతరాత్మ కలతచెంది నేను ధైర్యమును శాంతిని పొందలేకున్నాను.",m:"Seeing you touching the sky, blazing, many-coloured, with gaping mouths and large glowing eyes, my inner self is shaken and I find neither steadiness nor peace, O Vishnu.",w:"నభఃస్పృశమ్=touching the sky; దీప్తమ్=blazing; అనేకవర్ణమ్=many-coloured; వ్యాత్తాననమ్=with gaping mouths; దీప్తవిశాలనేత్రమ్=with large glowing eyes; దృష్ట్వా హి త్వామ్=seeing you; ప్రవ్యథితాన్తరాత్మా=with my inner self shaken; ధృతిమ్ న విన్దామి=I find no steadiness; శమమ్ చ=and peace; విష్ణో=O Vishnu"};
D["11.25"]={t:["దంష్ట్రాకరాలాని చ తే ముఖాని దృష్ట్వైవ కాలానలసన్నిభాని |","దిశో న జానే న లభే చ శర్మ ప్రసీద దేవేశ జగన్నివాస ||"],mt:"కోరలతో భయంకరమైన, కాలాగ్నివంటి నీ ముఖములను చూచి నేను దిక్కులను తెలియలేకున్నాను, సుఖమును పొందలేకున్నాను; ఓ దేవేశా! జగన్నివాసా! ప్రసన్నుడవగుము.",m:"Seeing your mouths, terrible with fangs and like the fire of dissolution, I lose my sense of direction and find no comfort. Be gracious, O Lord of gods, abode of the universe.",w:"దంష్ట్రాకరాలాని=terrible with fangs; చ=and; తే ముఖాని=your mouths; దృష్ట్వా ఏవ=merely seeing; కాలానలసన్నిభాని=like the fire of dissolution; దిశః న జానే=I do not know the directions; న లభే చ శర్మ=nor do I find comfort; ప్రసీద=be gracious; దేవేశ=O Lord of gods; జగన్నివాస=O abode of the universe"};
D["11.26"]={t:["అమీ చ త్వాం ధృతరాష్ట్రస్య పుత్రాః సర్వే సహైవావనిపాలసఙ్ఘైః |","భీష్మో ద్రోణః సూతపుత్రస్తథాసౌ సహాస్మదీయైరపి యోధముఖ్యైః ||"],mt:"ధృతరాష్ట్రుని ఈ కుమారులందరును రాజసమూహములతో కూడి, భీష్ముడు, ద్రోణుడు, ఆ కర్ణుడు, మనవైపు ముఖ్య యోధులతో కూడి... (11.27 లో కొనసాగును)",m:"All these sons of Dhritarashtra, together with hosts of kings, and Bhishma, Drona and that son of the charioteer (Karna), along with the chief warriors of our side... (continues in 11.27)",w:"అమీ చ=and these; త్వామ్=you; ధృతరాష్ట్రస్య పుత్రాః సర్వే=all the sons of Dhritarashtra; సహ ఏవ=together; అవనిపాలసఙ్ఘైః=with hosts of kings; భీష్మః=Bhishma; ద్రోణః=Drona; సూతపుత్రః=the charioteer’s son (Karna); తథా అసౌ=and he; సహ=with; అస్మదీయైః అపి=our own too; యోధముఖ్యైః=chief warriors"};
D["11.27"]={t:["వక్త్రాణి తే త్వరమాణా విశన్తి దంష్ట్రాకరాలాని భయానకాని |","కేచిద్విలగ్నా దశనాన్తరేషు సన్దృశ్యన్తే చూర్ణితైరుత్తమాఙ్గైః ||"],mt:"...భయంకరములైన కోరలతో కూడిన నీ ముఖములలో త్వరపడుచు ప్రవేశించుచున్నారు; కొందరు పళ్ళసందులలో చిక్కి నలిగిన తలలతో కనబడుచున్నారు.",m:"...are rushing into your fearful mouths, terrible with fangs; some are seen caught between your teeth with their heads crushed.",w:"వక్త్రాణి=mouths; తే=your; త్వరమాణాః=rushing; విశన్తి=enter; దంష్ట్రాకరాలాని=terrible with fangs; భయానకాని=fearful; కేచిత్=some; విలగ్నాః=stuck; దశనాన్తరేషు=between the teeth; సన్దృశ్యన్తే=are seen; చూర్ణితైః ఉత్తమాఙ్గైః=with crushed heads"};
D["11.28"]={t:["యథా నదీనాం బహవోఽమ్బువేగాః సముద్రమేవాభిముఖా ద్రవన్తి |","తథా తవామీ నరలోకవీరా విశన్తి వక్త్రాణ్యభివిజ్వలన్తి ||"],mt:"అనేక నదీప్రవాహములు సముద్రమువైపే పరుగెత్తునట్లు, ఈ నరలోకవీరులు మండుచున్న నీ ముఖములలో ప్రవేశించుచున్నారు.",m:"As many rushing currents of rivers flow toward the ocean, so these heroes of the human world enter your blazing mouths.",w:"యథా=as; నదీనామ్=of rivers; బహవః అమ్బువేగాః=many currents of water; సముద్రమ్ ఏవ అభిముఖాః=toward the ocean alone; ద్రవన్తి=flow; తథా=so; తవ అమీ=these of yours; నరలోకవీరాః=heroes of the human world; విశన్తి=enter; వక్త్రాణి=mouths; అభివిజ్వలన్తి=blazing"};

// Chapter 11 – shlokas 11.29 to 11.42. Paste after your D object.
D["11.29"]={t:["యథా ప్రదీప్తం జ్వలనం పతఙ్గా విశన్తి నాశాయ సమృద్ధవేగాః |","తథైవ నాశాయ విశన్తి లోకాస్తవాపి వక్త్రాణి సమృద్ధవేగాః ||"],mt:"శలభములు వేగముగా నాశనము కొరకు మండుచున్న అగ్నిలో ప్రవేశించునట్లు, లోకములు నాశనము కొరకు వేగముగా నీ ముఖములలో ప్రవేశించుచున్నవి.",m:"As moths rush with great speed into a blazing fire to their destruction, so do these people rush with great speed into your mouths to their destruction.",w:"యథా=as; ప్రదీప్తమ్ జ్వలనమ్=a blazing fire; పతఙ్గాః=moths; విశన్తి=enter; నాశాయ=for destruction; సమృద్ధవేగాః=with great speed; తథా ఏవ=so also; లోకాః=people; తవ అపి వక్త్రాణి=your mouths too"};
D["11.30"]={t:["లేలిహ్యసే గ్రసమానః సమన్తాల్లోకాన్సమగ్రాన్వదనైర్జ్వలద్భిః |","తేజోభిరాపూర్య జగత్సమగ్రం భాసస్తవోగ్రాః ప్రతపన్తి విష్ణో ||"],mt:"మండుచున్న ముఖములతో సమస్త లోకములను అన్ని వైపులా మ్రింగుచు నాకుచున్నావు; ఓ విష్ణో! నీ ఉగ్రకాంతులు తేజస్సుతో జగత్తునంతటిని నింపి తపింపజేయుచున్నవి.",m:"You lick up and devour all the worlds on every side with your flaming mouths; filling the whole universe with radiance, your fierce rays burn, O Vishnu.",w:"లేలిహ్యసే=you lick; గ్రసమానః=devouring; సమన్తాత్=on every side; లోకాన్ సమగ్రాన్=all the worlds; వదనైః జ్వలద్భిః=with flaming mouths; తేజోభిః=with radiance; ఆపూర్య=filling; జగత్ సమగ్రమ్=the whole universe; భాసః తవ ఉగ్రాః=your fierce rays; ప్రతపన్తి=burn; విష్ణో=O Vishnu"};
D["11.31"]={t:["ఆఖ్యాహి మే కో భవానుగ్రరూపో నమోఽస్తు తే దేవవర ప్రసీద |","విజ్ఞాతుమిచ్ఛామి భవన్తమాద్యం న హి ప్రజానామి తవ ప్రవృత్తిమ్ ||"],mt:"ఉగ్రరూపుడవైన నీవెవరో నాకు చెప్పుము; ఓ దేవవరా! నీకు నమస్కారము, ప్రసన్నుడవగుము; ఆదిపురుషుడవైన నిన్ను తెలిసికొనగోరుచున్నాను; నీ ప్రవృత్తిని ఎరుగకున్నాను.",m:"Tell me who you are, of such fierce form. Salutations to you, O best of gods; be gracious. I wish to know you, the primal one, for I do not understand your activity.",w:"ఆఖ్యాహి=tell; మే=me; కః భవాన్=who you are; ఉగ్రరూపః=of fierce form; నమః అస్తు తే=salutations to you; దేవవర=O best of gods; ప్రసీద=be gracious; విజ్ఞాతుమ్ ఇచ్ఛామి=I wish to know; భవన్తమ్ ఆద్యమ్=you, the primal one; న హి ప్రజానామి=I do not understand; తవ ప్రవృత్తిమ్=your activity"};
D["11.32"]={t:["శ్రీభగవానువాచ |","కాలోఽస్మి లోకక్షయకృత్ప్రవృద్ధో లోకాన్సమాహర్తుమిహ ప్రవృత్తః |","ఋతేఽపి త్వాం న భవిష్యన్తి సర్వే యేఽవస్థితాః ప్రత్యనీకేషు యోధాః ||"],mt:"శ్రీభగవానుడు పలికెను: నేను లోకక్షయకారకుడనైన ప్రవృద్ధకాలమును; లోకములను సంహరించుటకై ఇచట ప్రవర్తించుచున్నాను; నీవు లేకున్నను ప్రతిపక్షములో నిలిచిన యోధులందరును ఉండరు.",m:"The Blessed Lord said: I am mighty Time, the destroyer of the worlds, engaged here in withdrawing the worlds. Even without you, none of the warriors standing in the opposing armies will survive.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; కాలః అస్మి=I am Time; లోకక్షయకృత్=destroyer of the worlds; ప్రవృద్ధః=fully grown; లోకాన్ సమాహర్తుమ్=to gather in the worlds; ఇహ ప్రవృత్తః=engaged here; ఋతే అపి త్వామ్=even without you; న భవిష్యన్తి=will not exist; సర్వే=all; యే అవస్థితాః=who stand; ప్రత్యనీకేషు=in the opposing armies; యోధాః=warriors"};
D["11.33"]={t:["తస్మాత్త్వముత్తిష్ఠ యశో లభస్వ జిత్వా శత్రూన్భుఙ్క్ష్వ రాజ్యం సమృద్ధమ్ |","మయైవైతే నిహతాః పూర్వమేవ నిమిత్తమాత్రం భవ సవ్యసాచిన్ ||"],mt:"కావున నీవు లెమ్ము, కీర్తిని పొందుము; శత్రువులను జయించి సమృద్ధమైన రాజ్యమును అనుభవింపుము; వీరు నాచేతనే పూర్వమే చంపబడిరి; ఓ సవ్యసాచీ! నీవు నిమిత్తమాత్రుడవు కమ్ము.",m:"Therefore arise and win glory; conquering your enemies, enjoy a prosperous kingdom. These have already been slain by me; be merely the instrument, O Savyasachin.",w:"తస్మాత్=therefore; త్వమ్=you; ఉత్తిష్ఠ=arise; యశః లభస్వ=win glory; జిత్వా శత్రూన్=conquering enemies; భుఙ్క్ష్వ=enjoy; రాజ్యమ్ సమృద్ధమ్=a prosperous kingdom; మయా ఏవ=by me alone; ఏతే నిహతాః=these have been slain; పూర్వమ్ ఏవ=already; నిమిత్తమాత్రమ్ భవ=be merely the instrument; సవ్యసాచిన్=O Savyasachin (Arjuna)"};
D["11.34"]={t:["ద్రోణం చ భీష్మం చ జయద్రథం చ కర్ణం తథాన్యానపి యోధవీరాన్ |","మయా హతాంస్త్వం జహి మా వ్యథిష్ఠా యుధ్యస్వ జేతాసి రణే సపత్నాన్ ||"],mt:"నాచే హతులైన ద్రోణుని, భీష్ముని, జయద్రథుని, కర్ణుని, ఇతర యోధవీరులను నీవు సంహరింపుము; భయపడకుము; యుద్ధము చేయుము; రణమున శత్రువులను జయించెదవు.",m:"Drona, Bhishma, Jayadratha, Karna and other heroic warriors have been slain by me; you slay them. Do not be afraid; fight, and you will conquer your enemies in battle.",w:"ద్రోణమ్ చ భీష్మమ్ చ=Drona and Bhishma; జయద్రథమ్ చ=and Jayadratha; కర్ణమ్=Karna; తథా అన్యాన్ అపి యోధవీరాన్=and other heroic warriors too; మయా హతాన్=slain by me; త్వమ్ జహి=you slay; మా వ్యథిష్ఠాః=do not be distressed; యుధ్యస్వ=fight; జేతాసి=you will conquer; రణే=in battle; సపత్నాన్=rivals"};
D["11.35"]={t:["సఞ్జయ ఉవాచ |","ఏతచ్ఛ్రుత్వా వచనం కేశవస్య కృతాఞ్జలిర్వేపమానః కిరీటీ |","నమస్కృత్వా భూయ ఏవాహ కృష్ణం సగద్గదం భీతభీతః ప్రణమ్య ||"],mt:"సంజయుడు పలికెను: కేశవుని ఈ మాట విని కిరీటి చేతులు జోడించి వణకుచు నమస్కరించి, భయభీతుడై గద్గదస్వరముతో మరల కృష్ణునితో ఇట్లు పలికెను.",m:"Sanjaya said: Hearing these words of Keshava, the crowned Arjuna, trembling with folded hands, bowed again and, overcome with fear, spoke to Krishna in a faltering voice.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఏతత్ శ్రుత్వా=hearing this; వచనమ్=speech; కేశవస్య=of Keshava; కృతాఞ్జలిః=with folded hands; వేపమానః=trembling; కిరీటీ=the crowned one (Arjuna); నమస్కృత్వా=bowing; భూయః ఏవ ఆహ=spoke again; కృష్ణమ్=to Krishna; సగద్గదమ్=in a faltering voice; భీతభీతః=very much afraid; ప్రణమ్య=prostrating"};
D["11.36"]={t:["అర్జున ఉవాచ |","స్థానే హృషీకేశ తవ ప్రకీర్త్యా జగత్ప్రహృష్యత్యనురజ్యతే చ |","రక్షాంసి భీతాని దిశో ద్రవన్తి సర్వే నమస్యన్తి చ సిద్ధసఙ్ఘాః ||"],mt:"అర్జునుడు పలికెను: ఓ హృషీకేశా! నీ కీర్తనచే జగత్తు సంతోషించుట, అనురాగము పొందుట యుక్తమే; రాక్షసులు భయపడి దిక్కులకు పారిపోవుట, సిద్ధసంఘములందరును నమస్కరించుట యుక్తమే.",m:"Arjuna said: It is fitting, O Hrishikesha, that the world rejoices and is devoted at your glorification; that demons flee in fear in all directions; and that all hosts of perfected beings bow to you.",w:"అర్జునః ఉవాచ=Arjuna said; స్థానే=it is fitting; హృషీకేశ=O Hrishikesha; తవ ప్రకీర్త్యా=at your glorification; జగత్=the world; ప్రహృష్యతి=rejoices; అనురజ్యతే చ=and is attached; రక్షాంసి=demons; భీతాని=afraid; దిశః ద్రవన్తి=flee in all directions; సర్వే నమస్యన్తి చ=and all bow; సిద్ధసఙ్ఘాః=hosts of perfected beings"};
D["11.37"]={t:["కస్మాచ్చ తే న నమేరన్మహాత్మన్గరీయసే బ్రహ్మణోఽప్యాదికర్త్రే |","అనన్త దేవేశ జగన్నివాస త్వమక్షరం సదసత్తత్పరం యత్ ||"],mt:"ఓ మహాత్మా! బ్రహ్మకంటెను గొప్పవాడవు, ఆదికర్తవు అయిన నీకు వారెందుకు నమస్కరింపరు? ఓ అనంతా! దేవేశా! జగన్నివాసా! సత్తు అసత్తులకు పరమైన అక్షరము నీవే.",m:"Why should they not bow to you, O great soul, greater than Brahma, the original creator? O Infinite One, Lord of gods, abode of the universe, you are the imperishable, that which is beyond being and non-being.",w:"కస్మాత్ చ=and why; తే=to you; న నమేరన్=should they not bow; మహాత్మన్=O great soul; గరీయసే=greater; బ్రహ్మణః అపి=even than Brahma; ఆదికర్త్రే=the original creator; అనన్త=O Infinite One; దేవేశ=O Lord of gods; జగన్నివాస=O abode of the universe; త్వమ్ అక్షరమ్=you are the imperishable; సత్ అసత్=being and non-being; తత్ పరమ్ యత్=that which is beyond"};
D["11.38"]={t:["త్వమాదిదేవః పురుషః పురాణస్త్వమస్య విశ్వస్య పరం నిధానమ్ |","వేత్తాసి వేద్యం చ పరం చ ధామ త్వయా తతం విశ్వమనన్తరూప ||"],mt:"నీవు ఆదిదేవుడవు, పురాణపురుషుడవు; ఈ విశ్వమునకు పరమాశ్రయము నీవే; తెలిసికొనువాడవు, తెలియదగినదియు, పరమధామమును నీవే; ఓ అనంతరూపా! నీచే విశ్వము వ్యాపింపబడినది.",m:"You are the primal God, the ancient Person, the supreme resting place of this universe; you are the knower, the knowable and the supreme abode. By you the universe is pervaded, O being of infinite form.",w:"త్వమ్ ఆదిదేవః=you are the primal God; పురుషః పురాణః=the ancient Person; అస్య విశ్వస్య=of this universe; పరమ్ నిధానమ్=the supreme resting place; వేత్తా అసి=you are the knower; వేద్యమ్ చ=and the knowable; పరమ్ చ ధామ=and the supreme abode; త్వయా=by you; తతమ్=pervaded; విశ్వమ్=the universe; అనన్తరూప=O being of infinite form"};
D["11.39"]={t:["వాయుర్యమోఽగ్నిర్వరుణః శశాఙ్కః ప్రజాపతిస్త్వం ప్రపితామహశ్చ |","నమో నమస్తేఽస్తు సహస్రకృత్వః పునశ్చ భూయోఽపి నమో నమస్తే ||"],mt:"వాయువు, యముడు, అగ్ని, వరుణుడు, చంద్రుడు, ప్రజాపతి, ప్రపితామహుడు నీవే; నీకు వేయిసార్లు నమస్కారము; మరల మరల నీకు నమస్కారము నమస్కారము.",m:"You are Vayu, Yama, Agni, Varuna, the moon, Prajapati and the great-grandfather. Salutations to you a thousand times, and again and yet again salutations to you.",w:"వాయుః=Vayu; యమః=Yama; అగ్నిః=Agni; వరుణః=Varuna; శశాఙ్కః=the moon; ప్రజాపతిః=Prajapati; త్వమ్=you; ప్రపితామహః చ=and the great-grandfather; నమః నమః తే అస్తు=salutations, salutations to you; సహస్రకృత్వః=a thousand times; పునః చ భూయః అపి=again and yet again; నమః నమః తే=salutations to you"};
D["11.40"]={t:["నమః పురస్తాదథ పృష్ఠతస్తే నమోఽస్తు తే సర్వత ఏవ సర్వ |","అనన్తవీర్యామితవిక్రమస్త్వం సర్వం సమాప్నోషి తతోఽసి సర్వః ||"],mt:"ముందు నుండియు వెనుక నుండియు నీకు నమస్కారము; ఓ సర్వస్వరూపా! అన్ని వైపులనుండియు నీకు నమస్కారము; అనంతవీర్యుడవు, అమితపరాక్రముడవైన నీవు సర్వమును వ్యాపించియున్నావు, కావున నీవే సర్వము.",m:"Salutations to you from the front and from behind; salutations to you on every side, O All. You are of infinite power and immeasurable valour; you pervade everything, therefore you are everything.",w:"నమః=salutations; పురస్తాత్=from the front; అథ పృష్ఠతః తే=and from behind you; నమః అస్తు తే=salutations to you; సర్వతః ఏవ=on every side; సర్వ=O All; అనన్తవీర్యామితవిక్రమః త్వమ్=you of infinite power and immeasurable valour; సర్వమ్ సమాప్నోషి=you pervade everything; తతః అసి సర్వః=therefore you are everything"};
D["11.41"]={t:["సఖేతి మత్వా ప్రసభం యదుక్తం హే కృష్ణ హే యాదవ హే సఖేతి |","అజానతా మహిమానం తవేదం మయా ప్రమాదాత్ప్రణయేన వాపి ||"],mt:"నీ ఈ మహిమను ఎరుగక, సఖుడని తలచి, ప్రమాదముచేతనో ప్రేమచేతనో “ఓ కృష్ణా! ఓ యాదవా! ఓ సఖా!” అని నేను బలవంతముగా పలికిన దానిని... (11.42 లో కొనసాగును)",m:"Whatever I rashly said, thinking you a friend, “O Krishna! O Yadava! O friend!”, not knowing this greatness of yours, through carelessness or even affection... (continues in 11.42)",w:"సఖా ఇతి మత్వా=thinking you a friend; ప్రసభమ్=rashly; యత్ ఉక్తమ్=whatever was said; హే కృష్ణ హే యాదవ హే సఖా=O Krishna, O Yadava, O friend; ఇతి=thus; అజానతా=not knowing; మహిమానమ్ తవ ఇదమ్=this greatness of yours; మయా=by me; ప్రమాదాత్=through carelessness; ప్రణయేన వా అపి=or even through affection"};
D["11.42"]={t:["యచ్చావహాసార్థమసత్కృతోఽసి విహారశయ్యాసనభోజనేషు |","ఏకోఽథవాప్యచ్యుత తత్సమక్షం తత్క్షామయే త్వామహమప్రమేయమ్ ||"],mt:"...విహారశయ్యాసనభోజనములలో, ఒంటరిగానైనను, ఇతరుల సమక్షమునైనను పరిహాసముగా నేను నిన్ను అవమానించినచో, ఓ అచ్యుతా! ఆ అపరాధమును అప్రమేయుడవైన నిన్ను క్షమింపమని వేడుకొనుచున్నాను.",m:"...and in whatever way I disrespected you in jest, while at play, resting, sitting or eating, alone or in the presence of others, O Achyuta, for that I beg forgiveness from you, the immeasurable.",w:"యత్ చ అవహాసార్థమ్=and whatever in jest; అసత్కృతః అసి=you were disrespected; విహారశయ్యాసనభోజనేషు=during play, rest, sitting and meals; ఏకః=alone; అథవా అపి=or even; అచ్యుత=O Achyuta; తత్ సమక్షమ్=in the presence of others; తత్=for that; క్షామయే=I beg forgiveness; త్వామ్ అహమ్=from you I; అప్రమేయమ్=the immeasurable"};

// Chapter 11 – shlokas 11.43 to 11.55 (completes chapter 11). Paste after your D object.
D["11.43"]={t:["పితాసి లోకస్య చరాచరస్య త్వమస్య పూజ్యశ్చ గురుర్గరీయాన్ |","న త్వత్సమోఽస్త్యభ్యధికః కుతోఽన్యో లోకత్రయేఽప్యప్రతిమప్రభావ ||"],mt:"నీవు చరాచరజగత్తునకు తండ్రివి, పూజ్యుడవు, గురువులలో గొప్పవాడవు; నీతో సమానుడు లేడు; ఓ అప్రతిమప్రభావా! ముల్లోకములలోనైనను నీకంటె అధికుడు ఎక్కడ?",m:"You are the father of this world of the moving and the unmoving, its object of worship and its greatest teacher. None is equal to you; how then could there be anyone greater in the three worlds, O being of incomparable power?",w:"పితా అసి=you are the father; లోకస్య చరాచరస్య=of the world of moving and unmoving; త్వమ్ అస్య=you of this; పూజ్యః చ=and worthy of worship; గురుః గరీయాన్=the greatest teacher; న త్వత్సమః అస్తి=none is equal to you; అభ్యధికః=greater; కుతః అన్యః=how another; లోకత్రయే అపి=even in the three worlds; అప్రతిమప్రభావ=O being of incomparable power"};
D["11.44"]={t:["తస్మాత్ప్రణమ్య ప్రణిధాయ కాయం ప్రసాదయే త్వామహమీశమీడ్యమ్ |","పితేవ పుత్రస్య సఖేవ సఖ్యుః ప్రియః ప్రియాయార్హసి దేవ సోఢుమ్ ||"],mt:"కావున శరీరమును వంచి నమస్కరించి, స్తుతింపదగిన ఈశుడవైన నిన్ను ప్రసన్నుని చేయుచున్నాను; తండ్రి కుమారుని, స్నేహితుడు స్నేహితుని, ప్రియుడు ప్రియురాలిని సహించునట్లు, ఓ దేవా! నన్ను సహింపుము.",m:"Therefore, bowing and prostrating my body, I seek your grace, O adorable Lord. As a father forgives a son, a friend a friend, and a beloved her lover, so should you forgive me, O God.",w:"తస్మాత్=therefore; ప్రణమ్య=bowing; ప్రణిధాయ కాయమ్=prostrating the body; ప్రసాదయే=I seek the grace of; త్వామ్ అహమ్=you I; ఈశమ్=the Lord; ఈడ్యమ్=adorable; పితా ఇవ పుత్రస్య=like a father to a son; సఖా ఇవ సఖ్యుః=like a friend to a friend; ప్రియః ప్రియాయాః=like a lover to a beloved; అర్హసి=you ought; దేవ=O God; సోఢుమ్=to forgive"};
D["11.45"]={t:["అదృష్టపూర్వం హృషితోఽస్మి దృష్ట్వా భయేన చ ప్రవ్యథితం మనో మే |","తదేవ మే దర్శయ దేవ రూపం ప్రసీద దేవేశ జగన్నివాస ||"],mt:"ముందెన్నడును చూడనిదానిని చూచి సంతోషించితిని, భయముచే నా మనస్సు కలతచెందినది; ఓ దేవా! ఆ (పూర్వ) రూపమునే నాకు చూపుము; ఓ దేవేశా! జగన్నివాసా! ప్రసన్నుడవగుము.",m:"I am delighted at having seen what was never seen before, yet my mind is shaken with fear. Show me that same (earlier) form, O God; be gracious, O Lord of gods, abode of the universe.",w:"అదృష్టపూర్వమ్=never seen before; హృషితః అస్మి=I am delighted; దృష్ట్వా=having seen; భయేన చ=and with fear; ప్రవ్యథితమ్=shaken; మనః మే=my mind; తత్ ఏవ=that very; మే దర్శయ=show me; దేవ=O God; రూపమ్=form; ప్రసీద=be gracious; దేవేశ=O Lord of gods; జగన్నివాస=O abode of the universe"};
D["11.46"]={t:["కిరీటినం గదినం చక్రహస్తమిచ్ఛామి త్వాం ద్రష్టుమహం తథైవ |","తేనైవ రూపేణ చతుర్భుజేన సహస్రబాహో భవ విశ్వమూర్తే ||"],mt:"కిరీటము, గద, చక్రము చేతధరించిన నిన్ను అట్లే చూడగోరుచున్నాను; ఓ సహస్రబాహో! విశ్వమూర్తీ! ఆ చతుర్భుజరూపముతోనే అగుము.",m:"I wish to see you as before, with crown, mace and discus in hand. Take that very four-armed form, O thousand-armed one, O universal form.",w:"కిరీటినమ్=with a crown; గదినమ్=with a mace; చక్రహస్తమ్=with a discus in hand; ఇచ్ఛామి=I wish; త్వామ్ ద్రష్టుమ్=to see you; అహమ్=I; తథా ఏవ=just so; తేన ఏవ రూపేణ=in that very form; చతుర్భుజేన=four-armed; సహస్రబాహో=O thousand-armed one; భవ=become; విశ్వమూర్తే=O universal form"};
D["11.47"]={t:["శ్రీభగవానువాచ |","మయా ప్రసన్నేన తవార్జునేదం రూపం పరం దర్శితమాత్మయోగాత్ |","తేజోమయం విశ్వమనన్తమాద్యం యన్మే త్వదన్యేన న దృష్టపూర్వమ్ ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ అర్జునా! ప్రసన్నుడనై నా ఆత్మయోగముచే నీకు ఈ తేజోమయమైన, విశ్వమైన, అనంతమైన, ఆద్యమైన పరమరూపమును చూపితిని; ఇది నీవు తప్ప మరెవరును ముందెన్నడును చూడలేదు.",m:"The Blessed Lord said: Pleased with you, O Arjuna, I have shown you by my own yogic power this supreme form, radiant, universal, infinite and primal, which no one other than you has seen before.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; మయా ప్రసన్నేన=by me, being pleased; తవ=to you; అర్జున=O Arjuna; ఇదమ్ రూపమ్ పరమ్=this supreme form; దర్శితమ్=has been shown; ఆత్మయోగాత్=by my own yogic power; తేజోమయమ్=radiant; విశ్వమ్=universal; అనన్తమ్=infinite; ఆద్యమ్=primal; యత్ మే=which of mine; త్వదన్యేన=by anyone other than you; న దృష్టపూర్వమ్=has not been seen before"};
D["11.48"]={t:["న వేదయజ్ఞాధ్యయనైర్న దానైర్న చ క్రియాభిర్న తపోభిరుగ్రైః |","ఏవంరూపః శక్య అహం నృలోకే ద్రష్టుం త్వదన్యేన కురుప్రవీర ||"],mt:"ఓ కురుప్రవీరా! వేదయజ్ఞాధ్యయనములచేతను, దానములచేతను, క్రియలచేతను, ఉగ్రతపస్సులచేతను కూడా మనుష్యలోకమున ఇట్టి రూపముగల నన్ను నీవు తప్ప ఇతరులు చూడజాలరు.",m:"Not by study of the Vedas and sacrifices, nor by charity, nor by rituals, nor by severe austerities can I be seen in this form in the human world by anyone other than you, O hero of the Kurus.",w:"న వేదయజ్ఞాధ్యయనైః=not by Vedas, sacrifices and study; న దానైః=not by charity; న చ క్రియాభిః=nor by rituals; న తపోభిః ఉగ్రైః=nor by severe austerities; ఏవంరూపః=of this form; శక్యః అహమ్=I can be; నృలోకే=in the human world; ద్రష్టుమ్=seen; త్వదన్యేన=by anyone other than you; కురుప్రవీర=O hero of the Kurus"};
D["11.49"]={t:["మా తే వ్యథా మా చ విమూఢభావో దృష్ట్వా రూపం ఘోరమీదృఙ్మమేదమ్ |","వ్యపేతభీః ప్రీతమనాః పునస్త్వం తదేవ మే రూపమిదం ప్రపశ్య ||"],mt:"ఇట్టి నా ఈ ఘోరరూపమును చూచి నీకు వ్యథయు వద్దు, విమూఢభావమును వద్దు; భయము విడిచి ప్రీతిమనస్కుడవై నా ఆ (పూర్వ)రూపమునే మరల చూడుము.",m:"Do not be distressed or bewildered at seeing this terrible form of mine. Free from fear and with a glad heart, behold again that same form of mine.",w:"మా తే వ్యథా=let there be no distress for you; మా చ విమూఢభావః=nor bewilderment; దృష్ట్వా=seeing; రూపమ్ ఘోరమ్=terrible form; ఈదృక్=such; మమ ఇదమ్=this of mine; వ్యపేతభీః=free from fear; ప్రీతమనాః=with a glad heart; పునః త్వమ్=you again; తత్ ఏవ మే రూపమ్ ఇదమ్=that same form of mine; ప్రపశ్య=behold"};
D["11.50"]={t:["సఞ్జయ ఉవాచ |","ఇత్యర్జునం వాసుదేవస్తథోక్త్వా స్వకం రూపం దర్శయామాస భూయః |","ఆశ్వాసయామాస చ భీతమేనం భూత్వా పునః సౌమ్యవపుర్మహాత్మా ||"],mt:"సంజయుడు పలికెను: ఇట్లు అర్జునునితో చెప్పి వాసుదేవుడు మరల తన (పూర్వ) రూపమును చూపెను; మహాత్ముడు సౌమ్యరూపుడై భయపడిన ఇతనిని ఓదార్చెను.",m:"Sanjaya said: Having spoken thus to Arjuna, Vasudeva showed his own form again; and the great soul, taking a gentle form once more, comforted the frightened Arjuna.",w:"సఞ్జయః ఉవాచ=Sanjaya said; ఇతి అర్జునమ్=thus to Arjuna; వాసుదేవః=Vasudeva; తథా ఉక్త్వా=having spoken so; స్వకమ్ రూపమ్=his own form; దర్శయామాస=showed; భూయః=again; ఆశ్వాసయామాస చ=and comforted; భీతమ్ ఏనమ్=this frightened one; భూత్వా పునః=becoming again; సౌమ్యవపుః=of gentle form; మహాత్మా=the great soul"};
D["11.51"]={t:["అర్జున ఉవాచ |","దృష్ట్వేదం మానుషం రూపం తవ సౌమ్యం జనార్దన |","ఇదానీమస్మి సంవృత్తః సచేతాః ప్రకృతిం గతః ||"],mt:"అర్జునుడు పలికెను: ఓ జనార్దనా! నీ ఈ సౌమ్యమైన మానుషరూపమును చూచి ఇప్పుడు నేను స్వస్థచిత్తుడనైతిని, సహజస్థితిని పొందితిని.",m:"Arjuna said: Seeing this gentle human form of yours, O Janardana, I am now composed and restored to my normal state.",w:"అర్జునః ఉవాచ=Arjuna said; దృష్ట్వా=seeing; ఇదమ్ మానుషమ్ రూపమ్=this human form; తవ సౌమ్యమ్=your gentle; జనార్దన=O Janardana; ఇదానీమ్=now; అస్మి సంవృత్తః=I have become; సచేతాః=composed; ప్రకృతిమ్ గతః=restored to my normal state"};
D["11.52"]={t:["శ్రీభగవానువాచ |","సుదుర్దర్శమిదం రూపం దృష్టవానసి యన్మమ |","దేవా అప్యస్య రూపస్య నిత్యం దర్శనకాఙ్క్షిణః ||"],mt:"శ్రీభగవానుడు పలికెను: నీవు చూచిన నా ఈ రూపము చూచుటకు మిక్కిలి దుర్లభము; దేవతలును ఈ రూపమును ఎల్లప్పుడును చూడగోరుదురు.",m:"The Blessed Lord said: This form of mine that you have seen is very hard to behold; even the gods are always eager to see this form.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; సుదుర్దర్శమ్=very hard to see; ఇదమ్ రూపమ్=this form; దృష్టవాన్ అసి=you have seen; యత్ మమ=which of mine; దేవాః అపి=even the gods; అస్య రూపస్య=of this form; నిత్యమ్=always; దర్శనకాఙ్క్షిణః=eager to see"};
D["11.53"]={t:["నాహం వేదైర్న తపసా న దానేన న చేజ్యయా |","శక్య ఏవంవిధో ద్రష్టుం దృష్టవానసి మాం యథా ||"],mt:"నీవు నన్ను చూచినట్లు, ఈ విధముగా వేదములచేతగాని, తపస్సుచేతగాని, దానముచేతగాని, యజ్ఞముచేతగాని నేను చూడబడజాలను.",m:"Neither by the Vedas, nor by austerity, nor by charity, nor by sacrifice can I be seen in the way you have seen me.",w:"న అహమ్ వేదైః=not I by the Vedas; న తపసా=nor by austerity; న దానేన=nor by charity; న చ ఇజ్యయా=nor by sacrifice; శక్యః ఏవంవిధః=can such a one be; ద్రష్టుమ్=seen; దృష్టవాన్ అసి మామ్ యథా=as you have seen me"};
D["11.54"]={t:["భక్త్యా త్వనన్యయా శక్య అహమేవంవిధోఽర్జున |","జ్ఞాతుం ద్రష్టుం చ తత్త్వేన ప్రవేష్టుం చ పరన్తప ||"],mt:"ఓ అర్జునా! ఓ పరంతపా! అనన్యభక్తిచేతనే ఈ విధముగా నన్ను తత్త్వముగా తెలిసికొనుటకును, చూచుటకును, ప్రవేశించుటకును శక్యము.",m:"But by unwavering devotion alone, O Arjuna, O scorcher of foes, can I be known in this form, seen in truth, and entered into.",w:"భక్త్యా తు అనన్యయా=but by unwavering devotion; శక్యః అహమ్ ఏవంవిధః=I can be in this form; అర్జున=O Arjuna; జ్ఞాతుమ్=to be known; ద్రష్టుమ్ చ=and seen; తత్త్వేన=in truth; ప్రవేష్టుమ్ చ=and entered into; పరన్తప=O scorcher of foes"};
D["11.55"]={t:["మత్కర్మకృన్మత్పరమో మద్భక్తః సఙ్గవర్జితః |","నిర్వైరః సర్వభూతేషు యః స మామేతి పాణ్డవ ||"],mt:"ఓ పాండవా! నా కొరకే కర్మలు చేయువాడు, నన్నే పరమగతిగా భావించువాడు, నా భక్తుడు, ఆసక్తి వదలినవాడు, సర్వభూతములయందు వైరము లేనివాడు నన్నే పొందును.",m:"One who does work for me, holds me as the supreme goal, is my devotee, free from attachment, and without enmity toward any being, comes to me, O Pandava.",w:"మత్కర్మకృత్=one who does work for me; మత్పరమః=holding me as the supreme goal; మద్భక్తః=my devotee; సఙ్గవర్జితః=free from attachment; నిర్వైరః=without enmity; సర్వభూతేషు=toward all beings; యః=who; సః మామ్ ఏతి=he comes to me; పాణ్డవ=O Pandava"};

// Chapter 12 – shlokas 12.1 to 12.10. Paste after your D object.
D["12.1"]={t:["అర్జున ఉవాచ |","ఏవం సతతయుక్తా యే భక్తాస్త్వాం పర్యుపాసతే |","యే చాప్యక్షరమవ్యక్తం తేషాం కే యోగవిత్తమాః ||"],mt:"అర్జునుడు పలికెను: ఇట్లు నిత్యయుక్తులై నిన్ను ఉపాసించు భక్తులును, అక్షరమైన అవ్యక్తమును ఉపాసించువారును — వీరిలో యోగవిత్తములు ఎవరు?",m:"Arjuna said: Of those devotees who, ever steadfast, worship you thus, and those who worship the imperishable unmanifest, which are the best knowers of yoga?",w:"అర్జునః ఉవాచ=Arjuna said; ఏవమ్=thus; సతతయుక్తాః=ever steadfast; యే భక్తాః=the devotees who; త్వామ్=you; పర్యుపాసతే=worship; యే చ అపి=and those who also; అక్షరమ్ అవ్యక్తమ్=the imperishable unmanifest; తేషామ్=of these; కే=who; యోగవిత్తమాః=the best knowers of yoga"};
D["12.2"]={t:["శ్రీభగవానువాచ |","మయ్యావేశ్య మనో యే మాం నిత్యయుక్తా ఉపాసతే |","శ్రద్ధయా పరయోపేతాస్తే మే యుక్తతమా మతాః ||"],mt:"శ్రీభగవానుడు పలికెను: నాయందు మనస్సును నిలిపి, నిత్యయుక్తులై పరమశ్రద్ధతో నన్ను ఉపాసించువారు నాకు యుక్తతములని నా అభిప్రాయము.",m:"The Blessed Lord said: Those who fix their minds on me and worship me, ever steadfast and endowed with supreme faith, I consider the most perfect in yoga.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; మయి ఆవేశ్య=fixing on me; మనః=the mind; యే=who; మామ్=me; నిత్యయుక్తాః=ever steadfast; ఉపాసతే=worship; శ్రద్ధయా పరయా ఉపేతాః=endowed with supreme faith; తే=they; మే=by me; యుక్తతమాః=the most perfect; మతాః=are considered"};
D["12.3"]={t:["యే త్వక్షరమనిర్దేశ్యమవ్యక్తం పర్యుపాసతే |","సర్వత్రగమచిన్త్యం చ కూటస్థమచలం ధ్రువమ్ ||"],mt:"ఏ వారు అక్షరమును, నిర్దేశింపరానిదానిని, అవ్యక్తమును, సర్వవ్యాపకమును, అచింత్యమును, కూటస్థమును, అచలమును, ధ్రువమును ఉపాసింతురో... (12.4 లో కొనసాగును)",m:"But those who worship the imperishable, the indefinable, the unmanifest, the all-pervading, the inconceivable, the unchanging, the immovable and the constant... (continues in 12.4)",w:"యే తు=but those who; అక్షరమ్=the imperishable; అనిర్దేశ్యమ్=the indefinable; అవ్యక్తమ్=the unmanifest; పర్యుపాసతే=worship; సర్వత్రగమ్=the all-pervading; అచిన్త్యమ్ చ=and the inconceivable; కూటస్థమ్=the unchanging; అచలమ్=the immovable; ధ్రువమ్=the constant"};
D["12.4"]={t:["సన్నియమ్యేన్ద్రియగ్రామం సర్వత్ర సమబుద్ధయః |","తే ప్రాప్నువన్తి మామేవ సర్వభూతహితే రతాః ||"],mt:"...ఇంద్రియసమూహమును చక్కగా నియమించి, అన్నిచోట్ల సమబుద్ధి గలవారై, సర్వభూతహితమందు రతులై నన్నే పొందుదురు.",m:"...restraining the group of senses and having equal vision everywhere, engaged in the welfare of all beings, they also attain me alone.",w:"సన్నియమ్య=restraining; ఇన్ద్రియగ్రామమ్=the group of senses; సర్వత్ర=everywhere; సమబుద్ధయః=of equal mind; తే=they; ప్రాప్నువన్తి=attain; మామ్ ఏవ=me alone; సర్వభూతహితే రతాః=engaged in the welfare of all beings"};
D["12.5"]={t:["క్లేశోఽధికతరస్తేషామవ్యక్తాసక్తచేతసామ్ |","అవ్యక్తా హి గతిర్దుఃఖం దేహవద్భిరవాప్యతే ||"],mt:"అవ్యక్తమునందు ఆసక్తచిత్తులైన వారికి శ్రమ అధికము; ఎందుకనగా దేహధారులకు అవ్యక్తగతి దుఃఖముతో లభించును.",m:"The hardship is greater for those whose minds are attached to the unmanifest, for the unmanifest goal is attained with difficulty by the embodied.",w:"క్లేశః అధికతరః=greater hardship; తేషామ్=for them; అవ్యక్తాసక్తచేతసామ్=whose minds are attached to the unmanifest; అవ్యక్తా హి గతిః=the unmanifest goal indeed; దుఃఖమ్=with difficulty; దేహవద్భిః=by the embodied; అవాప్యతే=is attained"};
D["12.6"]={t:["యే తు సర్వాణి కర్మాణి మయి సన్న్యస్య మత్పరాః |","అనన్యేనైవ యోగేన మాం ధ్యాయన్త ఉపాసతే ||"],mt:"ఎవరు సర్వకర్మలను నాయందు సమర్పించి, నన్నే పరమగతిగా భావించి, అనన్యయోగముచే నన్ను ధ్యానించుచు ఉపాసింతురో... (12.7 లో కొనసాగును)",m:"But those who surrender all actions to me, holding me as the supreme goal, and worship me meditating with undivided yoga... (continues in 12.7)",w:"యే తు=but those who; సర్వాణి కర్మాణి=all actions; మయి సన్న్యస్య=surrendering to me; మత్పరాః=holding me as the supreme goal; అనన్యేన ఏవ యోగేన=by undivided yoga alone; మామ్ ధ్యాయన్తః=meditating on me; ఉపాసతే=worship"};
D["12.7"]={t:["తేషామహం సముద్ధర్తా మృత్యుసంసారసాగరాత్ |","భవామి నచిరాత్పార్థ మయ్యావేశితచేతసామ్ ||"],mt:"...ఓ పార్థా! నాయందే చిత్తము నిలిపిన వారిని మృత్యుసంసారసాగరమునుండి నేను త్వరలో ఉద్ధరించువాడనగుదును.",m:"...for those whose minds are fixed on me, I become before long the deliverer from the ocean of death and rebirth, O Partha.",w:"తేషామ్=of them; అహమ్=I; సముద్ధర్తా=deliverer; మృత్యుసంసారసాగరాత్=from the ocean of death and rebirth; భవామి=I become; నచిరాత్=before long; పార్థ=O Partha; మయి ఆవేశితచేతసామ్=whose minds are fixed on me"};
D["12.8"]={t:["మయ్యేవ మన ఆధత్స్వ మయి బుద్ధిం నివేశయ |","నివసిష్యసి మయ్యేవ అత ఊర్ధ్వం న సంశయః ||"],mt:"నాయందే మనస్సును నిలుపుము, నాయందే బుద్ధిని ప్రవేశింపజేయుము; ఇకపై నాయందే నివసించెదవు; సంశయము లేదు.",m:"Fix your mind on me alone, let your intellect enter into me; thereafter you will dwell in me alone, without doubt.",w:"మయి ఏవ=on me alone; మనః=mind; ఆధత్స్వ=fix; మయి=in me; బుద్ధిమ్=intellect; నివేశయ=place; నివసిష్యసి=you will dwell; మయి ఏవ=in me alone; అతః ఊర్ధ్వమ్=thereafter; న సంశయః=no doubt"};
D["12.9"]={t:["అథ చిత్తం సమాధాతుం న శక్నోషి మయి స్థిరమ్ |","అభ్యాసయోగేన తతో మామిచ్ఛాప్తుం ధనఞ్జయ ||"],mt:"ఓ ధనంజయా! నాయందు చిత్తమును స్థిరముగా నిలుపజాలనిచో, అభ్యాసయోగముచే నన్ను పొందగోరుము.",m:"If you are unable to fix your mind steadily on me, then seek to reach me by the yoga of practice, O Dhananjaya.",w:"అథ=if; చిత్తమ్=mind; సమాధాతుమ్=to fix; న శక్నోషి=you are unable; మయి స్థిరమ్=steadily on me; అభ్యాసయోగేన=by the yoga of practice; తతః=then; మామ్=me; ఇచ్ఛ ఆప్తుమ్=seek to reach; ధనఞ్జయ=O Dhananjaya"};
D["12.10"]={t:["అభ్యాసేఽప్యసమర్థోఽసి మత్కర్మపరమో భవ |","మదర్థమపి కర్మాణి కుర్వన్సిద్ధిమవాప్స్యసి ||"],mt:"అభ్యాసమునందును అసమర్థుడవైనచో, నా కొరకు కర్మలు చేయుటయే పరమలక్ష్యముగా కలవాడవు కమ్ము; నా కొరకు కర్మలు చేయుచున్నను సిద్ధిని పొందెదవు.",m:"If you are unable even to practise, make working for me your supreme aim; even by performing actions for my sake you will attain perfection.",w:"అభ్యాసే అపి=even in practice; అసమర్థః అసి=you are unable; మత్కర్మపరమః భవ=make working for me your supreme aim; మదర్థమ్ అపి=even for my sake; కర్మాణి=actions; కుర్వన్=performing; సిద్ధిమ్=perfection; అవాప్స్యసి=you will attain"};


// Chapter 12 – shlokas 12.11 to 12.20 (completes chapter 12). Paste after your D object.
D["12.11"]={t:["అథైతదప్యశక్తోఽసి కర్తుం మద్యోగమాశ్రితః |","సర్వకర్మఫలత్యాగం తతః కురు యతాత్మవాన్ ||"],mt:"దీనిని కూడా చేయలేనిచో, నా యోగమును ఆశ్రయించి, యతాత్ముడవై సర్వకర్మఫలత్యాగమును చేయుము.",m:"If you are unable even to do this, then, taking refuge in my yoga and self-controlled, renounce the fruits of all action.",w:"అథ=if; ఏతత్ అపి=even this; అశక్తః అసి=you are unable; కర్తుమ్=to do; మద్యోగమ్ ఆశ్రితః=taking refuge in my yoga; సర్వకర్మఫలత్యాగమ్=renunciation of the fruits of all action; తతః కురు=then do; యతాత్మవాన్=self-controlled"};
D["12.12"]={t:["శ్రేయో హి జ్ఞానమభ్యాసాజ్జ్ఞానాద్ధ్యానం విశిష్యతే |","ధ్యానాత్కర్మఫలత్యాగస్త్యాగాచ్ఛాన్తిరనన్తరమ్ ||"],mt:"అభ్యాసముకంటె జ్ఞానము శ్రేష్ఠము; జ్ఞానముకంటె ధ్యానము విశిష్టము; ధ్యానముకంటె కర్మఫలత్యాగము; త్యాగమువలన వెంటనే శాంతి కలుగును.",m:"Knowledge is better than practice; meditation excels knowledge; renunciation of the fruits of action excels meditation; and peace follows immediately upon renunciation.",w:"శ్రేయః=better; హి=indeed; జ్ఞానమ్=knowledge; అభ్యాసాత్=than practice; జ్ఞానాత్=than knowledge; ధ్యానమ్=meditation; విశిష్యతే=excels; ధ్యానాత్=than meditation; కర్మఫలత్యాగః=renunciation of the fruits of action; త్యాగాత్=from renunciation; శాన్తిః=peace; అనన్తరమ్=immediately after"};
D["12.13"]={t:["అద్వేష్టా సర్వభూతానాం మైత్రః కరుణ ఏవ చ |","నిర్మమో నిరహఙ్కారః సమదుఃఖసుఖః క్షమీ ||"],mt:"సర్వభూతములయందు ద్వేషములేనివాడు, మైత్రి కరుణ గలవాడు, మమకారము అహంకారము లేనివాడు, సుఖదుఃఖములయందు సమభావము గలవాడు, క్షమాశీలుడు... (12.14 లో కొనసాగును)",m:"One who hates no being, who is friendly and compassionate, free from possessiveness and ego, equal in pain and pleasure, and forgiving... (continues in 12.14)",w:"అద్వేష్టా=not hating; సర్వభూతానామ్=any being; మైత్రః=friendly; కరుణః ఏవ చ=and compassionate; నిర్మమః=free from possessiveness; నిరహఙ్కారః=free from ego; సమదుఃఖసుఖః=equal in pain and pleasure; క్షమీ=forgiving"};
D["12.14"]={t:["సన్తుష్టః సతతం యోగీ యతాత్మా దృఢనిశ్చయః |","మయ్యర్పితమనోబుద్ధిర్యో మద్భక్తః స మే ప్రియః ||"],mt:"...ఎల్లప్పుడును సంతుష్టుడు, యోగి, యతాత్ముడు, దృఢనిశ్చయుడు, నాయందు మనోబుద్ధులను అర్పించిన నా భక్తుడు నాకు ప్రియుడు.",m:"...always content, a yogi, self-controlled, of firm resolve, with mind and intellect dedicated to me: such a devotee of mine is dear to me.",w:"సన్తుష్టః=content; సతతమ్=always; యోగీ=a yogi; యతాత్మా=self-controlled; దృఢనిశ్చయః=of firm resolve; మయి అర్పితమనోబుద్ధిః=with mind and intellect dedicated to me; యః=who; మద్భక్తః=my devotee; సః=he; మే ప్రియః=dear to me"};
D["12.15"]={t:["యస్మాన్నోద్విజతే లోకో లోకాన్నోద్విజతే చ యః |","హర్షామర్షభయోద్వేగైర్ముక్తో యః స చ మే ప్రియః ||"],mt:"ఎవనివలన లోకము కలతచెందదో, ఎవడు లోకముచే కలతచెందడో, హర్షామర్షభయోద్వేగములనుండి విముక్తుడో అతడును నాకు ప్రియుడు.",m:"One by whom the world is not disturbed, and who is not disturbed by the world, and who is free from joy, envy, fear and anxiety, is also dear to me.",w:"యస్మాత్=by whom; న ఉద్విజతే=is not disturbed; లోకః=the world; లోకాత్=by the world; న ఉద్విజతే చ=and is not disturbed; యః=who; హర్షామర్షభయోద్వేగైః=from joy, envy, fear and anxiety; ముక్తః=free; యః సః చ=he also; మే ప్రియః=dear to me"};
D["12.16"]={t:["అనపేక్షః శుచిర్దక్ష ఉదాసీనో గతవ్యథః |","సర్వారమ్భపరిత్యాగీ యో మద్భక్తః స మే ప్రియః ||"],mt:"అపేక్షలేనివాడు, శుచి, దక్షుడు, ఉదాసీనుడు, వ్యథలేనివాడు, సర్వారంభపరిత్యాగి అయిన నా భక్తుడు నాకు ప్రియుడు.",m:"One who is free from expectation, pure, skilful, impartial, free from anxiety, and who gives up all undertakings, such a devotee of mine is dear to me.",w:"అనపేక్షః=free from expectation; శుచిః=pure; దక్షః=skilful; ఉదాసీనః=impartial; గతవ్యథః=free from anxiety; సర్వారమ్భపరిత్యాగీ=renouncer of all undertakings; యః మద్భక్తః=who is my devotee; సః మే ప్రియః=he is dear to me"};
D["12.17"]={t:["యో న హృష్యతి న ద్వేష్టి న శోచతి న కాఙ్క్షతి |","శుభాశుభపరిత్యాగీ భక్తిమాన్యః స మే ప్రియః ||"],mt:"ఎవడు సంతోషింపడో, ద్వేషింపడో, శోకింపడో, కోరడో, శుభాశుభములను విడిచినవాడై భక్తిమంతుడో అతడు నాకు ప్రియుడు.",m:"One who neither rejoices nor hates, neither grieves nor desires, who renounces both good and evil, and is full of devotion, is dear to me.",w:"యః=who; న హృష్యతి=does not rejoice; న ద్వేష్టి=does not hate; న శోచతి=does not grieve; న కాఙ్క్షతి=does not desire; శుభాశుభపరిత్యాగీ=renouncing good and evil; భక్తిమాన్=full of devotion; యః సః=he who; మే ప్రియః=dear to me"};
D["12.18"]={t:["సమః శత్రౌ చ మిత్రే చ తథా మానాపమానయోః |","శీతోష్ణసుఖదుఃఖేషు సమః సఙ్గవివర్జితః ||"],mt:"శత్రువునందును మిత్రునియందును సమముగా, మానాపమానములయందును, శీతోష్ణసుఖదుఃఖములయందును సమముగా, ఆసక్తిరహితుడై... (12.19 లో కొనసాగును)",m:"Equal toward enemy and friend, and likewise in honour and dishonour; equal in cold and heat, pleasure and pain, and free from attachment... (continues in 12.19)",w:"సమః=equal; శత్రౌ చ మిత్రే చ=toward enemy and friend; తథా=and; మానాపమానయోః=in honour and dishonour; శీతోష్ణసుఖదుఃఖేషు=in cold, heat, pleasure and pain; సమః=equal; సఙ్గవివర్జితః=free from attachment"};
D["12.19"]={t:["తుల్యనిన్దాస్తుతిర్మౌనీ సన్తుష్టో యేన కేనచిత్ |","అనికేతః స్థిరమతిర్భక్తిమాన్మే ప్రియో నరః ||"],mt:"...నిందాస్తుతులను సమముగా చూచువాడు, మౌని, దొరికినదానితో సంతుష్టుడు, నివాసమునకు ఆసక్తి లేనివాడు, స్థిరమతి గల భక్తుడైన మనుష్యుడు నాకు ప్రియుడు.",m:"...equal in blame and praise, silent, content with whatever comes, without attachment to a home, steady-minded and devoted: such a person is dear to me.",w:"తుల్యనిన్దాస్తుతిః=equal in blame and praise; మౌనీ=silent; సన్తుష్టః=content; యేన కేనచిత్=with whatever comes; అనికేతః=without attachment to a home; స్థిరమతిః=steady-minded; భక్తిమాన్=devoted; మే ప్రియః నరః=a person dear to me"};
D["12.20"]={t:["యే తు ధర్మ్యామృతమిదం యథోక్తం పర్యుపాసతే |","శ్రద్దధానా మత్పరమా భక్తాస్తేఽతీవ మే ప్రియాః ||"],mt:"శ్రద్ధగలవారై నన్నే పరమగతిగా భావించి, ఇట్లు చెప్పబడిన ఈ ధర్మయుక్తమైన అమృతమును ఉపాసించు భక్తులు నాకు అత్యంత ప్రియులు.",m:"Those devotees who, with faith and holding me as their supreme goal, follow this nectar of dharma as declared are exceedingly dear to me.",w:"యే తు=but those who; ధర్మ్యామృతమ్ ఇదమ్=this nectar of dharma; యథా ఉక్తమ్=as declared; పర్యుపాసతే=follow; శ్రద్దధానాః=with faith; మత్పరమాః=holding me as the supreme goal; భక్తాః తే=those devotees; అతీవ=exceedingly; మే ప్రియాః=dear to me"};


// Chapter 13 – shlokas 13.1 to 13.12 (13.1 = Arjuna's question, as in editions numbering 35 verses). Paste after your D object.
D["13.1"]={t:["అర్జున ఉవాచ |","ప్రకృతిం పురుషం చైవ క్షేత్రం క్షేత్రజ్ఞమేవ చ |","ఏతద్వేదితుమిచ్ఛామి జ్ఞానం జ్ఞేయం చ కేశవ ||"],mt:"అర్జునుడు పలికెను: ఓ కేశవా! ప్రకృతిని, పురుషుని, క్షేత్రమును, క్షేత్రజ్ఞుని, జ్ఞానమును, జ్ఞేయమును తెలిసికొనగోరుచున్నాను.",m:"Arjuna said: O Keshava, I wish to know about nature and the person, the field and the knower of the field, and knowledge and the object of knowledge.",w:"అర్జునః ఉవాచ=Arjuna said; ప్రకృతిమ్=nature; పురుషమ్=the person (spirit); చ ఏవ=and also; క్షేత్రమ్=the field; క్షేత్రజ్ఞమ్=the knower of the field; ఏవ చ=and; ఏతత్=this; వేదితుమ్ ఇచ్ఛామి=I wish to know; జ్ఞానమ్=knowledge; జ్ఞేయమ్ చ=and the object of knowledge; కేశవ=O Keshava"};
D["13.2"]={t:["శ్రీభగవానువాచ |","ఇదం శరీరం కౌన్తేయ క్షేత్రమిత్యభిధీయతే |","ఏతద్యో వేత్తి తం ప్రాహుః క్షేత్రజ్ఞ ఇతి తద్విదః ||"],mt:"శ్రీభగవానుడు పలికెను: ఓ కౌంతేయా! ఈ శరీరము క్షేత్రమని చెప్పబడును; దీనిని ఎరిగినవానిని దీనిని తెలిసినవారు క్షేత్రజ్ఞుడందురు.",m:"The Blessed Lord said: This body, O son of Kunti, is called the field; one who knows it is called the knower of the field by those who know this.",w:"శ్రీభగవాన్ ఉవాచ=the Blessed Lord said; ఇదమ్ శరీరమ్=this body; కౌన్తేయ=O son of Kunti; క్షేత్రమ్=the field; ఇతి అభిధీయతే=is called thus; ఏతత్=this; యః వేత్తి=who knows; తమ్=him; ప్రాహుః=they call; క్షేత్రజ్ఞః ఇతి=the knower of the field; తద్విదః=those who know it"};
D["13.3"]={t:["క్షేత్రజ్ఞం చాపి మాం విద్ధి సర్వక్షేత్రేషు భారత |","క్షేత్రక్షేత్రజ్ఞయోర్జ్ఞానం యత్తజ్జ్ఞానం మతం మమ ||"],mt:"ఓ భారతా! అన్ని క్షేత్రములలో నన్నే క్షేత్రజ్ఞునిగా తెలిసికొనుము; క్షేత్రక్షేత్రజ్ఞుల గూర్చిన జ్ఞానమే జ్ఞానమని నా అభిప్రాయము.",m:"Know me also as the knower of the field in all fields, O Bharata. Knowledge of the field and its knower is, in my view, true knowledge.",w:"క్షేత్రజ్ఞమ్ చ అపి=the knower of the field also; మామ్ విద్ధి=know me; సర్వక్షేత్రేషు=in all fields; భారత=O Bharata; క్షేత్రక్షేత్రజ్ఞయోః=of the field and its knower; జ్ఞానమ్=knowledge; యత్ తత్=that which; జ్ఞానమ్ మతమ్ మమ=is knowledge in my opinion"};
D["13.4"]={t:["తత్క్షేత్రం యచ్చ యాదృక్చ యద్వికారి యతశ్చ యత్ |","స చ యో యత్ప్రభావశ్చ తత్సమాసేన మే శృణు ||"],mt:"ఆ క్షేత్రము ఏది, ఎట్టిది, ఎట్టి వికారములు గలది, దేనినుండి ఏది పుట్టినది; అతడు (క్షేత్రజ్ఞుడు) ఎవడు, ఎట్టి ప్రభావము గలవాడు — దానిని సంగ్రహముగా నా వద్ద వినుము.",m:"What that field is, of what nature, with what modifications, and from what it arises; and who he (the knower) is and what his power is: hear that from me in brief.",w:"తత్ క్షేత్రమ్=that field; యత్ చ=what; యాదృక్ చ=of what nature; యద్వికారి=with what modifications; యతః చ యత్=and from what it arises; సః చ యః=and who he is; యత్ప్రభావః చ=and of what power; తత్=that; సమాసేన=in brief; మే=from me; శృణు=hear"};
D["13.5"]={t:["ఋషిభిర్బహుధా గీతం ఛన్దోభిర్వివిధైః పృథక్ |","బ్రహ్మసూత్రపదైశ్చైవ హేతుమద్భిర్వినిశ్చితైః ||"],mt:"ఇది ఋషులచే అనేక విధములుగా, వివిధ ఛందస్సులలో వేర్వేరుగా, యుక్తియుక్తములై నిశ్చితములైన బ్రహ్మసూత్రపదములచేతను గానము చేయబడినది.",m:"This has been sung by sages in many ways, separately in various Vedic hymns, and also in the well-reasoned and conclusive words of the Brahma Sutras.",w:"ఋషిభిః=by sages; బహుధా=in many ways; గీతమ్=sung; ఛన్దోభిః వివిధైః=in various hymns; పృథక్=separately; బ్రహ్మసూత్రపదైః=by the words of the Brahma Sutras; చ ఏవ=and also; హేతుమద్భిః=well-reasoned; వినిశ్చితైః=conclusive"};
D["13.6"]={t:["మహాభూతాన్యహఙ్కారో బుద్ధిరవ్యక్తమేవ చ |","ఇన్ద్రియాణి దశైకం చ పఞ్చ చేన్ద్రియగోచరాః ||"],mt:"పంచమహాభూతములు, అహంకారము, బుద్ధి, అవ్యక్తము, పదియింద్రియములు, మనస్సు, ఐదు ఇంద్రియవిషయములు... (13.7 లో కొనసాగును)",m:"The great elements, ego, intellect and the unmanifest; the ten senses and the mind, and the five objects of the senses... (continues in 13.7)",w:"మహాభూతాని=the great elements; అహఙ్కారః=ego; బుద్ధిః=intellect; అవ్యక్తమ్=the unmanifest; ఏవ చ=and; ఇన్ద్రియాణి దశ=the ten senses; ఏకమ్ చ=and the one (mind); పఞ్చ చ=and the five; ఇన్ద్రియగోచరాః=objects of the senses"};
D["13.7"]={t:["ఇచ్ఛా ద్వేషః సుఖం దుఃఖం సఙ్ఘాతశ్చేతనా ధృతిః |","ఏతత్క్షేత్రం సమాసేన సవికారముదాహృతమ్ ||"],mt:"...ఇచ్ఛ, ద్వేషము, సుఖము, దుఃఖము, సంఘాతము (శరీర సంఘటన), చేతన, ధృతి — ఇట్లు క్షేత్రము వికారములతో సహా సంగ్రహముగా చెప్పబడినది.",m:"...desire, aversion, pleasure, pain, the aggregate (body), consciousness and steadfastness: thus the field has been briefly described with its modifications.",w:"ఇచ్ఛా=desire; ద్వేషః=aversion; సుఖమ్=pleasure; దుఃఖమ్=pain; సఙ్ఘాతః=the aggregate (the body); చేతనా=consciousness; ధృతిః=steadfastness; ఏతత్ క్షేత్రమ్=this field; సమాసేన=briefly; సవికారమ్=with modifications; ఉదాహృతమ్=has been described"};
D["13.8"]={t:["అమానిత్వమదమ్భిత్వమహింసా క్షాన్తిరార్జవమ్ |","ఆచార్యోపాసనం శౌచం స్థైర్యమాత్మవినిగ్రహః ||"],mt:"అమానిత్వము, దంభరాహిత్యము, అహింస, క్షమ, సరళత, ఆచార్యసేవ, శౌచము, స్థైర్యము, ఆత్మనిగ్రహము... (13.12 వరకు కొనసాగును)",m:"Humility, freedom from pride, non-violence, forgiveness, uprightness, service of the teacher, purity, steadiness and self-control... (continues to 13.12)",w:"అమానిత్వమ్=humility; అదమ్భిత్వమ్=freedom from pride; అహింసా=non-violence; క్షాన్తిః=forgiveness; ఆర్జవమ్=uprightness; ఆచార్యోపాసనమ్=service of the teacher; శౌచమ్=purity; స్థైర్యమ్=steadiness; ఆత్మవినిగ్రహః=self-control"};
D["13.9"]={t:["ఇన్ద్రియార్థేషు వైరాగ్యమనహఙ్కార ఏవ చ |","జన్మమృత్యుజరావ్యాధిదుఃఖదోషానుదర్శనమ్ ||"],mt:"...ఇంద్రియవిషయములయందు వైరాగ్యము, అహంకారరాహిత్యము, జన్మమృత్యుజరావ్యాధిదుఃఖదోషములను పరిశీలించుట...",m:"...detachment from sense objects, absence of ego, and perceiving the evil of birth, death, old age, sickness and suffering...",w:"ఇన్ద్రియార్థేషు=toward sense objects; వైరాగ్యమ్=detachment; అనహఙ్కారః ఏవ చ=and absence of ego; జన్మమృత్యుజరావ్యాధిదుఃఖదోషానుదర్శనమ్=perceiving the evil of birth, death, old age, sickness and suffering"};
D["13.10"]={t:["అసక్తిరనభిష్వఙ్గః పుత్రదారగృహాదిషు |","నిత్యం చ సమచిత్తత్వమిష్టానిష్టోపపత్తిషు ||"],mt:"...పుత్రదారగృహాదులయందు ఆసక్తి మమకారములు లేకపోవుట, ఇష్టానిష్టప్రాప్తులయందు నిత్యము సమచిత్తత...",m:"...non-attachment and non-identification with son, wife, home and the like, and constant evenness of mind in the occurrence of the desirable and undesirable...",w:"అసక్తిః=non-attachment; అనభిష్వఙ్గః=non-identification; పుత్రదారగృహాదిషు=with son, wife, home and the like; నిత్యమ్ చ=and constant; సమచిత్తత్వమ్=evenness of mind; ఇష్టానిష్టోపపత్తిషు=in the occurrence of the desirable and undesirable"};
D["13.11"]={t:["మయి చానన్యయోగేన భక్తిరవ్యభిచారిణీ |","వివిక్తదేశసేవిత్వమరతిర్జనసంసది ||"],mt:"...నాయందు అనన్యయోగముచే అవ్యభిచారిణియైన భక్తి, ఏకాంతదేశసేవనము, జనసమూహమునందు అరుచి...",m:"...unswerving devotion to me through undivided yoga, resorting to solitary places, and distaste for the company of people...",w:"మయి=to me; చ=and; అనన్యయోగేన=through undivided yoga; భక్తిః=devotion; అవ్యభిచారిణీ=unswerving; వివిక్తదేశసేవిత్వమ్=resorting to solitary places; అరతిః=distaste; జనసంసది=for the company of people"};
D["13.12"]={t:["అధ్యాత్మజ్ఞాననిత్యత్వం తత్త్వజ్ఞానార్థదర్శనమ్ |","ఏతజ్జ్ఞానమితి ప్రోక్తమజ్ఞానం యదతోఽన్యథా ||"],mt:"...అధ్యాత్మజ్ఞానమునందు నిత్యనిష్ఠ, తత్త్వజ్ఞానప్రయోజనమును దర్శించుట — ఇదియే జ్ఞానమని చెప్పబడినది; దీనికి భిన్నమైనది అజ్ఞానము.",m:"...constancy in knowledge of the self and seeing the purpose of knowledge of truth: this is declared to be knowledge, and what is contrary to it is ignorance.",w:"అధ్యాత్మజ్ఞాననిత్యత్వమ్=constancy in knowledge of the self; తత్త్వజ్ఞానార్థదర్శనమ్=seeing the purpose of knowledge of truth; ఏతత్=this; జ్ఞానమ్=knowledge; ఇతి ప్రోక్తమ్=is declared; అజ్ఞానమ్=ignorance; యత్=what; అతః అన్యథా=is contrary to this"};


// Chapter 13 – shlokas 13.13 to 13.24. Paste after your D object.
D["13.13"]={t:["జ్ఞేయం యత్తత్ప్రవక్ష్యామి యజ్జ్ఞాత్వామృతమశ్నుతే |","అనాదిమత్పరం బ్రహ్మ న సత్తన్నాసదుచ్యతే ||"],mt:"ఏది తెలిసికొనిన అమృతత్వమును పొందునో ఆ జ్ఞేయమును చెప్పెదను; అనాదియైన పరబ్రహ్మము సత్తనియు అసత్తనియు చెప్పబడదు.",m:"I shall describe that which is to be known, knowing which one attains immortality: the beginningless supreme Brahman, which is said to be neither being nor non-being.",w:"జ్ఞేయమ్=what is to be known; యత్ తత్=that which; ప్రవక్ష్యామి=I shall describe; యత్ జ్ఞాత్వా=knowing which; అమృతమ్ అశ్నుతే=one attains immortality; అనాది=beginningless; మత్పరమ్=subject to me; బ్రహ్మ=Brahman; న సత్ తత్=that is not being; న అసత్=nor non-being; ఉచ్యతే=is said"};
D["13.14"]={t:["సర్వతః పాణిపాదం తత్సర్వతోఽక్షిశిరోముఖమ్ |","సర్వతః శ్రుతిమల్లోకే సర్వమావృత్య తిష్ఠతి ||"],mt:"అది అన్ని వైపులా చేతులు పాదములు గలది, అన్ని వైపులా కన్నులు శిరస్సులు ముఖములు గలది, అన్ని వైపులా చెవులు గలది; లోకమున సర్వమును ఆవరించి ఉన్నది.",m:"It has hands and feet everywhere, eyes, heads and mouths everywhere, and ears everywhere; it exists in the world enveloping everything.",w:"సర్వతః పాణిపాదమ్=with hands and feet everywhere; తత్=that; సర్వతః అక్షిశిరోముఖమ్=with eyes, heads and mouths everywhere; సర్వతః శ్రుతిమత్=with ears everywhere; లోకే=in the world; సర్వమ్=everything; ఆవృత్య=enveloping; తిష్ఠతి=exists"};
D["13.15"]={t:["సర్వేన్ద్రియగుణాభాసం సర్వేన్ద్రియవివర్జితమ్ |","అసక్తం సర్వభృచ్చైవ నిర్గుణం గుణభోక్తృ చ ||"],mt:"సర్వేంద్రియగుణములుగా ప్రకాశించునది, సర్వేంద్రియములు లేనిది, ఆసక్తిరహితమైనది, సర్వమును భరించునది, నిర్గుణమై గుణములను అనుభవించునది.",m:"It shines as the qualities of all the senses, yet is devoid of all senses; unattached, yet supporting all; free of the gunas, yet experiencing the gunas.",w:"సర్వేన్ద్రియగుణాభాసమ్=shining as the qualities of all senses; సర్వేన్ద్రియవివర్జితమ్=devoid of all senses; అసక్తమ్=unattached; సర్వభృత్ చ ఏవ=and yet supporting all; నిర్గుణమ్=free of the gunas; గుణభోక్తృ చ=and the enjoyer of the gunas"};
D["13.16"]={t:["బహిరన్తశ్చ భూతానామచరం చరమేవ చ |","సూక్ష్మత్వాత్తదవిజ్ఞేయం దూరస్థం చాన్తికే చ తత్ ||"],mt:"భూతములకు లోపలను వెలుపలను ఉన్నది, చరమును అచరమును అదే; సూక్ష్మత్వముచే తెలియరానిది; దూరమునందును సమీపమునందును ఉన్నది.",m:"It is outside and inside all beings, the unmoving and also the moving; because of its subtlety it is incomprehensible; it is far away and also near.",w:"బహిః అన్తః చ=outside and inside; భూతానామ్=of beings; అచరమ్=the unmoving; చరమ్ ఏవ చ=and also the moving; సూక్ష్మత్వాత్=because of subtlety; తత్ అవిజ్ఞేయమ్=that is incomprehensible; దూరస్థమ్=far away; చ అన్తికే చ తత్=and that is also near"};
D["13.17"]={t:["అవిభక్తం చ భూతేషు విభక్తమివ చ స్థితమ్ |","భూతభర్తృ చ తజ్జ్ఞేయం గ్రసిష్ణు ప్రభవిష్ణు చ ||"],mt:"భూతములయందు విభాగము లేనిదైనను విభక్తమైనట్లు నిలిచియున్నది; భూతములను భరించునదిగాను, మ్రింగునదిగాను, సృజించునదిగాను దానిని తెలిసికొనుము.",m:"Though undivided, it exists as if divided among beings; know it as the sustainer of beings, their devourer and their generator.",w:"అవిభక్తమ్ చ=undivided; భూతేషు=among beings; విభక్తమ్ ఇవ చ స్థితమ్=and standing as if divided; భూతభర్తృ చ=and the sustainer of beings; తత్ జ్ఞేయమ్=that is to be known; గ్రసిష్ణు=devourer; ప్రభవిష్ణు చ=and generator"};
D["13.18"]={t:["జ్యోతిషామపి తజ్జ్యోతిస్తమసః పరముచ్యతే |","జ్ఞానం జ్ఞేయం జ్ఞానగమ్యం హృది సర్వస్య విష్ఠితమ్ ||"],mt:"అది జ్యోతులకు కూడా జ్యోతి, తమస్సునకు అతీతమైనదని చెప్పబడును; అది జ్ఞానము, జ్ఞేయము, జ్ఞానముచే పొందదగినది; అందరి హృదయములలో నిలిచియున్నది.",m:"It is the light of all lights, said to be beyond darkness; it is knowledge, the object of knowledge and the goal of knowledge, seated in the hearts of all.",w:"జ్యోతిషామ్ అపి=of lights even; తత్ జ్యోతిః=that is the light; తమసః పరమ్=beyond darkness; ఉచ్యతే=is said; జ్ఞానమ్=knowledge; జ్ఞేయమ్=the object of knowledge; జ్ఞానగమ్యమ్=the goal of knowledge; హృది సర్వస్య=in the heart of all; విష్ఠితమ్=seated"};
D["13.19"]={t:["ఇతి క్షేత్రం తథా జ్ఞానం జ్ఞేయం చోక్తం సమాసతః |","మద్భక్త ఏతద్విజ్ఞాయ మద్భావాయోపపద్యతే ||"],mt:"ఇట్లు క్షేత్రము, జ్ఞానము, జ్ఞేయము సంగ్రహముగా చెప్పబడినవి; నా భక్తుడు దీనిని తెలిసికొని నా భావమును పొందును.",m:"Thus the field, knowledge and the object of knowledge have been briefly described. My devotee, knowing this, becomes fit for my state.",w:"ఇతి=thus; క్షేత్రమ్=the field; తథా=and; జ్ఞానమ్=knowledge; జ్ఞేయమ్ చ=and the object of knowledge; ఉక్తమ్=have been described; సమాసతః=briefly; మద్భక్తః=my devotee; ఏతత్ విజ్ఞాయ=knowing this; మద్భావాయ=for my state; ఉపపద్యతే=becomes fit"};
D["13.20"]={t:["ప్రకృతిం పురుషం చైవ విద్ధ్యనాదీ ఉభావపి |","వికారాంశ్చ గుణాంశ్చైవ విద్ధి ప్రకృతిసమ్భవాన్ ||"],mt:"ప్రకృతియు పురుషుడును ఇద్దరును అనాదులని తెలిసికొనుము; వికారములను గుణములను ప్రకృతినుండి పుట్టినవిగా తెలిసికొనుము.",m:"Know that both nature and the person are beginningless; and know that modifications and the gunas are born of nature.",w:"ప్రకృతిమ్=nature; పురుషమ్ చ ఏవ=and the person; విద్ధి=know; అనాదీ=beginningless; ఉభౌ అపి=both; వికారాన్ చ=and the modifications; గుణాన్ చ ఏవ=and the gunas; విద్ధి=know; ప్రకృతిసమ్భవాన్=born of nature"};
